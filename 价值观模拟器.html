母亲被县军管组羁押，第二天被定罪为'攻击毛主席、为刘少奇翻案'。经安徽省革委会核心小组批准，判处死刑。1970年4月11日，方忠谋被处决。",consequences:"母亲被杀害时，张红兵年仅16岁。此后数十年，他活在极度的悔恨和痛苦中。他说：'我亲手把母亲送上了刑场。'父亲也终生自责。张红兵后来公开忏悔，成为反思文革暴行的象征。但母亲再也回不来了。",choice_support_a:"理解张红兵：在极端政治环境和洗脑教育下，16岁少年被迫在'革命信仰'和亲情之间选择，他也是受害者（理解政治信仰压力）",choice_support_b:"无法原谅：无论何种政治洗脑，亲手举报母亲导致她被处决，这是人性底线的崩溃，亲情应该高于任何意识形态（亲情 > 信仰）",reflection:"如果你是16岁的张红兵，在1970年的中国，你会举报母亲吗？",impact_score:10,controversy_level:9.5},{id:"case_002",value_pair:["family","faith"],direction:"faith_over_family",intuitive_lean:"faith",title:"艾尔肯·库尔班拒绝出卖流亡者",real_person:"艾尔肯·库尔班 (Erkin Qurban)",year:2013,location:"中国新疆",context:"2013年，维吾尔族学者艾尔肯·库尔班回国探亲时被新疆当局扣留。当局以他在国内的家人作为人质，要求他提供海外维吾尔流亡者和活动人士的详细信息，包括姓名、住址、活动计划等。当局威胁说，如果不合作，他的父母、兄弟姐妹都将面临严重后果。",dilemma:"艾尔肯面临着极其残酷的选择：合作意味着背叛同胞和信仰，导致无数流亡者被抓捕甚至失踪；拒绝合作则意味着亲人将受到迫害，父母可能在晚年遭受牢狱之灾。这不是抽象的道德难题，而是一个人必须在几天内做出的生死抉择。",actual_choice:"经过痛苦的思想斗争，艾尔肯最终拒绝合作。他告诉当局自己不会出卖任何人，即使代价是家人受难。",consequences:"艾尔肯被禁止离开中国数月，他的家人遭到持续骚扰和监控。但他保护了数十名流亡者的安全，这些人至今仍在继续为维吾尔人权发声。艾尔肯本人最终获释回到海外，但此后再也无法与国内亲人团聚。",choice_support_a:"支持艾尔肯的选择：即使是血缘至亲，也不能强迫一个人背叛自己的民族和信仰，保护更多人的生命是更大的道德责任（信仰 > 亲情）",choice_support_b:"质疑艾尔肯的选择：父母养育之恩重于泰山，为了抽象的政治理想而让年迈父母承受迫害是残忍的，家人应该是第一位的（亲情 > 信仰）",reflection:"如果你是艾尔肯，在亲人的哭泣和威胁面前，你能坚持自己的选择吗？",impact_score:9,controversy_level:8.5},{id:"case_003",value_pair:["justice","loyalty"],direction:"justice_over_loyalty",intuitive_lean:"justice",title:"爱德华·斯诺登揭露NSA监控",real_person:"爱德华·斯诺登 (Edward Snowden)",year:2013,location:"美国",context:"2013年，29岁的CIA前雇员斯诺登在NSA承包商工作时发现，美国政府正在对全球数十亿人进行大规模无授权监控，包括美国公民。这个名为'棱镜计划'(PRISM)的项目直接违反了美国宪法第四修正案。斯诺登签署过保密协议，泄露机密将面临终身监禁甚至死刑。",dilemma:"斯诺登面临的选择是：遵守对雇主和国家的忠诚承诺，保守秘密继续领取高薪过舒适生活；还是违反保密协议，冒着被通缉、流亡的风险，向世界揭露政府的违宪行为？",actual_choice:"斯诺登选择了揭露真相。他联系了《卫报》记者格伦·格林沃尔德，提供了大量NSA机密文件，并公开了自己的身份。",consequences:"斯诺登被美国政府指控为叛国罪，护照被吊销，被迫流亡俄罗斯至今无法回国。但他的揭露引发了全球对隐私权的大讨论，推动了多国修改监控法律，被许多人视为英雄和良心守护者。",choice_support_a:"支持斯诺登：当雇主和政府从事违宪的大规模监控时，公民有道德义务揭露真相，公众知情权和正义高于对机构的忠诚（正义 > 忠诚）",choice_support_b:"反对斯诺登：他签署了保密协议并接受了国家的信任，却单方面决定泄露国家机密，这种背叛危害了国家安全，应该通过内部渠道解决问题（忠诚 > 正义）",reflection:"如果你发现雇主正在做违法的事情，你会选择举报还是保持沉默？",impact_score:8.5,controversy_level:9},{id:"case_004",value_pair:["loyalty","justice"],direction:"loyalty_over_justice",intuitive_lean:"justice",title:"弗兰克·瑟彭蒂科的警察困境",real_person:"弗兰克·瑟彭蒂科 (Frank Serpico)",year:1971,location:"美国纽约",context:"1960年代，纽约市警察弗兰克·瑟彭蒂科发现整个警察系统充斥着腐败：警察收受毒贩贿赂、勒索商家、包庇犯罪。他的同事们都参与其中，并多次试图拉他入伙。瑟彭蒂科拒绝同流合污，但也面临着巨大压力：揭发同事将被视为叛徒，在警察内部成为孤立者。",dilemma:"在一个腐败成为潜规则的系统中，是保持对同事的忠诚、遵守'警察不举报警察'的铁律，还是为了正义而揭发腐败，承受被同事孤立甚至报复的风险？",actual_choice:"瑟彭蒂科最终选择向《纽约时报》揭露警察系统的腐败。他成为证人，在公开听证会上作证。",consequences:"瑟彭蒂科遭到同事的彻底孤立和报复。1971年，在一次毒品突袭行动中，他被枪击中面部，同事们故意延迟呼叫救援，导致他永久性面部损伤和听力丧失。他不得不提前退休，移居海外。但他的揭露促成了纽约警察系统的大规模改革。",choice_support_a:"支持瑟彭蒂科：即使面对同事的孤立和报复，揭露腐败仍然是正确的选择，正义和公众利益高于对腐败同事的忠诚（正义 > 忠诚）",choice_support_b:"质疑瑟彭蒂科：警察工作需要同事间的绝对信任，揭发同事破坏了这种信任，应该通过内部渠道解决问题而非向媒体曝光（忠诚 > 正义）",reflection:"如果你的同事都在做违法的事情，而你的举报会让自己成为众矢之的，你会选择沉默还是揭发？",impact_score:8,controversy_level:7.5},{id:"case_005",value_pair:["freedom","safety"],direction:"freedom_over_safety",intuitive_lean:"safety",title:"瑞典的COVID-19自由模式",real_person:"安德斯·泰格内尔 (Anders Tegnell)",year:2020,location:"瑞典",context:"2020年COVID-19疫情爆发时，全球大多数国家选择了严格封锁、强制口罩、关闭学校等措施。但瑞典首席流行病学家泰格内尔选择了不同道路：拒绝强制封锁，保持餐厅、商店、学校开放，仅靠民众自愿遵守建议来控制疫情。这一决定在疫情初期导致瑞典死亡率远高于北欧邻国。",dilemma:"在致命疫情面前，是保护个人自由和经济活动，相信民众的自主判断；还是采取强制措施，牺牲自由来最大程度保护公众生命安全？",actual_choice:"泰格内尔坚持自由优先的策略，认为强制封锁不可持续，会造成更大的社会和经济损害，应该相信民众的理性和自律。",consequences:"2020年上半年，瑞典的死亡率显著高于邻国挪威、芬兰和丹麦。但瑞典避免了经济停摆和封锁对心理健康的巨大冲击。到2021-2022年，随着疫苗普及，瑞典的累计超额死亡率反而低于许多实施严格封锁的国家。这一策略至今仍存在巨大争议。",choice_support_a:"支持瑞典模式：即使在疫情中，也不应该牺牲基本自由权利，强制封锁对经济和心理健康的损害可能超过疫情本身（自由 > 安全）",choice_support_b:"反对瑞典模式：在致命疫情面前，政府有责任采取强制措施保护公众生命，个人自由应该暂时让位于公共卫生安全（安全 > 自由）",reflection:"如果你是政策制定者，你会选择强制封锁还是自愿遵守？",impact_score:8,controversy_level:9.5},{id:"case_006",value_pair:["safety","freedom"],direction:"safety_over_freedom",intuitive_lean:"safety",title:"新西兰的COVID-19清零模式",real_person:"杰辛达·阿德恩 (Jacinda Ardern)",year:2020,location:"新西兰",context:"2020年3月，新西兰仅有100多例确诊病例时,总理阿德恩就宣布全国进入最高级别封锁：除超市和药房外所有商业关闭，禁止离开住所，违者罚款或监禁。边境完全关闭，连本国公民都难以回国。这是民主国家中最严厉的防疫措施之一，持续了数周。",dilemma:"在疫情仍处于早期、死亡人数不多的情况下，是否应该采取如此严厉的限制措施，剥夺公民的基本自由权利，强制隔离所有人？还是应该采取较温和的措施，保留更多个人自由？",actual_choice:"阿德恩选择了严厉的清零策略，宁可过度反应也不愿承担疫情失控的风险。",consequences:"新西兰在2020-2021年成功将疫情死亡人数控制在极低水平（人均死亡率是全球最低之一），社会和经济快速恢复正常。但数十万海外新西兰人被困国外无法回家，经济也遭受了巨大打击。到2022年Omicron变种出现后，清零策略最终放弃。",choice_support_a:"支持新西兰模式：在致命疫情面前，政府有责任采取一切必要手段保护公民生命，短期的自由限制换来了长期的社会稳定（安全 > 自由）",choice_support_b:"反对新西兰模式：如此严厉的封锁措施侵犯了基本人权，政府不应该为了控制疫情而剥夺公民的行动自由和经济活动权利（自由 > 安全）",reflection:"如果你生活在2020年的新西兰，你会支持还是反对这种严格封锁？",impact_score:7.5,controversy_level:8.5},{id:"case_007",value_pair:["justice","life"],direction:"justice_over_life",intuitive_lean:"justice",title:"纽伦堡审判处死纳粹战犯",real_person:"阿尔弗雷德·约德尔 (Alfred Jodl)",year:1946,location:"德国纽伦堡",context:"1946年，纽伦堡国际军事法庭审判了24名纳粹高级将领和官员。其中阿尔弗雷德·约德尔是德国国防军作战部长，签署了许多军事命令。辩方律师辩称约德尔只是执行命令的军人，并未亲手杀人，且战争已经结束，处死他无法挽回任何损失。但检方坚持必须伸张正义。",dilemma:"纳粹战犯罪行滔天，但战争已经结束，处死他们无法让死者复活。是应该处以死刑来伸张正义、震慑未来的战争罪行，还是应该废除死刑、以监禁代替杀戮，坚守生命权高于一切的原则？",actual_choice:"法庭判决约德尔等10人死刑。1946年10月16日，他们在监狱中被绞死。",consequences:"纽伦堡审判确立了'遵从命令不能成为战争罪辩护理由'的国际法原则，对二战后的国际法发展产生了深远影响。但也引发了关于死刑正当性和战胜国审判战败国的争议。",choice_support_a:"支持死刑判决：对于犯下反人类罪行的战犯，死刑是必要的正义，也是对受害者的尊重和对未来战争罪犯的震慑（正义 > 生命）",choice_support_b:"反对死刑判决：无论罪行多么严重，国家都不应该剥夺任何人的生命权，终身监禁已经是足够的惩罚，杀戮无法带来真正的正义（生命 > 正义）",reflection:"如果你是纽伦堡法庭的法官，你会判处死刑还是终身监禁？",impact_score:8,controversy_level:7},{id:"case_008",value_pair:["life","justice"],direction:"life_over_justice",intuitive_lean:"justice",title:"特雷莎修女拒绝谴责罪犯",real_person:"特雷莎修女 (Mother Teresa)",year:1995,location:"印度加尔各答",context:"1995年，一名曾经杀害多人的重刑犯在狱中病重，面临死刑。受害者家属强烈要求尽快执行死刑，拒绝为其提供医疗。但特雷莎修女得知后，亲自前往监狱探望这名罪犯，为他提供医疗照顾，并公开呼吁赦免他的死刑，改为终身监禁。她的行为激怒了受害者家属。",dilemma:"一个犯下重罪的人是否仍有获得医疗和生存的权利？是应该优先考虑受害者的正义诉求和社会的惩罚需要，还是坚守生命权神圣不可侵犯的原则，反对死刑？",actual_choice:"特雷莎修女坚持认为，无论犯下何种罪行，生命都是神圣的，没有人有权利剥夺另一个人的生命。她继续为这名罪犯提供照顾。",consequences:"这名罪犯的死刑最终被改为终身监禁，在狱中度过了余生。特雷莎修女的行为受到了部分人的赞扬，认为她展现了真正的慈悲，但也遭到许多人的批评，认为她忽视了受害者的痛苦和正义的需要。",choice_support_a:"支持特雷莎修女：无论犯下何种罪行，生命权都是不可剥夺的，废除死刑是文明社会的标志，应该以监禁而非杀戮来惩罚犯罪（生命 > 正义）",choice_support_b:"反对特雷莎修女：对于犯下严重罪行的人，受害者和社会有权要求正义和惩罚，生命权不应该凌驾于正义之上（正义 > 生命）",reflection:"如果你的亲人被谋杀，你会支持给凶手医疗救助并反对死刑吗？",impact_score:7.5,controversy_level:8},{id:"case_009",value_pair:["truth","no_harm"],direction:"no_harm_over_truth",intuitive_lean:"no_harm",title:"藏匿安妮·弗兰克的荷兰家庭",real_person:"米普·吉斯 (Miep Gies)",year:1942,location:"荷兰阿姆斯特丹",context:"1942年，纳粹占领荷兰，开始大规模逮捕犹太人。米普·吉斯和她的丈夫决定帮助老板奥托·弗兰克一家躲藏，这个家庭包括奥托的女儿安妮。当纳粹盖世太保挨家挨户搜查犹太人时，米普面临着直接的询问：你知道这个社区有犹太人躲藏吗？",dilemma:"说真话意味着安妮一家将被抓捕并送往集中营，几乎肯定死亡；撒谎则违背了诚实的原则，并且如果被发现，米普自己也将被处死。是坚守诚实原则，还是为了保护无辜生命而撒谎？",actual_choice:"米普对纳粹军官撒了谎，否认知道任何犹太人的藏身之处。她冒着生命危险持续为弗兰克一家提供食物和保护长达两年。",consequences:"1944年，有人告密，弗兰克一家最终被发现并送往集中营。安妮在贝尔根-贝尔森集中营去世，但她的日记被米普保存下来，成为了反映大屠杀历史的重要文献。米普因为她的勇气和牺牲被以色列授予'国际义人'称号。",choice_support_a:"支持米普的选择：在极端邪恶面前，撒谎来保护无辜生命是道德的，诚实不应该成为帮助邪恶的工具（保护无辜 > 诚实）",choice_support_b:"质疑米普的选择：虽然动机高尚，但撒谎仍然是错误的，应该拒绝回答或寻找其他方式保护他们，而不是直接撒谎（诚实 > 保护无辜）",reflection:"如果纳粹军官问你家里是否藏有犹太人，你会说真话还是撒谎？",impact_score:9,controversy_level:6},{id:"case_010",value_pair:["truth","no_harm"],direction:"truth_over_no_harm",intuitive_lean:"truth",title:"医生告知癌症晚期真相",real_person:"伊丽莎白·库伯勒-罗斯 (Elisabeth Kübler-Ross)",year:1969,location:"美国芝加哥",context:"1960年代的美国医学界，普遍做法是对癌症晚期患者隐瞒真实病情，认为知道真相会让患者绝望并加速死亡。但精神科医生库伯勒-罗斯在与数百名濒死患者交流后发现，患者们最痛苦的不是死亡本身，而是周围所有人都对他们撒谎。她开始倡导'临终真相告知'原则。",dilemma:"对一个只剩几个月生命的癌症患者，是如实告知残酷真相让他们在绝望中度过最后时光，还是善意隐瞒让他们在希望和无知中度过？",actual_choice:"库伯勒-罗斯坚持认为患者有权知道自己的真实状况，医生应该如实告知病情，同时提供心理支持帮助患者接受现实。",consequences:"她的理论最初遭到医学界强烈反对，许多医生认为这会加速患者死亡。但后续研究证明，知道真相的患者反而能够更平静地面对死亡，有机会安排后事并与亲人好好告别。如今，如实告知病情已成为现代医学伦理的基本原则。",choice_support_a:"支持库伯勒-罗斯：患者有权知道自己的真实病情，隐瞒真相是对患者自主权的侵犯，诚实是尊重患者尊严的前提（诚实 > 保护情感）",choice_support_b:"反对如实告知：知道自己即将死亡会让患者陷入绝望和痛苦，善意的隐瞒可以让他们在相对平静中度过最后时光（保护情感 > 诚实）",reflection:"如果你的亲人得了癌症晚期，你会告诉他们真相吗？",impact_score:7,controversy_level:7.5},{id:"case_011",value_pair:["environment","safety"],direction:"environment_over_safety",intuitive_lean:"safety",title:"日本福岛后反核运动",real_person:"菅直人",year:2011,location:"日本",context:"2011年福岛核事故后，时任日本首相菅直人宣布将逐步废除核电，转向可再生能源。但这意味着日本必须大量进口化石燃料，电价将大幅上涨，部分地区可能面临电力短缺。工业界和经济学家警告说，废核将严重损害日本经济竞争力，并导致碳排放大幅增加。",dilemma:"是应该为了避免核事故风险而废除核电，承受经济损失和能源不安全；还是继续使用清洁高效的核能，接受极小概率的核事故风险？",actual_choice:"菅直人坚持废核立场，日本逐步关闭了大部分核电站，转而大量使用火力发电和进口能源。",consequences:"日本电价大幅上涨，碳排放增加，能源对外依存度达到90%以上，经济增长受到严重制约。但日本避免了再次发生核事故的风险。到2020年代，随着可再生能源技术进步，日本开始重新考虑重启部分核电站。",choice_support_a:"支持废核决定：核事故的灾难性后果（如切尔诺贝利和福岛）证明核能风险不可接受，即使付出经济代价也应该转向更安全的能源（环境安全 > 经济发展）",choice_support_b:"反对废核决定：核能是目前最清洁高效的能源，福岛事故是极端地震和海啸的结果，不应该因为小概率事件就放弃核能（能源安全 > 环境风险）",reflection:"如果你是政策制定者，你会选择废除核电还是继续使用？",impact_score:7.5,controversy_level:8},{id:"case_012",value_pair:["safety","environment"],direction:"safety_over_environment",intuitive_lean:"safety",title:"中国三峡大坝建设",real_person:"李鹏",year:1994,location:"中国湖北",context:"1994年，中国开始建设三峡大坝，这是世界上最大的水电工程。大坝将淹没632平方公里土地，140万人需要搬迁，数千处文物古迹被淹没，长江生态系统遭受巨大影响，白鳍豚等物种濒临灭绝。但大坝可以提供巨大的清洁能源，防止长江下游洪灾，每年可以避免数千人死于洪水。",dilemma:"是应该为了保护长江生态和文化遗产而放弃建设大坝，承受洪灾威胁和能源短缺；还是为了防洪和发电而建设大坝，接受生态和文化的巨大损失？",actual_choice:"中国政府决定建设三峡大坝，140万人被强制搬迁，大量文物和生态被永久淹没。",consequences:"三峡大坝提供了全国约2%的电力，有效减少了长江下游的洪灾损失。但长江生态遭受严重破坏，白鳍豚功能性灭绝，地质灾害增加，被迫搬迁的移民中很多人生活水平下降。这一决策至今仍存在巨大争议。",choice_support_a:"支持三峡建设：防止洪灾和提供清洁能源拯救了更多人的生命，相比之下生态损失是可以接受的代价（公共安全 > 环境保护）",choice_support_b:"反对三峡建设：如此规模的生态破坏和文化损失是不可逆的，不应该为了短期利益而牺牲长期的生态平衡和文化传承（环境保护 > 发展需要）",reflection:"如果你是决策者，你会选择建设还是放弃三峡大坝？",impact_score:7.5,controversy_level:8.5},{id:"case_013",value_pair:["freedom","life"],direction:"freedom_over_life",intuitive_lean:"life",title:"拒绝强制疫苗接种",real_person:"美国反疫苗运动参与者",year:2021,location:"美国",context:"2021年，COVID-19 Delta变种在美国快速传播，疫苗已被证明可以显著降低重症和死亡率。拜登政府颁布命令，要求100人以上企业的员工必须接种疫苗或每周检测，否则将被解雇。许多人认为这侵犯了身体自主权，即使疫苗可以救命，也不应该被强制接种。",dilemma:"在疫情中，是应该强制接种疫苗来保护公众健康和挽救生命，还是应该尊重个人的身体自主权，即使这可能导致更多人死亡？",actual_choice:"数百万美国人拒绝接种疫苗，许多人宁愿失业也不接受强制令。最高法院最终裁定强制令违宪。",consequences:"美国的疫苗接种率停滞在70%左右，远低于许多其他发达国家。2021-2022年冬季，美国经历了Omicron变种造成的严重疫情，死亡人数达到历史新高。但美国保持了个人选择的自由，避免了强制疫苗可能带来的社会撕裂。",choice_support_a:"支持拒绝强制：身体自主权是基本人权，即使疫苗可以救命，政府也无权强制公民在身体上接受任何医疗干预（自由 > 生命）",choice_support_b:"支持强制接种：在疫情中，个人选择会影响公众健康，政府有责任采取强制措施保护公共卫生，挽救生命优先于个人选择（生命 > 自由）",reflection:"如果政府要求你接种疫苗否则失业，你会接种还是拒绝？",impact_score:8,controversy_level:9.5},{id:"case_014",value_pair:["truth","loyalty"],direction:"truth_over_loyalty",intuitive_lean:"truth",title:"深喉揭露水门事件",real_person:"马克·费尔特 (Mark Felt)",year:1972,location:"美国华盛顿",context:"1972年,FBI副局长马克·费尔特发现尼克松总统正在利用FBI掩盖水门事件丑闻。作为FBI高层，费尔特对机构和总统负有忠诚义务。但他认为总统正在滥用权力、妨碍司法。他决定匿名向《华盛顿邮报》记者泄露调查信息，代号'深喉'。",dilemma:"是应该对总统和FBI保持忠诚，遵守保密义务；还是为了揭露真相和维护民主而泄密，背叛自己的誓言和组织？",actual_choice:"费尔特选择了泄密。他持续向记者提供内部信息，最终导致尼克松总统辞职。",consequences:"水门事件被彻底揭露，尼克松成为美国历史上唯一被迫辞职的总统，美国民主制度的自我纠错机制得到验证。但费尔特本人隐瞒身份长达30多年，直到2005年才公开承认自己是'深喉'。他的行为至今仍有争议：有人认为他是英雄，有人认为他背叛了誓言。",choice_support_a:"支持费尔特：当权力被滥用时，向公众揭露真相是更高的道德责任，诚实和正义高于对腐败组织的忠诚（诚实 > 忠诚）",choice_support_b:"质疑费尔特：他发誓效忠总统和FBI，却违背誓言泄露机密，即使动机高尚，也不应该背叛自己的誓言（忠诚 > 诚实）",reflection:"如果你发现你的上司在做违法的事，你会向媒体举报吗？",impact_score:8.5,controversy_level:7.5},{id:"case_015",value_pair:["justice","life"],direction:"life_over_justice",intuitive_lean:"life",title:"南非真相与和解委员会",real_person:"德斯蒙德·图图 (Desmond Tutu)",year:1996,location:"南非",context:"1996年，种族隔离制度结束后，南非面临抉择：是像纽伦堡审判那样起诉和惩罚所有种族主义罪犯，还是选择宽恕和和解？大主教图图领导的真相与和解委员会选择了后者：只要罪犯说出真相，就可以获得特赦，免于起诉。许多受害者家属愤怒地质问：杀人犯仅仅说出真相就可以逃避惩罚吗？",dilemma:"是应该坚持正义原则，起诉和惩罚所有罪犯，即使这可能导致国家陷入内战；还是为了避免更多流血和实现民族和解，放弃惩罚而选择宽恕？",actual_choice:"南非选择了宽恕之路。数千名种族隔离时期的罪犯因为说出真相而获得特赦，包括许多杀人犯和酷刑执行者。",consequences:"南非避免了报复性内战，实现了相对和平的政权过渡。但许多受害者家属认为正义没有得到伸张，罪犯没有付出应有代价。真相与和解委员会模式后来被许多国家借鉴，但关于'是否应该牺牲正义来换取和平'的争议至今仍在继续。",choice_support_a:"支持图图的选择：在种族分裂的国家，宽恕和真相比惩罚更重要，避免内战和实现和解可以挽救更多生命（和平与生命 > 正义）",choice_support_b:"反对放弃惩罚：对杀人犯和酷刑执行者的宽恕是对受害者的背叛，正义不应该被牺牲，罪犯必须付出代价（正义 > 和平）",reflection:"如果你的亲人被种族主义者杀害，你会接受宽恕凶手换取国家和平吗？",impact_score:8.5,controversy_level:8.5},{id:"case_016",value_pair:["freedom","truth"],direction:"truth_over_freedom",intuitive_lean:"truth",title:"伽利略被迫放弃日心说",real_person:"伽利略·伽利雷 (Galileo Galilei)",year:1633,location:"意大利罗马",context:"1633年，69岁的伽利略因宣扬日心说被罗马宗教裁判所传唤。教会给他两个选择：公开放弃日心说、承认地球是宇宙中心，就可以保住自由和生命；坚持真理则将被处以火刑。伽利略面临着痛苦抉择：是为真理殉道，还是选择屈服以保全自由？",dilemma:"在强权威胁下，科学家应该坚持已证实的科学真理而殉道，还是应该暂时屈服、保全自由，等待未来继续研究？",actual_choice:"伽利略选择了公开放弃日心说，跪在宗教裁判所前宣读悔过书。但据说他在宣读后低声说：'但地球仍在转动。'",consequences:"伽利略被软禁在家直到去世，但保住了生命。他在软禁期间继续秘密研究，完成了《关于两门新科学的对话》。300年后教会才承认错误。伽利略的选择被有些人视为务实，也被有些人视为对真理的背叛。",choice_support_a:"批评伽利略：作为科学家，应该为真理献身，公开放弃真理是对科学的背叛（真实 > 自由）",choice_support_b:"理解伽利略：保全自由和生命才能继续研究，殉道对科学没有意义，真理终将战胜谎言（自由 > 真实）",reflection:"如果你是伽利略，你会选择为真理殉道，还是暂时屈服以保全研究的机会？",impact_score:8,controversy_level:7},{id:"case_017",value_pair:["justice","family"],direction:"justice_over_family",intuitive_lean:"family",title:"林肯处决逃兵儿子的战友",real_person:"亚伯拉罕·林肯 (Abraham Lincoln)",year:1863,location:"美国华盛顿",context:"1863年南北战争期间，林肯总统的儿子罗伯特在军中的好友威廉·斯科特因在哨岗睡觉被军事法庭判处死刑。罗伯特哭着恳求父亲特赦他的朋友，林肯的妻子也以家庭情感施压。但林肯面临困境：如果因为私人关系特赦，会破坏军纪，其他士兵会怎么想？",dilemma:"是应该维护军法的公正性，即使这会让儿子痛苦；还是应该顾及家人感受，利用权力救下儿子的朋友？",actual_choice:"林肯经过彻夜思考，最终拒绝特赦，让军法按程序执行。威廉·斯科特被执行了枪决。",consequences:"罗伯特对父亲产生了长期的怨恨，父子关系出现裂痕。但林肯维护了军法的严肃性，北军纪律得到加强。历史学家认为这一决定对联邦军队最终获胜起到了重要作用。林肯本人为此痛苦终生。",choice_support_a:"支持林肯：公职人员必须维护法律公正，不能因私人关系破坏规则，这是对所有人负责（正义 > 亲情）",choice_support_b:"质疑林肯：为了抽象的'公正'牺牲家人的情感需求是冷酷的，家人应该是第一位的（亲情 > 正义）",reflection:"如果你是掌权者，你会为了维护公正而让家人承受痛苦吗？",impact_score:7.5,controversy_level:7.5},{id:"case_063",value_pair:["justice","family"],direction:"justice_over_family",intuitive_lean:"justice",title:"包拯铡美案判子",real_person:"包拯（包青天）",year:1057,location:"中国开封",context:"北宋名臣包拯以清廉公正闻名。他的养子包勉在京城倚仗父亲权势，勾结宦官贪污受贿、欺压百姓，还强占民女导致一家三口自杀。案发后，包勉躲回家中，包拯的嫂子（养子生母）跪地哭求：'勉儿是你唯一的儿子，包家就这一根苗，你忍心吗？'满门亲戚都来求情，威胁说如果处死包勉，包家断子绝孙，对不起祖宗。",dilemma:"是应该利用权力包庇儿子、保住包家血脉，还是应该大义灭亲、维护法律公正，即使这意味着包家绝后？",actual_choice:"包拯彻夜未眠，最终召集开封府所有官员，亲自主持对包勉的审判。他当堂宣布包勉罪行：贪污、杀人、强占民女。依律当斩。包拯亲自下令处死了养子。",consequences:"包勉被斩首示众。包拯的嫂子当场昏厥，此后终身不与包拯说话。包家确实断了后（包拯无亲生子）。但此案震动朝野，百姓称颂'包青天铁面无私，连自己儿子都不放过'。包拯的公正形象千古流传，成为中国司法公正的象征。受害民女家属在包拯墓前长跪谢恩。",choice_support_a:"敬佩包拯：法律面前人人平等，即使是自己的儿子犯罪也必须受到惩罚，这才是真正的正义。如果包庇亲人，何以服众？（正义 > 亲情）",choice_support_b:"质疑包拯：儿子虽然有罪，但罪不至死。完全可以从轻发落或流放，非要处死导致绝后，这是对家族的不负责任（亲情 > 过度正义）",reflection:"如果你是法官，你的儿子犯了严重罪行，你会判他死刑吗？",impact_score:9.5,controversy_level:4},{id:"case_018",value_pair:["freedom","loyalty"],direction:"freedom_over_loyalty",intuitive_lean:"freedom",title:"赫鲁晓夫秘密报告",real_person:"尼基塔·赫鲁晓夫 (Nikita Khrushchev)",year:1956,location:"苏联莫斯科",context:"1956年，苏共总书记赫鲁晓夫在党代会上做了秘密报告，揭露斯大林时期的大清洗和个人崇拜。赫鲁晓夫本人曾是斯大林的忠实部下，参与过清洗行动。现在他面临选择：是继续维护党的统一形象和对斯大林的忠诚，还是揭露真相、推动思想解放？",dilemma:"作为党的领导人，应该维护组织团结和对前任领袖的忠诚，还是应该为了人民的思想自由揭露体制的错误？",actual_choice:"赫鲁晓夫选择了揭露真相。他在秘密报告中详细列举了斯大林的罪行，包括非法处决、伪造罪名、制造恐怖气氛等。",consequences:"报告内容很快泄露到全世界，引发了东欧的政治震荡（波兰事件、匈牙利起义）。苏联国内开始了'解冻'时期，数百万政治犯得到平反。但党内保守派对赫鲁晓夫产生不满，最终导致他在1964年被迫下台。",choice_support_a:"支持赫鲁晓夫：揭露体制错误、推动思想解放比维护对领袖的虚假忠诚更重要（自由 > 忠诚）",choice_support_b:"批评赫鲁晓夫：揭露党的错误削弱了组织权威，引发了政治动荡，对组织的忠诚应该优先（忠诚 > 自由）",reflection:"如果你是体制内的高层，你会揭露组织的黑暗历史吗？",impact_score:8.5,controversy_level:8},{id:"case_019",value_pair:["life","environment"],direction:"life_over_environment",intuitive_lean:"life",title:"DDT与疟疾防治",real_person:"保罗·穆勒 (Paul Hermann Müller)",year:1948,location:"全球",context:"1948年，瑞士化学家保罗·穆勒因发明DDT杀虫剂获得诺贝尔奖。DDT在二战后被大规模用于疟疾防治，拯救了数百万生命。但到1960年代，科学家发现DDT会在生物体内累积，导致鸟类蛋壳变薄、物种濒危、生态系统破坏。环保主义者要求全面禁用DDT，但热带国家面临困境：禁用DDT会导致疟疾死灰复燃。",dilemma:"是应该为了保护生态环境全面禁用DDT，即使这会导致数百万人死于疟疾；还是应该继续使用DDT拯救生命，即使这会造成长期的环境破坏？",actual_choice:"发达国家在1970年代基本禁用了DDT。但非洲等疟疾高发地区继续限制性使用DDT用于室内喷洒，作为最后的防疫手段。",consequences:"发达国家的鸟类种群逐渐恢复。但非洲因疟疾每年仍有数十万人死亡，其中大部分是儿童。WHO在2006年重新认可DDT用于疟疾防治。关于'应该拯救眼前的生命还是保护长远的生态'的争论至今仍在继续。",choice_support_a:"支持继续使用DDT：拯救人类生命比保护鸟类更重要，不能让穷国儿童为富国的环保理想买单（生命 > 环境）",choice_support_b:"支持禁用DDT：生态系统一旦崩溃将导致更大规模的生命损失，应该寻找替代方案而不是饮鸩止渴（环境 > 生命）",reflection:"如果你的孩子生活在疟疾高发区，你会支持禁用DDT吗？",impact_score:8,controversy_level:8.5},{id:"case_020",value_pair:["faith","life"],direction:"faith_over_life",intuitive_lean:"life",title:"托马斯·莫尔拒绝承认国王",real_person:"托马斯·莫尔 (Thomas More)",year:1535,location:"英国伦敦",context:"1535年，英国大法官托马斯·莫尔因拒绝承认亨利八世为英国教会最高领袖而被捕。亨利八世给他最后机会：只要宣誓承认国王的宗教权威，就可以释放；拒绝则处死。莫尔是虔诚的天主教徒，认为只有教皇才是教会领袖。他面临选择：背叛信仰以保命，还是为信仰献身？",dilemma:"当世俗权力要求背叛宗教信仰时，应该为了活命而妥协，还是应该坚持信仰哪怕付出生命代价？",actual_choice:"托马斯·莫尔拒绝宣誓，坚持认为国王无权凌驾于教会之上。他在法庭上慷慨陈词，表示宁愿为信仰而死。",consequences:"莫尔被判斩首。临刑前他说：'我是国王的忠臣，但首先是上帝的忠臣。'天主教会后来封他为圣人。但批评者认为，为了宗教教义而放弃生命、抛弃家人是盲目和自私的。",choice_support_a:"敬佩莫尔：信仰是人的精神支柱，为信仰献身是高贵的，生命如果失去信仰就失去意义（信仰 > 生命）",choice_support_b:"质疑莫尔：宗教信仰是个人选择，不值得为此送命，活着才能服务更多人（生命 > 信仰）",reflection:"如果你面临'放弃信仰或者死亡'的选择，你会如何决定？",impact_score:7.5,controversy_level:7},{id:"case_021",value_pair:["justice","safety"],direction:"safety_over_justice",intuitive_lean:"justice",title:"9/11后的关塔那摩监狱",real_person:"乔治·W·布什 (George W. Bush)",year:2002,location:"美国",context:"2001年9/11恐怖袭击后，美国总统布什面临选择：是严格遵守日内瓦公约和美国宪法给予恐怖嫌疑人正当法律程序，还是为了国家安全采取非常手段？布什政府最终决定在关塔那摩建立监狱，关押恐怖嫌疑人而不给予审判权利，并授权使用'强化审讯技术'（被批评者称为酷刑）。",dilemma:"在面对恐怖主义威胁时，是应该坚持法治和人权原则，即使这可能让一些恐怖分子逃脱；还是应该为了公共安全牺牲部分正义原则？",actual_choice:"布什政府选择了安全优先。数百名嫌疑人被无限期关押在关塔那摩，没有审判，没有律师，许多人遭受水刑等'强化审讯'。",consequences:"美国在此后数年没有发生大规模恐怖袭击，布什支持者认为这证明了政策有效。但关塔那摩成为美国人权污点，损害了美国的国际形象。许多被关押者后来被证明是无辜的。奥巴马承诺关闭关塔那摩但最终未能实现。",choice_support_a:"支持安全优先：在极端威胁下，保护数百万无辜公民的安全比维护少数恐怖嫌疑人的权利更重要（安全 > 正义）",choice_support_b:"坚持正义原则：放弃法治原则就是向恐怖主义投降，酷刑和非法关押是对文明底线的背叛（正义 > 安全）",reflection:"如果你是总统，在面对恐怖威胁时，你会坚守法治还是采取极端手段？",impact_score:9,controversy_level:9},{id:"case_022",value_pair:["freedom","family"],direction:"freedom_over_family",intuitive_lean:"freedom",title:"苏菲·肖尔反纳粹传单",real_person:"苏菲·肖尔 (Sophie Scholl)",year:1943,location:"德国慕尼黑",context:"1943年，21岁的德国大学生苏菲·肖尔和哥哥汉斯参加了反纳粹组织'白玫瑰'，秘密印刷传单揭露纳粹罪行。她的父母恳求她停止危险行动：'我们已经失去了你的哥哥，不能再失去你。为了家人，放弃这些吧。'但苏菲认为在纳粹暴政下保持沉默是可耻的，她必须为自由和良心发声。",dilemma:"是应该为了家人的安全放弃反抗，还是应该为了自由和正义的理想冒险行动，即使这会让父母承受失去子女的痛苦？",actual_choice:"苏菲选择继续行动。1943年2月18日，她和哥哥在慕尼黑大学散发传单时被捕。盖世太保威胁说只要她供出同伙就可以免死，但她拒绝背叛。",consequences:"苏菲和哥哥在被捕四天后被纳粹判处死刑，执行断头台。她的最后遗言是：'这样美好的阳光天气，而我必须离开......但有多少人现在正在死去，而我的死又算得了什么。'她的父母承受了失去两个孩子的巨大痛苦。战后她被誉为反纳粹英雄。",choice_support_a:"敬佩苏菲：在暴政下为自由和正义献身是高贵的，不能为了家人安全而对罪恶保持沉默（自由 > 亲情）",choice_support_b:"同情父母：父母养育子女不是为了让他们殉道，保护家人是首要责任，理想主义不应该以家人痛苦为代价（亲情 > 自由）",reflection:"如果你是苏菲的父母，你会支持她的选择吗？",impact_score:9,controversy_level:7.5},{id:"case_023",value_pair:["faith","loyalty"],direction:"loyalty_over_faith",intuitive_lean:"faith",title:"马丁·路德·金拒绝共产党",real_person:"马丁·路德·金 (Martin Luther King Jr.)",year:1965,location:"美国",context:"1965年，民权运动领袖马丁·路德·金面临艰难选择。FBI威胁他：如果不与运动中的共产党同情者切割、不公开谴责激进左翼，就会公开他的私生活丑闻。共产党支持者一直是民权运动的重要盟友，为黑人权利斗争提供了大量资金和组织支持。但金担心如果被贴上'赤色分子'标签，会毁掉整个民权运动。",dilemma:"是应该坚守对盟友和同志的忠诚，即使这会被利用来攻击运动；还是应该为了更大的理想（种族平等）与某些盟友切割？",actual_choice:"金选择了与激进左翼保持距离，公开强调民权运动的非暴力和基督教性质，与共产主义划清界限。一些曾并肩战斗的激进派因此离开了运动。",consequences:"金的策略使民权运动获得了更广泛的中产阶级支持，最终促成了1964年民权法案的通过。但他因'背叛'盟友而受到激进派的批评，一些左翼活动家认为他向权力妥协了。",choice_support_a:"理解金的选择：为了实现更大的目标（种族平等），必须做出战术妥协，忠诚不应该妨碍理想实现（信仰/理想 > 忠诚）",choice_support_b:"批评金的选择：在压力下抛弃并肩战斗的同志是背叛，忠诚和团结才是运动的基础（忠诚 > 信仰）",reflection:"如果你是运动领袖，你会为了策略成功而与激进盟友切割吗？",impact_score:7.5,controversy_level:8},{id:"case_024",value_pair:["life","family"],direction:"life_over_family",intuitive_lean:"life",title:"特里·夏沃安乐死案",real_person:"特里·夏沃 (Terri Schiavo)",year:2005,location:"美国佛罗里达",context:"2005年，美国女子特里·夏沃因心脏骤停导致严重脑损伤，成为植物人已15年。她的丈夫迈克尔认为妻子不愿意以植物人状态活着，要求医院拔除喂食管，让她安然离世。但特里的父母坚决反对，认为只要还活着就有希望，他们要求继续维持女儿生命。",dilemma:"当家人意见分裂时，应该尊重患者生前可能的意愿让其安然离世，还是应该不惜代价维持生命直到自然死亡？",actual_choice:"经过多年法律battle，法院最终支持丈夫的决定，允许拔除喂食管。2005年3月31日，特里在父母守候中去世。",consequences:"此案引发美国社会大辩论，甚至惊动了国会和总统。父母至今认为丈夫'谋杀'了女儿。这个案例促使更多美国人开始签署生前遗嘱，明确表明自己对生命维持治疗的态度。",choice_support_a:"支持丈夫：植物人状态没有意义，让患者有尊严地离开比维持毫无质量的生命更重要（生命尊严 > 亲情执念）",choice_support_b:"支持父母：只要还有一丝生命，就不应该放弃，父母有权为子女争取每一天的生存机会（亲情 > 生命质量）",reflection:"如果是你的亲人成为植物人，你会选择拔管还是继续维持？",impact_score:8.5,controversy_level:9},{id:"case_025",value_pair:["truth","safety"],direction:"truth_over_safety",intuitive_lean:"truth",title:"切尔诺贝利真相揭露",real_person:"瓦列里·列加索夫 (Valery Legasov)",year:1986,location:"苏联",context:"1986年切尔诺贝利核电站爆炸后，首席科学家列加索夫发现事故原因是反应堆设计缺陷，苏联其他十几座同类型反应堆都存在同样隐患。苏联当局要求他对国际原子能机构隐瞒设计缺陷，只承认是操作失误，以维护苏联核工业声誉和'社会稳定'。但列加索夫知道，隐瞒真相意味着其他反应堆随时可能重演灾难。",dilemma:"是应该服从国家利益隐瞒核设施缺陷以维护社会稳定，还是应该不顾后果揭露真相以防止未来灾难？",actual_choice:"列加索夫在国际会议上部分遵守了官方口径，但私下录制了揭露真相的录音带。1988年，在事故两周年当天，他在家中自杀，留下了揭露苏联核工业系统性问题的证词。",consequences:"列加索夫的录音带在他死后流传开来，促使苏联改进核电站安全设计。但他本人被官方打压，被剥夺应得的荣誉。HBO剧集《切尔诺贝利》让世界认识了这位为真相牺牲的科学家。",choice_support_a:"敬佩列加索夫：科学家的职责是揭露真相，隐瞒安全隐患可能导致更大灾难，真相高于稳定（真实 > 安全）",choice_support_b:"理解官方立场：在冷战背景下，揭露核设施缺陷可能引发恐慌，危及国家安全，稳定优先（安全 > 真实）",reflection:"如果你发现危险真相，你会冒险揭露还是服从掩盖命令？",impact_score:9,controversy_level:7.5},{id:"case_026",value_pair:["environment","family"],direction:"environment_over_family",intuitive_lean:"family",title:"朱莉娅·希尔树上抗议",real_person:"朱莉娅·巴特菲尔德·希尔 (Julia Butterfly Hill)",year:1999,location:"美国加州",context:"1997年，23岁的环保活动家朱莉娅为抗议砍伐千年红杉，爬上一棵55米高的古树，发誓不达目的不下树。她的家人恳求她下来：'你的父母需要你，你不能为了一棵树抛弃家人。'但朱莉娅认为这些古树是不可替代的生态遗产，她在树上搭建了简易平台，靠绳索运送的食物维生。",dilemma:"是应该回到地面照顾需要她的家人，还是应该为了环保事业继续危险的树上抗议，即使家人为此担惊受怕？",actual_choice:"朱莉娅在树上坚守了738天（超过两年），经历了暴风雨、寒冬和伐木公司的骚扰。她拒绝了所有劝她下树的请求，包括家人的恳求。",consequences:"1999年，木材公司最终妥协，承诺永久保护这棵树和周围的树林。朱莉娅成为环保英雄，但她与家人的关系严重紧张。她的母亲公开表示无法理解女儿'为了树而抛弃家人'的行为。",choice_support_a:"支持朱莉娅：千年古树是不可替代的生态遗产，为环保献身是有意义的牺牲（环境 > 亲情）",choice_support_b:"同情家人：环保重要但不应该以抛弃家人为代价，父母养育子女不是为了让他们在树上冒险两年（亲情 > 环境）",reflection:"如果你的子女为了环保事业做出极端行为，你会支持还是反对？",impact_score:7,controversy_level:7.5},{id:"case_027",value_pair:["loyalty","safety"],direction:"safety_over_loyalty",intuitive_lean:"safety",title:"刺杀希特勒计划",real_person:"克劳斯·冯·施陶芬贝格 (Claus von Stauffenberg)",year:1944,location:"德国",context:"1944年，德国陆军上校施陶芬贝格策划刺杀希特勒。他曾宣誓效忠元首，但目睹纳粹暴行后认为希特勒正在毁灭德国。他面临道德困境：作为军人，他向希特勒宣过誓；但作为德国人，他知道只有除掉希特勒才能拯救国家、结束战争、挽救无数生命。",dilemma:"是应该遵守对领袖的忠诚誓言，还是应该为了拯救国家和人民的生命背叛誓言、刺杀元首？",actual_choice:"施陶芬贝格选择了刺杀行动。1944年7月20日，他将炸弹带入希特勒的会议室。虽然他明知刺杀是对誓言的背叛。",consequences:"炸弹爆炸但希特勒幸存。施陶芬贝格和同谋者当晚被捕并枪决。纳粹清洗了约5000名'叛徒'。但施陶芬贝格在战后被视为德国良心的象征，证明'忠诚不应该高于人性'。",choice_support_a:"敬佩施陶芬贝格：当领袖背叛国家时，背叛领袖就是真正的忠诚，拯救生命高于誓言（安全/生命 > 忠诚）",choice_support_b:"质疑背叛：军人誓言神圣，一旦允许违背誓言，军队纪律将崩溃，忠诚是根本（忠诚 > 其他考量）",reflection:"如果你宣誓效忠的领袖正在毁灭国家，你会背叛誓言吗？",impact_score:9,controversy_level:7},{id:"case_028",value_pair:["life","loyalty"],direction:"loyalty_over_life",intuitive_lean:"life",title:"弗拉基米尔·科马罗夫的最后飞行",real_person:"弗拉基米尔·科马罗夫 (Vladimir Komarov)",year:1967,location:"苏联",context:"1967年，苏联宇航员科马罗夫被安排驾驶联盟1号飞船。工程师发现飞船有200多个技术缺陷，飞行几乎必死无疑。但政府为了赶在五一节前完成任务坚持发射。科马罗夫知道风险，但如果他拒绝，替补宇航员尤里·加加林（他的好友）将被派上天。",dilemma:"是应该拒绝执行必死任务以保全性命，但这会害死自己最好的朋友；还是应该接受任务，用自己的死亡换朋友的生存？",actual_choice:"科马罗夫选择了执行任务。他告诉妻子：'如果我不去，他们会派尤里去，我不能让他去送死。'1967年4月24日，联盟1号升空。",consequences:"飞船降落伞失灵，科马罗夫以高速撞击地面，成为第一位在太空任务中牺牲的人。录音记录了他坠落前的咒骂和绝望。他的牺牲暴露了苏联太空计划的问题，促使系统改进，拯救了后续宇航员包括加加林的生命。",choice_support_a:"敬佩科马罗夫：为了保护朋友而牺牲自己是真正的英雄主义，对友情的忠诚高于自己的生命（忠诚 > 生命）",choice_support_b:"批评体制：没有人应该被迫在'自己死或朋友死'之间选择，真正的问题是强迫宇航员送死的体制（生命 > 忠诚）",reflection:"如果执行任务就是送死，你会为了保护朋友而代替他去吗？",impact_score:9,controversy_level:6.5},{id:"case_029",value_pair:["faith","truth"],direction:"truth_over_faith",intuitive_lean:"truth",title:"查尔斯·达尔文发表进化论",real_person:"查尔斯·达尔文 (Charles Darwin)",year:1859,location:"英国",context:"1859年，达尔文完成了《物种起源》，提出进化论。但他深知这一理论将动摇基督教创世论根基，背离他从小接受的宗教信仰。他的妻子艾玛是虔诚的基督徒，恳求他不要发表'亵渎上帝'的理论。达尔文陷入20年的痛苦犹豫：是坚守宗教信仰、保护家庭和睦，还是公布颠覆信仰的科学真理？",dilemma:"当科学发现与宗教信仰冲突时，应该为了维护信仰压制真相，还是应该为了真理挑战信仰，即使这会破坏家庭关系、背离一生的信念？",actual_choice:"达尔文最终选择发表进化论。1859年11月24日，《物种起源》出版，首印1250册当天售罄。",consequences:"进化论引发巨大争议，教会谴责达尔文为'异端'。他与妻子的关系紧张，终生为背离信仰而内疚。但进化论成为现代生物学基础，从根本上改变了人类对自身的认识。达尔文临终前仍在为'伤害了妻子的信仰'而自责。",choice_support_a:"支持达尔文：科学真理不应该被宗教信仰压制，追求真相是人类进步的基础（真实 > 信仰）",choice_support_b:"同情妻子：信仰是人的精神支柱，为了科学理论而破坏家人的信仰体系是残忍的（信仰 > 真实）",reflection:"如果你的科学发现会颠覆你和家人的宗教信仰，你会发表吗？",impact_score:9.5,controversy_level:8},{id:"case_064",value_pair:["faith","truth"],direction:"faith_over_truth",intuitive_lean:"faith",title:"特雷莎修女伪造孤儿出生证",real_person:"特雷莎修女 (Mother Teresa)",year:1971,location:"印度加尔各答",context:"1971年印巴战争期间，大量孟加拉穆斯林难民涌入印度。特雷莎修女的孤儿院收留了数百名穆斯林儿童。印度教极端分子闯入孤儿院，要求交出所有穆斯林儿童名单，声称要'送他们回孟加拉'（实际是要杀害）。印度政府官员也要求修女提供真实登记信息，说这是'依法行政'。",dilemma:"是应该说出真相、提供穆斯林儿童的真实信息，遵守法律和诚实原则；还是应该对当局说谎、伪造出生证明把穆斯林儿童改成印度教徒，保护这些孩子的生命但违背诚实原则？",actual_choice:"特雷莎修女选择了说谎。她连夜伪造了所有穆斯林儿童的出生证明，把他们的名字改成印度教名字，宗教一栏全部填写'印度教'。当官员和暴徒来查时，她拿出假证明说：'这里没有穆斯林儿童，都是印度教孤儿。'",consequences:"特雷莎修女的谎言救了312名穆斯林儿童的生命。战争结束后，她帮助这些孩子找到家人或安置到穆斯林社区。但她终生为'欺骗政府、伪造文件'感到内疚，多次在忏悔中提及此事。教会内部对她的行为也有争议：有人认为她违背了'不可作假见证'的诫命。但被救孩子的家人称她为'圣人'。",choice_support_a:"支持特雷莎：在生命受到威胁时，保护无辜者高于说真话的义务。上帝不会因为拯救生命的谎言而惩罚人（信仰/慈悲 > 绝对真实）",choice_support_b:"质疑做法：即使是为了善意，违背诚实原则和法律就是错的。应该寻求其他方式保护孩子，而不是说谎（真实/法律 > 善意谎言）",reflection:"如果说真话会导致无辜者死亡，你会选择说谎吗？",impact_score:9.5,controversy_level:3},{id:"case_030",value_pair:["justice","truth"],direction:"justice_over_truth",intuitive_lean:"truth",title:"辛普森案陪审团判决",real_person:"O.J.辛普森陪审团",year:1995,location:"美国洛杉矶",context:"1995年，美国橄榄球明星辛普森被控杀害前妻。证据包括血迹DNA、手套等，科学上几乎证明他有罪。但辩护律师揭露了洛杉矶警局的种族歧视历史和证据采集违规。陪审团（多数为黑人）面临选择：基于科学证据定罪，还是通过无罪判决惩罚有种族主义历史的警局、为历史上无数被冤枉的黑人'复仇'？",dilemma:"是应该忠于证据和真相做出可能正确的判决，还是应该利用这次机会向不公正的制度发出信号，即使这可能让真凶逍遥法外？",actual_choice:"陪审团经过不到四小时讨论，判决辛普森无罪。多位陪审员后来承认，他们知道辛普森可能有罪，但判他无罪是对警局种族主义的'报复'。",consequences:"判决引发美国社会撕裂，白人多数认为司法不公，黑人多数为判决欢呼。辛普森虽获自由但身败名裂。这个案例成为'陪审团是否应该基于政治动机而非证据判案'的经典争议。1997年民事诉讼判定辛普森需赔偿3350万美元。",choice_support_a:"支持陪审团：在系统性种族不公面前，这次判决是对历史不公的矫正，社会正义高于个案真相（正义 > 真实）",choice_support_b:"批评判决：司法系统应该只看证据和真相，用错误判决报复制度是对法治的破坏（真实 > 正义）",reflection:"如果你是陪审员，你会基于证据还是基于社会正义考量判案？",impact_score:8.5,controversy_level:9.5},{id:"case_031",value_pair:["freedom","no_harm"],direction:"freedom_over_no_harm",intuitive_lean:"no_harm",title:"《查理周刊》讽刺漫画",real_person:"史提芬·夏博尼耶 (Stéphane Charbonnier)",year:2015,location:"法国巴黎",context:"法国讽刺杂志《查理周刊》主编夏博尼耶坚持发表嘲讽伊斯兰先知穆罕默德的漫画，认为这是言论自由。穆斯林社区警告这些漫画严重伤害了全球十几亿穆斯林的宗教感情，甚至可能引发暴力报复。法国政府和许多知识分子也建议他停止，以避免激化矛盾、危及无辜民众安全。",dilemma:"是应该坚持言论自由原则继续发表讽刺漫画，还是应该考虑到可能造成的伤害和危险而自我克制？",actual_choice:"夏博尼耶拒绝妥协，继续发表讽刺漫画。他说：'如果我们屈服于威胁，言论自由就死了。'",consequences:"2015年1月7日，两名极端分子冲进《查理周刊》编辑部，枪杀12人，包括夏博尼耶在内的多位漫画家。袭击引发全球'我是查理'运动，支持者认为这是捍卫言论自由；批评者认为《查理周刊》的挑衅不负责任，导致无辜者送命。",choice_support_a:"支持夏博尼耶：言论自由是民主社会基石，不能因为暴力威胁而自我审查（自由 > 避免伤害）",choice_support_b:"批评《查理周刊》：言论自由不应该包括故意伤害他人信仰的权利，挑衅导致无辜同事丧生是不负责任的（不伤害无辜 > 自由）",reflection:"如果行使言论自由可能导致暴力报复伤及无辜，你会自我克制吗？",impact_score:9.5,controversy_level:9.5},{id:"case_032",value_pair:["loyalty","no_harm"],direction:"no_harm_over_loyalty",intuitive_lean:"no_harm",title:"休·汤普森制止美莱村屠杀",real_person:"休·汤普森 (Hugh Thompson Jr.)",year:1968,location:"越南美莱村",context:"1968年越战期间，美军直升机飞行员汤普森目睹自己的战友正在屠杀手无寸铁的越南平民——老人、妇女、儿童。他的长官和战友正在执行'清剿'任务。汤普森面临选择：作为军人，他应该服从命令、忠于战友；但作为人，他无法容忍对无辜平民的屠杀。",dilemma:"是应该忠于军队和战友，对屠杀平民保持沉默；还是应该背叛战友，阻止屠杀、拯救无辜者？",actual_choice:"汤普森将直升机降落在美军和平民之间，命令机枪手：'如果美军继续射击平民，就向美军开火。'他用直升机运走了11名越南平民，包括儿童。",consequences:"汤普森救下的平民幸存，但他在军中被视为叛徒，遭受长期排挤和死亡威胁。军方试图掩盖美莱村屠杀。直到30年后，汤普森才被追授勇气勋章。他说：'我宁愿被军队当叛徒，也不愿成为屠杀儿童的帮凶。'",choice_support_a:"敬佩汤普森：保护无辜生命高于对军队的忠诚，在暴行面前沉默就是共谋（不伤害无辜 > 忠诚）",choice_support_b:"理解军队文化：战时背叛战友、用枪指向自己人违背了军人的根本价值（忠诚 > 其他考量）",reflection:"如果你目睹战友犯下战争罪行，你会制止还是保持沉默？",impact_score:9.5,controversy_level:7},{id:"case_033",value_pair:["environment","no_harm"],direction:"no_harm_over_environment",intuitive_lean:"no_harm",title:"亚马逊雨林与原住民驱逐",real_person:"奇科·门德斯 (Chico Mendes)",year:1988,location:"巴西亚马逊",context:"1980年代，巴西政府为了保护亚马逊雨林，计划建立大型自然保护区，但这需要驱逐在雨林中世代居住的原住民和橡胶工人。环保人士面临道德困境：雨林是'地球之肺'，保护雨林对全人类至关重要；但保护区计划将让数万原住民失去家园，破坏他们的生存方式。",dilemma:"是应该为了保护珍贵生态而建立严格保护区，即使这意味着驱逐原住民；还是应该保护原住民权利，即使他们的生存方式可能损害雨林？",actual_choice:"橡胶工人领袖门德斯提出了'提取保护区'模式：允许原住民和橡胶工人继续在雨林中生活和工作，同时禁止商业砍伐。",consequences:"门德斯因反对牧场主砍伐雨林于1988年被暗杀。但他的理念被采纳，创建了既保护雨林又保护原住民权利的'提取保护区'模式。这个案例证明了环保不必以牺牲弱势群体为代价。",choice_support_a:"支持强硬环保：雨林对全球气候至关重要，为了人类长远利益，局部人群的搬迁是必要的（环境 > 不伤害少数人）",choice_support_b:"支持门德斯：驱逐原住民保护环境是环境殖民主义，不应该让弱势群体为环保买单（不伤害无辜 > 环境）",reflection:"为了保护环境，可以驱逐世居原住民吗？",impact_score:8,controversy_level:8},{id:"case_034",value_pair:["life","truth"],direction:"life_over_truth",intuitive_lean:"life",title:"奥斯卡·辛德勒的伪造文件",real_person:"奥斯卡·辛德勒 (Oskar Schindler)",year:1944,location:"波兰",context:"二战期间，德国商人辛德勒雇佣犹太人在工厂工作。1944年，纳粹开始系统性屠杀犹太人，辛德勒面临选择：诚实报告工厂中犹太工人的真实情况（多数人其实已无劳动能力），让他们被送往集中营；还是伪造文件，谎称这些人都是'必不可少的技术工人'，以拯救他们的生命？",dilemma:"是应该诚实地向纳粹政府报告真实情况遵守法律，还是应该通过撒谎和伪造文件来拯救无辜生命？",actual_choice:"辛德勒选择了大规模撒谎。他伪造文件、贿赂官员，将1200名犹太人列入'必需工人名单'，声称他们都是不可替代的技术专家。",consequences:"辛德勒名单上的1200名犹太人全部幸存。辛德勒为此耗尽家财，战后陷入贫困。1993年电影《辛德勒的名单》让世界记住了这位'通过撒谎拯救生命'的英雄。",choice_support_a:"赞扬辛德勒：在极端邪恶面前，撒谎以拯救无辜生命是道德的，生命高于诚实（生命 > 真实）",choice_support_b:"坚持原则：即使动机高尚，撒谎和伪造文件也违背了诚实原则（真实 > 后果考量）",reflection:"如果诚实会导致无辜者死亡，你会选择撒谎吗？",impact_score:9.5,controversy_level:3},{id:"case_035",value_pair:["faith","safety"],direction:"faith_over_safety",intuitive_lean:"safety",title:"西藏喇嘛自焚抗议",real_person:"丹增平措 (Thubten Phuntsok)",year:2011,location:"中国四川",context:"2011年起，一些藏族僧人通过自焚抗议中国政府的宗教政策。20岁的僧人丹增平措在自焚前录制了遗言视频。中国政府警告说自焚会被定性为'煽动分裂'，牵连寺院和家人，让更多人受到惩罚。但丹增认为自焚是为了信仰和民族自由的牺牲，他必须用生命唤醒世界关注。",dilemma:"是应该为了寺院安全和家人不受牵连而放弃抗议，还是应该为了信仰和自由进行自焚，即使这会让亲人和僧侣团体承受严厉惩罚？",actual_choice:"丹增平措选择了自焚。他在遗言中说：'为了藏人的自由和达赖喇嘛返回西藏，我将献出生命。'2011年12月1日，他在街头点火自焚。",consequences:"丹增在医院去世，终年20岁。他的寺院遭到整顿，家人被监控。2009-2019年间有超过150名藏人自焚，引发国际关注但也导致当地管控加强。",choice_support_a:"理解牺牲：在没有其他反抗手段时，用生命抗议是捍卫信仰和自由的最后方式（信仰/自由 > 安全）",choice_support_b:"质疑自焚：自焚不仅毁掉自己生命，还让家人和社区承受惩罚，是不负责任的（安全 > 信仰表达）",reflection:"为了信仰和政治理想，可以进行可能牵连亲友的自我牺牲吗？",impact_score:8.5,controversy_level:9},{id:"case_036",value_pair:["justice","environment"],direction:"justice_over_environment",intuitive_lean:"justice",title:"印度恒河污染与穷人生计",real_person:"拉吉夫·甘地 (Rajiv Gandhi)",year:1985,location:"印度",context:"1985年，印度政府面临恒河污染危机。主要污染源是小型皮革厂和染色作坊，这些工厂雇佣了数百万贫困工人。环保部门建议强制关闭所有不达标小厂，恢复恒河水质。但这意味着数百万底层工人将失业，他们没有其他谋生技能，将陷入赤贫。总理甘地面临选择：是环保优先还是社会公正优先？",dilemma:"是应该为了恢复圣河生态而关闭污染工厂，即使这会让数百万穷人失业；还是应该保护底层民众生计，即使这意味着继续污染？",actual_choice:"甘地政府采取了渐进政策：对大工厂强制环保要求，但给小作坊更长宽限期和资金支持，避免一刀切导致大规模失业。",consequences:"恒河污染改善缓慢，至今仍是严重问题。但避免了社会动荡和大规模赤贫。这个案例成为'环保与社会公正冲突'的典型：发达国家可以牺牲经济追求环保，但发展中国家的穷人不能为环保付出生存代价。",choice_support_a:"支持社会公正优先：不能让底层民众为环保买单，就业和生存权高于环境（正义/生计 > 环境）",choice_support_b:"坚持环保优先：恒河污染影响数亿人健康，保护环境是对更多人的正义（环境 > 少数人就业）",reflection:"如果关闭污染工厂会让穷人失业，你会强制关闭吗？",impact_score:8,controversy_level:8.5},{id:"case_037",value_pair:["freedom","environment"],direction:"environment_over_freedom",intuitive_lean:"freedom",title:"中国禁摩托车治理雾霾",real_person:"北京市政府",year:2002,location:"中国北京",context:"2002年，北京为治理空气污染决定禁止摩托车上路，后来还限制外地车辆和实施单双号限行。数百万依靠摩托车上班的外来务工人员、送餐员、快递员抗议这侵犯了他们的出行自由。政府坚持认为治理雾霾是公共利益，个人必须做出牺牲。",dilemma:"是应该保障公民自由选择交通工具的权利，还是应该为了集体环境利益限制个人出行自由？",actual_choice:"政府强制执行禁摩令和限行政策，没收了数万辆摩托车。抗议者被驱散，政策严格执行。",consequences:"北京空气质量在后续十年显著改善（当然也有其他因素）。但数十万底层劳动者被迫改变通勤方式，成本和时间大幅增加。批评者认为这是以牺牲底层民众权益为代价的'环保独裁'。",choice_support_a:"支持政府：环境污染危及所有人健康，限制少数人的出行自由是必要的（环境 > 自由）",choice_support_b:"批评政策：在没有补偿的情况下剥夺穷人的谋生工具是不公正的，环保不应该由底层买单（自由/公正 > 环境）",reflection:"为了环保，可以强制限制个人出行自由吗？",impact_score:7.5,controversy_level:8},{id:"case_038",value_pair:["life","safety"],direction:"safety_over_life",intuitive_lean:"safety",title:"2002年莫斯科剧院人质危机",real_person:"弗拉基米尔·普京 (Vladimir Putin)",year:2002,location:"俄罗斯莫斯科",context:"2002年，车臣恐怖分子占领莫斯科剧院，劫持850名人质，威胁引爆炸药。谈判陷入僵局。俄罗斯特种部队有两个选择：继续谈判可能保住更多人质生命，但恐怖分子可能真的引爆炸药；或者强攻，虽然肯定会有人质伤亡，但可以确保不让恐怖分子得逞、震慑未来恐怖主义。",dilemma:"是应该优先保护当前人质生命尽量谈判，还是应该强硬反恐不向恐怖主义妥协，即使这会导致部分人质死亡？",actual_choice:"普京下令强攻。特种部队向剧院释放麻醉气体后冲入，击毙全部恐怖分子，但129名人质因麻醉剂过量死亡。",consequences:"超过120名人质死于军方的麻醉气体，普京拒绝道歉，称'我们拯救了更多人，向恐怖分子展示了俄罗斯不会妥协。'批评者认为政府牺牲了无辜人质；支持者认为这震慑了恐怖主义，保护了长远安全。",choice_support_a:"支持强攻：向恐怖主义妥协会鼓励更多袭击，强硬反恐保护了更多未来生命（公共安全 > 当前部分人生命）",choice_support_b:"批评政府：政府的职责是保护公民生命，导致120名人质死亡的决定是失败的（生命 > 安全教训）",reflection:"如果你是领导人，你会优先拯救眼前人质还是优先震慑未来恐怖主义？",impact_score:9,controversy_level:9},{id:"case_039",value_pair:["justice","freedom"],direction:"freedom_over_justice",intuitive_lean:"freedom",title:"犹太律师为纳粹游行权辩护",real_person:"阿恩·格德斯坦 (Arne Goldstein, ACLU律师)",year:1977,location:"美国伊利诺伊州斯科基镇",context:"1977年，美国纳粹党申请在斯科基镇（Skokie）游行。该镇60%居民是犹太人，其中数千人是大屠杀幸存者，至今手臂上还有纹身编号。幸存者们恳求政府禁止游行：'我们亲眼看到纳粹杀死我们的父母和孩子。现在让他们穿着纳粹制服、举着卐字旗在我们家门口游行，这是对我们的二次伤害，是对死者的侮辱。求你们了，不要让他们来。'斯科基镇政府准备颁布禁令。但美国公民自由联盟(ACLU)的犹太人律师阿恩·格德斯坦接下了为纳粹辩护的案子——尽管他自己的父母也是大屠杀幸存者。",dilemma:"是应该为了大屠杀幸存者的尊严和心理安全禁止纳粹游行（正义/保护受害者），还是应该捍卫言论自由甚至保护纳粹的游行权（自由）？",actual_choice:"格德斯坦选择为纳粹辩护。他在法庭上说：'我憎恨纳粹，但如果政府能禁止纳粹言论，明天就能禁止我们犹太人的言论。言论自由必须保护所有人，包括我们最憎恨的人。'",consequences:"联邦法院判ACLU胜诉，纳粹获得游行权（但最终取消了游行）。幸存者社区震怒，格德斯坦收到大量死亡威胁，被犹太社区视为叛徒。他的父母虽然理解儿子，但终身背负'儿子为纳粹辩护'的痛苦。但这个判决成为美国言论自由的里程碑，确立了'政府不能因为言论冒犯他人就审查'的原则。连幸存者多年后也承认：'我们恨他的选择，但他保护了所有少数群体的权利。'",choice_support_a:"支持格德斯坦：言论自由必须保护所有人，即使是最可憎的言论。如果政府能禁止纳粹，就能禁止任何异见（言论自由 > 保护受害者感受）",choice_support_b:"同情幸存者：大屠杀幸存者不应该被迫在家门口看到杀害他们家人的旗帜。正义要求保护受害者免受二次伤害（保护受害者 > 绝对言论自由）",reflection:"如果你是犹太律师，你会为纳粹的游行权辩护吗？",impact_score:10,controversy_level:9.5},{id:"case_040",value_pair:["faith","environment"],direction:"environment_over_faith",intuitive_lean:"environment",title:"圣山朝圣与生态破坏",real_person:"冈仁波齐环保争议",year:2015,location:"中国西藏",context:"冈仁波齐是藏传佛教、印度教等多个宗教的圣山，每年数万信徒前来转山朝圣。但大量朝圣者产生的垃圾、排泄物、踩踏等行为严重破坏了高原脆弱生态，稀有植物消失，野生动物迁离。环保组织建议限制朝圣人数、划定核心保护区禁止进入。但宗教领袖和信众认为朝圣是信仰核心，限制朝圣等于剥夺宗教自由。",dilemma:"是应该为了保护脆弱的高原生态系统而限制宗教朝圣活动，还是应该尊重宗教自由允许朝圣继续，即使这会持续破坏环境？",actual_choice:"政府采取了折中方案：允许朝圣但要求自带垃圾下山，建立环保厕所，限制单日朝圣人数上限，核心区禁止扎营。部分宗教人士配合，但仍有信徒认为这是对信仰的亵渎。",consequences:"环境破坏速度减缓但未根本解决。一些虔诚信徒因为限制措施无法完成理想中的朝圣而遗憾。这个案例展示了宗教活动与环境保护的长期张力。",choice_support_a:"支持环保限制：高原生态极其脆弱且不可逆转，保护环境应该优先于宗教活动便利（环境 > 信仰便利）",choice_support_b:"支持宗教自由：信仰自由是基本人权，不应该因为环保而限制宗教朝圣，应该通过教育和技术解决环境问题（信仰 > 环境管制）",reflection:"如果你的宗教活动会破坏珍贵生态，你接受被限制吗？",impact_score:7,controversy_level:7.5},{id:"case_041",value_pair:["loyalty","environment"],direction:"environment_over_loyalty",intuitive_lean:"environment",title:"大众汽车排放门内部举报",real_person:"大众汽车工程师（匿名）",year:2015,location:"德国",context:"2015年，大众汽车工程师发现公司在柴油车上安装作弊软件，测试时显示达标但实际排放超标40倍，每年排放近100万吨超量污染物。这名工程师为大众工作多年，同事都是朋友。他面临选择：对公司忠诚保持沉默，还是举报公司欺诈、保护环境和公众健康？",dilemma:"是应该忠于雇主和同事保守秘密，还是应该为了环境和公众利益揭露企业犯罪？",actual_choice:"这名工程师（身份至今保密）选择了匿名向美国环保署举报。检测确认了作弊行为。",consequences:"大众汽车丑闻曝光，面临250亿美元罚款，CEO辞职，股价暴跌。但举报者在公司内部被视为叛徒，若身份泄露可能面临报复。全球召回1100万辆作弊车辆，避免了持续的环境污染。",choice_support_a:"支持举报者：企业犯罪必须被揭露，保护环境和公众健康高于对公司的忠诚（环境 > 忠诚）",choice_support_b:"理解保密：向外界举报而非内部解决是对同事的背叛，让数万员工失业（忠诚 > 环保举报）",reflection:"如果你发现雇主在造假污染环境，你会举报吗？",impact_score:8.5,controversy_level:6.5},{id:"case_042",value_pair:["faith","justice"],direction:"justice_over_faith",intuitive_lean:"justice",title:"教会性侵案举报神父",real_person:"波士顿环球报调查组",year:2002,location:"美国波士顿",context:"2002年，记者发现波士顿天主教会系统性掩盖神父性侵儿童案件。一些受害者是虔诚教徒，他们面临痛苦选择：公开指控神父会背叛信仰、伤害教会声誉、动摇信众；但保持沉默意味着更多儿童将受害，罪犯逍遥法外。",dilemma:"是应该为了保护教会和信仰而不举报神父的罪行，还是应该为了正义和保护儿童而揭露教会丑闻？",actual_choice:"波士顿环球报发表了调查报告，上百名受害者站出来指控。教会被迫承认掩盖了数十年的性侵案件。",consequences:"全球范围内数千起教会性侵案曝光，教会信誉严重受损，赔偿金额超过30亿美元。但数千名受害儿童得到正义。2015年电影《聚焦》记录了这一事件。部分虔诚教徒至今认为媒体'背叛了信仰'。",choice_support_a:"支持揭露：保护儿童免受侵害比维护教会声誉更重要，正义高于信仰忠诚（正义 > 信仰）",choice_support_b:"同情教会：媒体的报道伤害了数百万虔诚信众的信仰，应该内部解决而非公开羞辱（信仰 > 公开正义）",reflection:"如果揭露宗教机构罪行会伤害信众信仰，你会选择揭露吗？",impact_score:9,controversy_level:7.5},{id:"case_043",value_pair:["family","loyalty"],direction:"family_over_loyalty",intuitive_lean:"family",title:"美籍日裔拒绝参军",real_person:"弗雷德·科雷马松 (Fred Korematsu)",year:1942,location:"美国",context:"二战期间，美国政府强制关押所有西海岸日裔美国人。22岁的科雷马松面临选择：服从政府命令让父母和女友被关进集中营，证明对美国的忠诚；还是拒绝服从、保护家人，但这意味着被视为叛国者。科雷马松选择了抵抗，使用假身份试图保护女友和家人免于被关押。",dilemma:"是应该服从国家命令证明忠诚，即使这会让家人被不公正关押；还是应该反抗不公命令保护家人，即使这被视为不忠？",actual_choice:"科雷马松拒绝报到，躲藏起来试图保护女友和家人。他被捕后成为第一个在法庭上挑战拘留令的日裔美国人。",consequences:"科雷马松被判刑，在狱中度过两年。最高法院维持了拘留令的合法性。但他的反抗成为公民权利斗争的象征。1983年法院推翻原判决，承认当年拘留是错误的。2015年奥巴马追授他总统自由勋章。",choice_support_a:"敬佩科雷马松：保护家人免受不公正对待高于对不义政府的忠诚（家庭 > 忠诚）",choice_support_b:"理解政府：战时服从命令是必要的，个人不应该以家庭为由违抗法律（忠诚 > 家庭）",reflection:"如果政府命令会伤害你的家人，你会服从还是反抗？",impact_score:8.5,controversy_level:6},{id:"case_044",value_pair:["family","safety"],direction:"safety_over_family",intuitive_lean:"family",title:"艾滋病患者强制隔离",real_person:"安德鲁·沙利文 (Andrew Sullivan)",year:1985,location:"美国",context:"1985年艾滋病恐慌时期，一些政客提议强制隔离所有HIV感染者，以保护公众安全。这意味着感染者将被强制与家人分离，关押在隔离设施中。感染者家属面临选择：支持隔离政策保护公共健康，还是反对隔离保护家人权利和尊严？",dilemma:"是应该为了公共安全支持强制隔离感染者，即使这会拆散家庭；还是应该反对隔离维护家人团聚权，即使这可能增加传播风险？",actual_choice:"在同性恋权利活动家和家属的反对下，美国最终没有实施大规模强制隔离，而是采取了教育和自愿检测。",consequences:"避免了对感染者的大规模人权侵害，家庭得以团聚。但艾滋病在1980年代继续传播，数万人死亡。批评者认为如果实施隔离可能挽救更多生命；支持者认为隔离会制造更大恐慌和歧视。",choice_support_a:"反对强制隔离：疾病不是犯罪，不应该因为疾病拆散家庭，家庭权利高于恐惧（家庭 > 安全恐慌）",choice_support_b:"支持隔离政策：在面对致命传染病时，保护公众安全需要牺牲部分个人自由（安全 > 家庭团聚）",reflection:"如果你的家人被诊断为传染病，你支持强制隔离政策吗？",impact_score:8,controversy_level:8.5},{id:"case_103",value_pair:["family","truth"],direction:"truth_over_family",intuitive_lean:"truth",title:"朴延美公开家庭创伤",real_person:"朴延美 (Yeonmi Park)",year:2014,location:"美国",context:"北朝鲜脱北者朴延美在2014年决定向全世界讲述自己的逃亡故事，包括极度私密的家庭苦难：她的母亲在逃亡途中被人贩子强奸，她本人13岁时被性侵，父亲在中国死于肠癌无法得到治疗。她的母亲恳求她：'这些事太羞耻了，不要告诉全世界。我们已经自由了，为什么要让所有人知道我们的屈辱？这会毁掉我的尊严，也会让你妹妹（还在北朝鲜）面临危险。'但朴延美认为：如果不说出真相，世界就不会了解北朝鲜人民的真实苦难，独裁政权将继续迫害数百万人。",dilemma:"是应该为了保护母亲尊严和家人隐私而隐瞒这些极度私密的创伤，还是应该不顾家人反对公开一切，让世界了解真相？",actual_choice:"朴延美在2014年都柏林青年峰会上公开演讲，详细讲述了母亲被强奸、自己被性侵等极度私密的经历。她还出版了回忆录《为了活下去》，毫不保留地揭露了所有细节。",consequences:"她的演讲视频被观看数千万次，《为了活下去》成为畅销书，让全球关注北朝鲜人权。但她的母亲陷入深深的羞愧，多次哭泣说'我的屈辱被全世界知道了'。她在北朝鲜的妹妹处境更危险。一些韩国人和脱北者社区批评她'为了出名出卖家人隐私'。她的家庭为此付出了巨大的情感代价，但北朝鲜的真相得以传播。",choice_support_a:"支持公开：北朝鲜独裁政权的残暴必须被揭露，数百万人的苦难需要世界关注。个人隐私在这样的历史使命面前应该让步（真相/人权 > 家庭隐私）",choice_support_b:"理解母亲：性侵是极度私密的创伤，受害者有权选择不公开。没有人应该被迫牺牲家人尊严去当'人权斗士'（家庭尊严 > 真相传播）",reflection:"如果公开真相需要暴露你母亲被强奸、你自己被性侵的细节，并且母亲哭求你不要说，你会为了更大的使命说出来吗？",impact_score:9.5,controversy_level:7.5},{id:"case_062",value_pair:["family","truth"],direction:"family_over_truth",intuitive_lean:"family",title:"伽利略坚持日心说害苦女儿",real_person:"伽利略·伽利雷 (Galileo Galilei)",year:1633,location:"意大利佛罗伦萨",context:"天文学家伽利略通过望远镜观测证实了日心说（地球围绕太阳转），这是科学事实真相。但罗马教廷认为这违背《圣经》，是异端邪说。伽利略的女儿维吉尼亚（修女玛利亚·切莱斯特）在修道院中因父亲的'异端'学说遭受巨大痛苦：其他修女疏远她，神父在弥撒时暗示她'父亲是魔鬼的仆人'，她每天在恐惧和羞辱中煎熬。她在信中哭着恳求父亲：'爸爸，求您了，就说地球不动吧。说句违心的话，能让您平安，也能让我不再被羞辱。科学真相真的那么重要吗？我快承受不住了...'",dilemma:"是应该为了女儿的安宁说一句违心的话（'地球不动'），还是应该坚持科学事实真相，即使这会让女儿继续在修道院受苦？",actual_choice:"1633年，伽利略在宗教法庭的压力下短暂宣布'地球不动'。但1632年他出版了《关于托勒密和哥白尼两大世界体系的对话》，实质上仍在坚持日心说。最终他被判软禁。",consequences:"伽利略被软禁后，维吉尼亚的处境更加艰难。她在修道院中被完全孤立，精神和身体健康急剧恶化，1634年（父亲被判软禁仅1年后）在痛苦和忧郁中去世，年仅33岁。伽利略收到女儿死讯后悲痛欲绝，在给朋友的信中写道：'我失去了我最亲爱的女儿，她为我的科学追求付出了生命。'但他的坚持最终推动了科学革命，日心说成为现代天文学基础。女儿的牺牲换来了人类对宇宙真相的认知。",choice_support_a:"同情女儿：一个科学理论（即使是真的）值得让你女儿在羞辱和恐惧中死去吗？说句'地球不动'的违心话，女儿就能平安生活。真相可以等，女儿的生命不能等（家人生命 > 科学真相）",choice_support_b:"理解伽利略：如果科学家都因为家人压力而放弃真理，人类就永远活在谎言中。他的女儿也不会希望父亲为了她而背叛科学。真理高于一切（科学真相 > 个人家庭）",reflection:"如果坚持科学真相会让你的女儿在修道院被羞辱折磨至死，而说一句违心的话就能救她，你会怎么选？",impact_score:9.5,controversy_level:8},{id:"case_046",value_pair:["family","no_harm"],direction:"no_harm_over_family",intuitive_lean:"no_harm",title:"谢尔比·诺克斯举报性侵继父",real_person:"谢尔比·诺克斯 (化名案例)",year:2005,location:"美国",context:"15岁女孩发现继父性侵她的小妹妹（8岁）。如果报警，继父入狱，母亲将失去丈夫和经济来源，家庭破裂；母亲甚至可能怪罪她'拆散家庭'。但如果沉默，妹妹将继续受害。她面临选择：保持沉默维护家庭表面完整，还是报警拯救妹妹但导致家庭破碎？",dilemma:"是应该为了家庭完整和母亲不受伤害而对性侵保持沉默，还是应该举报罪行保护妹妹，即使这会毁掉家庭？",actual_choice:"女孩选择了报警。她告诉警察继父的罪行，即使她知道母亲会恨她。",consequences:"继父被捕判刑，妹妹脱离了侵害。母亲最初确实责怪了女儿，家庭陷入混乱。但几年后，母亲醒悟过来，感谢女儿的勇气。妹妹长大后说：'姐姐拯救了我的人生。'",choice_support_a:"支持报警：保护无辜儿童免受侵害高于维护家庭表面和谐（不伤害无辜 > 家庭完整）",choice_support_b:"理解沉默：15岁孩子不应该承担拆散家庭的重担，应该寻求其他方式而非报警（家庭 > 报警后果）",reflection:"如果举报家庭成员罪行会导致家庭破裂，你会报警吗？",impact_score:8.5,controversy_level:5},{id:"case_047",value_pair:["faith","no_harm"],direction:"no_harm_over_faith",intuitive_lean:"no_harm",title:"耶和华见证人拒绝输血导致儿童死亡",real_person:"加拿大输血案",year:1995,location:"加拿大",context:"1995年，一名耶和华见证人教徒的孩子因事故大量失血，医生说必须输血才能活命。但该教派严格禁止输血，认为这违背圣经教义。父母拒绝输血，坚持信仰。医院面临选择：尊重父母的宗教信仰权让孩子死去，还是违背父母意愿强制输血拯救孩子生命？",dilemma:"是应该尊重宗教信仰自由，即使这会导致无辜儿童死亡；还是应该优先保护儿童生命，强制医疗干预违背父母信仰？",actual_choice:"法院紧急介入，授权医院强制输血。孩子被拯救，但父母认为这是对宗教自由的侵犯。",consequences:"孩子存活，但与父母的关系紧张。这个案例在全球引发关于'宗教自由vs儿童权利'的讨论。许多国家立法允许医院在紧急情况下违背父母意愿抢救儿童。耶和华见证人教会至今坚持输血禁令。",choice_support_a:"支持强制输血：儿童有独立的生命权，不应该因为父母的信仰而死亡（不伤害儿童 > 信仰自由）",choice_support_b:"支持父母权利：宗教信仰自由是基本人权，政府不应该强制医疗干预（信仰自由 > 强制救治）",reflection:"如果父母的宗教信仰会导致孩子死亡，政府应该干预吗？",impact_score:9,controversy_level:8.5},{id:"case_048",value_pair:["faith","freedom"],direction:"freedom_over_faith",intuitive_lean:"freedom",title:"沙特女性驾车抗议",real_person:"玛娜尔·谢里夫 (Manal al-Sharif)",year:2011,location:"沙特阿拉伯",context:"2011年，沙特女性玛娜尔因宗教法律禁止女性驾车。保守派宗教学者坚称这是伊斯兰传统，女性驾车违背信仰和社会道德。玛娜尔认为这是对女性自由的压迫，驾车是基本权利，她决定公开违抗禁令、上传驾车视频。她的家人恳求她停止：'不要挑战信仰和传统，这会给家族带来耻辱。'",dilemma:"是应该遵守基于宗教的法律和传统，还是应该为了个人自由和女权而挑战信仰传统？",actual_choice:"玛娜尔公开驾车并上传视频。她被捕入狱，但拒绝道歉，坚称'驾车是权利不是犯罪'。",consequences:"玛娜尔因驾车被判刑并失去工作。但她的行动引发全球关注和国内女性觉醒。2018年，沙特终于解禁女性驾车。玛娜尔被誉为女权英雄，但保守派至今认为她'背叛了信仰'。",choice_support_a:"支持玛娜尔：个人自由和平等权利高于宗教传统限制（自由 > 信仰传统）",choice_support_b:"理解保守派：宗教法律是社会秩序基础，挑战信仰会导致道德崩溃（信仰 > 个人自由）",reflection:"如果宗教传统限制你的基本权利，你会公开反抗吗？",impact_score:8.5,controversy_level:9},{id:"case_049",value_pair:["justice","no_harm"],direction:"justice_over_no_harm",intuitive_lean:"justice",title:"性侵犯罪人名单公开",real_person:"梅根·康卡案后立法",year:1996,location:"美国",context:"1994年，7岁女孩梅根·康卡被邻居性侵杀害。凶手是有前科的性犯罪者，但家长们不知情。悲剧后，美国通过'梅根法案'要求公开性犯罪者信息。但这意味着已经服刑完毕的人将被终身标记，他们的子女、配偶等无辜家人也会被牵连，遭受社区歧视，孩子在学校被欺凌。",dilemma:"是应该公开性犯罪者信息以保护潜在受害者实现正义，即使这会伤害犯罪者的无辜家人；还是应该保护罪犯家人隐私，即使这可能让潜在施害者隐藏在社区中？",actual_choice:"美国全面实施梅根法案，公开性犯罪者姓名、照片、住址。网站可以查询你邻居是否是性犯罪者。",consequences:"许多性侵案被提前预防，社区安全感提升。但性犯罪者的子女因父母罪行被歧视，有家庭因此自杀。性犯罪者难以重新融入社会，再犯率是否真的降低仍有争议。",choice_support_a:"支持公开：保护潜在受害儿童的安全高于保护罪犯家人不受牵连（正义/安全 > 不伤害罪犯家属）",choice_support_b:"质疑政策：惩罚应该针对犯罪者本人，不应该让无辜子女承受歧视和羞辱（不伤害无辜 > 正义展示）",reflection:"为了保护社区安全，可以公开罪犯信息即使这会伤害其无辜家人吗？",impact_score:8,controversy_level:8},{id:"case_050",value_pair:["life","no_harm"],direction:"life_over_no_harm",intuitive_lean:"no_harm",title:"电车难题现实版：器官移植",real_person:"德国器官分配争议",year:2012,location:"德国",context:"2012年德国一个案例：一名脑死亡患者的器官可以拯救5个濒死病人（心脏、肝、肾×2、肺）。但医生发现如果摘取器官，这5人中可能有2人的身体会排斥器官，导致捐献者原本可以救活的另外3个人失去机会。而且这2人是富人通过操纵名单排到前面的。是否应该按原计划给这5人移植，即使明知可能浪费器官且存在不公？",dilemma:"是应该拯救眼前这5个生命，即使其中可能有人不配获得且会浪费资源；还是应该让这5人等待，优先给那3个更有救活希望的人，但这意味着这5人可能等不到下一个器官？",actual_choice:"医生最终按照等待名单顺序移植，5人接受器官。后来确实有2人排异反应严重，器官功能不佳。",consequences:"5人中3人完全康复，2人长期依赖药物。批评者指出如果分配给最合适的5个人，可能拯救5个完全康复的生命。这个案例凸显了器官分配的道德困境。",choice_support_a:"支持救眼前5人：已经在名单上的人有权获得器官，不应该因为效果可能不佳就放弃他们（生命平等 > 效果最优）",choice_support_b:"支持优化分配：医疗资源珍贵，应该救活可能性最大的人，让器官发挥最大价值（拯救更多生命 > 不伤害当前患者）",reflection:"如果救5个人但效果不佳，还是救3个人但完全康复，你会如何选择？",impact_score:7.5,controversy_level:8},{id:"case_051",value_pair:["environment","truth"],direction:"truth_over_environment",intuitive_lean:"environment",title:"气候门邮件泄露事件",real_person:"东英吉利大学气候研究中心",year:2009,location:"英国",context:"2009年，黑客泄露了气候科学家的内部邮件，显示科学家讨论如何'调整'数据以更有力地证明气候变暖，以及如何压制反对声音。环保组织恳求媒体不要报道：'即使科学家有些过激，但气候危机是真实的，报道这些邮件会被否认派利用，阻碍环保事业。'记者面临选择：为了环保大业而掩盖科学不端，还是揭露真相哪怕被反环保派利用？",dilemma:"是应该为了保护环保事业而掩盖科学家的不当行为，还是应该揭露真相，即使这会被用来攻击气候科学、阻碍环保进程？",actual_choice:"媒体广泛报道了'气候门'丑闻。多家机构调查确认存在数据处理不当和学术不端行为。",consequences:"气候否认派大肆宣传'气候变暖是骗局'，环保运动受到打击，公众对气候科学的信任度下降。但调查也促使气候研究更加透明规范。科学家们后来承认'为了正义目的而操纵真相也是错的'。",choice_support_a:"支持揭露：科学必须基于真实数据，即使动机高尚也不能容忍学术不端（真实 > 环保目的）",choice_support_b:"理解掩盖：气候危机是真实的，揭露科学家瑕疵会被坏人利用，环保大局高于学术纯洁（环境大局 > 科学真实瑕疵）",reflection:"如果揭露真相会被用来攻击你认同的事业，你会揭露吗？",impact_score:8,controversy_level:8.5},{id:"case_052",value_pair:["safety","no_harm"],direction:"safety_over_no_harm",intuitive_lean:"no_harm",title:"反恐刑讯逼供",real_person:"阿布·祖贝达 (Abu Zubaydah)",year:2002,location:"美国秘密监狱",context:"2002年，CIA抓获基地组织嫌犯祖贝达。审讯者相信他掌握即将发动的恐怖袭击情报，可能拯救数千生命。但他拒绝合作。CIA面临选择：使用水刑等'强化审讯技术'（酷刑）获取情报防止袭击，还是遵守禁止酷刑的国际法，即使这意味着无辜平民可能死于恐怖袭击？",dilemma:"是应该对恐怖嫌疑人实施酷刑以获取拯救生命的情报，还是应该坚守不对任何人施加酷刑的原则，即使这可能无法阻止袭击？",actual_choice:"CIA对祖贝达实施了83次水刑和其他酷刑。他最终提供了一些情报（后来证明多数不可靠）。",consequences:"祖贝达在关塔那摩被关押至今（20+年）从未受审。酷刑获得的情报多数被证实不可靠。美国因酷刑丑闻国际声誉受损。批评者称酷刑违背了美国价值观；支持者称在紧急情况下这是必要的恶。",choice_support_a:"理解酷刑：在滴答作响的定时炸弹情境下，为了拯救无辜平民，对恐怖分子用刑是必要的（公共安全 > 不伤害嫌犯）",choice_support_b:"反对酷刑：禁止酷刑是文明底线，一旦开了先例就会滑坡，而且酷刑获得的情报不可靠（不伤害/人权 > 安全）",reflection:"如果对嫌犯用刑可能获得阻止恐怖袭击的情报，你支持吗？",impact_score:9,controversy_level:9.5},{id:"case_053",value_pair:["faith","environment"],direction:"faith_over_environment",intuitive_lean:"environment",title:"阿米什人拒绝环保法规",real_person:"阿米什社区 (Amish Community)",year:2018,location:"美国宾夕法尼亚",context:"2018年，宾州政府要求所有农场安装现代化污水处理系统以保护水源。阿米什人是拒绝现代科技的基督教派，他们的信仰要求过简朴生活、拒绝电力和现代设备。政府威胁：不安装污水系统就关闭农场。阿米什人认为这违背了他们两百年的信仰传统。",dilemma:"是应该为了保护环境而强制宗教社群使用现代科技，还是应该尊重宗教信仰自由，即使这可能造成环境污染？",actual_choice:"阿米什人拒绝安装现代污水系统。他们表示：'我们宁愿失去农场，也不能背叛上帝和祖先的生活方式。'最终法院判决他们可以使用传统方法处理污水，但需要更频繁的检查。",consequences:"阿米什人保持了信仰传统，但当地水质监测压力增加。环保组织批评这是对落后习俗的妥协。阿米什社区则认为他们的传统生活方式比现代农业更环保，只是不符合政府标准。",choice_support_a:"支持阿米什：宗教信仰自由是基本人权，政府不应该强迫宗教群体改变生活方式（信仰 > 环境规制）",choice_support_b:"支持环保法规：保护水源关系所有人健康，宗教信仰不能成为污染环境的借口（环境 > 信仰特权）",reflection:"如果你的信仰生活方式被认定为不环保，你会妥协吗？",impact_score:7,controversy_level:7.5},{id:"case_054",value_pair:["family","environment"],direction:"family_over_environment",intuitive_lean:"family",title:"为治病子女的父母非法采药",real_person:"王某（化名）",year:2016,location:"中国四川",context:"2016年，四川农民王某的女儿患罕见疾病，唯一有效的药材是野生雪莲，生长在海拔4000米的保护区。采挖野生雪莲是重罪（破坏濒危植物）。孩子病情恶化，王某偷偷进入保护区采药。护林员发现后，王某跪地恳求：'这是救我女儿命的唯一办法。'",dilemma:"是应该为了保护濒危植物严惩非法采药者，还是应该理解父母为救子女铤而走险的绝境？",actual_choice:"王某冒险采到了雪莲，女儿病情稳定。但他被逮捕判刑三年。法院判决：'同情你的处境，但法律面前人人平等，保护生态是全民责任。'",consequences:"女儿得救，但失去父亲三年。环保组织表示如果为此开先例，保护区将被盗采一空。王某妻子在法庭上痛哭：'法律没有人情，只有我们家人才知道那种绝望。'",choice_support_a:"理解王某：为了救子女的生命，父母可以铤而走险，家人生命高于环保规则（家庭 > 环境）",choice_support_b:"支持判决：保护生态是为了全人类未来，不能因个案破坏法律，否则保护区将被毁（环境 > 个人家庭）",reflection:"如果是你的孩子濒危，你会非法采药吗？",impact_score:8.5,controversy_level:8},{id:"case_055",value_pair:["freedom","environment"],direction:"freedom_over_environment",intuitive_lean:"environment",title:"特斯拉反对加州零排放强制令",real_person:"加州电动车争议",year:2022,location:"美国加州",context:"2022年，加州通过法律：2035年禁止销售新燃油车，强制全面电动化。许多车主和自由主义者抗议：政府无权规定公民买什么车，这侵犯消费自由。环保派反驳：气候危机紧急，必须强制转型。反对者：'就算环保重要，也不能剥夺我选择的权利。'",dilemma:"是应该为了应对气候变化强制淘汰燃油车，还是应该尊重消费者选择自由，让市场自然演进？",actual_choice:"加州州长签署了禁令。大量车主发起诉讼，认为这违反宪法自由权。诉讼至今仍在进行，但禁令暂未推翻。",consequences:"加州成为美国环保先锋，但也引发巨大争议。支持者说这是必要的；反对者说这是'环保专制'。许多人考虑搬离加州以保留购车自由。这成为自由vs环保的标志性案例。",choice_support_a:"反对禁令：即使为了环保，政府也无权强制公民的消费选择，自由高于环保强制（自由 > 环境管制）",choice_support_b:"支持禁令：面对气候危机，必须采取强制措施，个人消费自由不应阻碍拯救地球（环境 > 消费自由）",reflection:"如果政府为了环保禁止你购买某类商品，你接受吗？",impact_score:7.5,controversy_level:8.5},{id:"case_056",value_pair:["justice","environment"],direction:"environment_over_justice",intuitive_lean:"justice",title:"切尔诺贝利石棺工人被迫参与",real_person:"苏联清理工",year:1986,location:"苏联乌克兰",context:"1986年切尔诺贝利核事故后，苏联政府征召60万士兵和工人清理核污染、建造石棺。政府隐瞒了真实辐射水平，许多人在不知情的情况下受到致命辐射。但如果不立即封堵，整个欧洲将受核污染威胁。政府选择牺牲清理工的知情权和生命，以保护更大范围的环境。",dilemma:"是应该告知工人真实危险、给予拒绝权（可能导致无人参与、污染扩散），还是应该隐瞒信息强制征召以保护更大环境（但这不公正）？",actual_choice:"苏联政府隐瞒辐射真相，以'爱国任务'名义强制征召。清理工被告知'很安全'，实际上许多人接受了致命剂量辐射。",consequences:"石棺成功封堵，避免了更大灾难，欧洲免于核污染。但数万清理工患癌症或死亡，他们的知情权和生命被牺牲。幸存者至今认为政府欺骗并谋杀了他们。",choice_support_a:"批评政府：即使为了环境，也不能欺骗和强迫人们送死，这违背基本正义（正义 > 环境）",choice_support_b:"理解政府：在极端危机下，牺牲少数人保护数百万人和环境是必要的恶（环境/公共安全 > 个体正义）",reflection:"如果隐瞒真相可以让更多人参与拯救环境，你支持欺骗吗？",impact_score:9.5,controversy_level:8.5},{id:"case_057",value_pair:["life","environment"],direction:"environment_over_life",intuitive_lean:"life",title:"印度鼠患vs使用毒药",real_person:"印度环保组织",year:2019,location:"印度",context:"2019年印度爆发鼠患，鼠类传播疾病已致数千人死亡。政府计划大规模投放灭鼠药。环保组织阻止：灭鼠药会毒害生态系统，导致食物链上的鹰、蛇等动物死亡，破坏生态平衡。但如不灭鼠，疫情将扩散，更多人会死。这是'杀鼠药或死人'的选择。",dilemma:"是应该为了保护生态系统禁用灭鼠药，即使这会导致更多人类死于鼠疫；还是应该使用灭鼠药拯救人命，即使破坏生态？",actual_choice:"环保组织坚持抗议，政府妥协改用人工捕鼠。但效率太低，鼠患持续扩散，又有数百人死亡。最终政府不顾抗议使用了灭鼠药。",consequences:"鼠患被控制，疫情结束。但大量猛禽和蛇因误食中毒鼠而死亡，生态受损。环保组织说：'你们为了眼前利益毁了生态。'政府说：'人命才是第一位的。'",choice_support_a:"支持政府：人类生命高于其他物种和生态平衡，拯救人命是首要责任（生命 > 环境）",choice_support_b:"支持环保组织：破坏生态系统会导致更长远的灾难，应该用可持续方法而非毒药（环境 > 眼前人命）",reflection:"如果杀虫剂能救人但会毁坏生态，你会使用吗？",impact_score:8,controversy_level:8.5},{id:"case_058",value_pair:["loyalty","environment"],direction:"loyalty_over_environment",intuitive_lean:"loyalty",title:"煤矿工人保护岗位反对转型",real_person:"美国煤矿工人工会",year:2020,location:"美国西弗吉尼亚",context:"2020年，美国政府推动能源转型，计划关闭煤矿改用清洁能源。煤矿工人世代以采煤为生，面对失业威胁，工会领袖呼吁工人与煤矿企业站在一起，反对环保政策。一些年轻工人纠结：明知采煤污染环境，但背叛自己的工会和工友去支持关闭煤矿，这是对同志的背叛。",dilemma:"是应该忠于工会和工友，反对关闭煤矿（即使这损害环境）；还是应该为了环境支持转型，即使这意味着背叛工友？",actual_choice:"大多数煤矿工人选择了忠诚，集体抗议反对关闭煤矿。他们的口号是：'我们不能背叛养活了我们三代人的行业。'虽然他们也知道煤炭污染环境。",consequences:"工人团结赢得了短期让步，部分煤矿延缓关闭。但长期来看，煤炭行业仍在衰退，工人最终失业。批评者说工人短视；工人说：'你们这些环保精英不理解我们的生存困境。'",choice_support_a:"理解工人：对工会和工友的忠诚是工人阶级的脊梁，不能为了抽象的环保背叛同志（忠诚 > 环境）",choice_support_b:"批评工人：面对气候危机，保护地球比保护落后产业更重要，应该支持转型而非抱残守缺（环境 > 行业忠诚）",reflection:"如果你的职业损害环境，你会支持淘汰自己的行业吗？",impact_score:7.5,controversy_level:8},{id:"case_059",value_pair:["no_harm","environment"],direction:"environment_over_no_harm",intuitive_lean:"no_harm",title:"海洋风电驱逐渔民社区",real_person:"苏格兰海上风电",year:2021,location:"苏格兰",context:"2021年，苏格兰建设大型海上风电场以实现碳中和。但风电场占据了渔民世代捕鱼的海域。渔民抗议：'我们祖祖辈辈在这里捕鱼，现在被赶走，政府补偿根本不够生存。'数百渔民家庭面临破产。政府坚持：为了环境和气候，这是必要牺牲。",dilemma:"是应该为了清洁能源推进风电项目，即使这会毁掉无辜渔民的生计；还是应该保护渔民权益，即使这会延缓环保进程？",actual_choice:"苏格兰政府推进了风电项目，给渔民少量补偿，但不足以弥补损失。风电场建成，渔民被迫改行或迁移。",consequences:"风电场成功运营，苏格兰清洁能源比例大幅提升，成为环保榜样。但渔民社区瓦解，许多老渔民破产，年轻一代流失。渔民说：'你们用我们的生计换来了环保政绩。'",choice_support_a:"批评政府：不应该让无辜弱势群体为环保买单，应该找到不伤害渔民的方案（不伤害 > 环境）",choice_support_b:"支持政府：气候危机紧急，清洁能源转型需要牺牲，少数人利益应该让位于全球环境（环境 > 不伤害少数人）",reflection:"如果环保项目会毁掉一个社区的生计，你支持吗？",impact_score:7.5,controversy_level:8},{id:"case_060",value_pair:["truth","environment"],direction:"environment_over_truth",intuitive_lean:"environment",title:"隐瞒新能源汽车污染真相",real_person:"电动车电池污染争议",year:2023,location:"全球",context:"2023年，独立研究发现：电动车电池生产过程产生的污染（锂矿开采、重金属污染）比宣传的严重得多，某些指标甚至不比燃油车环保。但环保组织和政府担心：公开这些数据会打击电动车推广，阻碍能源转型。一些科学家被施压不要发表研究。",dilemma:"是应该公开电动车污染真相，即使这会阻碍环保转型；还是应该隐瞒不利数据，为了推动'更大的环保事业'？",actual_choice:"主流媒体选择淡化报道这些研究，继续宣传电动车的环保优势。政府也没有公开讨论电池污染问题。",consequences:"电动车继续快速普及，化石燃料消耗减少。但锂矿开采地（南美、非洲）的生态破坏加剧，当地居民健康受影响。批评者指责这是'为了环保目的而隐瞒环境真相'的讽刺。",choice_support_a:"支持公开真相：科学真相不应该为政治目的服务，隐瞒污染数据是欺骗公众（真实 > 环保政策）",choice_support_b:"理解淡化处理：电动车整体上仍比燃油车好，过分强调电池污染会阻碍必要的转型（环境大局 > 细节真相）",reflection:"如果公开真相会阻碍环保政策，你会隐瞒吗？",impact_score:8,controversy_level:9},{id:"case_061",value_pair:["faith","freedom"],direction:"faith_over_freedom",intuitive_lean:"freedom",title:"伊朗妇女因脱头巾被捕",real_person:"玛莎·阿米尼 (Mahsa Amini)",year:2022,location:"伊朗德黑兰",context:"2022年，22岁的伊朗女孩玛莎因头巾戴得'不够严实'被道德警察逮捕，在拘留所死亡。伊朗政府坚持强制头巾法：这是伊斯兰教法的要求，保护宗教价值观高于个人自由。玛莎的家人和全球抗议者认为：宗教信仰不能剥夺女性的着装自由。",dilemma:"是应该强制执行宗教着装规范以维护信仰传统，还是应该允许个人自由选择，即使这违背宗教法规？",actual_choice:"伊朗政府坚持头巾法，认为这是维护伊斯兰信仰的核心。玛莎的死引发全国抗议，但政府镇压示威，继续执行头巾法。",consequences:"玛莎成为反头巾法运动的象征，全球声援。伊朗政府逮捕了数千抗议者。保守派认为西方在煽动推翻伊斯兰信仰；改革派认为这是专制而非信仰。冲突至今持续。",choice_support_a:"支持政府：伊斯兰国家有权按教法治理，宗教信仰是社会基础，不能被世俗自由侵蚀（信仰 > 自由）",choice_support_b:"支持抗议者：强迫妇女穿戴是压迫，真正的信仰应该是自愿的，不应该用暴力强制（自由 > 强制信仰）",reflection:"如果宗教法律限制你的基本自由，你会服从还是反抗？",impact_score:9.5,controversy_level:9.5},{id:"case_065",value_pair:["justice","life"],direction:"life_over_justice",intuitive_lean:"life",title:"印度帮派头目放走目击证人",real_person:"维卡斯·杜贝 (Vikas Dubey)",year:2018,location:"印度北方邦",context:"2018年，印度帮派头目维卡斯在执行暗杀时，发现目标家中有一个10岁女孩目击了全过程。按照帮派规矩，必须杀人灭口以防被指证。但维卡斯看到女孩和自己死去的女儿一样大，陷入挣扎：是执行正义（帮派的'规矩'）灭口，还是违背规矩放她活命？",dilemma:"是为了组织规矩和自保杀死目击者，还是为了保护无辜孩子生命放弃'正义'冒着被举报的风险？",actual_choice:"维卡斯对手下说：'这次例外。'他放走了女孩。两年后，正是这个女孩的证词导致他被捕。",consequences:"2020年，维卡斯在转移途中被警方击毙。女孩的证词是定罪关键。维卡斯的律师在遗物中发现他的笔记：'我做了该死的事，但至少那个女孩还活着。'",choice_support_a:"理解维卡斯：即使是罪犯，保护孩子生命的决定也显示了人性，生命高于规矩（生命 > 正义/规矩）",choice_support_b:"谴责维卡斯：一个杀人犯不配被同情，他本应受到法律制裁，女孩的正义证词是应得的（正义 > 罪犯的人性）",reflection:"如果保护无辜者会让你自己受到惩罚，你会怎么选择？",impact_score:8.5,controversy_level:8.5},{id:"case_066",value_pair:["faith","life"],direction:"faith_over_life",intuitive_lean:"faith",title:"圣马克西米利安·科尔贝代替陌生人赴死",real_person:"圣马克西米利安·科尔贝 (Maximilian Kolbe)",year:1941,location:"波兰奥斯维辛集中营",context:"1941年7月，奥斯维辛集中营有一名囚犯逃跑。作为惩罚，纳粹随机选出10名囚犯处以饿死。其中一名叫弗朗西斯·加约尼塞克的波兰士兵哭喊：'我的妻子！我的孩子们！'47岁的波兰天主教神父马克西米利安·科尔贝主动站出来，请求代替这个陌生人去死。",dilemma:"是为了自己的生存保持沉默，还是为了信仰中的爱与牺牲精神，主动替陌生人赴死？",actual_choice:"科尔贝神父坚持要求替换。纳粹同意了。他和其他9人被关进饿死牢房。",consequences:"科尔贝在牢房中领导祷告，安慰其他囚犯，最后是唯一活到第14天的人。纳粹给他注射毒针处死。弗朗西斯·加约尼塞克活到了战后，见证了自己的孩子和孙子出生。科尔贝被封为圣人，成为无私牺牲的象征。",choice_support_a:"支持科尔贝：为信仰而牺牲自己拯救陌生人的生命，这是基督之爱的最高体现，比生存本能更崇高（信仰 > 生命）",choice_support_b:"质疑科尔贝：虽然高尚，但每个生命都同等珍贵，主动赴死不是理性的选择，活着可以帮助更多人（生命 > 信仰）",reflection:"如果你能救一个陌生人的命，代价是你自己必死，你会这样做吗？",impact_score:10,controversy_level:7},{id:"case_067",value_pair:["faith","loyalty"],direction:"loyalty_over_faith",intuitive_lean:"loyalty",title:"德特里希·朋霍费尔刺杀希特勒计划",real_person:"德特里希·朋霍费尔 (Dietrich Bonhoeffer)",year:1943,location:"德国柏林",context:"1943年，德国路德教会牧师朋霍费尔加入了刺杀希特勒的秘密抵抗组织。作为虔诚的基督徒，他一生信奉'不可杀人'的诫命。但面对纳粹屠杀数百万犹太人的暴行，他陷入了深刻的道德困境：是坚守宗教信仰的非暴力原则，还是忠于人类良心参与刺杀暴君？",dilemma:"信仰要求不可杀人，但忠诚于受苦者要求采取行动阻止更大的恶。是遵守宗教戒律，还是违背信条去拯救生命？",actual_choice:"朋霍费尔选择参与刺杀计划。他说：'当疯子驾车冲向人群时，牧师的职责不仅是安慰伤者，更要拉下方向盘。'",consequences:"1943年刺杀计划失败，朋霍费尔被捕。1945年4月9日，在纳粹德国投降前23天，他在集中营被绞死，年仅39岁。但他的神学思想和道德勇气影响了几代人。",choice_support_a:"支持朋霍费尔：面对极端邪恶，机械地遵守教条是懦弱的，真正的忠诚是承担罪责去阻止更大的恶（忠诚 > 教条信仰）",choice_support_b:"质疑朋霍费尔：基督教的核心是非暴力和爱敌人，即使面对希特勒也不应该杀人，应该相信上帝的审判（信仰 > 忠诚）",reflection:"如果杀死一个暴君能拯救百万人，但违背你的宗教信仰，你会这样做吗？",impact_score:9.5,controversy_level:8.5},{id:"case_068",value_pair:["faith","no_harm"],direction:"faith_over_no_harm",intuitive_lean:"faith",title:"耶和华见证人拒绝输血导致孩子死亡",real_person:"丹尼斯·林格 (Dennis Lindberg)",year:2007,location:"美国华盛顿州",context:"2007年，14岁的丹尼斯·林格因白血病需要紧急输血才能存活。但他和养父母都是耶和华见证人信徒，该教派严格禁止输血，认为这违反圣经教义。医院向法院申请强制输血令，但丹尼斯在法庭上明确表示：'即使死，我也不会输血，这是我的信仰。'法官尊重了这个成熟少年的宗教自由。",dilemma:"是为了救孩子的命违背宗教信仰接受输血，还是坚守信仰原则拒绝治疗，眼看孩子死去？",actual_choice:"丹尼斯和家人拒绝输血。他说：'我宁愿死也不会违背耶和华。'",consequences:"2007年11月28日，丹尼斯去世，距离他15岁生日只有几天。他的死引发了巨大争议：支持者认为他是殉道者，为信仰献身；反对者认为这是宗教洗脑导致的悲剧，一个孩子不应该为教义而死。",choice_support_a:"支持丹尼斯：信仰自由是基本人权，他已经足够成熟做出选择，为信仰而死是个人自主权（信仰 > 不伤害）",choice_support_b:"反对决定：14岁的孩子深受宗教影响，不能真正自主决定生死，父母和社会有义务救他的命（不伤害 > 信仰）",reflection:"如果你的宗教信仰禁止救命的医疗手段，你会坚持信仰还是选择生存？",impact_score:9,controversy_level:9.5},{id:"case_069",value_pair:["faith","safety"],direction:"faith_over_safety",intuitive_lean:"faith",title:"奥斯卡·罗梅罗大主教被暗杀",real_person:"奥斯卡·罗梅罗 (Óscar Romero)",year:1980,location:"萨尔瓦多圣萨尔瓦多",context:"1980年，萨尔瓦多大主教奥斯卡·罗梅罗多次公开谴责军政府的暴行和屠杀平民。他收到多次死亡威胁，朋友和同事劝他离开国家保命。但他说：'如果他们杀了我，我将在萨尔瓦多人民中复活。'他认为作为宗教领袖，有信仰责任为受压迫者发声，即使代价是生命。",dilemma:"是为了个人安全保持沉默或逃离，还是为了信仰的正义使命继续谴责暴政，承受被暗杀的风险？",actual_choice:"罗梅罗拒绝逃离，继续在讲道中谴责暴力。他呼吁士兵们：'以上帝的名义，停止镇压！'",consequences:"1980年3月24日，罗梅罗在主持弥撒时被狙击手射杀。他的死引发了萨尔瓦多内战，但也成为拉美解放神学的象征。2018年他被封为圣人。",choice_support_a:"支持罗梅罗：真正的信仰需要勇气和牺牲，为正义而死比苟活更有价值，他是殉道者（信仰 > 安全）",choice_support_b:"质疑罗梅罗：活着可以继续帮助更多人，主动送死是不负责任的，应该先保护自己（安全 > 信仰）",reflection:"如果坚持信仰会导致你被杀害，你会选择逃离还是坚守？",impact_score:9.5,controversy_level:7.5},{id:"case_070",value_pair:["environment","faith"],direction:"faith_over_environment",intuitive_lean:"faith",title:"拉达克僧侣焚烧圣树保护寺庙",real_person:"嘉措喇嘛 (Gyatso Lama)",year:2010,location:"印度拉达克",context:"2010年，拉达克地区遭遇严重泥石流威胁，一棵800年的神圣菩提树挡住了引水渠道，必须砍伐才能保护下游村庄和寺庙。但这棵树被认为是佛祖开悟的象征，砍伐是严重的亵渎。嘉措喇嘛面临选择：保护神树还是保护人类社区。",dilemma:"是为了环境保护和灾害预防砍伐神树，还是为了宗教信仰保护圣树，承受泥石流风险？",actual_choice:"嘉措选择举行仪式后焚烧神树，用宗教方式处理，而非直接砍伐。他说：'佛陀教导慈悲，树会理解。'",consequences:"神树被移除后，引水系统得以修复，避免了泥石流灾难。但部分村民认为这是对信仰的背叛，嘉措遭受持续批评。",choice_support_a:"支持嘉措：宗教信仰高于环境物质，通过宗教仪式处理是对信仰的尊重（信仰 > 环境）",choice_support_b:"质疑嘉措：古树是生态瑰宝，宗教可以妥协但生态系统不能，应该改道而非砍树（环境 > 信仰）",reflection:"当宗教圣物威胁到生态安全时，你会如何选择？",impact_score:8,controversy_level:7},{id:"case_071",value_pair:["environment","family"],direction:"environment_over_family",intuitive_lean:"environment",title:"黄万里举报父亲的水利工程",real_person:"黄万里",year:1957,location:"中国陕西",context:"1957年，清华大学教授黄万里发现三门峡大坝工程存在严重生态隐患，会导致黄河改道和大规模泥沙淤积。但该工程由他父亲的老友主持，举报会牵连父亲的政治声誉和家族关系网。黄万里面临家庭压力，但他坚信科学真理高于亲情。",dilemma:"是为了家族和睦保持沉默，还是为了环境生态揭露工程隐患，冒着家庭决裂的风险？",actual_choice:"黄万里连续发表文章批评工程，被打成右派。他说：'黄河不能这样治，否则子孙后代会骂我们。'",consequences:"黄万里被打成右派，下放劳改20年。父亲与他断绝关系。但三门峡工程果然失败，证明了他的预言。2001年他去世时，黄河依然在为这个错误买单。",choice_support_a:"支持黄万里：环境灾难影响千秋万代，科学良心高于家庭情面（环境 > 亲情）",choice_support_b:"质疑黄万里：孝道是中华文化根本，公开反对父辈是不孝，应该私下沟通（亲情 > 环境）",reflection:"如果你的家人支持一个破坏环境的工程，你会公开反对吗？",impact_score:9,controversy_level:8.5},{id:"case_072",value_pair:["environment","justice"],direction:"environment_over_justice",intuitive_lean:"environment",title:"肯尼亚守林人杀死盗猎者",real_person:"卡鲁基·卡马乌 (Karuki Kamau)",year:2019,location:"肯尼亚阿伯德尔国家公园",context:"2019年,肯尼亚护林员卡鲁基在巡逻时遭遇武装盗猎团伙，他们已经杀死3头濒危大象。卡鲁基开枪击毙2名盗猎者。事后调查显示，这两人是贫困村民，为养家糊口才冒险盗猎，且已放下武器准备投降。",dilemma:"是为了保护濒危物种和生态系统射杀盗猎者，还是考虑社会正义和人命价值，给予他们投降机会？",actual_choice:"卡鲁基选择射杀，事后他说：'每一头大象的死亡都是对未来的背叛，我不能让他们逃脱。'",consequences:"两名盗猎者死亡，留下5个孤儿。环保组织称赞卡鲁基为英雄，但人权组织指控他过度使用武力。他被停职调查但最终无罪释放。盗猎仍在继续。",choice_support_a:"支持卡鲁基：濒危物种灭绝不可逆，保护生态系统优先于个体人命（环境 > 正义）",choice_support_b:"质疑卡鲁基：人命高于动物，贫困驱使犯罪需要社会正义，而非枪决（正义 > 环境）",reflection:"当濒危动物和贫困人类发生冲突，你会站在哪一边？",impact_score:8.5,controversy_level:9},{id:"case_073",value_pair:["environment","life"],direction:"environment_over_life",intuitive_lean:"environment",title:"切尔诺贝利清理者自愿赴死",real_person:"瓦列里·霍杰姆丘克 (Valeri Khodemchuk)",year:1986,location:"苏联乌克兰",context:"1986年切尔诺贝利核事故后，核心融化，必须有人进入反应堆底部排水防止蒸汽爆炸，否则整个欧洲将被辐射污染。这是必死任务。三名志愿者明知必死仍进入反应堆。",dilemma:"是为了保护自己的生命拒绝任务，还是为了防止环境灾难自愿赴死？",actual_choice:"工程师阿列克谢·阿纳年科、瓦列里·别兹帕洛夫和潜水员鲍里斯·巴拉诺夫自愿进入。他们说：'如果不做，整个欧洲将变成荒漠。'",consequences:"三人成功排水，防止了更大灾难。但他们都死于急性辐射病。瓦列里的遗体至今仍埋在反应堆废墟下，辐射太强无法取出。",choice_support_a:"支持志愿者：为防止环境浩劫而牺牲是崇高的，个人生命服从整体生态（环境 > 生命）",choice_support_b:"质疑决定：强迫或劝说人去送死是不道德的，应该寻找其他技术方案（生命 > 环境）",reflection:"如果需要你牺牲生命才能阻止环境灾难，你会自愿吗？",impact_score:10,controversy_level:7},{id:"case_074",value_pair:["environment","no_harm"],direction:"environment_over_no_harm",intuitive_lean:"environment",title:"激进环保组织ELF纵火案",real_person:"丹尼尔·麦高恩 (Daniel McGowan)",year:2001,location:"美国俄勒冈",context:"2001年，'地球解放阵线'(ELF)成员丹尼尔参与纵火烧毁木材公司和转基因研究中心，造成数百万美元损失。他们确保无人伤亡，但破坏了私人财产。丹尼尔认为和平抗议无效，必须用激进手段阻止环境破坏。",dilemma:"是通过破坏财产甚至伤害来阻止环境破坏，还是坚持非暴力原则即使环保效果有限？",actual_choice:"丹尼尔参与多起纵火，他说：'每一棵被砍的古树都是谋杀，我们只是自卫。'",consequences:"丹尼尔被FBI列为'国内恐怖分子'，判刑7年。出狱后他反思自己的激进行为，但仍坚持环保目标是正确的。被烧毁的公司重建后继续砍伐森林。",choice_support_a:"理解丹尼尔：面对生态灾难，激进行动是必要的，财产损失可以接受（环境 > 不伤害）",choice_support_b:"反对丹尼尔：暴力和破坏永远不正当，应该通过法律和教育途径（不伤害 > 环境）",reflection:"为了保护环境，破坏财产甚至伤人是否正当？",impact_score:8,controversy_level:9.5},{id:"case_075",value_pair:["environment","safety"],direction:"environment_over_safety",intuitive_lean:"environment",title:"朱莉亚·巴特菲尔德在红杉树上居住两年",real_person:"朱莉亚·巴特菲尔德 (Julia Butterfly Hill)",year:1997,location:"美国加州",context:"1997年，23岁的环保活动家朱莉亚爬上一棵1000年树龄的红杉树'月亮'，拒绝下来阻止太平洋木材公司砍伐。她在55米高的树上生活了738天，经历暴风雨、直升机骚扰、零下气温，生命安全严重受威胁。",dilemma:"是为了个人安全下树，还是为了保护古树和森林生态系统冒生命危险？",actual_choice:"朱莉亚拒绝下树，她通过手机接受采访说：'这棵树活了1000年，我的两年算什么？'",consequences:"朱莉亚最终迫使木材公司签协议保护月亮和周边森林。但她严重营养不良、手脚冻伤，留下永久伤害。她成为环保象征，但也饱受身心创伤。",choice_support_a:"支持朱莉亚：为保护千年古树和生态而冒险是值得的，环境价值高于个人安全（环境 > 安全）",choice_support_b:"质疑朱莉亚：个人安全不应被忽视，有其他更安全的环保方式（安全 > 环境）",reflection:"你会为了保护一棵树而冒生命危险住在上面两年吗？",impact_score:8.5,controversy_level:7},{id:"case_076",value_pair:["environment","truth"],direction:"truth_over_environment",intuitive_lean:"truth",title:"气候学家朱迪思·库里揭露数据造假",real_person:"朱迪思·库里 (Judith Curry)",year:2009,location:"美国佐治亚理工",context:"2009年'气候门'事件中，朱迪思发现部分气候学家为了推动环保政策夸大数据、隐藏不利证据。作为气候科学家，她面临选择：是为了环保大业保持沉默，还是冒着被环保界抛弃的风险揭露真相。",dilemma:"是为了环保运动的政治目标掩盖科学瑕疵，还是坚持科学真实性即使削弱环保动员力？",actual_choice:"朱迪思公开批评数据造假，她说：'如果我们为了好的目标撒谎，最终会失去所有信誉。'",consequences:"朱迪思被环保界视为'叛徒'，失去研究资金，被同行孤立。但她坚持科学诚实，后来获得部分平反。气候科学的可信度因造假丑闻受损。",choice_support_a:"支持朱迪思：科学真实性是一切的基础，为环保撒谎最终适得其反（真相 > 环境）",choice_support_b:"质疑朱迪思：面对气候危机，完美主义会妨碍行动，小瑕疵可以接受（环境 > 真相）",reflection:"如果说出真相会削弱环保运动，你会保持沉默吗？",impact_score:8,controversy_level:9},{id:"case_077",value_pair:["faith","freedom"],direction:"faith_over_freedom",intuitive_lean:"faith",title:"圣女贞德拒绝认罪",real_person:"圣女贞德 (Joan of Arc)",year:1431,location:"法国鲁昂",context:"1431年，19岁的贞德被英国人俘虏后，宗教法庭以异端罪审判她。只要她承认'听到上帝声音'是谎言、放弃男装，就能免于死刑获得自由。但这意味着否认她的整个信仰和使命。",dilemma:"是为了自由和生命违背信仰认罪，还是坚持信仰真实性被烧死在火刑柱上？",actual_choice:"贞德短暂妥协后又收回认罪，她说：'我宁愿死也不愿撤回上帝给我的使命。'",consequences:"1431年5月30日，贞德被烧死，年仅19岁。但她成为法国民族英雄和天主教圣人，500年后被平反封圣。",choice_support_a:"支持贞德：为信仰殉道比苟活更崇高，信仰的真实性高于自由和生命（信仰 > 自由）",choice_support_b:"质疑贞德：19岁太年轻，应该妥协活下来，未来还能做更多事（自由 > 信仰）",reflection:"如果放弃信仰能换来自由，你会妥协吗？",impact_score:9.5,controversy_level:7.5},{id:"case_078",value_pair:["faith","justice"],direction:"faith_over_justice",intuitive_lean:"faith",title:"教宗庇护十二世对纳粹的沉默",real_person:"教宗庇护十二世 (Pope Pius XII)",year:1942,location:"梵蒂冈",context:"1942年，教宗庇护十二世确切知道纳粹正在系统性屠杀犹太人。盟国和犹太团体恳求他公开谴责，以教宗的道德权威拯救生命。但他担心公开对抗会导致纳粹报复天主教徒、摧毁教会，选择私下救援而非公开谴责。",dilemma:"是为了社会正义公开对抗纳粹冒着教会被摧毁的风险，还是为了保护教会机构选择沉默？",actual_choice:"庇护选择保持公开中立，私下援助犹太人，他说：'公开对抗只会让情况更糟。'",consequences:"数十万犹太人被教会秘密藏匿获救。但教宗的沉默被视为道德失败，至今备受争议。许多人认为他应该不惜代价发声。",choice_support_a:"支持庇护：保护教会机构是信仰责任，私下救援更有效，公开对抗是鲁莽的（信仰 > 正义）",choice_support_b:"谴责庇护：面对大屠杀保持沉默是道德懦弱，教宗应该不惜代价谴责邪恶（正义 > 信仰）",reflection:"如果公开谴责邪恶会危及你所属组织的存亡，你会发声吗？",impact_score:9,controversy_level:9.5},{id:"case_079",value_pair:["family","freedom"],direction:"family_over_freedom",intuitive_lean:"family",title:"索菲·绍尔放弃逃跑机会",real_person:"索菲·绍尔 (Sophie Scholl)",year:1943,location:"德国慕尼黑",context:"1943年，22岁的索菲因散发反纳粹传单被捕。审讯中，盖世太保提出交易：如果她提供'白玫瑰'抵抗组织其他成员名单，可以从轻发落；如果拒绝，她和哥哥汉斯都将被处决。她的父母跪求她妥协保命。",dilemma:"是为了自由和理想背叛战友，还是为了家人（父母、哥哥）的哀求妥协求生？",actual_choice:"索菲拒绝出卖任何人。她对父母说：'对不起，但我必须承担后果。'她和哥哥都坚守沉默。",consequences:"1943年2月22日，索菲和哥哥被斩首，父母当场晕倒。但他们的沉默保护了其他成员。索菲成为反纳粹英雄，德国各地的学校和街道以她命名。",choice_support_a:"支持索菲：理想高于生命，拒绝妥协是勇气，父母最终会理解（自由 > 家庭）",choice_support_b:"理解父母：22岁太年轻，为父母活下来也是一种孝道和责任（家庭 > 自由）",reflection:"如果你的父母跪求你放弃理想保命，你会妥协吗？",impact_score:10,controversy_level:8},{id:"case_080",value_pair:["family","life"],direction:"family_over_life",intuitive_lean:"family",title:"邱少云父亲拒绝捐献器官救子",real_person:"邱父（化名）",year:2015,location:"中国四川",context:"2015年，32岁的儿子患肝癌晚期，唯一希望是肝移植。68岁父亲配型成功，但医生警告：以父亲年龄和健康状况，捐肝有60%死亡风险。母亲和女儿哭求父亲不要冒险，但儿子是家中独子，续香火的唯一希望。",dilemma:"是为了儿子的生命冒60%死亡风险捐肝，还是为了其他家人（妻子、孙女）的未来拒绝捐献？",actual_choice:"父亲坚持捐肝，他说：'儿子死了，这个家就散了。'手术中父亲因并发症死亡，儿子获得肝脏后也因感染去世。",consequences:"父子双亡，母亲精神崩溃，12岁孙女成为孤儿。这场悲剧摧毁了整个家庭。",choice_support_a:"理解父亲：为儿子牺牲是父爱本能，家族延续是中国文化核心（家庭 > 生命）",choice_support_b:"质疑父亲：60%死亡风险太高，为妻子和孙女活下来更理性（生命 > 家庭）",reflection:"如果救家人有很高的死亡风险，你会冒险吗？",impact_score:9.5,controversy_level:8.5},{id:"case_081",value_pair:["family","loyalty"],direction:"loyalty_over_family",intuitive_lean:"loyalty",title:"马库斯·尤尼乌斯·布鲁图斯刺杀凯撒",real_person:"马库斯·尤尼乌斯·布鲁图斯 (Marcus Junius Brutus)",year:-44,location:"罗马",context:"公元前44年，凯撒逐渐成为独裁者，威胁罗马共和制。布鲁图斯是凯撒的养子和最信任的人，凯撒视他如亲生儿子。但布鲁图斯忠于共和理想，加入了刺杀凯撒的密谋。",dilemma:"是忠于养父的恩情和父子之情，还是忠于罗马共和国的政治理想？",actual_choice:"布鲁图斯参与刺杀。凯撒看到他时说：'你也有份，我的孩子？'然后死去。",consequences:"凯撒之死引发内战，共和制并未恢复，反而导致帝制。布鲁图斯被视为叛徒，两年后兵败自杀。但他的忠诚于理想成为共和主义象征。",choice_support_a:"支持布鲁图斯：忠于国家和理想高于私人恩情，背叛暴君不是背叛（忠诚理想 > 家庭）",choice_support_b:"谴责布鲁图斯：杀死养父是最大的背叛，无论政治理由多崇高（家庭 > 忠诚）",reflection:"如果你的养父成为独裁者，你会为了国家而背叛他吗？",impact_score:9,controversy_level:9},{id:"case_082",value_pair:["family","no_harm"],direction:"family_over_no_harm",intuitive_lean:"family",title:"母亲抢劫银行救女儿",real_person:"卡伦·威尔逊 (Karen Wilson,化名)",year:2017,location:"美国俄亥俄",context:"2017年，单亲母亲卡伦的7岁女儿患白血病，保险拒赔，需要28万美元救命。卡伦多次求助无果，绝望中她持玩具枪抢劫银行3.2万美元，没有伤害任何人，立即用于女儿治疗。",dilemma:"是遵守法律放弃救女儿，还是通过犯罪伤害他人（银行、储户）获取救命钱？",actual_choice:"卡伦选择抢劫。她说：'我知道这是错的，但我不能看着女儿死去。'",consequences:"卡伦被捕判刑15年。女儿接受治疗但因母亲入狱缺乏照料，病情恶化。社会对她既同情又谴责。女儿8岁时去世。",choice_support_a:"理解卡伦：为救孩子不择手段是母爱本能，情有可原（家庭 > 不伤害）",choice_support_b:"反对卡伦：伤害他人筹钱永远不正当，应该通过合法途径（不伤害 > 家庭）",reflection:"如果合法途径无法救家人的命，你会犯罪吗？",impact_score:9,controversy_level:9.5},{id:"case_083",value_pair:["family","safety"],direction:"safety_over_family",intuitive_lean:"safety",title:"彭定康撤离香港员工",real_person:"彭定康 (Chris Patten)",year:1997,location:"香港",context:"1997年香港回归前，末任港督彭定康面临抉择：数千名追随英国的香港公务员要求移民英国以保安全，但这会让他们的父母、兄弟姐妹留在香港承受政治风险。英国政府担心接收太多移民。",dilemma:"是优先保护员工安全给予居英权让家庭分离，还是考虑家庭团聚让他们留在香港冒政治风险？",actual_choice:"彭定康推动给予5万个家庭居英权，但明确不包括父母和成年兄弟。他说：'我们必须保护那些为英国服务的人。'",consequences:"数千家庭移民英国，但老人和亲属留在香港，许多家庭从此分离。一些老人因思念子女抑郁去世。但移民者确实在英国获得了安全。",choice_support_a:"支持彭定康：生命安全优先，移民是理性选择，家庭可以视频联系（安全 > 家庭团聚）",choice_support_b:"质疑彭定康：强迫家庭分离是残忍的，应该给全家移民机会（家庭 > 安全）",reflection:"为了安全你会接受与父母兄弟永久分离吗？",impact_score:8.5,controversy_level:8},{id:"case_084",value_pair:["freedom","justice"],direction:"justice_over_freedom",intuitive_lean:"justice",title:"马尔科姆·X放弃非暴力主义",real_person:"马尔科姆·X (Malcolm X)",year:1964,location:"美国纽约",context:"1964年，马尔科姆·X脱离伊斯兰民族后反思：黑人为了'自由'采取非暴力抗议，但白人暴力镇压从未停止。他认为真正的社会正义需要'用任何必要手段'包括自卫性暴力，即使这会限制道德自由和言论自由。",dilemma:"是坚持非暴力自由主义等待缓慢改革，还是为了即刻的社会正义采取激进手段包括暴力？",actual_choice:"马尔科姆公开宣扬'以眼还眼'，鼓励黑人武装自卫。他说：'不要以暴力反抗是哲学，但若有人攻击我，我会反击。'",consequences:"1965年马尔科姆被暗杀。他的激进主张加速了民权运动，但也导致暴力冲突升级。支持者认为他带来真正改变，反对者认为他播下仇恨种子。",choice_support_a:"支持马尔科姆：面对持续暴力压迫，为正义而战包括暴力自卫是必要的（正义 > 非暴力自由）",choice_support_b:"反对马尔科姆：暴力只会导致更多暴力，应该坚持金博士的非暴力道路（自由和平 > 正义）",reflection:"当和平抗争无效时，暴力反抗是否正当？",impact_score:9,controversy_level:9.5},{id:"case_085",value_pair:["freedom","life"],direction:"freedom_over_life",intuitive_lean:"freedom",title:"帕特里克·亨利的演讲",real_person:"帕特里克·亨利 (Patrick Henry)",year:1775,location:"美国弗吉尼亚",context:"1775年，美国独立前夜，弗吉尼亚议员帕特里克·亨利力主武装反抗英国。许多人担心战争会导致殖民地居民大量死亡，主张妥协求和。亨利坚信自由高于生命。",dilemma:"是为了保全生命接受英国统治，还是为了自由而战即使面临大量死亡？",actual_choice:"亨利发表著名演说：'不自由，毋宁死！'(Give me liberty or give me death!)他推动弗吉尼亚加入独立战争。",consequences:"美国独立战争造成数万人死亡。但最终赢得独立，建立了自由国家。亨利的演讲成为自由主义经典，但战争的代价至今引发争议。",choice_support_a:"支持亨利：为自由而死比被奴役地活着更高贵，自由是生命意义所在（自由 > 生命）",choice_support_b:"质疑亨利：数万人死亡代价太大，或许可以通过谈判逐步获得自治权（生命 > 自由）",reflection:"如果获得自由需要你冒生命危险，你会加入吗？",impact_score:8.5,controversy_level:8},{id:"case_086",value_pair:["freedom","loyalty"],direction:"loyalty_over_freedom",intuitive_lean:"loyalty",title:"日本移民在二战中的选择",real_person:"丹尼尔·井上 (Daniel Inouye)",year:1943,location:"美国夏威夷",context:"1943年，日裔美国人丹尼尔被关进集中营，自由被剥夺仅因种族。美国允许他们参军证明忠诚，但要去欧洲作战，可能战死。丹尼尔面临选择：是追求自己的自由权利，还是用生命证明对美国的忠诚？",dilemma:"是为了自由抗议种族歧视拒绝参军，还是为了证明忠诚接受不公待遇参战？",actual_choice:"丹尼尔加入第442团全日裔部队。他说：'美国是我的国家，我要证明我的忠诚。'",consequences:"442团成为美军史上伤亡率最高部队之一。丹尼尔失去右臂，但获得荣誉勋章。日裔社区用鲜血和牺牲证明了忠诚，推动了战后平权。",choice_support_a:"支持丹尼尔：用忠诚和牺牲赢得尊严和平等是正确的，忠诚高于自由（忠诚 > 自由）",choice_support_b:"质疑丹尼尔：应该抗议种族歧视而非顺从，不应该为不公国家卖命（自由 > 忠诚）",reflection:"当国家对你不公时，你还会保持忠诚吗？",impact_score:9,controversy_level:8.5},{id:"case_087",value_pair:["freedom","no_harm"],direction:"freedom_over_no_harm",intuitive_lean:"freedom",title:"威廉·华莱士的苏格兰独立战争",real_person:"威廉·华莱士 (William Wallace)",year:1297,location:"苏格兰",context:"1297年，威廉·华莱士领导苏格兰反抗英格兰统治。许多苏格兰贵族为了避免战乱和伤亡选择向英王投降。华莱士坚持武装抵抗，即使这意味着大量平民在战火中死亡。",dilemma:"是为了减少伤亡和痛苦接受英格兰统治，还是为了苏格兰自由发动战争，承受大量死伤？",actual_choice:"华莱士发动起义，攻克多座城市。他说：'他们可以夺走我们的生命，但永远夺不走我们的自由！'",consequences:"战争导致数千平民死亡，乡村被毁。华莱士最终被俘，遭受极刑而死。但他的牺牲激励了后代，苏格兰最终独立。",choice_support_a:"支持华莱士：自由值得任何代价，不自由的和平是耻辱（自由 > 不伤害）",choice_support_b:"质疑华莱士：大量平民死亡代价太高，和平统治好过战乱（不伤害 > 自由）",reflection:"为了民族自由，平民伤亡在多大程度上是可接受的？",impact_score:9,controversy_level:8.5},{id:"case_088",value_pair:["freedom","safety"],direction:"freedom_over_safety",intuitive_lean:"freedom",title:"新加坡李光耀的威权模式",real_person:"李光耀 (Lee Kuan Yew)",year:1965,location:"新加坡",context:"1965年独立后，李光耀面临种族冲突和经济危机。他选择强力镇压言论自由、新闻自由、反对党，实行严苛的社会控制，理由是确保国家稳定和人民安全。",dilemma:"是优先保护公民自由即使可能带来混乱和冲突，还是为了安全和稳定限制自由？",actual_choice:"李光耀选择安全优先。他说：'我宁要秩序，不要混乱。'新加坡成为'软威权'国家。",consequences:"新加坡实现了惊人的经济发展和社会安全，犯罪率极低。但言论自由严重受限，反对派被打压，许多人移民寻求自由。这一模式至今备受争议。",choice_support_a:"批评李光耀：自由是人的尊严所在，为安全牺牲自由是交易魔鬼（自由 > 安全）",choice_support_b:"支持李光耀：新加坡的成功证明了有序安全比混乱自由更重要（安全 > 自由）",reflection:"如果让你选择，你要一个自由但混乱的社会，还是安全但受限的社会？",impact_score:8.5,controversy_level:9.5},{id:"case_089",value_pair:["freedom","truth"],direction:"freedom_over_truth",intuitive_lean:"freedom",title:"朱利安·阿桑奇与维基解密",real_person:"朱利安·阿桑奇 (Julian Assange)",year:2010,location:"英国",context:"2010年，阿桑奇通过维基解密发布大量美国机密文件，揭露战争罪行和外交谎言。但他也不加审查地发布了包含线人姓名的文件，导致一些人可能遇害。他坚持绝对信息自由，反对任何审查。",dilemma:"是为了真相不惜代价发布一切信息包括可能致人死亡的敏感资料，还是为了保护生命进行选择性披露？",actual_choice:"阿桑奇拒绝审查，全部公开。他说：'真相没有议程，信息自由是绝对的。'",consequences:"多名线人因身份暴露被杀害或失踪。阿桑奇被通缉，在厄瓜多尔使馆避难7年，后被捕至今关押。他成为信息自由的殉道者，但代价是他人的生命。",choice_support_a:"支持阿桑奇：绝对的信息自由是民主基石，真相公开优先（自由 > 真相的后果）",choice_support_b:"批评阿桑奇：不负责任的泄密导致无辜者死亡，信息自由不等于不计后果（真相责任 > 绝对自由）",reflection:"为了信息自由，别人因你的泄密而死是否可以接受？",impact_score:8.5,controversy_level:9.5},{id:"case_090",value_pair:["justice","loyalty"],direction:"loyalty_over_justice",intuitive_lean:"loyalty",title:"美莱村屠杀的直升机飞行员",real_person:"休·汤普森 (Hugh Thompson Jr.)",year:1968,location:"越南美莱村",context:"1968年3月16日，美军在美莱村屠杀平民。直升机飞行员汤普森目击后，面临抉择：是忠于军队同袍保持沉默，还是为了正义阻止战友的暴行甚至向他们开枪？",dilemma:"是忠于同袍和军队（loyalty）保持沉默，还是为了正义对抗战友？",actual_choice:"汤普森降落直升机，挡在美军和平民之间，命令机枪手：'如果他们开枪，你就向美军开火。'他救出了11名平民。",consequences:"汤普森阻止了更大屠杀，但被军方视为叛徒，遭到死亡威胁和多年冷落。直到1998年才被正式表彰为英雄。他一生背负'背叛战友'的骂名。",choice_support_a:"批评汤普森：军队中对战友开枪威胁是最大的背叛，应该事后报告而非当场对抗（忠诚 > 正义）",choice_support_b:"支持汤普森：面对屠杀平民的暴行，正义高于对犯罪战友的忠诚（正义 > 忠诚）",reflection:"如果你的战友正在犯下战争罪行，你会当场阻止他们吗？",impact_score:9.5,controversy_level:8.5},{id:"case_091",value_pair:["justice","no_harm"],direction:"no_harm_over_justice",intuitive_lean:"no_harm",title:"南非真相与和解委员会",real_person:"德斯蒙德·图图 (Desmond Tutu)",year:1996,location:"南非",context:"1996年，南非废除种族隔离后，大主教图图主持真相与和解委员会。他面临选择：是追求正义严惩种族隔离罪犯可能引发内战，还是为了避免流血冲突给予特赦，放弃司法正义？",dilemma:"是坚持司法正义惩罚罪犯冒着国家分裂和暴力冲突的风险，还是为了社会和平放弃惩罚？",actual_choice:"图图选择'宽恕代替报复'，给予坦白者特赦。他说：'没有宽恕，就没有未来。'",consequences:"南非避免了内战和大规模报复，实现了和平过渡。但许多受害者家属认为这是对正义的背叛，凶手逍遥法外。图图自己也承认这是'不完美的正义'。",choice_support_a:"支持图图：避免更多流血和冲突比惩罚罪犯更重要，和平优先（不伤害 > 正义）",choice_support_b:"反对特赦：让罪犯逍遥法外是对受害者的二次伤害，正义不容妥协（正义 > 避免冲突）",reflection:"为了社会和平，放弃惩罚罪犯是否可以接受？",impact_score:9,controversy_level:9},{id:"case_092",value_pair:["justice","safety"],direction:"safety_over_justice",intuitive_lean:"safety",title:"911后的酷刑审讯",real_person:"乔治·特尼特 (George Tenet, CIA局长)",year:2002,location:"美国",context:"2002年，CIA局长特尼特授权对恐怖嫌疑人使用'强化审讯技术'（变相酷刑），包括水刑。他认为这些情报可以防止下一次911式袭击，挽救成千上万美国人生命。但这违反了《日内瓦公约》和司法正义原则。",dilemma:"是坚持司法正义和人权禁止酷刑，还是为了国家安全和拯救生命授权酷刑？",actual_choice:"特尼特授权酷刑。他说：'我的职责是保护美国人，如果情报能阻止袭击，我会不择手段。'",consequences:"数十名囚犯遭受酷刑，其中一些是无辜的。2014年参议院报告证明酷刑效果有限。特尼特和其他官员未被起诉，但美国道德形象严重受损。",choice_support_a:"支持特尼特：面对恐怖威胁，保护公民生命安全高于对敌人的司法正义（安全 > 正义）",choice_support_b:"谴责酷刑：酷刑违反人类尊严和法治原则，无论目的多崇高都不正当（正义 > 安全）",reflection:"如果酷刑一个恐怖分子能救100个无辜者，你会授权吗？",impact_score:8.5,controversy_level:9.5},{id:"case_093",value_pair:["justice","truth"],direction:"justice_over_truth",intuitive_lean:"justice",title:"德国纳粹档案的封存",real_person:"保罗·菲尔兹 (Paul Freese,化名)",year:1955,location:"德国",context:"1955年，德国历史学家保罗发现政府封存了大量纳粹档案，其中包括许多现任政府官员在纳粹时期的罪行证据。公开这些档案可以还原历史真相，但会导致政府崩溃和社会动荡，延缓战后重建。",dilemma:"是为了历史真相公开档案揭露罪犯，还是为了社会正义和稳定重建保持封存？",actual_choice:"保罗私下泄露部分档案给媒体，导致数名官员下台，但他被政府起诉并入狱。",consequences:"保罗入狱3年，但他的行为推动了德国的'去纳粹化'进程。然而完整档案直到2000年代才逐步解密，许多纳粹罪犯逃脱了正义。",choice_support_a:"支持保罗：历史真相必须公开，即使代价是社会动荡，正义不能等待（正义 > 稳定真相）",choice_support_b:"质疑保罗：战后重建需要稳定，过度追究历史会妨碍和解（稳定 > 正义）",reflection:"为了社会稳定，封存历史真相是否可以接受？",impact_score:8,controversy_level:8.5},{id:"case_094",value_pair:["life","loyalty"],direction:"loyalty_over_life",intuitive_lean:"loyalty",title:"劳伦斯·奥茨的南极自杀",real_person:"劳伦斯·奥茨 (Lawrence Oates)",year:1912,location:"南极",context:"1912年，英国南极探险队返程时，奥茨因冻伤严重拖累团队。食物不足，如果他继续跟随，所有人都会饿死。奥茨意识到自己是负担，面临选择：是争取自己的生存权利，还是为了团队离开帐篷赴死？",dilemma:"是为了自己的生命权利要求团队继续照顾，还是为了对团队的忠诚主动赴死？",actual_choice:"奥茨对队友说：'我出去走走，可能要一段时间。'他走进暴风雪，再也没有回来。",consequences:"奥茨的牺牲为团队节省了食物和时间，但最终全队仍然遇难。奥茨成为自我牺牲和忠诚的象征，但他的死并未挽救队友。",choice_support_a:"支持奥茨：为了团队主动赴死是最高形式的忠诚和荣誉（忠诚 > 生命）",choice_support_b:"质疑奥茨：每个生命都有价值，不应该放弃求生努力，团队有义务照顾伤员（生命 > 忠诚）",reflection:"如果你成为团队的负担，你会选择离开赴死吗？",impact_score:9.5,controversy_level:7.5},{id:"case_095",value_pair:["life","no_harm"],direction:"life_over_no_harm",intuitive_lean:"life",title:"乌拉圭空难的食人事件",real_person:"费尔南多·帕拉多 (Fernando Parrado)",year:1972,location:"安第斯山脉",context:"1972年，乌拉圭橄榄球队飞机坠毁在安第斯山脉。72天后获救前，16名幸存者面临饥饿死亡。唯一食物来源是冻死队友的尸体。帕拉多面临选择：吃人肉活下去还是饿死？",dilemma:"是坚守对死者尊严的道德原则饿死，还是为了生存吃死去队友的肉？",actual_choice:"帕拉多和幸存者决定吃人肉。他说：'如果我死了，我也希望他们吃我的肉活下去。'",consequences:"16人靠食人肉生存72天后获救。他们一生背负心理创伤和道德争议。天主教会最终宽恕了他们，但社会舆论分裂。帕拉多成为励志演说家。",choice_support_a:"理解幸存者：极端生存情况下，活下去是首要的，对死者最好的致敬就是生存（生命 > 不伤害死者尊严）",choice_support_b:"质疑行为：即使极端情况，吃人肉也是对死者最大的不尊重和亵渎（不伤害死者尊严 > 生命）",reflection:"如果只有吃死去队友的肉才能活命，你会这样做吗？",impact_score:9.5,controversy_level:9},{id:"case_096",value_pair:["life","safety"],direction:"life_over_safety",intuitive_lean:"life",title:"韦斯·摩尔医生在埃博拉疫区",real_person:"肯特·布兰特利 (Kent Brantly)",year:2014,location:"利比里亚",context:"2014年西非埃博拉疫情爆发，美国医生布兰特利在利比里亚治疗病人。病毒致死率70%，他的家人恳求他回国以保安全。但如果他离开，数百名病人将无人医治而死。",dilemma:"是为了个人和家人的安全离开疫区，还是为了拯救病人生命留下来冒感染风险？",actual_choice:"布兰特利选择留下。他说：'这些病人没有选择，但我有，我选择留下。'",consequences:"布兰特利感染埃博拉，紧急转送回美国才幸存。但他在非洲期间救治了数百名病人。他的选择激励了更多医护人员前往疫区，但也让妻子和孩子经历了巨大恐惧。",choice_support_a:"支持布兰特利：医生的使命是救死扶伤，拯救生命优先于个人安全（生命 > 安全）",choice_support_b:"质疑布兰特利：他对家人也有责任，冒死救陌生人是对妻子孩子的不负责任（安全 > 生命）",reflection:"如果救别人的命需要冒你自己和家人的安全风险，你会去吗？",impact_score:8.5,controversy_level:7.5},{id:"case_097",value_pair:["life","truth"],direction:"truth_over_life",intuitive_lean:"truth",title:"安娜·波利特科夫斯卡娅调查普京",real_person:"安娜·波利特科夫斯卡娅 (Anna Politkovskaya)",year:2006,location:"俄罗斯莫斯科",context:"2006年，俄罗斯记者安娜长期调查普京政府在车臣的战争罪行和腐败。她多次收到死亡威胁，已有三名调查同一主题的记者被暗杀。朋友和家人恳求她停止调查保命。",dilemma:"是为了保命停止调查，还是为了揭露真相继续工作，冒被暗杀的风险？",actual_choice:"安娜拒绝停止。她说：'如果我们都因为恐惧而沉默，真相就永远不会被看见。'",consequences:"2006年10月7日（普京生日当天），安娜在家中电梯被枪杀，年仅48岁。她的调查报告成为揭露俄罗斯人权状况的重要文献，但凶手至今未被缉拿。",choice_support_a:"支持安娜：揭露真相是记者的使命，为真相而死是最高荣誉（真相 > 生命）",choice_support_b:"质疑安娜：活着才能继续工作，主动送死是不理性的，应该先保护自己（生命 > 真相）",reflection:"如果报道真相会导致你被暗杀，你会继续吗？",impact_score:9.5,controversy_level:7},{id:"case_098",value_pair:["loyalty","no_harm"],direction:"loyalty_over_no_harm",intuitive_lean:"loyalty",title:"731部队的护士困境",real_person:"筱冢良雄护士 (化名)",year:1945,location:"中国哈尔滨",context:"1945年，日本731部队护士筱冢良雄目睹医生在活人身上做实验。作为军人，他必须服从命令忠于部队；但作为医护人员，他的职责是不伤害病人。拒绝执行命令意味着被军法处决。",dilemma:"是忠于军队和命令协助活体实验，还是坚持医学伦理拒绝伤害即使被处决？",actual_choice:"筱冢选择服从命令。他协助了数百例活体实验，战后他在回忆录中说：'我告诉自己，这是忠于国家的代价。'",consequences:"数千名中国、苏联、朝鲜战俘在实验中惨死。筱冢战后逃脱审判，但一生背负罪恶感，晚年公开忏悔。他的证词成为揭露731罪行的关键证据。",choice_support_a:"理解筱冢：在极权军队中，拒绝命令等于送死，普通人很难反抗（忠诚压力 > 不伤害）",choice_support_b:"谴责筱冢：即使面临死亡威胁，协助杀害无辜也是不可原谅的罪行（不伤害 > 忠诚）",reflection:"如果拒绝参与罪行会导致你被处决，你会服从命令吗？",impact_score:10,controversy_level:9},{id:"case_099",value_pair:["loyalty","safety"],direction:"loyalty_over_safety",intuitive_lean:"loyalty",title:"拉乌尔·瓦伦贝格拯救犹太人",real_person:"拉乌尔·瓦伦贝格 (Raoul Wallenberg)",year:1944,location:"匈牙利布达佩斯",context:"1944年，瑞典外交官瓦伦贝格在布达佩斯为犹太人发放保护护照。纳粹警告他停止，否则将其视为敌人。瑞典政府建议他撤离以保安全。但他已经承诺保护数千名犹太人，离开等于背叛。",dilemma:"是为了个人安全撤离布达佩斯，还是忠于对犹太人的承诺留下来冒生命危险？",actual_choice:"瓦伦贝格拒绝撤离。他说：'我已经承诺保护他们，我不能离开。'他继续发放护照、藏匿犹太人。",consequences:"瓦伦贝格拯救了至少10万名犹太人。但1945年1月苏军占领布达佩斯后，他被逮捕并送往苏联，再也没有回来。他可能在1947年死于苏联监狱。",choice_support_a:"支持瓦伦贝格：忠于承诺和道义高于个人安全，他是真正的英雄（忠诚 > 安全）",choice_support_b:"质疑瓦伦贝格：活着可以救更多人，主动送死是不理智的（安全 > 忠诚）",reflection:"如果履行承诺会让你失去自由甚至生命，你会坚持吗？",impact_score:10,controversy_level:6.5},{id:"case_100",value_pair:["loyalty","truth"],direction:"loyalty_over_truth",intuitive_lean:"loyalty",title:"水门事件的尼克松幕僚",real_person:"约翰·迪安 (John Dean)",year:1973,location:"美国华盛顿",context:"1973年水门事件调查中，白宫法律顾问约翰·迪安知道尼克松总统参与犯罪掩盖。他面临选择：是忠于总统保持沉默保护他，还是向国会说出真相但背叛总统和白宫同僚？",dilemma:"是忠于总统和同僚保守秘密，还是说出真相揭露总统犯罪？",actual_choice:"迪安选择作证，详细揭露尼克松的罪行。他说：'我不能为谎言牺牲自己的诚信。'",consequences:"迪安的证词导致尼克松辞职，但他被白宫和保守派视为叛徒。他自己也因妨碍司法被判刑4个月。迪安至今仍被一些人视为告密者而非英雄。",choice_support_a:"谴责迪安：背叛总统和同僚是最大的不忠，应该维护团队（忠诚 > 真相）",choice_support_b:"支持迪安：揭露总统犯罪是爱国行为，真相高于个人忠诚（真相 > 忠诚）",reflection:"如果你的老板犯罪，你会举报他还是保持忠诚？",impact_score:8.5,controversy_level:9},{id:"case_101",value_pair:["no_harm","safety"],direction:"safety_over_no_harm",intuitive_lean:"safety",title:"广岛原子弹投放决定",real_person:"哈里·杜鲁门 (Harry Truman)",year:1945,location:"美国华盛顿",context:"1945年，杜鲁门总统面临决定：是投放原子弹杀死数十万日本平民迫使日本投降，还是发动地面入侵，美军预计伤亡50万人但避免屠杀平民？",dilemma:"是为了美军士兵的安全屠杀日本平民，还是为了不伤害无辜平民让美军士兵冒更大风险？",actual_choice:"杜鲁门授权投放原子弹。他说：'我的责任是保护美国士兵，为此我愿意承担任何道德负担。'",consequences:"广岛和长崎共约20万平民死亡，大多是妇女儿童。但日本迅速投降，避免了地面战的百万伤亡。这一决定至今是最大的道德争议。",choice_support_a:"支持杜鲁门：保护本国士兵生命是总统首要责任，原子弹减少了总伤亡（安全 > 不伤害）",choice_support_b:"谴责杜鲁门：故意屠杀平民是战争罪，无论理由多充分都不正当（不伤害 > 安全）",reflection:"如果你是总统，你会为了本国士兵而屠杀敌国平民吗？",impact_score:10,controversy_level:10},{id:"case_102",value_pair:["safety","truth"],direction:"safety_over_truth",intuitive_lean:"safety",title:"苏联隐瞒切尔诺贝利事故",real_person:"瓦列里·列加索夫 (Valery Legasov)",year:1986,location:"苏联莫斯科",context:"1986年切尔诺贝利事故后，首席科学家列加索夫发现反应堆设计存在致命缺陷，苏联全国还有10座同型反应堆。政府要求他隐瞒缺陷以维护苏联核工业形象和社会稳定，公开真相可能引发恐慌。",dilemma:"是为了社会稳定和民众心理安全隐瞒真相，还是公开反应堆缺陷警告公众但引发恐慌？",actual_choice:"列加索夫最初妥协隐瞒，但两年后在自杀前录音公开了全部真相。他说：'我们撒谎的代价不是有人会相信谎言，而是我们将不再能辨别真相。'",consequences:"列加索夫1988年自杀，他的证词促使苏联关闭危险反应堆。但两年的隐瞒导致数千人受到本可避免的辐射伤害。他的选择至今引发争议：应该立即公开还是应该隐瞒？",choice_support_a:"理解隐瞒：公开缺陷会引发大规模恐慌和社会混乱，保护民众心理安全优先（安全 > 真相）",choice_support_b:"谴责隐瞒：公众有权知道核威胁，隐瞒导致更多人受害，真相是安全的前提（真相 > 短期安全）",reflection:"如果公开真相会引发社会恐慌，你会选择隐瞒吗？",impact_score:9.5,controversy_level:9},{id:"case_103",value_pair:["contract","justice"],direction:"contract_over_justice",intuitive_lean:"contract",title:"夏洛克的一磅肉合同",real_person:"虚构案例（莎士比亚《威尼斯商人》）",year:1596,location:"意大利威尼斯",context:"在莎士比亚的经典戏剧中，商人夏洛克与安东尼奥签订合约：如果安东尼奥无法按时还款，夏洛克有权从他身上割下一磅肉。这是双方自愿签订的合同，白纸黑字，公证见证。当安东尼奥的船只失事无法还款时，夏洛克坚持要执行合同条款。法庭面临抉择：严格执行合同条款（会导致安东尼奥死亡），还是以人道主义和公正为由废除这一残忍的合同条款？",dilemma:"当一个合法签订的合同包含极其不公正的条款时，是应该坚持契约精神严格执行，还是应该以正义和人性为由废除合同？",actual_choice:"剧中的法官波西亚做出了著名的判决：夏洛克可以割肉，但合同只写了'一磅肉'，没有写'一滴血'。如果夏洛克在割肉时流出一滴血，就违反了合同，将被处死。这一判决实质上是通过法律技巧废除了合同。",consequences:"这个案例成为法律史上的经典：它展示了当契约精神与人性正义发生冲突时的两难。严格的契约主义者认为法官违背了合同自由原则；而人道主义者认为不应该允许通过合同条款来合法伤害他人。",choice_support_a:"支持契约精神：契约一旦签订就必须履行，否则整个商业社会的信任基础将崩塌。如果允许法官以'不公正'为由随意废除合同，那么所有合同都将失去约束力（契约 > 正义）",choice_support_b:"支持正义优先：合同自由不是绝对的，当合同条款极度不公正、违背基本人性时，法律有责任介入。契约精神不应该成为合法伤害他人的借口（正义 > 契约）",reflection:"如果你是法官，面对这样一个合法但残忍的合同，你会如何判决？",impact_score:8,controversy_level:8.5},{id:"case_104",value_pair:["contract","family"],direction:"family_over_contract",intuitive_lean:"family",title:"代孕母亲的抚养权之争",real_person:"玛丽·贝丝·怀特黑德 (Mary Beth Whitehead)",year:1986,location:"美国新泽西",context:"1986年，玛丽·贝丝·怀特黑德与威廉·斯特恩夫妇签订代孕合同，约定她用人工授精方式怀孕，婴儿出生后交给斯特恩夫妇抚养，她获得1万美元报酬。合同明确规定她放弃所有抚养权。但当婴儿梅丽莎出生后，玛丽无法割舍母子之情，拒绝交出孩子并逃往佛罗里达。斯特恩夫妇起诉要求执行合同，玛丽则主张合同无效，她是孩子的生母，有不可剥夺的抚养权。",dilemma:"当代孕合同与母亲天性发生冲突时，是应该严格执行合同条款，还是应该尊重生母与孩子的血缘纽带和母爱？",actual_choice:"新泽西州最高法院做出判决：代孕合同违反公共政策，属于'贩卖婴儿'，因此无效。但考虑到孩子的最佳利益，法院将监护权判给了斯特恩夫妇（因为他们经济条件更好），同时给予玛丽探视权。",consequences:"这个案例成为美国代孕法律的里程碑。它确立了原则：涉及亲子关系的合同不能完全按照商业合同对待，生母的权利不能被合同完全剥夺。此后许多州禁止或严格限制商业代孕。但这也引发了关于合同自由边界的争议：如果成年人自愿签订的合同都可以被法院废除，契约精神还有何意义？",choice_support_a:"支持执行合同：玛丽是成年人，她自愿签订合同并收取了报酬，就应该履行承诺。如果允许代孕母亲随意反悔，那么所有代孕合同都将失去意义（契约 > 亲情）",choice_support_b:"支持玛丽：母子纽带是天然的，不能通过合同买卖。十月怀胎建立的情感联系超越了合同条款，强制执行这种合同是对人性的践踏（亲情 > 契约）",reflection:"如果你是法官，你会判决执行代孕合同，还是支持生母的抚养权？",impact_score:9,controversy_level:9.5},{id:"case_105",value_pair:["justice","contract"],direction:"justice_over_contract",intuitive_lean:"justice",title:"雷曼兄弟的巨额奖金合同",real_person:"雷曼兄弟高管团队",year:2008,location:"美国纽约",context:"2008年9月，雷曼兄弟因次贷危机破产，引发全球金融海啸，数百万人失业，数万亿美元财富蒸发。但就在破产前几周，雷曼高管们根据雇佣合同发放了总计35亿美元的奖金给自己。这些合同是合法的，明确规定了奖金条款。但公众愤怒了：正是这些高管的贪婪和错误决策导致了破产，凭什么还能拿巨额奖金？国会召开听证会，要求高管们自愿退还奖金。",dilemma:"当合法的雇佣合同与公众的正义感发生冲突时，是应该严格执行合同条款（高管有权获得奖金），还是应该以道德和正义为由要求高管放弃合同权利？",actual_choice:"大部分高管拒绝退还奖金，援引合同条款和私有财产权。只有少数高管在巨大压力下象征性退还了部分奖金。他们的律师辩称：'合同就是合同，不能因为公众情绪而改变。'",consequences:"公众对华尔街的愤怒达到顶点，'占领华尔街'运动部分源于此事件。政府后来通过立法限制金融机构的奖金发放，但无法追回已发放的奖金。这个案例引发了关于契约精神边界的大讨论：当严格执行合同明显违背社会正义时，法律和道德应该如何选择？",choice_support_a:"支持执行合同：无论后果如何，合法签订的合同必须执行，否则私有财产权和契约精神将荡然无存。不能因为民粹情绪就剥夺合同权利（契约 > 正义）",choice_support_b:"支持正义：这些高管几乎摧毁了全球经济，却还要拿巨额奖金，这是对正义的嘲弄。法律应该有道德底线，极度不公的合同不应该得到保护（正义 > 契约）",reflection:"如果你是这些高管之一，你会坚持合同权利还是主动退还奖金？",impact_score:8.5,controversy_level:9},{id:"case_106",value_pair:["contract","life"],direction:"life_over_contract",intuitive_lean:"life",title:"印度农民的棉花种子债务",real_person:"印度棉农群体",year:2006,location:"印度马哈拉施特拉邦",context:"2000年代，孟山都等种子公司向印度农民推销转基因棉花种子，承诺高产。农民签订购买合同，借高利贷购买昂贵的种子。但种子需要大量化肥和灌溉，许多农民因干旱歉收，无法偿还债务。放贷者根据合同要求农民必须还款，否则将没收土地。2006年，仅马哈拉施特拉邦就有1044名农民因无法偿还种子债务而自杀。他们在遗书中写道：'我签了合同，但我付不起。与其让家人失去土地，不如我去死，至少保险金能还债。'",dilemma:"当严格执行债务合同会导致借款人走投无路甚至自杀时，是应该坚持契约精神要求还款，还是应该以人道主义为由减免债务？",actual_choice:"初期，放贷者和种子公司坚持执行合同，认为'欠债还钱天经地义'。但随着自杀人数激增，国际舆论压力下，印度政府介入，强制要求银行减免部分农业债务，并限制了种子公司的某些合同条款。",consequences:"政府的债务减免拯救了许多农民的生命，但也引发了道德风险争议：如果债务可以因为'困难'而减免，那么契约精神还有何意义？未来谁还愿意借钱给农民？但支持者认为，当合同执行会导致大规模死亡时，生命权必须高于契约权。",choice_support_a:"支持执行合同：虽然同情农民，但合同必须履行，否则信贷体系将崩溃，未来农民更难借到钱。应该通过慈善和社会救济帮助农民，而非破坏契约（契约 > 生命）",choice_support_b:"支持减免债务：当严格执行合同会导致人死亡时，必须以人道主义干预。没有任何合同条款的价值能高过人的生命，法律的目的是保护人而非保护合同（生命 > 契约）",reflection:"如果你是放贷者，面对走投无路的借款人，你会坚持合同还是减免债务？",impact_score:9.5,controversy_level:9},{id:"case_107",value_pair:["contract","loyalty"],direction:"contract_over_loyalty",intuitive_lean:"contract",title:"勒布朗·詹姆斯的'决定'",real_person:"勒布朗·詹姆斯 (LeBron James)",year:2010,location:"美国克利夫兰",context:"2010年，NBA超级巨星勒布朗·詹姆斯的合同到期，他面临选择：留在家乡球队克利夫兰骑士队（他在这里长大，球迷视他为英雄，他承诺要为家乡带来总冠军），还是跳槽到迈阿密热火队追求总冠军戒指？从合同角度，他完全有权选择任何球队；但从忠诚角度，克利夫兰球迷和整个城市都期待他留下。勒布朗最终在电视直播中宣布：'我要把我的天赋带到南海岸（迈阿密）。'",dilemma:"当职业运动员的合同自由与对家乡、球迷的忠诚发生冲突时，应该优先考虑哪一个？",actual_choice:"勒布朗选择了跳槽迈阿密，行使了合同赋予他的自由选择权。他认为作为职业球员，有权为自己的职业生涯做最好的选择。",consequences:"克利夫兰球迷烧毁了他的球衣，老板发表公开信痛斥他'背叛'。勒布朗在迈阿密赢得了两座总冠军，但'背叛家乡'的污名跟随了他多年。2014年他重返克利夫兰，2016年为骑士夺得总冠军，才部分洗刷了'背叛者'的标签。这个案例引发了关于职业契约与地域忠诚的大讨论。",choice_support_a:"支持勒布朗：职业体育是一份工作，球员有权选择对自己职业生涯最好的选项。合同到期就可以自由选择，这是契约精神的体现，不应该被道德绑架（契约 > 忠诚）",choice_support_b:"批评勒布朗：他不仅是球员，更是克利夫兰的象征和希望。他曾承诺为家乡带来冠军，球迷为他欢呼了七年，这种情感纽带和忠诚比合同条款更重要（忠诚 > 契约）",reflection:"如果你是勒布朗，在合同自由和家乡忠诚之间，你会如何选择？",impact_score:7,controversy_level:8},{id:"case_108",value_pair:["loyalty","contract"],direction:"loyalty_over_contract",intuitive_lean:"loyalty",title:"日本终身雇佣制的崩溃",real_person:"日本企业员工群体",year:1990
