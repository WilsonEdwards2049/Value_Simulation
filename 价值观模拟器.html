。母亲被县军管组羁押，第二天被定罪为'攻击毛主席、为刘少奇翻案'。经安徽省革委会核心小组批准，判处死刑。1970年4月11日，方忠谋被处决。",consequences:"母亲被杀害时，张红兵年仅16岁。此后数十年，他活在极度的悔恨和痛苦中。他说：'我亲手把母亲送上了刑场。'父亲也终生自责。张红兵后来公开忏悔，成为反思文革暴行的象征。但母亲再也回不来了。",choice_support_a:"理解张红兵：在极端政治环境和洗脑教育下，16岁少年被迫在'革命信仰'和亲情之间选择，他也是受害者（理解政治信仰压力）",choice_support_b:"无法原谅：无论何种政治洗脑，亲手举报母亲导致她被处决，这是人性底线的崩溃，亲情应该高于任何意识形态（亲情 > 信仰）",reflection:"如果你是16岁的张红兵，在1970年的中国，你会举报母亲吗？",impact_score:10,controversy_level:9.5},{id:"case_002",value_pair:["family","faith"],direction:"faith_over_family",intuitive_lean:"faith",title:"艾尔肯·库尔班拒绝出卖流亡者",real_person:"艾尔肯·库尔班 (Erkin Qurban)",year:2013,location:"中国新疆",context:"2013年，维吾尔族学者艾尔肯·库尔班回国探亲时被新疆当局扣留。当局以他在国内的家人作为人质，要求他提供海外维吾尔流亡者和活动人士的详细信息，包括姓名、住址、活动计划等。当局威胁说，如果不合作，他的父母、兄弟姐妹都将面临严重后果。",dilemma:"艾尔肯面临着极其残酷的选择：合作意味着背叛同胞和信仰，导致无数流亡者被抓捕甚至失踪；拒绝合作则意味着亲人将受到迫害，父母可能在晚年遭受牢狱之灾。这不是抽象的道德难题，而是一个人必须在几天内做出的生死抉择。",actual_choice:"经过痛苦的思想斗争，艾尔肯最终拒绝合作。他告诉当局自己不会出卖任何人，即使代价是家人受难。",consequences:"艾尔肯被禁止离开中国数月，他的家人遭到持续骚扰和监控。但他保护了数十名流亡者的安全，这些人至今仍在继续为维吾尔人权发声。艾尔肯本人最终获释回到海外，但此后再也无法与国内亲人团聚。",choice_support_a:"质疑艾尔肯的选择：父母养育之恩重于泰山，为了抽象的政治理想而让年迈父母承受迫害是残忍的，家人应该是第一位的（亲情 > 信仰）",choice_support_b:"支持艾尔肯的选择：即使是血缘至亲，也不能强迫一个人背叛自己的民族和信仰，保护更多人的生命是更大的道德责任（信仰 > 亲情）",reflection:"如果你是艾尔肯，在亲人的哭泣和威胁面前，你能坚持自己的选择吗？",impact_score:9,controversy_level:8.5},{id:"case_003",value_pair:["justice","loyalty"],direction:"justice_over_loyalty",intuitive_lean:"justice",title:"爱德华·斯诺登揭露NSA监控",real_person:"爱德华·斯诺登 (Edward Snowden)",year:2013,location:"美国",context:"2013年，29岁的CIA前雇员斯诺登在NSA承包商工作时发现，美国政府正在对全球数十亿人进行大规模无授权监控，包括美国公民。这个名为'棱镜计划'(PRISM)的项目直接违反了美国宪法第四修正案。斯诺登签署过保密协议，泄露机密将面临终身监禁甚至死刑。",dilemma:"斯诺登面临的选择是：遵守对雇主和国家的忠诚承诺，保守秘密继续领取高薪过舒适生活；还是违反保密协议，冒着被通缉、流亡的风险，向世界揭露政府的违宪行为？",actual_choice:"斯诺登选择了揭露真相。他联系了《卫报》记者格伦·格林沃尔德，提供了大量NSA机密文件，并公开了自己的身份。",consequences:"斯诺登被美国政府指控为叛国罪，护照被吊销，被迫流亡俄罗斯至今无法回国。但他的揭露引发了全球对隐私权的大讨论，推动了多国修改监控法律，被许多人视为英雄和良心守护者。",choice_support_a:"支持斯诺登：当雇主和政府从事违宪的大规模监控时，公民有道德义务揭露真相，公众知情权和正义高于对机构的忠诚（正义 > 忠诚）",choice_support_b:"反对斯诺登：他签署了保密协议并接受了国家的信任，却单方面决定泄露国家机密，这种背叛危害了国家安全，应该通过内部渠道解决问题（忠诚 > 正义）",reflection:"如果你发现雇主正在做违法的事情，你会选择举报还是保持沉默？",impact_score:8.5,controversy_level:9},{id:"case_004",value_pair:["loyalty","justice"],direction:"loyalty_over_justice",intuitive_lean:"justice",title:"弗兰克·瑟彭蒂科的警察困境",real_person:"弗兰克·瑟彭蒂科 (Frank Serpico)",year:1971,location:"美国纽约",context:"1960年代，纽约市警察弗兰克·瑟彭蒂科发现整个警察系统充斥着腐败：警察收受毒贩贿赂、勒索商家、包庇犯罪。他的同事们都参与其中，并多次试图拉他入伙。瑟彭蒂科拒绝同流合污，但也面临着巨大压力：揭发同事将被视为叛徒，在警察内部成为孤立者。",dilemma:"在一个腐败成为潜规则的系统中，是保持对同事的忠诚、遵守'警察不举报警察'的铁律，还是为了正义而揭发腐败，承受被同事孤立甚至报复的风险？",actual_choice:"瑟彭蒂科最终选择向《纽约时报》揭露警察系统的腐败。他成为证人，在公开听证会上作证。",consequences:"瑟彭蒂科遭到同事的彻底孤立和报复。1971年，在一次毒品突袭行动中，他被枪击中面部，同事们故意延迟呼叫救援，导致他永久性面部损伤和听力丧失。他不得不提前退休，移居海外。但他的揭露促成了纽约警察系统的大规模改革。",choice_support_a:"质疑瑟彭蒂科：警察工作需要同事间的绝对信任，揭发同事破坏了这种信任，应该通过内部渠道解决问题而非向媒体曝光（忠诚 > 正义）",choice_support_b:"支持瑟彭蒂科：即使面对同事的孤立和报复，揭露腐败仍然是正确的选择，正义和公众利益高于对腐败同事的忠诚（正义 > 忠诚）",reflection:"如果你的同事都在做违法的事情，而你的举报会让自己成为众矢之的，你会选择沉默还是揭发？",impact_score:8,controversy_level:7.5},{id:"case_005",value_pair:["freedom","safety"],direction:"freedom_over_safety",intuitive_lean:"safety",title:"瑞典的COVID-19自由模式",real_person:"安德斯·泰格内尔 (Anders Tegnell)",year:2020,location:"瑞典",context:"2020年COVID-19疫情爆发时，全球大多数国家选择了严格封锁、强制口罩、关闭学校等措施。但瑞典首席流行病学家泰格内尔选择了不同道路：拒绝强制封锁，保持餐厅、商店、学校开放，仅靠民众自愿遵守建议来控制疫情。这一决定在疫情初期导致瑞典死亡率远高于北欧邻国。",dilemma:"在致命疫情面前，是保护个人自由和经济活动，相信民众的自主判断；还是采取强制措施，牺牲自由来最大程度保护公众生命安全？",actual_choice:"泰格内尔坚持自由优先的策略，认为强制封锁不可持续，会造成更大的社会和经济损害，应该相信民众的理性和自律。",consequences:"2020年上半年，瑞典的死亡率显著高于邻国挪威、芬兰和丹麦。但瑞典避免了经济停摆和封锁对心理健康的巨大冲击。到2021-2022年，随着疫苗普及，瑞典的累计超额死亡率反而低于许多实施严格封锁的国家。这一策略至今仍存在巨大争议。",choice_support_a:"支持瑞典模式：即使在疫情中，也不应该牺牲基本自由权利，强制封锁对经济和心理健康的损害可能超过疫情本身（自由 > 安全）",choice_support_b:"反对瑞典模式：在致命疫情面前，政府有责任采取强制措施保护公众生命，个人自由应该暂时让位于公共卫生安全（安全 > 自由）",reflection:"如果你是政策制定者，你会选择强制封锁还是自愿遵守？",impact_score:8,controversy_level:9.5},{id:"case_006",value_pair:["safety","freedom"],direction:"safety_over_freedom",intuitive_lean:"safety",title:"新西兰的COVID-19清零模式",real_person:"杰辛达·阿德恩 (Jacinda Ardern)",year:2020,location:"新西兰",context:"2020年3月，新西兰仅有100多例确诊病例时,总理阿德恩就宣布全国进入最高级别封锁：除超市和药房外所有商业关闭，禁止离开住所，违者罚款或监禁。边境完全关闭，连本国公民都难以回国。这是民主国家中最严厉的防疫措施之一，持续了数周。",dilemma:"在疫情仍处于早期、死亡人数不多的情况下，是否应该采取如此严厉的限制措施，剥夺公民的基本自由权利，强制隔离所有人？还是应该采取较温和的措施，保留更多个人自由？",actual_choice:"阿德恩选择了严厉的清零策略，宁可过度反应也不愿承担疫情失控的风险。",consequences:"新西兰在2020-2021年成功将疫情死亡人数控制在极低水平（人均死亡率是全球最低之一），社会和经济快速恢复正常。但数十万海外新西兰人被困国外无法回家，经济也遭受了巨大打击。到2022年Omicron变种出现后，清零策略最终放弃。",choice_support_a:"支持新西兰模式：在致命疫情面前，政府有责任采取一切必要手段保护公民生命，短期的自由限制换来了长期的社会稳定（安全 > 自由）",choice_support_b:"反对新西兰模式：如此严厉的封锁措施侵犯了基本人权，政府不应该为了控制疫情而剥夺公民的行动自由和经济活动权利（自由 > 安全）",reflection:"如果你生活在2020年的新西兰，你会支持还是反对这种严格封锁？",impact_score:7.5,controversy_level:8.5},{id:"case_007",value_pair:["justice","life"],direction:"justice_over_life",intuitive_lean:"justice",title:"审判南京大屠杀战犯：死刑，还是终身监禁？",real_person:"谷寿夫（侵华日军第六师团师团长）",year:1947,location:"中国南京",context:"谷寿夫是侵华日军第六师团师团长。战后，南京审判战犯军事法庭认定他负有共同纵兵屠杀俘虏及平民等罪责。本题把你放在审判者的位置，并加入一个游戏设定：你可以判处死刑，也可以判处终身监禁、不得假释，并假定监禁能够阻止他再次伤害任何人。战争已经结束，罪责已经查明。你面前是平民被屠杀的记录；幸存者中，有人失去了父母，有人失去了孩子，他们等了多年，终于等到追究罪责的机会。",dilemma:"你一直认为，即使是罪犯，也拥有不可剥夺的生命权。面对这样的罪行，你还会坚持不判死刑吗？终身监禁同样是让他为罪行承担后果；真正的分歧是，死刑是不是必要且相称的惩罚。",actual_choice:"法庭判处谷寿夫死刑，1947年4月26日在南京雨花台执行。“终身监禁、不得假释”这个选项是本题的游戏设定。",consequences:"判决书底稿至今保存。无论判处死刑还是终身监禁，他都没有逃脱罪责；两种判决的分歧在于，是否要以剥夺生命的方式实现这份正义。",choice_support_a:"判处死刑：对参与制造大屠杀的战犯，只有死刑才与罪行相称，这是对遇难者和幸存者的交代（以死刑实现正义 > 罪犯的生命）",choice_support_b:"判处终身监禁、不得假释：让他用余生承担罪责，这同样是正义；但即使面对最极端的罪行，也不剥夺他的生命（生命不可剥夺 > 以死刑实现正义）",reflection:"“任何人的生命都不应被剥夺”，是否也包括犯下极端暴行、应当承担最严厉惩罚的人？",impact_score:9.5,controversy_level:9},{id:"case_008",value_pair:["life","justice"],direction:"life_over_justice",intuitive_lean:"justice",title:"特雷莎修女拒绝谴责罪犯",real_person:"特雷莎修女 (Mother Teresa)",year:1995,location:"印度加尔各答",context:"1995年，一名曾经杀害多人的重刑犯在狱中病重，面临死刑。受害者家属强烈要求尽快执行死刑，拒绝为其提供医疗。但特雷莎修女得知后，亲自前往监狱探望这名罪犯，为他提供医疗照顾，并公开呼吁赦免他的死刑，改为终身监禁。她的行为激怒了受害者家属。",dilemma:"一个犯下重罪的人是否仍有获得医疗和生存的权利？是应该优先考虑受害者的正义诉求和社会的惩罚需要，还是坚守生命权神圣不可侵犯的原则，反对死刑？",actual_choice:"特雷莎修女坚持认为，无论犯下何种罪行，生命都是神圣的，没有人有权利剥夺另一个人的生命。她继续为这名罪犯提供照顾。",consequences:"这名罪犯的死刑最终被改为终身监禁，在狱中度过了余生。特雷莎修女的行为受到了部分人的赞扬，认为她展现了真正的慈悲，但也遭到许多人的批评，认为她忽视了受害者的痛苦和正义的需要。",choice_support_a:"支持特雷莎修女：无论犯下何种罪行，生命权都是不可剥夺的，废除死刑是文明社会的标志，应该以监禁而非杀戮来惩罚犯罪（生命 > 正义）",choice_support_b:"反对特雷莎修女：对于犯下严重罪行的人，受害者和社会有权要求正义和惩罚，生命权不应该凌驾于正义之上（正义 > 生命）",reflection:"如果你的亲人被谋杀，你会支持给凶手医疗救助并反对死刑吗？",impact_score:7.5,controversy_level:8},{id:"case_012",value_pair:["safety","environment"],direction:"safety_over_environment",intuitive_lean:"safety",title:"阿斯旺高坝：调控尼罗河洪水与下游生态",real_person:"埃及政府与阿斯旺高坝受影响社区",year:1954,location:"埃及尼罗河",context:"埃及在1954年决定兴建阿斯旺高坝，水库自1964年开始蓄水，工程于1970年完工。水库储存汛期来水并调节下泄，结束了下游原有的年度洪水过程；阿斯旺月均流量峰值从建坝前约8,763立方米/秒降至建坝后约2,573立方米/秒，流域评估也记载水库帮助埃及应对多次高洪水。与此同时，大坝截留泥沙和营养物，削弱下游三角洲与地中海获得的自然补给。研究记录到尼罗沙丁鱼渔获从1964年的约1.5万吨降至1966年的约554吨；泥沙减少也被认为是三角洲海岸侵蚀的因素之一，但并非唯一原因。水库还淹没努比亚家园，迫使当地居民迁移，防洪收益与代价并非由同一群体承担。",dilemma:"如果水库蓄存汛期洪水、显著压低洪峰，却同时截留滋养下游生态的泥沙和营养物，冲击渔业与三角洲，并淹没努比亚居民的家园，你会支持以大型水库降低洪水风险，还是反对工程并承担较少调蓄能力带来的风险？",actual_choice:"埃及政府决定兴建阿斯旺高坝。水库蓄水后调节尼罗河汛期流量，显著改变了下游洪水过程；与此同时，努比亚居民因水库淹没而迁移，下游河口生态也经历了泥沙与营养物供给减少后的变化。",consequences:"水库把汛期洪水转为可调度的储水，降低了下游洪峰并帮助埃及应对多次高洪水；但它也阻断大部分泥沙输送，改变河口营养条件，沙丁鱼渔获在建坝蓄水后急剧下降。泥沙减少与三角洲海岸侵蚀有关，但海岸变化还受其他因素影响，不能完全归因于大坝。被淹没的努比亚社区承担了迁居与失去故土的代价，而防洪和水资源收益惠及更广泛地区。",choice_support_a:"支持高坝：尼罗河异常洪水可能淹没农田与居民区；水库能储存汛期来水、明显压低洪峰，并帮助应对高洪水和干旱。即使这会削弱下游泥沙与营养补给、损害渔业，也应优先保障更大范围人口的安全（公共安全 > 环境保护）",choice_support_b:"反对高坝：截留泥沙和营养物会改变三角洲、河口与渔业，影响可能持续数十年；努比亚居民还为全国性的防洪与供水收益失去家园。应优先采用代价分配更公平、尽量维持河流生态过程的洪水管理方式，而不是把这些损失集中压给下游生态和被迁移社区（环境保护 > 公共安全）",reflection:"如果大型水库确实能压低洪峰，但生态和迁居代价主要落在下游与少数社区，你会认为公共安全收益足以证明这些代价合理吗？",impact_score:9.5,controversy_level:9},{id:"case_013",value_pair:["freedom","life"],direction:"freedom_over_life",intuitive_lean:"life",title:"拒绝强制疫苗接种",real_person:"美国反疫苗运动参与者",year:2021,location:"美国",context:"2021年，COVID-19 Delta变种在美国快速传播，疫苗已被证明可以显著降低重症和死亡率。拜登政府颁布命令，要求100人以上企业的员工必须接种疫苗或每周检测，否则将被解雇。许多人认为这侵犯了身体自主权，即使疫苗可以救命，也不应该被强制接种。",dilemma:"在疫情中，是应该强制接种疫苗来保护公众健康和挽救生命，还是应该尊重个人的身体自主权，即使这可能导致更多人死亡？",actual_choice:"数百万美国人拒绝接种疫苗，许多人宁愿失业也不接受强制令。最高法院最终裁定强制令违宪。",consequences:"美国的疫苗接种率停滞在70%左右，远低于许多其他发达国家。2021-2022年冬季，美国经历了Omicron变种造成的严重疫情，死亡人数达到历史新高。但美国保持了个人选择的自由，避免了强制疫苗可能带来的社会撕裂。",choice_support_a:"支持拒绝强制：身体自主权是基本人权，即使疫苗可以救命，政府也无权强制公民在身体上接受任何医疗干预（自由 > 生命）",choice_support_b:"支持强制接种：在疫情中，个人选择会影响公众健康，政府有责任采取强制措施保护公共卫生，挽救生命优先于个人选择（生命 > 自由）",reflection:"如果政府要求你接种疫苗否则失业，你会接种还是拒绝？",impact_score:8,controversy_level:9.5},{id:"case_014",value_pair:["truth","loyalty"],direction:"loyalty_over_truth",intuitive_lean:"loyalty",title:"帕特·蒂尔曼：友军误伤与英雄叙事",real_person:"帕特·蒂尔曼 (Pat Tillman)、美国陆军指挥链",year:2004,location:"阿富汗霍斯特省",context:"前NFL球员帕特·蒂尔曼在九一一事件后放弃职业生涯加入美国陆军游骑兵团。2004年，他在阿富汗行动中被己方士兵误伤身亡。陆军最初对外称他死于敌方火力，并追授银星勋章；勋章引文称他是在猛烈敌火中英勇作战。数日内已有指挥官收到友军误伤的重大疑点，但蒂尔曼的妻子和兄长在一个多月后才获知实情。战场信息混乱时，指挥链既要尽快核实死因、如实通知家属，也要维护部队凝聚力与阵亡者名誉。",dilemma:"当战场上发生友军误伤，公开细节可能打击部队士气、伤害战友与家属并损害军队声誉时，指挥链应优先维护部队凝聚力、等调查完成后再公布，还是尽快向家属与部队说明已知疑点？",actual_choice:"陆军最初称蒂尔曼死于敌方火力，家属与公众数周后才获知友军误伤。后续国防部监察长认定银星推荐材料含有重大不准确内容，并错误暗示他死于敌火；官方调查指出严重失误，但没有认定存在有组织的蓄意掩盖。",consequences:"延迟说明令蒂尔曼家属承受额外痛苦，也使军方的英雄叙事和嘉奖程序受到质疑。调查与国会报告批评通报、嘉奖材料及证据保全存在严重问题；军方随后处分了多名军官并向家属道歉，但家属仍质疑调查是否完整。",choice_support_a:"支持尽早说明：一旦指挥链掌握友军误伤的重大疑点，家属和部队就有权及时知道；不能以军誉、士气或英雄形象为由维持误导叙事（真实 > 忠诚）",choice_support_b:"优先维护部队凝聚力：战场信息尚待核实，过早传播可能打击战友士气、伤害家属并削弱公众对军队的信任；指挥链应先统一核实、尊重阵亡者并保护部队（忠诚 > 真实）",reflection:"当军方已有友军误伤的重大疑点，但完整调查尚未结束，你会要求立即告知家属与部队，还是支持指挥链先统一核实后再公开？",impact_score:9.5,controversy_level:8.5},{id:"case_015",value_pair:["justice","life"],direction:"life_over_justice",intuitive_lean:"life",title:"南非真相与和解委员会",real_person:"德斯蒙德·图图 (Desmond Tutu)",year:1996,location:"南非",context:"1996年，种族隔离制度结束后，南非面临抉择：是像纽伦堡审判那样起诉和惩罚所有种族主义罪犯，还是选择宽恕和和解？大主教图图领导的真相与和解委员会选择了后者：只要罪犯说出真相，就可以获得特赦，免于起诉。许多受害者家属愤怒地质问：杀人犯仅仅说出真相就可以逃避惩罚吗？",dilemma:"是应该坚持正义原则，起诉和惩罚所有罪犯，即使这可能导致国家陷入内战；还是为了避免更多流血和实现民族和解，放弃惩罚而选择宽恕？",actual_choice:"南非选择了宽恕之路。数千名种族隔离时期的罪犯因为说出真相而获得特赦，包括许多杀人犯和酷刑执行者。",consequences:"南非避免了报复性内战，实现了相对和平的政权过渡。但许多受害者家属认为正义没有得到伸张，罪犯没有付出应有代价。真相与和解委员会模式后来被许多国家借鉴，但关于'是否应该牺牲正义来换取和平'的争议至今仍在继续。",choice_support_a:"反对放弃惩罚：对杀人犯和酷刑执行者的宽恕是对受害者的背叛，正义不应该被牺牲，罪犯必须付出代价（正义 > 和平）",choice_support_b:"支持图图的选择：在种族分裂的国家，宽恕和真相比惩罚更重要，避免内战和实现和解可以挽救更多生命（和平与生命 > 正义）",reflection:"如果你的亲人被种族主义者杀害，你会接受宽恕凶手换取国家和平吗？",impact_score:8.5,controversy_level:8.5},{id:"case_016",value_pair:["freedom","truth"],direction:"truth_over_freedom",intuitive_lean:"truth",title:"伽利略被迫放弃日心说",real_person:"伽利略·伽利雷 (Galileo Galilei)",year:1633,location:"意大利罗马",context:"1633年，69岁的伽利略因宣扬日心说被罗马宗教裁判所传唤。教会给他两个选择：公开放弃日心说、承认地球是宇宙中心，就可以保住自由和生命；坚持真理则将被处以火刑。伽利略面临着痛苦抉择：是为真理殉道，还是选择屈服以保全自由？",dilemma:"在强权威胁下，科学家应该坚持已证实的科学真理而殉道，还是应该暂时屈服、保全自由，等待未来继续研究？",actual_choice:"伽利略选择了公开放弃日心说，跪在宗教裁判所前宣读悔过书。但据说他在宣读后低声说：'但地球仍在转动。'",consequences:"伽利略被软禁在家直到去世，但保住了生命。他在软禁期间继续秘密研究，完成了《关于两门新科学的对话》。300年后教会才承认错误。伽利略的选择被有些人视为务实，也被有些人视为对真理的背叛。",choice_support_a:"理解伽利略：保全自由和生命才能继续研究，殉道对科学没有意义，真理终将战胜谎言（自由 > 真实）",choice_support_b:"批评伽利略：作为科学家，应该为真理献身，公开放弃真理是对科学的背叛（真实 > 自由）",reflection:"如果你是伽利略，你会选择为真理殉道，还是暂时屈服以保全研究的机会？",impact_score:8,controversy_level:7},{id:"case_017",value_pair:["justice","family"],direction:"family_over_justice",intuitive_lean:"family",title:"《心术》：默许私取肾脏，救自己的女儿？",real_person:"刘晨曦（电视剧《心术》人物）",year:2012,location:"中国",context:"电视剧《心术》中，医生刘晨曦的女儿南南患有严重肾病，病情不断恶化，等待合适的肾源。医院里一个男孩抢救无效死亡，他的肾脏与南南匹配，但男孩的父母明确拒绝捐献。同事急于救南南，试图绕过家属同意取得肾脏，甚至准备让刘晨曦服下镇静药，替他把事情办了。刘晨曦发现后，面对的不是自己能否策划取肾，而是要不要阻止身边的人。",dilemma:"假如你是这位父亲：你的女儿可能等不到下一次移植机会，同事已经准备私下取肾。你只需默许，就能为女儿争取生机；但这意味着明知另一个家庭已经拒绝，仍接受未经同意取得的器官。你会阻止他们，还是默许他们继续？",actual_choice:"剧中刘晨曦阻止了同事，南南没有接受这次移植。他没有把对方拒绝捐献的权利，变成可以因为自己女儿需要就绕过的障碍。",consequences:"这一次，刘晨曦尊重了死者家属的拒绝，女儿却失去了眼前的移植机会，仍需在病情恶化中等待。此处的代价是失去一次救命机会，而不是女儿已经因此死亡；在作出选择的当时，他无法确定还能否等到新的肾源。",choice_support_a:"阻止私自取肾：不能因为自己的孩子需要，就侵犯另一个家庭明确拒绝捐献的权利，即使女儿可能失去救命机会（正义 > 亲情）",choice_support_b:"默许同事取肾：接受未经同意取得的肾脏，为女儿争取活下去的机会，即使这侵犯了另一个家庭的权利（亲情 > 正义）",reflection:"对方的孩子已经去世，你的孩子却还有救。此刻，你还能坚持“救人也不能强取器官”吗？",impact_score:9.5,controversy_level:9.5},{id:"case_063",value_pair:["justice","family"],direction:"justice_over_family",intuitive_lean:"justice",title:"汉克该不该追查身为毒枭的连襟沃尔特",real_person:"汉克与沃尔特（美剧《绝命毒师》人物）",year:2013,location:"美国新墨西哥州阿尔伯克基",context:"缉毒局探员汉克与连襟沃尔特（两人的妻子是亲姐妹）来往多年，两家人频繁聚会、一起照顾孩子；沃尔特患癌后，汉克一直把他视为需要保护的家人。后来汉克发现，自己追查多年的制毒首脑「海森堡」正是沃尔特。此时沃尔特已经退出毒品生意，癌症却复发了。他告诉汉克：即使继续调查，等案件查清时自己很可能已经死了。揭发他不会让一个正在犯罪的人停止，反而会让沃尔特的妻子和两个孩子失去家庭，孩子们必须知道父亲是毒枭和杀人者，整个家庭的名誉和生活被彻底摧毁；汉克中枪后的康复治疗费用其实来自沃尔特的毒资，他本人也可能因此受到调查。但沃尔特建立毒品帝国期间制造并参与了多起死亡，以威胁、欺骗和杀戮保护自己。如果汉克沉默，沃尔特就可能凭借癌症和亲属身份逃过所有追责，受害者永远得不到公正。",dilemma:"是为了保护无辜的家人，对身患绝症、已经收手的沃尔特保持沉默（亲情），还是坚持让他为造成的死亡和伤害接受调查与审判（正义）？",actual_choice:"汉克选择继续追查，最终在沙漠中亲手逮捕了沃尔特。",consequences:"汉克刚给沃尔特戴上手铐，一伙武装毒贩就赶到了，汉克在交火中被杀。",choice_support_a:"坚持正义：亲属关系不能成为毒枭的免罪符。无论沃尔特还剩多少时间，他都必须为造成的死亡和伤害接受调查与审判（正义 > 亲情）",choice_support_b:"保护家庭：沃尔特已经退出犯罪并即将死亡。继续追查只能摧毁他妻子和孩子的人生，让整个家庭替他的罪行受罚（亲情 > 正义）",reflection:"如果一个罪行严重的亲人已经停止犯罪、身患绝症，而揭发他最直接的后果是摧毁其他无辜家人的生活，你还要坚持追责吗？",impact_score:9.5,controversy_level:9.5},{id:"case_018",value_pair:["freedom","loyalty"],direction:"freedom_over_loyalty",intuitive_lean:"freedom",title:"曲洋与刘正风的知音之交",real_person:"曲洋与刘正风（金庸小说《笑傲江湖》人物）",year:1500,location:"衡山与江南（小说世界）",context:"在金庸小说《笑傲江湖》中，衡山派长老刘正风与日月神教长老曲洋分别属于正邪两派，却因为共同的音乐爱好成为知音。他们合奏并整理《笑傲江湖》曲谱，但两派都把对方视为敌人，门派关系也不允许他们公开往来。刘正风因此决定金盆洗手，退出江湖中的门派纷争。",dilemma:"如果门派要求你与敌对门派的朋友断绝来往，你是服从师门、维护组织边界，还是坚持自己选择朋友和追求艺术的权利？前者意味着保住门派身份，后者则可能被视为背叛师门。",actual_choice:"刘正风没有按门派秩序彻底切断与曲洋的友谊，曲洋也没有因为正邪之分放弃这段关系。面对要求他们断绝来往、交代彼此关系的压力，两人仍选择共同完成《笑傲江湖》曲谱，并离开门派纷争。",consequences:"两人失去了原有门派身份和江湖地位，也付出了生命代价；但他们保留了自主选择朋友、追求音乐和决定自己生活方式的权利。故事因此提出疑问：门派忠诚是否可以要求一个人放弃真实的友谊与精神生活？",choice_support_a:"支持曲洋与刘正风：门派身份不应规定一个人只能与谁交往、只能欣赏什么艺术。自由选择朋友和生活方式，比服从排他的组织命令更重要（自由 > 忠诚）",choice_support_b:"支持门派秩序：加入一个组织就意味着承担相应的边界和义务，不能一边享有师门身份，一边拒绝遵守组织对敌我关系的要求（忠诚 > 自由）",reflection:"如果你的组织要求你与最重要的朋友断绝关系，你会服从组织，还是保留自己的选择？",impact_score:8.5,controversy_level:8},{id:"case_019",value_pair:["life","environment"],direction:"life_over_environment",intuitive_lean:"life",title:"DDT与疟疾防治",real_person:"保罗·穆勒 (Paul Hermann Müller)",year:1948,location:"全球",context:"1948年，瑞士化学家保罗·穆勒因发明DDT杀虫剂获得诺贝尔奖。DDT在二战后被大规模用于疟疾防治，拯救了数百万生命。但到1960年代，科学家发现DDT会在生物体内累积，导致鸟类蛋壳变薄、物种濒危、生态系统破坏。环保主义者要求全面禁用DDT，但热带国家面临困境：禁用DDT会导致疟疾死灰复燃。",dilemma:"是应该为了保护生态环境全面禁用DDT，即使这会导致数百万人死于疟疾；还是应该继续使用DDT拯救生命，即使这会造成长期的环境破坏？",actual_choice:"发达国家在1970年代基本禁用了DDT。但非洲等疟疾高发地区继续限制性使用DDT用于室内喷洒，作为最后的防疫手段。",consequences:"发达国家的鸟类种群逐渐恢复。但非洲因疟疾每年仍有数十万人死亡，其中大部分是儿童。WHO在2006年重新认可DDT用于疟疾防治。关于'应该拯救眼前的生命还是保护长远的生态'的争论至今仍在继续。",choice_support_a:"支持继续使用DDT：拯救人类生命比保护鸟类更重要，不能让穷国儿童为富国的环保理想买单（生命 > 环境）",choice_support_b:"支持禁用DDT：生态系统一旦崩溃将导致更大规模的生命损失，应该寻找替代方案而不是饮鸩止渴（环境 > 生命）",reflection:"如果你的孩子生活在疟疾高发区，你会支持禁用DDT吗？",impact_score:8,controversy_level:8.5},{id:"case_020",value_pair:["faith","life"],direction:"faith_over_life",intuitive_lean:"life",title:"徐炳川被公审处决",real_person:"徐炳川与宝山县土改工作队",year:1951,location:"中国上海宝山县枫塘乡",context:"1950年至1952年的土地改革中，地主被划为需要被改造和清除的阶级对象。上海宝山县枫塘乡的徐炳川被当地人称为“小炳川”，在土改记录中被指认为压迫雇工、具有“恶霸”性质的地主。公审时，他的妻子也上台控诉他。现有材料记录了这些指控和处决过程，但不能把运动中的阶级定性直接等同于经过独立审判确认的犯罪事实。",dilemma:"你是土改工作队成员。群众要求处决一名被指认为“恶霸地主”的人，认为不杀他就无法完成土地改革，也会让其他地主继续反抗。可是现有证据主要来自群众控诉、阶级身份和政治审查，并不足以证明每项指控。你是服从把阶级敌人清除出去的革命信仰，还是暂停处决、优先保护一个具体的人的生命？",actual_choice:"当地土改工作队接受了对徐炳川的阶级和政治定性。他在公审大会上被判处死刑，随后被枪决。",consequences:"处决强化了土改中的革命权威，也向当地人展示了阶级斗争的惩罚边界；但一个人的生命被不可逆地交给了阶级标签、群众动员和政治审查。这个案例留下了无法回避的问题：为了建立理想社会，是否可以先把被定义为敌人的人当作必须牺牲的对象？",choice_support_a:"支持处决：地主阶级曾经依靠剥削和暴力压迫农民，若不彻底清除最危险的恶霸，就无法完成土地改革、打破旧秩序并建立新的社会（革命信仰 > 生命）",choice_support_b:"反对处决：无论一个人的阶级出身和群众评价如何，都不能在缺乏独立证据和正常审判的情况下夺走他的生命；社会改革不能以把人当作阶级敌人为借口杀人（生命 > 革命信仰）",reflection:"如果你相信消灭阶级压迫是通往理想社会的必经之路，但眼前这个人的具体罪行并未经过独立审判，你会批准处决吗？",impact_score:9.5,controversy_level:9.5},{id:"case_021",value_pair:["justice","safety"],direction:"safety_over_justice",intuitive_lean:"justice",title:"为了安全，监控每一个人？",real_person:"中国多地公安机关（警务云）",year:2017,location:"中国山东、江苏、天津等地",context:"你负责一座城市的公共安全。为了提前发现暴力犯罪和其他危险，警方希望把原本分散的信息汇集起来：人们的微信、微博、QQ账号及网络活动，购物和快递记录，住宿、出行与位置数据，还有他们与哪些人一起旅行、出入同一家网吧。绝大多数人没有犯罪嫌疑，但系统可以据此找出被标记为“重点人员”的人及其关联者。收集范围越广，越可能提前发现线索，也越难让普通人知道自己何时被监控、为何被列为风险。",dilemma:"是允许警方持续汇集普通人的数字生活信息，以便在危险发生前识别潜在威胁；还是坚持无具体嫌疑就不应把每个人及其社交关系纳入监控，即使这样可能漏掉预警线索？",actual_choice:"中国多地公安机关建设了“警务云”。人权观察根据山东、江苏、天津等地的采购文件调查发现，系统整合政府记录、网络账号和活动、购物物流与出行等信息，用于追踪“重点人员”及其关联者；被关注的对象包括上访者和被认为可能影响“稳定”的人。独立技术研究还证实，微信对中国注册账号的单聊、群聊文字和图片实施内容审查，敏感消息可能在发件人没有收到提示的情况下无法送达。微博、抖音、小红书等平台也有删帖、限制内容可见度或封禁账号的记录；有人因网上言论遭警方约谈或拘留。这些是不同平台和部门的审查、执法实践，不能都归为同一个“警务云”系统。",consequences:"如此规模的数据汇集使警方有能力从日常行为中寻找线索，但普通人也可能因为与被关注者同行或有其他关联而进入监控视野。私信发出后对方看不到、帖子被删除或限制传播、账号被封，以及因言论被约谈，都让人在日常交流中承担实际风险。被标记者难以获知原因或申诉；个人隐私、无罪推定与结社自由都可能受损。公开调查记录了跨平台的内容审查和多地的跨来源数据收集，但尚未证实全国每个应用的每条私信都由国安部门逐条审核。",choice_support_a:"坚持正义：不能在没有具体嫌疑和有效监督的情况下，大规模汇集普通人的账号、购物、出行和社交关系，再把无辜者当作潜在风险，即使可能错过预警线索（正义 > 安全）",choice_support_b:"坚持公共安全：越早识别危险越可能保护无辜者；为此可以整合普通人的数字足迹，提前调查可疑关联，即使多数被监控者从未违法（安全 > 正义）",reflection:"如果你一直认为公共安全应当优先，当自己的聊天账号、购物记录和出行关系也被纳入风险分析时，你还愿意让所有人接受这种监控吗？",impact_score:9.5,controversy_level:9},{id:"case_022",value_pair:["freedom","family"],direction:"family_over_freedom",intuitive_lean:"family",title:"妻女被扣在朝鲜之后",real_person:"奥吉南、申淑子与他们的两个女儿",year:1986,location:"西德、丹麦与朝鲜",context:"韩国经济学家奥吉南与妻子申淑子、两个年幼女儿于1985年迁往朝鲜。次年，朝鲜当局派他前往西德招募韩国留学生。他在丹麦寻求政治庇护，没有按命令返回。此后，妻子和女儿被朝鲜当局拘禁；联合国任意拘留问题工作组认定，对她们的拘禁属于任意拘留。朝鲜政权利用家人的处境向奥吉南施压，要求他回去继续为政权工作。",dilemma:"你已经逃到自由国家，妻子和两个女儿却被政权扣留。你可以回去，重新为这个政权工作，并希望家人因此获释；但回去后可能再次失去自由，而且政权并未保证会放人。你会为了与妻女团聚回去效力，还是留在自由之地，承受家人继续被关押、自己无法陪伴她们的痛苦？",actual_choice:"奥吉南没有返回朝鲜。他在丹麦申请政治庇护，后来回到韩国。朝鲜当局没有释放他的妻子和女儿；此后多年，他持续呼吁与家人团聚。",consequences:"奥吉南保住了自由，没有再被迫替朝鲜政权工作，但妻女长期被拘禁，与他分离。2012年，朝鲜方面称申淑子已经去世、女儿不愿与父亲联系，却没有提供可独立核实的死亡时间和地点；联合国工作组要求朝鲜立即释放被拘禁的妻女。团聚没有实现，回去是否能救出家人也始终没有答案。",choice_support_a:"坚持自由：不回去替迫害家人的政权效力。即使妻女仍被扣留，也不能让政权用亲情迫使你放弃自由；回去并不保证她们获释（自由 > 亲情）",choice_support_b:"选择亲情：妻子和两个女儿正在被关押，不能只顾自己留在安全之地；即使回去可能再次失去自由，也要争取与家人团聚的机会（亲情 > 自由）",reflection:"如果政权扣押你的配偶和年幼孩子，要求你回去为它工作，却不保证家人会获释，你会回去吗？",impact_score:10,controversy_level:10},{id:"case_023",value_pair:["faith","loyalty"],direction:"loyalty_over_faith",intuitive_lean:"faith",title:"马丁·路德·金拒绝共产党",real_person:"马丁·路德·金 (Martin Luther King Jr.)",year:1965,location:"美国",context:"1965年，民权运动领袖马丁·路德·金面临艰难选择。FBI威胁他：如果不与运动中的共产党同情者切割、不公开谴责激进左翼，就会公开他的私生活丑闻。共产党支持者一直是民权运动的重要盟友，为黑人权利斗争提供了大量资金和组织支持。但金担心如果被贴上'赤色分子'标签，会毁掉整个民权运动。",dilemma:"是应该坚守对盟友和同志的忠诚，即使这会被利用来攻击运动；还是应该为了更大的理想（种族平等）与某些盟友切割？",actual_choice:"金选择了与激进左翼保持距离，公开强调民权运动的非暴力和基督教性质，与共产主义划清界限。一些曾并肩战斗的激进派因此离开了运动。",consequences:"金的策略使民权运动获得了更广泛的中产阶级支持，最终促成了1964年民权法案的通过。但他因'背叛'盟友而受到激进派的批评，一些左翼活动家认为他向权力妥协了。",choice_support_a:"理解金的选择：为了实现更大的目标（种族平等），必须做出战术妥协，忠诚不应该妨碍理想实现（信仰/理想 > 忠诚）",choice_support_b:"批评金的选择：在压力下抛弃并肩战斗的同志是背叛，忠诚和团结才是运动的基础（忠诚 > 信仰）",reflection:"如果你是运动领袖，你会为了策略成功而与激进盟友切割吗？",impact_score:7.5,controversy_level:8},{id:"case_024",value_pair:["life","family"],direction:"life_over_family",intuitive_lean:"life",title:"特里·夏沃安乐死案",real_person:"特里·夏沃 (Terri Schiavo)",year:2005,location:"美国佛罗里达",context:"2005年，美国女子特里·夏沃因心脏骤停导致严重脑损伤，成为植物人已15年。她的丈夫迈克尔认为妻子不愿意以植物人状态活着，要求医院拔除喂食管，让她安然离世。但特里的父母坚决反对，认为只要还活着就有希望，他们要求继续维持女儿生命。",dilemma:"当家人意见分裂时，应该尊重患者生前可能的意愿让其安然离世，还是应该不惜代价维持生命直到自然死亡？",actual_choice:"经过多年法律battle，法院最终支持丈夫的决定，允许拔除喂食管。2005年3月31日，特里在父母守候中去世。",consequences:"此案引发美国社会大辩论，甚至惊动了国会和总统。父母至今认为丈夫'谋杀'了女儿。这个案例促使更多美国人开始签署生前遗嘱，明确表明自己对生命维持治疗的态度。",choice_support_a:"支持丈夫：植物人状态没有意义，让患者有尊严地离开比维持毫无质量的生命更重要（生命尊严 > 亲情执念）",choice_support_b:"支持父母：只要还有一丝生命，就不应该放弃，父母有权为子女争取每一天的生存机会（亲情 > 生命质量）",reflection:"如果是你的亲人成为植物人，你会选择拔管还是继续维持？",impact_score:8.5,controversy_level:9},{id:"case_025",value_pair:["truth","safety"],direction:"truth_over_safety",intuitive_lean:"truth",title:"切尔诺贝利真相揭露",real_person:"瓦列里·列加索夫 (Valery Legasov)",year:1986,location:"苏联",context:"1986年切尔诺贝利核电站爆炸后，首席科学家列加索夫发现事故原因是反应堆设计缺陷，苏联其他十几座同类型反应堆都存在同样隐患。苏联当局要求他对国际原子能机构隐瞒设计缺陷，只承认是操作失误，以维护苏联核工业声誉和'社会稳定'。但列加索夫知道，隐瞒真相意味着其他反应堆随时可能重演灾难。",dilemma:"是应该服从国家利益隐瞒核设施缺陷以维护社会稳定，还是应该不顾后果揭露真相以防止未来灾难？",actual_choice:"列加索夫在国际会议上部分遵守了官方口径，但私下录制了揭露真相的录音带。1988年，在事故两周年当天，他在家中自杀，留下了揭露苏联核工业系统性问题的证词。",consequences:"列加索夫的录音带在他死后流传开来，促使苏联改进核电站安全设计。但他本人被官方打压，被剥夺应得的荣誉。HBO剧集《切尔诺贝利》让世界认识了这位为真相牺牲的科学家。",choice_support_a:"敬佩列加索夫：科学家的职责是揭露真相，隐瞒安全隐患可能导致更大灾难，真相高于稳定（真实 > 安全）",choice_support_b:"理解官方立场：在冷战背景下，揭露核设施缺陷可能引发恐慌，危及国家安全，稳定优先（安全 > 真实）",reflection:"如果你发现危险真相，你会冒险揭露还是服从掩盖命令？",impact_score:9,controversy_level:7.5},{id:"case_026",value_pair:["environment","family"],direction:"environment_over_family",intuitive_lean:"family",title:"朱莉娅·希尔树上抗议",real_person:"朱莉娅·巴特菲尔德·希尔 (Julia Butterfly Hill)",year:1999,location:"美国加州",context:"1997年，23岁的环保活动家朱莉娅为抗议砍伐千年红杉，爬上一棵55米高的古树，发誓不达目的不下树。她的家人恳求她下来：'你的父母需要你，你不能为了一棵树抛弃家人。'但朱莉娅认为这些古树是不可替代的生态遗产，她在树上搭建了简易平台，靠绳索运送的食物维生。",dilemma:"是应该回到地面照顾需要她的家人，还是应该为了环保事业继续危险的树上抗议，即使家人为此担惊受怕？",actual_choice:"朱莉娅在树上坚守了738天（超过两年），经历了暴风雨、寒冬和伐木公司的骚扰。她拒绝了所有劝她下树的请求，包括家人的恳求。",consequences:"1999年，木材公司最终妥协，承诺永久保护这棵树和周围的树林。朱莉娅成为环保英雄，但她与家人的关系严重紧张。她的母亲公开表示无法理解女儿'为了树而抛弃家人'的行为。",choice_support_a:"支持朱莉娅：千年古树是不可替代的生态遗产，为环保献身是有意义的牺牲（环境 > 亲情）",choice_support_b:"同情家人：环保重要但不应该以抛弃家人为代价，父母养育子女不是为了让他们在树上冒险两年（亲情 > 环境）",reflection:"如果你的子女为了环保事业做出极端行为，你会支持还是反对？",impact_score:7,controversy_level:7.5},{id:"case_027",value_pair:["loyalty","safety"],direction:"safety_over_loyalty",intuitive_lean:"safety",title:"蒋彦勇揭露 SARS 疫情瞒报",real_person:"蒋彦勇",year:2003,location:"中国北京",context:"2003年 SARS 疫情期间，官方公布的北京病例数远低于实际情况，军队医院病例也未充分进入公开统计。时任军医的蒋彦勇向媒体披露军队医院收治了大量 SARS 患者，促使疫情信息受到国际关注。同期报道显示军队人员接受外国媒体采访需经政治部门批准；但现有资料不能确认他在披露前曾收到针对个人的明确禁令。",dilemma:"作为军医，你要不要服从党和军队的信息管理及组织纪律，不向外界披露军队医院掌握的疫情信息；还是越过组织限制，公开病例情况，以便公众和卫生机构及时认识传播风险？",actual_choice:"蒋彦勇向媒体披露军队医院的 SARS 病例情况。2003年4月20日，中国官方大幅上调北京病例数字，并转向每日通报和加强防控；他的披露推动了关注，但并非后续应对变化的唯一原因。",consequences:"信息公开让此前未充分呈现的疫情规模进入公众与国际视野，帮助揭示延误通报的严重性。2004年，蒋彦勇因要求重新评价1989年天安门事件而被拘押近七周，获释后又受到采访限制和监控；这些后续打压有明确的政治背景，不应简单归因于 SARS 吹哨。",choice_support_a:"支持忠诚：遵守党和军队的信息管理要求，维护组织纪律与指挥体系；军人不应擅自向外披露内部掌握的信息，即使这意味着公众暂时无法获知完整疫情（忠诚 > 公共安全）",choice_support_b:"支持公共安全：疫情信息关系到传染病防控，延迟公开会妨碍公众和卫生机构判断风险；即使违背党和军队的信息管理要求，也应及时揭示疫情规模（公共安全 > 忠诚）",reflection:"当党和军队要求遵守疫情信息管理，而延迟披露可能妨碍传染病防控时，你会把组织纪律还是公共安全放在首位？",impact_score:9,controversy_level:9},{id:"case_028",value_pair:["life","loyalty"],direction:"life_over_loyalty",intuitive_lean:"life",title:"睢阳守城：以百姓的生命尽忠？",real_person:"张巡、许远与睢阳军民",year:757,location:"唐朝睢阳（今河南商丘）",context:"安史之乱期间，张巡、许远率军守卫睢阳，抵抗叛军，牵制其向江淮地区推进。城池长期被围，援军迟迟不到，粮食耗尽。守军没有停止抵抗，而是以杀食城中居民的方式维持作战。后世因他们为唐朝坚守而称颂其忠烈，但这份忠诚的代价不只是将士自己的生命，也包括城中百姓。",dilemma:"你是守城将领，肩负抵抗叛军、保卫国家的职责。粮食已经耗尽，继续坚守需要杀死平民供军士食用。你会拒绝以百姓为食，即使因此无法继续守城、可能被视为不忠；还是为了不向叛军屈服，允许牺牲百姓来维持抵抗？停止抵抗并不保证敌军会放过军民，但继续杀食平民意味着由你主动夺走他们的生命。",actual_choice:"据《旧唐书》等记载，张巡杀死自己的妾，强令军士食用；随后守军杀食城中妇女及其他居民，继续抵抗叛军。张巡、许远没有放弃守城。757年，睢阳最终陷落，张巡被俘后遇害，许远被押走，后来也被杀。",consequences:"城中平民被杀食，坚守最终仍未避免城破。张巡、许远因牵制叛军、屏障江淮而被后世奉为忠烈，但以无辜者的生命维持抵抗，也让这场守城成为对忠诚边界的追问：将领可以选择自己殉国，是否也有权替百姓决定牺牲？",choice_support_a:"守住生命底线：拒绝杀食平民，即使无法继续守城，也不能为了尽忠主动杀害本应保护的百姓；自己愿意殉国，不代表有权要求他人牺牲（生命 > 忠诚）",choice_support_b:"坚持为国守城：睢阳关系到江淮的安危，不能因粮尽就向叛军屈服；即使需要付出城中百姓的生命，也要维持抵抗、履行保卫国家的职责（忠诚 > 生命）",reflection:"如果忠于国家的代价，是杀死你本应保护的百姓，你还会把这种坚守称为忠诚吗？",impact_score:10,controversy_level:10},{id:"case_029",value_pair:["faith","truth"],direction:"truth_over_faith",intuitive_lean:"truth",title:"查尔斯·达尔文发表进化论",real_person:"查尔斯·达尔文 (Charles Darwin)",year:1859,location:"英国",context:"1859年，达尔文完成了《物种起源》，提出进化论。但他深知这一理论将动摇基督教创世论根基，背离他从小接受的宗教信仰。他的妻子艾玛是虔诚的基督徒，恳求他不要发表'亵渎上帝'的理论。达尔文陷入20年的痛苦犹豫：是坚守宗教信仰、保护家庭和睦，还是公布颠覆信仰的科学真理？",dilemma:"当科学发现与宗教信仰冲突时，应该为了维护信仰压制真相，还是应该为了真理挑战信仰，即使这会破坏家庭关系、背离一生的信念？",actual_choice:"达尔文最终选择发表进化论。1859年11月24日，《物种起源》出版，首印1250册当天售罄。",consequences:"进化论引发巨大争议，教会谴责达尔文为'异端'。他与妻子的关系紧张，终生为背离信仰而内疚。但进化论成为现代生物学基础，从根本上改变了人类对自身的认识。达尔文临终前仍在为'伤害了妻子的信仰'而自责。",choice_support_a:"同情妻子：信仰是人的精神支柱，为了科学理论而破坏家人的信仰体系是残忍的（信仰 > 真实）",choice_support_b:"支持达尔文：科学真理不应该被宗教信仰压制，追求真相是人类进步的基础（真实 > 信仰）",reflection:"如果你的科学发现会颠覆你和家人的宗教信仰，你会发表吗？",impact_score:9.5,controversy_level:8},{id:"case_064",value_pair:["faith","truth"],direction:"faith_over_truth",intuitive_lean:"faith",title:"蝙蝠侠替哈维·丹特背罪",real_person:"蝙蝠侠与詹姆斯·戈登（电影《蝙蝠侠：黑暗骑士》人物）",year:2008,location:"哥谭市（电影虚构城市，2008年为上映年份）",context:"电影《蝙蝠侠：黑暗骑士》中，检察官哈维·丹特通过司法打击犯罪，成为哥谭市民相信正义能够实现、城市能够改变的象征。但他遭受小丑的打击后转向复仇，犯下杀人罪。丹特死后，蝙蝠侠与戈登知道他的罪行，也担心一旦真相公开，市民会把这位英雄的崩溃看成整个司法改革理想的失败。这里需要维护的信念不是对丹特个人的忠诚，而是普通人能够通过公共司法改变社会的希望。",dilemma:"如果你是蝙蝠侠，你会让戈登公开丹特的罪行，让市民和受害者家属知道真正的凶手；还是主动承担罪名，请戈登隐瞒真相，保留丹特作为司法改革英雄的形象？前者尊重公众认识事实的权利，却可能动摇他们刚刚建立的信念；后者试图保住共同的希望，却让公众相信错误的事实，也让你成为被追捕的人。公开真相是否一定会摧毁希望，是角色的判断，并非确定事实。",actual_choice:"蝙蝠侠选择承担丹特的罪名，让戈登把自己作为凶手追捕。戈登没有向公众揭露丹特的杀人行为，而是在悼念中继续把他称为英雄。蝙蝠侠愿意失去自己的声誉，成为被追捕的人，以保留市民心中那个代表正义与改变的象征。",consequences:"丹特的英雄形象被保留下来，蝙蝠侠则遭到追捕；公众和受害者家属没有获知真正的凶手。两人希望这个谎言能维持市民对司法改革的信念，但不能因此断言，公开事实就必然毁掉理想。维持希望的同时，他们也替公众决定了哪些事实不该被知道，让这份共同信念依赖于一个虚假的英雄形象。",choice_support_a:"维护信念：由蝙蝠侠承担罪名，隐瞒丹特的罪行。不能让一个人的崩溃摧毁整座城市对正义能够实现、社会能够改变的信念；当人们刚刚开始相信这些理想时，保住共同的希望比立即揭露事实更重要（信仰 > 真实）",choice_support_b:"公开真相：让公众和受害者家属知道丹特的罪行，不把罪名安在蝙蝠侠身上。人们有权根据事实判断英雄与制度；真正值得坚持的理想应当接受事实的检验，而不是靠隐瞒维持（真实 > 信仰）",reflection:"当一个支撑许多人信念的英雄犯下罪行，你会公开事实，让理想接受检验；还是隐瞒他的失败，保住人们继续相信正义的希望？",impact_score:9.5,controversy_level:3},{id:"case_030",value_pair:["justice","truth"],direction:"justice_over_truth",intuitive_lean:"truth",title:"辛普森案陪审团判决",real_person:"O.J.辛普森陪审团",year:1995,location:"美国洛杉矶",context:"1995年，美国橄榄球明星辛普森被控杀害前妻。证据包括血迹DNA、手套等，科学上几乎证明他有罪。但辩护律师揭露了洛杉矶警局的种族歧视历史和证据采集违规。陪审团（多数为黑人）面临选择：基于科学证据定罪，还是通过无罪判决惩罚有种族主义历史的警局、为历史上无数被冤枉的黑人'复仇'？",dilemma:"是应该忠于证据和真相做出可能正确的判决，还是应该利用这次机会向不公正的制度发出信号，即使这可能让真凶逍遥法外？",actual_choice:"陪审团经过不到四小时讨论，判决辛普森无罪。多位陪审员后来承认，他们知道辛普森可能有罪，但判他无罪是对警局种族主义的'报复'。",consequences:"判决引发美国社会撕裂，白人多数认为司法不公，黑人多数为判决欢呼。辛普森虽获自由但身败名裂。这个案例成为'陪审团是否应该基于政治动机而非证据判案'的经典争议。1997年民事诉讼判定辛普森需赔偿3350万美元。",choice_support_a:"支持陪审团：在系统性种族不公面前，这次判决是对历史不公的矫正，社会正义高于个案真相（正义 > 真实）",choice_support_b:"批评判决：司法系统应该只看证据和真相，用错误判决报复制度是对法治的破坏（真实 > 正义）",reflection:"如果你是陪审员，你会基于证据还是基于社会正义考量判案？",impact_score:8.5,controversy_level:9.5},{id:"case_034",value_pair:["life","truth"],direction:"life_over_truth",intuitive_lean:"life",title:"《美丽人生》：把集中营说成一场游戏",real_person:"圭多与儿子乔舒亚（电影《美丽人生》人物）",year:1997,location:"纳粹集中营（电影情境，1997年上映）",context:"在1997年上映的电影《美丽人生》中，犹太父亲圭多与年幼的儿子乔舒亚被送进纳粹集中营。为了让孩子不被恐惧击垮，并配合自己的保护安排，圭多谎称他们正在参加一场游戏：不哭闹、不抱怨饥饿、按规则躲藏，就能积累积分；拿到一千分，便能赢得一辆真正的坦克。这里的谎言不是说给敌人听，而是让自己深爱的孩子相信一个与现实完全不同的故事。",dilemma:"你是这个父亲。你可以告诉孩子，他们被囚禁在一个会杀人的地方，藏好、不出声是为了活命，让他理解真正的危险；但这也可能使他恐慌、失去希望。你也可以编造一场有奖励的游戏，让他带着期待配合藏匿，却使他无法真正理解自己的处境。你会让孩子面对真实，还是用善意的谎言争取保护他生命的机会？",actual_choice:"圭多选择维持游戏的谎言。他不懂德语，却假装翻译看守的命令，把威胁改说成游戏规则。集中营撤离时，他让儿子躲好，告诉他这是赢得坦克前的最后考验，必须等人都离开后才能出来。圭多被看守押走时，还向藏着的儿子做滑稽动作，继续让他相信这只是游戏；随后圭多被杀害。",consequences:"儿子听从了藏匿的安排，活到了第二天。美军坦克进入集中营时，他以为自己真的赢得了奖品，随后与幸存的母亲团聚。电影中的谎言不仅缓解恐惧，也促使孩子保持安静、坚持躲藏，对保护生命起到了实际作用；但他的生还同样依赖父亲的保护和盟军到来，不能归结为谎言单独救了他。成年后的儿子在旁白中理解了父亲的牺牲。",choice_support_a:"保护生命：用游戏和奖品的谎言维持孩子的希望，让他配合藏匿、坚持等待；在极端危机下，可以暂时让他相信虚构的现实，以争取生还的机会（生命 > 真实）",choice_support_b:"面对真实：以孩子能理解的方式说明真正的危险，让他知道为什么必须藏好；不把死亡威胁包装成游戏，即使面对现实可能令他恐惧，也帮助他依据真实处境行动（真实 > 生命）",reflection:"如果一个虚构的故事能让孩子保持希望、配合求生，但会让他无法理解自己面临的真实危险，你会继续维持这个谎言吗？",impact_score:9.5,controversy_level:3},{id:"case_035",value_pair:["faith","safety"],direction:"faith_over_safety",intuitive_lean:"safety",title:"恐袭警报下的马尼拉黑耶稣游行",real_person:"奎阿坡教堂组织者与朝圣信众",year:2012,location:"菲律宾马尼拉",context:"2012年1月，菲律宾总统阿基诺公开警告，情报部门收到恐怖分子可能袭击黑耶稣游行的报告；奎阿坡教堂方面也称收到过包含疑似袭击者姓名的信息。政府和教会都讨论过取消活动，但情报可信度受到质疑，警方搜查没有发现炸弹或爆炸物。面对数百万信众聚集、若袭击发生可能造成大规模伤亡的风险，组织者仍决定举行游行。",dilemma:"当针对数百万人的恐袭警报尚未证实、但一旦成真可能造成重大伤亡时，你会取消或推迟重要的宗教游行，还是在加强安保后继续举行？",actual_choice:"教会组织者没有取消游行。2012年1月9日，数百万信众在大规模警力部署下参加活动；游行持续约22小时，最终没有发生恐怖袭击。",consequences:"游行平安结束，未发生炸弹袭击；但这并不能证明事前风险为零。红十字会为数百名信众处理轻伤、疲劳、脱水和昏厥等情况。事件留下的核心取舍是：维持重要的集体宗教实践，还是避免在未排除恐袭风险时让极大规模人群聚集。",choice_support_a:"坚持举行：对信众而言，黑耶稣节是重要的集体信仰实践；在威胁尚未证实、安保力量已大幅加强时，继续举行并非必然等于漠视生命（信仰 > 公共安全）",choice_support_b:"取消或推迟：数百万人聚集时，即使袭击情报尚不确定，潜在伤亡也可能极其严重；暂缓活动可以避免把公众置于可预防的风险中（公共安全 > 信仰）",reflection:"如果恐袭警报可信度有限，但可能波及数百万参加者，你会坚持举行重要宗教活动，还是先取消以保护公众？",impact_score:8.5,controversy_level:8},{id:"case_036",value_pair:["justice","environment"],direction:"justice_over_environment",intuitive_lean:"justice",title:"印度恒河污染与穷人生计",real_person:"拉吉夫·甘地 (Rajiv Gandhi)",year:1985,location:"印度",context:"1985年，印度政府面临恒河污染危机。主要污染源是小型皮革厂和染色作坊，这些工厂雇佣了数百万贫困工人。环保部门建议强制关闭所有不达标小厂，恢复恒河水质。但这意味着数百万底层工人将失业，他们没有其他谋生技能，将陷入赤贫。总理甘地面临选择：是环保优先还是社会公正优先？",dilemma:"是应该为了恢复圣河生态而关闭污染工厂，即使这会让数百万穷人失业；还是应该保护底层民众生计，即使这意味着继续污染？",actual_choice:"甘地政府采取了渐进政策：对大工厂强制环保要求，但给小作坊更长宽限期和资金支持，避免一刀切导致大规模失业。",consequences:"恒河污染改善缓慢，至今仍是严重问题。但避免了社会动荡和大规模赤贫。这个案例成为'环保与社会公正冲突'的典型：发达国家可以牺牲经济追求环保，但发展中国家的穷人不能为环保付出生存代价。",choice_support_a:"支持社会公正优先：不能让底层民众为环保买单，就业和生存权高于环境（正义/生计 > 环境）",choice_support_b:"坚持环保优先：恒河污染影响数亿人健康，保护环境是对更多人的正义（环境 > 少数人就业）",reflection:"如果关闭污染工厂会让穷人失业，你会强制关闭吗？",impact_score:8,controversy_level:8.5},{id:"case_037",value_pair:["freedom","environment"],direction:"environment_over_freedom",intuitive_lean:"freedom",title:"中国禁摩托车治理雾霾",real_person:"北京市政府",year:2002,location:"中国北京",context:"2002年，北京为治理空气污染决定禁止摩托车上路，后来还限制外地车辆和实施单双号限行。数百万依靠摩托车上班的外来务工人员、送餐员、快递员抗议这侵犯了他们的出行自由。政府坚持认为治理雾霾是公共利益，个人必须做出牺牲。",dilemma:"是应该保障公民自由选择交通工具的权利，还是应该为了集体环境利益限制个人出行自由？",actual_choice:"政府强制执行禁摩令和限行政策，没收了数万辆摩托车。抗议者被驱散，政策严格执行。",consequences:"北京空气质量在后续十年显著改善（当然也有其他因素）。但数十万底层劳动者被迫改变通勤方式，成本和时间大幅增加。批评者认为这是以牺牲底层民众权益为代价的'环保独裁'。",choice_support_a:"批评政策：在没有补偿的情况下剥夺穷人的谋生工具是不公正的，环保不应该由底层买单（自由/公正 > 环境）",choice_support_b:"支持政府：环境污染危及所有人健康，限制少数人的出行自由是必要的（环境 > 自由）",reflection:"为了环保，可以强制限制个人出行自由吗？",impact_score:7.5,controversy_level:8},{id:"case_038",value_pair:["life","safety"],direction:"safety_over_life",intuitive_lean:"safety",title:"2002年莫斯科剧院人质危机",real_person:"弗拉基米尔·普京 (Vladimir Putin)",year:2002,location:"俄罗斯莫斯科",context:"2002年，车臣恐怖分子占领莫斯科剧院，劫持850名人质，威胁引爆炸药。谈判陷入僵局。俄罗斯特种部队有两个选择：继续谈判可能保住更多人质生命，但恐怖分子可能真的引爆炸药；或者强攻，虽然肯定会有人质伤亡，但可以确保不让恐怖分子得逞、震慑未来恐怖主义。",dilemma:"是应该优先保护当前人质生命尽量谈判，还是应该强硬反恐不向恐怖主义妥协，即使这会导致部分人质死亡？",actual_choice:"普京下令强攻。特种部队向剧院释放麻醉气体后冲入，击毙全部恐怖分子，但129名人质因麻醉剂过量死亡。",consequences:"超过120名人质死于军方的麻醉气体，普京拒绝道歉，称'我们拯救了更多人，向恐怖分子展示了俄罗斯不会妥协。'批评者认为政府牺牲了无辜人质；支持者认为这震慑了恐怖主义，保护了长远安全。",choice_support_a:"批评政府：政府的职责是保护公民生命，导致120名人质死亡的决定是失败的（生命 > 安全教训）",choice_support_b:"支持强攻：向恐怖主义妥协会鼓励更多袭击，强硬反恐保护了更多未来生命（公共安全 > 当前部分人生命）",reflection:"如果你是领导人，你会优先拯救眼前人质还是优先震慑未来恐怖主义？",impact_score:9,controversy_level:9},{id:"case_039",value_pair:["justice","freedom"],direction:"freedom_over_justice",intuitive_lean:"freedom",title:"为了让施害者受罚，可以强迫受害者出庭吗？",real_person:"情境改编（参考英国皇家检察署的证人传唤制度）",year:2021,location:"英格兰与威尔士（制度背景）",context:"一名遭受性侵的女性报案后，经过治疗才逐渐恢复生活。开庭前，她明确表示不愿再作证：反复讲述受侵害的过程、接受质询，会让她重新陷入创伤。她没有撤回原来的指控，也没有受到嫌疑人的威胁。检方已评估其他证据及视频作证等保护措施，但这些仍不能消除她的抗拒；缺少她的证言，案件可能无法继续。本情境参考真实制度：在例外情况下，检方可以申请法院传唤不愿作证的受害者，拒不到庭可能导致被捕。",dilemma:"假如你负责这起案件：为了让施害者接受审判，你是否会申请强制传唤，要求她违背自己的意愿再次讲述创伤？还是尊重她停止参与的决定，承受案件可能无法继续、施害者可能逃脱追究的结果？",actual_choice:"英国皇家检察署的制度允许检方在例外情况下申请法院传唤不愿作证的受害者，拒不到庭可能导致被捕。现在由你决定：申请强制出庭，还是尊重受害者的拒绝。",consequences:"强制出庭可能使追诉得以继续，却会再次剥夺受害者对自身经历的控制，并可能加重创伤；不强制出庭能尊重她的自主决定，却可能失去追究犯罪的关键证据。出庭不保证定罪，不出庭也不自动等于撤案。",choice_support_a:"申请强制出庭：在其他取证和保护办法已经评估后，为了追究严重犯罪，仍要求她作证，即使这违背她的意愿（正义 > 自由）",choice_support_b:"不申请强制出庭：尊重她停止参与诉讼的自主决定，即使案件可能因此无法继续（自由 > 正义）",reflection:"她已经被剥夺过一次自主权。为了替她伸张正义，你能否再次要求她承受自己明确拒绝的事情？",impact_score:9.5,controversy_level:9},{id:"case_040",value_pair:["faith","environment"],direction:"environment_over_faith",intuitive_lean:"environment",title:"圣山朝圣与生态破坏",real_person:"冈仁波齐环保争议",year:2015,location:"中国西藏",context:"冈仁波齐是藏传佛教、印度教等多个宗教的圣山，每年数万信徒前来转山朝圣。但大量朝圣者产生的垃圾、排泄物、踩踏等行为严重破坏了高原脆弱生态，稀有植物消失，野生动物迁离。环保组织建议限制朝圣人数、划定核心保护区禁止进入。但宗教领袖和信众认为朝圣是信仰核心，限制朝圣等于剥夺宗教自由。",dilemma:"是应该为了保护脆弱的高原生态系统而限制宗教朝圣活动，还是应该尊重宗教自由允许朝圣继续，即使这会持续破坏环境？",actual_choice:"政府采取了折中方案：允许朝圣但要求自带垃圾下山，建立环保厕所，限制单日朝圣人数上限，核心区禁止扎营。部分宗教人士配合，但仍有信徒认为这是对信仰的亵渎。",consequences:"环境破坏速度减缓但未根本解决。一些虔诚信徒因为限制措施无法完成理想中的朝圣而遗憾。这个案例展示了宗教活动与环境保护的长期张力。",choice_support_a:"支持宗教自由：信仰自由是基本人权，不应该因为环保而限制宗教朝圣，应该通过教育和技术解决环境问题（信仰 > 环境管制）",choice_support_b:"支持环保限制：高原生态极其脆弱且不可逆转，保护环境应该优先于宗教活动便利（环境 > 信仰便利）",reflection:"如果你的宗教活动会破坏珍贵生态，你接受被限制吗？",impact_score:7,controversy_level:7.5},{id:"case_041",value_pair:["loyalty","environment"],direction:"environment_over_loyalty",intuitive_lean:"environment",title:"大众汽车排放门内部举报",real_person:"大众汽车工程师（匿名）",year:2015,location:"德国",context:"2015年，大众汽车工程师发现公司在柴油车上安装作弊软件，测试时显示达标但实际排放超标40倍，每年排放近100万吨超量污染物。这名工程师为大众工作多年，同事都是朋友。他面临选择：对公司忠诚保持沉默，还是举报公司欺诈、保护环境和公众健康？",dilemma:"是应该忠于雇主和同事保守秘密，还是应该为了环境和公众利益揭露企业犯罪？",actual_choice:"这名工程师（身份至今保密）选择了匿名向美国环保署举报。检测确认了作弊行为。",consequences:"大众汽车丑闻曝光，面临250亿美元罚款，CEO辞职，股价暴跌。但举报者在公司内部被视为叛徒，若身份泄露可能面临报复。全球召回1100万辆作弊车辆，避免了持续的环境污染。",choice_support_a:"理解保密：向外界举报而非内部解决是对同事的背叛，让数万员工失业（忠诚 > 环保举报）",choice_support_b:"支持举报者：企业犯罪必须被揭露，保护环境和公众健康高于对公司的忠诚（环境 > 忠诚）",reflection:"如果你发现雇主在造假污染环境，你会举报吗？",impact_score:8.5,controversy_level:6.5},{id:"case_042",value_pair:["faith","justice"],direction:"faith_over_justice",intuitive_lean:"justice",title:"顾顺章叛变后的决定",real_person:"周恩来与中央特科",year:1931,location:"中国上海",context:"1931年，中央特科领导人顾顺章被捕后叛变，向国民党当局供出地下组织的大量机密，并协助搜捕昔日同志。组织紧急转移，未能及时撤离的人可能被捕和处决。顾顺章的家属及身边人员中有人接触过地下工作、了解部分秘密，但没有证据证明每个人都参与了叛变，有些人只是他的亲属。",dilemma:"你是地下组织负责人，必须决定如何处置顾顺章的家属和身边人员。坚持正义，意味着只能惩罚有证据证明参与叛变的人，不得因亲属关系或潜在风险处死未经审判、尚未实施背叛的人，即使放走他们可能使更多同志暴露；坚持信仰，意味着相信共产主义革命关系千百万人的未来，为保存革命力量，可以牺牲少数个人，包括尚未实际背叛但可能泄密的人。",actual_choice:"周恩来负责领导中央特科执行了中共中央处置顾顺章家属的决定。根据当时报刊记录及后来的考证，遇害者通常被认为包括顾顺章的妻子张杏华、岳父母张阿桃和张陆氏、妻妹张爱宝、哥哥顾维桢、嫂子吴韶兰、吴韶兰的弟弟吴克昌及其妻、妻子的表妹叶小妹，以及一名姓名不详的男佣；个别姓名和身份在不同材料中有出入。他们未经逐一审判即被杀害并秘密掩埋。两名年幼孩子顾利群和顾益群没有被杀，随后被送走。周恩来后来整理的《大事记》记载：“中央决定消灭顾顺章家属10人。”现有材料不足以证明周恩来亲自处决了具体人员。",consequences:"这项决定把组织安全和革命事业置于对个人逐一调查、审判之上，亲属关系与潜在泄密风险也成为致命理由。顾顺章叛变造成的破坏没有太大争议，但有关遇害人数、死者是否掌握机密以及决策和执行细节，不同材料仍有差异。",choice_support_a:"坚持信仰：共产主义革命关系千百万人的未来。为了保存革命力量，可以牺牲少数个人，包括尚未实际背叛、但可能泄密的人（信仰 ＞ 正义）",choice_support_b:"坚持正义：只能惩罚能够证明参与叛变的人。不得因亲属关系或潜在风险处死未经审判、尚未实施背叛的人，即使放走他们可能使更多同志牺牲（正义 ＞ 信仰）",reflection:"如果你相信革命最终能够解放千百万人，你是否有权为了它，处死几个尚未被证明有罪的人？",impact_score:9.5,controversy_level:9},{id:"case_043",value_pair:["family","loyalty"],direction:"family_over_loyalty",intuitive_lean:"family",title:"易牙杀子迎合齐桓公",real_person:"易牙、齐桓公与管仲（古籍记载）",year:-645,location:"齐国（前645年为管仲临终评价之年，杀子年份不详）",context:"《史记·齐太公世家》记载，管仲病重时，齐桓公询问易牙是否可以担任国相。管仲回答：‘杀子以适君，非人情，不可。’易牙曾杀死自己的儿子来迎合君主，把至亲作为取悦君主的代价。《大学衍义》后来将桓公的想法解释为：一个人连自己的儿子都不偏爱，必定能够忠于我。这是后世评论对君主心理的解释，并不能证明易牙真心忠诚，也不能据此断言桓公曾下令杀子。",dilemma:"假设你是这位臣子，并把对君主的忠诚理解为：君主的意愿应高于自己的一切私人牵挂。当这种效忠走到牺牲亲生孩子的地步，你会保护孩子，承认亲情是不能跨越的界限；还是认为既然忠诚高于亲情，就不能只在代价较小时坚持它？这不是君主下令的史实复述，而是借易牙的行为追问绝对忠诚的边界。",actual_choice:"古籍记述中的易牙选择了杀子以迎合齐桓公。管仲没有把这种牺牲看成可靠忠诚的证明，而是据此劝桓公不要任用他。管仲死后，桓公没有听从劝告，仍然亲近易牙等人。这里能够确认的是古籍如何记述和评价他的行为，不能把迎合、求宠直接等同于忠诚。",consequences:"故事中，孩子成为父亲迎合君主的牺牲品，亲子关系被不可逆地摧毁。《史记》还记载，桓公死后，易牙与竖刀参与杀群吏、立公子无诡。但即使不考虑他后来的行为，问题也已经存在：为了君主牺牲自己的孩子，能否因为被称为忠诚就获得正当性？案例不要求你预先知道易牙后来会做什么。",choice_support_a:"选择亲情：保护自己的孩子，拒绝把至亲作为效忠的代价；即使君主因此认为自己有所保留，也不以毁掉亲子关系来证明忠诚（亲情 > 忠诚）",choice_support_b:"选择绝对忠诚：如果对君主的效忠确实高于亲情，就应让君主的意愿优先，即使必须牺牲至亲；不能因为代价落到自己的孩子身上，就为原本无条件的忠诚设置例外（忠诚 > 亲情）",reflection:"你认为忠诚高于亲情时，这个排序是否也适用于牺牲自己的孩子？如果不适用，是亲情更重要，还是忠诚本来就不应意味着无条件迎合？",impact_score:8.5,controversy_level:6},{id:"case_044",value_pair:["family","safety"],direction:"family_over_safety",intuitive_lean:"family",title:"《最后生还者》：用女儿换取疫苗的希望？",real_person:"乔尔与艾莉（游戏《最后生还者》人物）",year:2013,location:"美国盐湖城",context:"2013年发行的游戏《最后生还者》中，真菌感染摧毁了社会，大量人变成感染者，幸存者长期生活在死亡威胁之下。乔尔曾在灾难中失去亲生女儿，后来护送具有免疫能力的少女艾莉穿越美国。两人没有血缘关系，却在相依为命中形成了父女般的感情。到达盐湖城医院后，火萤组织告诉乔尔：他们准备取出艾莉脑内的变异感染组织，用于研制疫苗，但手术会杀死她。",dilemma:"你已经把这个孩子当作自己的女儿，现在医生告诉你，她的免疫机制可能带来疫苗，让无数人免受感染；代价是她必须死在手术台上。你会允许手术，承受再次失去女儿的痛苦；还是救走她，即使这会中断眼前的疫苗研究、放弃保护更多人的希望？手术会夺走她的生命，但疫苗能否成功并不是你已经掌握的保证。",actual_choice:"乔尔没有接受这个代价。他闯入手术室，杀死阻挡他的主刀医生，抱走尚未醒来的艾莉；随后杀死试图阻止他带走艾莉的火萤领袖玛琳。艾莉醒来后，他隐瞒了手术和救人的经过，谎称火萤已经放弃寻找疫苗。",consequences:"艾莉活了下来，乔尔没有再次失去视如女儿的亲人，但火萤在这家医院研制疫苗的计划被中断，感染仍然威胁着其他幸存者。他救下了眼前的孩子，却放弃了利用她的免疫机制保护更多人的机会；这不等于疫苗原本必然成功，也不等于公众的损失可以被忽略。",choice_support_a:"救走女儿：艾莉已经是你的家人，不能把她的死亡当作保护公众的代价；即使放弃研制疫苗的希望，也要让她活着离开医院（亲情 > 公共安全）",choice_support_b:"允许手术：感染仍在威胁无数人的生命，不能只因为她是自己的女儿就放弃疫苗研究；即使失去她，也要保留保护更多人的希望（公共安全 > 亲情）",reflection:"如果拯救公众的希望，需要你视如亲生女儿的孩子死去，你还愿意把公共安全放在亲情之前吗？",impact_score:10,controversy_level:9.5},{id:"case_103",value_pair:["family","truth"],direction:"truth_over_family",intuitive_lean:"truth",title:"朴延美公开家庭创伤",real_person:"朴延美 (Yeonmi Park)",year:2014,location:"美国",context:"北朝鲜脱北者朴延美在2014年决定向全世界讲述自己的逃亡故事，包括极度私密的家庭苦难：她的母亲在逃亡途中被人贩子强奸，她本人13岁时被性侵，父亲在中国死于肠癌无法得到治疗。她的母亲恳求她：'这些事太羞耻了，不要告诉全世界。我们已经自由了，为什么要让所有人知道我们的屈辱？这会毁掉我的尊严，也会让你妹妹（还在北朝鲜）面临危险。'但朴延美认为：如果不说出真相，世界就不会了解北朝鲜人民的真实苦难，独裁政权将继续迫害数百万人。",dilemma:"是应该为了保护母亲尊严和家人隐私而隐瞒这些极度私密的创伤，还是应该不顾家人反对公开一切，让世界了解真相？",actual_choice:"朴延美在2014年都柏林青年峰会上公开演讲，详细讲述了母亲被强奸、自己被性侵等极度私密的经历。她还出版了回忆录《为了活下去》，毫不保留地揭露了所有细节。",consequences:"她的演讲视频被观看数千万次，《为了活下去》成为畅销书，让全球关注北朝鲜人权。但她的母亲陷入深深的羞愧，多次哭泣说'我的屈辱被全世界知道了'。她在北朝鲜的妹妹处境更危险。一些韩国人和脱北者社区批评她'为了出名出卖家人隐私'。她的家庭为此付出了巨大的情感代价，但北朝鲜的真相得以传播。",choice_support_a:"理解母亲：性侵是极度私密的创伤，受害者有权选择不公开。没有人应该被迫牺牲家人尊严去当'人权斗士'（家庭尊严 > 真相传播）",choice_support_b:"支持公开：北朝鲜独裁政权的残暴必须被揭露，数百万人的苦难需要世界关注。个人隐私在这样的历史使命面前应该让步（真相/人权 > 家庭隐私）",reflection:"如果公开真相需要暴露你母亲被强奸、你自己被性侵的细节，并且母亲哭求你不要说，你会为了更大的使命说出来吗？",impact_score:9.5,controversy_level:7.5},{id:"case_062",value_pair:["family","truth"],direction:"family_over_truth",intuitive_lean:"family",title:"伽利略坚持日心说害苦女儿",real_person:"伽利略·伽利雷 (Galileo Galilei)",year:1633,location:"意大利佛罗伦萨",context:"天文学家伽利略通过望远镜观测证实了日心说（地球围绕太阳转），这是科学事实真相。但罗马教廷认为这违背《圣经》，是异端邪说。伽利略的女儿维吉尼亚（修女玛利亚·切莱斯特）在修道院中因父亲的'异端'学说遭受巨大痛苦：其他修女疏远她，神父在弥撒时暗示她'父亲是魔鬼的仆人'，她每天在恐惧和羞辱中煎熬。她在信中哭着恳求父亲：'爸爸，求您了，就说地球不动吧。说句违心的话，能让您平安，也能让我不再被羞辱。科学真相真的那么重要吗？我快承受不住了...'",dilemma:"是应该为了女儿的安宁说一句违心的话（'地球不动'），还是应该坚持科学事实真相，即使这会让女儿继续在修道院受苦？",actual_choice:"1633年，伽利略在宗教法庭的压力下短暂宣布'地球不动'。但1632年他出版了《关于托勒密和哥白尼两大世界体系的对话》，实质上仍在坚持日心说。最终他被判软禁。",consequences:"伽利略被软禁后，维吉尼亚的处境更加艰难。她在修道院中被完全孤立，精神和身体健康急剧恶化，1634年（父亲被判软禁仅1年后）在痛苦和忧郁中去世，年仅33岁。伽利略收到女儿死讯后悲痛欲绝，在给朋友的信中写道：'我失去了我最亲爱的女儿，她为我的科学追求付出了生命。'但他的坚持最终推动了科学革命，日心说成为现代天文学基础。女儿的牺牲换来了人类对宇宙真相的认知。",choice_support_a:"同情女儿：一个科学理论（即使是真的）值得让你女儿在羞辱和恐惧中死去吗？说句'地球不动'的违心话，女儿就能平安生活。真相可以等，女儿的生命不能等（家人生命 > 科学真相）",choice_support_b:"理解伽利略：如果科学家都因为家人压力而放弃真理，人类就永远活在谎言中。他的女儿也不会希望父亲为了她而背叛科学。真理高于一切（科学真相 > 个人家庭）",reflection:"如果坚持科学真相会让你的女儿在修道院被羞辱折磨至死，而说一句违心的话就能救她，你会怎么选？",impact_score:9.5,controversy_level:8},{id:"case_048",value_pair:["faith","freedom"],direction:"faith_over_freedom",intuitive_lean:"faith",title:"苏格拉底拒绝越狱",real_person:"苏格拉底（柏拉图《克力同》中的人物）",year:-399,location:"古希腊雅典",context:"在柏拉图的哲学对话《克力同》中，苏格拉底被雅典法庭判处死刑，关押在等待执行的监狱里。朋友克力同带来已经安排好的越狱方案：只要苏格拉底答应逃走，就能离开雅典，到别的城邦继续生活和教学。苏格拉底认为判决对自己不公，但他一生生活在雅典、享受城邦法律带来的秩序与保护，也因此对法律和共同体承担了承诺。",dilemma:"既然判决可能是不公正的，而朋友已经安排好逃走的机会，你是应该保住生命和继续生活教学的自由，还是应该坚持对法律、城邦承诺和正义原则的信念，接受即将执行的判决？",actual_choice:"苏格拉底拒绝越狱。他认为不能因为自己受到不公正对待，就用违法和背弃承诺来回应；公民可以尝试说服城邦改变决定，但不能在判决不利时单方面撕毁与法律的约定。",consequences:"苏格拉底留在雅典并接受死刑，失去了继续生活、教学和选择居所的自由。《克力同》由此留下一个持续争议的问题：公民对法律和共同体的承诺，是否可能重要到值得用自己的生命和自由来维护？",choice_support_a:"支持苏格拉底：如果原则只在对自己有利时才需要遵守，它就不是原则。即使判决不公，也不能用逃跑和背约摧毁对法律与正义的承诺（法律与正义 > 个人自由）",choice_support_b:"支持越狱：错误的判决不能因为披着法律外衣就获得服从。苏格拉底应保住生命和思想，继续在别处生活、教学，并保留反抗不公的自由（自由 > 法律承诺）",reflection:"如果你确信判决不公，而朋友已经为你安排好逃走的机会，你会为了守住对法律和共同体的承诺放弃自由吗？",impact_score:9,controversy_level:9},{id:"case_051",value_pair:["environment","truth"],direction:"environment_over_truth",intuitive_lean:"environment",title:"夜鹦鹉栖息地位置保密",real_person:"昆士兰夜鹦鹉恢复团队与保育机构",year:2013,location:"澳大利亚昆士兰州",context:"2013年，研究人员在昆士兰重新发现极为稀少的夜鹦鹉种群。由于鸟类数量极少、栖息地容易受干扰，保育团队决定不公开精确发现地点，并暂缓公开部分叫声录音，以降低观鸟者干扰和盗捕风险。精确位置与录音若能广泛共享，有助于独立研究、核实分布并寻找新种群；但也可能让脆弱栖息地暴露。后来当地建立保护区并限制进入，团队才逐步公开部分录音和生态资料。",dilemma:"为了保护刚发现的极危物种，是否应暂时隐去精确坐标和部分研究资料，即使这会限制公开核验和其他研究者寻找新种群？",actual_choice:"保育团队起初对公众隐去精确地点并限制敏感资料；在保护措施建立后，逐步公开部分叫声录音和生态信息。",consequences:"保密降低了发现点立即受到干扰的风险，但也限制了精确资料的公开使用。保护措施建立后，公开的录音帮助研究者在其他地点发现了新的夜鹦鹉种群，显示资料开放也能带来重要的保护收益。",choice_support_a:"倾向环保：对极少数、易受干扰的动物，先保护栖息地再公开精确坐标，可以避免求知和观赏需求伤害物种（环境保护优先）",choice_support_b:"倾向真实：精确记录和研究资料应尽可能接受独立核验；过度保密会限制科学复查，也可能延缓发现其他种群（开放求证优先）",reflection:"当公开精确资料有助于科学核验和新发现、却可能暴露脆弱物种时，你会如何决定公开的范围与时机？",impact_score:8.5,controversy_level:7.5},{id:"case_053",value_pair:["faith","environment"],direction:"faith_over_environment",intuitive_lean:"environment",title:"阿米什人拒绝环保法规",real_person:"阿米什社区 (Amish Community)",year:2018,location:"美国宾夕法尼亚",context:"2018年，宾州政府要求所有农场安装现代化污水处理系统以保护水源。阿米什人是拒绝现代科技的基督教派，他们的信仰要求过简朴生活、拒绝电力和现代设备。政府威胁：不安装污水系统就关闭农场。阿米什人认为这违背了他们两百年的信仰传统。",dilemma:"是应该为了保护环境而强制宗教社群使用现代科技，还是应该尊重宗教信仰自由，即使这可能造成环境污染？",actual_choice:"阿米什人拒绝安装现代污水系统。他们表示：'我们宁愿失去农场，也不能背叛上帝和祖先的生活方式。'最终法院判决他们可以使用传统方法处理污水，但需要更频繁的检查。",consequences:"阿米什人保持了信仰传统，但当地水质监测压力增加。环保组织批评这是对落后习俗的妥协。阿米什社区则认为他们的传统生活方式比现代农业更环保，只是不符合政府标准。",choice_support_a:"支持阿米什：宗教信仰自由是基本人权，政府不应该强迫宗教群体改变生活方式（信仰 > 环境规制）",choice_support_b:"支持环保法规：保护水源关系所有人健康，宗教信仰不能成为污染环境的借口（环境 > 信仰特权）",reflection:"如果你的信仰生活方式被认定为不环保，你会妥协吗？",impact_score:7,controversy_level:7.5},{id:"case_054",value_pair:["family","environment"],direction:"family_over_environment",intuitive_lean:"family",title:"为治病子女的父母非法采药",real_person:"王某（化名）",year:2016,location:"中国四川",context:"2016年，四川农民王某的女儿患罕见疾病，唯一有效的药材是野生雪莲，生长在海拔4000米的保护区。采挖野生雪莲是重罪（破坏濒危植物）。孩子病情恶化，王某偷偷进入保护区采药。护林员发现后，王某跪地恳求：'这是救我女儿命的唯一办法。'",dilemma:"是应该为了保护濒危植物严惩非法采药者，还是应该理解父母为救子女铤而走险的绝境？",actual_choice:"王某冒险采到了雪莲，女儿病情稳定。但他被逮捕判刑三年。法院判决：'同情你的处境，但法律面前人人平等，保护生态是全民责任。'",consequences:"女儿得救，但失去父亲三年。环保组织表示如果为此开先例，保护区将被盗采一空。王某妻子在法庭上痛哭：'法律没有人情，只有我们家人才知道那种绝望。'",choice_support_a:"理解王某：为了救子女的生命，父母可以铤而走险，家人生命高于环保规则（家庭 > 环境）",choice_support_b:"支持判决：保护生态是为了全人类未来，不能因个案破坏法律，否则保护区将被毁（环境 > 个人家庭）",reflection:"如果是你的孩子濒危，你会非法采药吗？",impact_score:8.5,controversy_level:8},{id:"case_055",value_pair:["freedom","environment"],direction:"freedom_over_environment",intuitive_lean:"environment",title:"特斯拉反对加州零排放强制令",real_person:"加州电动车争议",year:2022,location:"美国加州",context:"2022年，加州通过法律：2035年禁止销售新燃油车，强制全面电动化。许多车主和自由主义者抗议：政府无权规定公民买什么车，这侵犯消费自由。环保派反驳：气候危机紧急，必须强制转型。反对者：'就算环保重要，也不能剥夺我选择的权利。'",dilemma:"是应该为了应对气候变化强制淘汰燃油车，还是应该尊重消费者选择自由，让市场自然演进？",actual_choice:"加州州长签署了禁令。大量车主发起诉讼，认为这违反宪法自由权。诉讼至今仍在进行，但禁令暂未推翻。",consequences:"加州成为美国环保先锋，但也引发巨大争议。支持者说这是必要的；反对者说这是'环保专制'。许多人考虑搬离加州以保留购车自由。这成为自由vs环保的标志性案例。",choice_support_a:"反对禁令：即使为了环保，政府也无权强制公民的消费选择，自由高于环保强制（自由 > 环境管制）",choice_support_b:"支持禁令：面对气候危机，必须采取强制措施，个人消费自由不应阻碍拯救地球（环境 > 消费自由）",reflection:"如果政府为了环保禁止你购买某类商品，你接受吗？",impact_score:7.5,controversy_level:8.5},{id:"case_056",value_pair:["justice","environment"],direction:"environment_over_justice",intuitive_lean:"justice",title:"切尔诺贝利石棺工人被迫参与",real_person:"苏联清理工",year:1986,location:"苏联乌克兰",context:"1986年切尔诺贝利核事故后，苏联政府征召60万士兵和工人清理核污染、建造石棺。政府隐瞒了真实辐射水平，许多人在不知情的情况下受到致命辐射。但如果不立即封堵，整个欧洲将受核污染威胁。政府选择牺牲清理工的知情权和生命，以保护更大范围的环境。",dilemma:"是应该告知工人真实危险、给予拒绝权（可能导致无人参与、污染扩散），还是应该隐瞒信息强制征召以保护更大环境（但这不公正）？",actual_choice:"苏联政府隐瞒辐射真相，以'爱国任务'名义强制征召。清理工被告知'很安全'，实际上许多人接受了致命剂量辐射。",consequences:"石棺成功封堵，避免了更大灾难，欧洲免于核污染。但数万清理工患癌症或死亡，他们的知情权和生命被牺牲。幸存者至今认为政府欺骗并谋杀了他们。",choice_support_a:"批评政府：即使为了环境，也不能欺骗和强迫人们送死，这违背基本正义（正义 > 环境）",choice_support_b:"理解政府：在极端危机下，牺牲少数人保护数百万人和环境是必要的恶（环境/公共安全 > 个体正义）",reflection:"如果隐瞒真相可以让更多人参与拯救环境，你支持欺骗吗？",impact_score:9.5,controversy_level:8.5},{id:"case_057",value_pair:["life","environment"],direction:"environment_over_life",intuitive_lean:"life",title:"印度鼠患vs使用毒药",real_person:"印度环保组织",year:2019,location:"印度",context:"2019年印度爆发鼠患，鼠类传播疾病已致数千人死亡。政府计划大规模投放灭鼠药。环保组织阻止：灭鼠药会毒害生态系统，导致食物链上的鹰、蛇等动物死亡，破坏生态平衡。但如不灭鼠，疫情将扩散，更多人会死。这是'杀鼠药或死人'的选择。",dilemma:"是应该为了保护生态系统禁用灭鼠药，即使这会导致更多人类死于鼠疫；还是应该使用灭鼠药拯救人命，即使破坏生态？",actual_choice:"环保组织坚持抗议，政府妥协改用人工捕鼠。但效率太低，鼠患持续扩散，又有数百人死亡。最终政府不顾抗议使用了灭鼠药。",consequences:"鼠患被控制，疫情结束。但大量猛禽和蛇因误食中毒鼠而死亡，生态受损。环保组织说：'你们为了眼前利益毁了生态。'政府说：'人命才是第一位的。'",choice_support_a:"支持政府：人类生命高于其他物种和生态平衡，拯救人命是首要责任（生命 > 环境）",choice_support_b:"支持环保组织：破坏生态系统会导致更长远的灾难，应该用可持续方法而非毒药（环境 > 眼前人命）",reflection:"如果杀虫剂能救人但会毁坏生态，你会使用吗？",impact_score:8,controversy_level:8.5},{id:"case_058",value_pair:["loyalty","environment"],direction:"loyalty_over_environment",intuitive_lean:"loyalty",title:"煤矿工人保护岗位反对转型",real_person:"美国煤矿工人工会",year:2020,location:"美国西弗吉尼亚",context:"2020年，美国政府推动能源转型，计划关闭煤矿改用清洁能源。煤矿工人世代以采煤为生，面对失业威胁，工会领袖呼吁工人与煤矿企业站在一起，反对环保政策。一些年轻工人纠结：明知采煤污染环境，但背叛自己的工会和工友去支持关闭煤矿，这是对同志的背叛。",dilemma:"是应该忠于工会和工友，反对关闭煤矿（即使这损害环境）；还是应该为了环境支持转型，即使这意味着背叛工友？",actual_choice:"大多数煤矿工人选择了忠诚，集体抗议反对关闭煤矿。他们的口号是：'我们不能背叛养活了我们三代人的行业。'虽然他们也知道煤炭污染环境。",consequences:"工人团结赢得了短期让步，部分煤矿延缓关闭。但长期来看，煤炭行业仍在衰退，工人最终失业。批评者说工人短视；工人说：'你们这些环保精英不理解我们的生存困境。'",choice_support_a:"理解工人：对工会和工友的忠诚是工人阶级的脊梁，不能为了抽象的环保背叛同志（忠诚 > 环境）",choice_support_b:"批评工人：面对气候危机，保护地球比保护落后产业更重要，应该支持转型而非抱残守缺（环境 > 行业忠诚）",reflection:"如果你的职业损害环境，你会支持淘汰自己的行业吗？",impact_score:7.5,controversy_level:8},{id:"case_060",value_pair:["truth","environment"],direction:"environment_over_truth",intuitive_lean:"environment",title:"隐瞒新能源汽车污染真相",real_person:"电动车电池污染争议",year:2023,location:"全球",context:"2023年，独立研究发现：电动车电池生产过程产生的污染（锂矿开采、重金属污染）比宣传的严重得多，某些指标甚至不比燃油车环保。但环保组织和政府担心：公开这些数据会打击电动车推广，阻碍能源转型。一些科学家被施压不要发表研究。",dilemma:"是应该公开电动车污染真相，即使这会阻碍环保转型；还是应该隐瞒不利数据，为了推动'更大的环保事业'？",actual_choice:"主流媒体选择淡化报道这些研究，继续宣传电动车的环保优势。政府也没有公开讨论电池污染问题。",consequences:"电动车继续快速普及，化石燃料消耗减少。但锂矿开采地（南美、非洲）的生态破坏加剧，当地居民健康受影响。批评者指责这是'为了环保目的而隐瞒环境真相'的讽刺。",choice_support_a:"支持公开真相：科学真相不应该为政治目的服务，隐瞒污染数据是欺骗公众（真实 > 环保政策）",choice_support_b:"理解淡化处理：电动车整体上仍比燃油车好，过分强调电池污染会阻碍必要的转型（环境大局 > 细节真相）",reflection:"如果公开真相会阻碍环保政策，你会隐瞒吗？",impact_score:8,controversy_level:9},{id:"case_061",value_pair:["faith","freedom"],direction:"faith_over_freedom",intuitive_lean:"freedom",title:"伊朗妇女因脱头巾被捕",real_person:"玛莎·阿米尼 (Mahsa Amini)",year:2022,location:"伊朗德黑兰",context:"2022年，22岁的伊朗女孩玛莎因头巾戴得'不够严实'被道德警察逮捕，在拘留所死亡。伊朗政府坚持强制头巾法：这是伊斯兰教法的要求，保护宗教价值观高于个人自由。玛莎的家人和全球抗议者认为：宗教信仰不能剥夺女性的着装自由。",dilemma:"是应该强制执行宗教着装规范以维护信仰传统，还是应该允许个人自由选择，即使这违背宗教法规？",actual_choice:"伊朗政府坚持头巾法，认为这是维护伊斯兰信仰的核心。玛莎的死引发全国抗议，但政府镇压示威，继续执行头巾法。",consequences:"玛莎成为反头巾法运动的象征，全球声援。伊朗政府逮捕了数千抗议者。保守派认为西方在煽动推翻伊斯兰信仰；改革派认为这是专制而非信仰。冲突至今持续。",choice_support_a:"支持政府：伊斯兰国家有权按教法治理，宗教信仰是社会基础，不能被世俗自由侵蚀（信仰 > 自由）",choice_support_b:"支持抗议者：强迫妇女穿戴是压迫，真正的信仰应该是自愿的，不应该用暴力强制（自由 > 强制信仰）",reflection:"如果宗教法律限制你的基本自由，你会服从还是反抗？",impact_score:9.5,controversy_level:9.5},{id:"case_065",value_pair:["justice","life"],direction:"life_over_justice",intuitive_lean:"life",title:"沙利特换俘：用1027名囚犯换回一名士兵？",real_person:"吉拉德·沙利特（以色列士兵）与以色列政府",year:2011,location:"以色列 / 加沙地带",context:"2006年，19岁的以色列士兵吉拉德·沙利特被哈马斯俘虏，此后被关押了五年多。谈判中，对方提出条件：释放沙利特，以色列须释放1027名巴勒斯坦囚犯。这些囚犯中，约280人因参与或策划致命袭击被判终身监禁。许多遇难者家属强烈反对交换：这些人已经受过审判，释放他们等于撤销原本应当执行的惩罚。但沙利特仍然活着。如果拒绝交易，他可能继续被囚禁，甚至死在囚禁中。",dilemma:"你是最终决策者。拒绝交换，已经定罪的人必须服完刑期，不能为了一个人的生命，取消对数百名重罪犯的惩罚；接受交换，就要减免并终止这些人的刑罚，把沙利特活着带回家。你会怎么选？",actual_choice:"2011年，以色列政府最终接受了交换。同年10月沙利特获释回国，1027名巴勒斯坦囚犯分10月和12月两批获释。",consequences:"沙利特在被关押五年多后活着回到家人身边。这个选择在以色列社会引发激烈争议：支持者认为国家有责任把自己的士兵活着带回家，反对者和许多遇难者家属则认为，这让已经定罪的袭击者逃脱了应得的惩罚。",choice_support_a:"拒绝交换：已经定罪的人必须服完刑期，不能为了一个人的生命，取消对数百名重罪犯的惩罚（正义 > 生命）",choice_support_b:"接受交换：减免并终止这些人的刑罚，把一个仍然活着的无辜者带回家（生命 > 正义）",reflection:"当正义要求有罪者继续受罚，而减免他们的惩罚可以立刻救回一个无辜者时，你还会坚持“正义高于生命”吗？",impact_score:9.5,controversy_level:9.5},{id:"case_066",value_pair:["faith","life"],direction:"faith_over_life",intuitive_lean:"faith",title:"圣马克西米利安·科尔贝代替陌生人赴死",real_person:"圣马克西米利安·科尔贝 (Maximilian Kolbe)",year:1941,location:"波兰奥斯维辛集中营",context:"1941年7月，奥斯维辛集中营有一名囚犯逃跑。作为惩罚，纳粹随机选出10名囚犯处以饿死。其中一名叫弗朗西斯·加约尼塞克的波兰士兵哭喊：'我的妻子！我的孩子们！'47岁的波兰天主教神父马克西米利安·科尔贝主动站出来，请求代替这个陌生人去死。",dilemma:"是为了自己的生存保持沉默，还是为了信仰中的爱与牺牲精神，主动替陌生人赴死？",actual_choice:"科尔贝神父坚持要求替换。纳粹同意了。他和其他9人被关进饿死牢房。",consequences:"科尔贝在牢房中领导祷告，安慰其他囚犯，最后是唯一活到第14天的人。纳粹给他注射毒针处死。弗朗西斯·加约尼塞克活到了战后，见证了自己的孩子和孙子出生。科尔贝被封为圣人，成为无私牺牲的象征。",choice_support_a:"支持科尔贝：为信仰而牺牲自己拯救陌生人的生命，这是基督之爱的最高体现，比生存本能更崇高（信仰 > 生命）",choice_support_b:"质疑科尔贝：虽然高尚，但每个生命都同等珍贵，主动赴死不是理性的选择，活着可以帮助更多人（生命 > 信仰）",reflection:"如果你能救一个陌生人的命，代价是你自己必死，你会这样做吗？",impact_score:10,controversy_level:7},{id:"case_067",value_pair:["faith","loyalty"],direction:"loyalty_over_faith",intuitive_lean:"loyalty",title:"德特里希·朋霍费尔刺杀希特勒计划",real_person:"德特里希·朋霍费尔 (Dietrich Bonhoeffer)",year:1943,location:"德国柏林",context:"1943年，德国路德教会牧师朋霍费尔加入了刺杀希特勒的秘密抵抗组织。作为虔诚的基督徒，他一生信奉'不可杀人'的诫命。但面对纳粹屠杀数百万犹太人的暴行，他陷入了深刻的道德困境：是坚守宗教信仰的非暴力原则，还是忠于人类良心参与刺杀暴君？",dilemma:"信仰要求不可杀人，但忠诚于受苦者要求采取行动阻止更大的恶。是遵守宗教戒律，还是违背信条去拯救生命？",actual_choice:"朋霍费尔选择参与刺杀计划。他说：'当疯子驾车冲向人群时，牧师的职责不仅是安慰伤者，更要拉下方向盘。'",consequences:"1943年刺杀计划失败，朋霍费尔被捕。1945年4月9日，在纳粹德国投降前23天，他在集中营被绞死，年仅39岁。但他的神学思想和道德勇气影响了几代人。",choice_support_a:"质疑朋霍费尔：基督教的核心是非暴力和爱敌人，即使面对希特勒也不应该杀人，应该相信上帝的审判（信仰 > 忠诚）",choice_support_b:"支持朋霍费尔：面对极端邪恶，机械地遵守教条是懦弱的，真正的忠诚是承担罪责去阻止更大的恶（忠诚 > 教条信仰）",reflection:"如果杀死一个暴君能拯救百万人，但违背你的宗教信仰，你会这样做吗？",impact_score:9.5,controversy_level:8.5},{id:"case_069",value_pair:["faith","safety"],direction:"safety_over_faith",intuitive_lean:"faith",title:"反恐名义下的新疆宗教压迫",real_person:"新疆地方当局与穆斯林居民（含亲历者叙述）",year:2017,location:"中国新疆",context:"新疆发生过致命暴力袭击，当局以反恐为名加强对穆斯林的宗教管控。亲历者陈述：男人蓄须、女人戴头巾都被禁止；礼拜和讲经须限于党内官员指定的范围，讲经一句越界、家中保存《古兰经》或私下诵读，都可能被送入集中营。2017年条例却以“非正常蓄须”“蒙面罩袍”等措辞表述禁令；同年地方工商部门还令两家带“星月／新月”字号的商户摘牌改名。",dilemma:"面对真实的恐怖袭击，政府能否以反恐为由限制普通穆斯林的蓄须、戴头巾、礼拜、讲经和持有《古兰经》？还是应保护日常信仰实践，不把宗教生活本身当作安全威胁？",actual_choice:"新疆当局实施以反恐、去极端化为名的宗教管控。亲历者描述，实际执行远超条例表述的“非正常蓄须”和“蒙面罩袍”，涉及普通胡须、头巾、讲经内容及《古兰经》的持有与诵读；违规者可能被送入集中营。2017年地方工商部门还要求两家带“星月／新月”字号的商户摘牌改名。",consequences:"日常宗教实践受到广泛限制，普通表达也可能伴随拘押风险。联合国人权高专办2022年评估指出，新疆存在大规模任意和歧视性拘押及宗教表达受限等严重人权问题，并称其严重程度可能构成危害人类罪。反恐有真实安全背景，但没有证据表明禁止普通蓄须、戴头巾或私下诵经能预防袭击。",choice_support_a:"反对以信仰定罪：蓄须、戴头巾、礼拜、讲经和持有《古兰经》是日常宗教生活，不应成为拘押普通民众的理由。反恐应针对有证据的暴力行为，而不是把整个穆斯林群体的信仰实践视为威胁（信仰自由 > 公共安全管控）",choice_support_b:"支持强力预防：恐怖袭击可能夺走无辜者生命，政府有责任阻止极端主义组织动员。即使严密审查宗教活动会限制个人实践，只要能降低袭击风险，就应优先维护更广泛公众的安全（公共安全 > 宗教表达）",reflection:"如果反恐措施把普通蓄须、戴头巾、持有《古兰经》和私下诵读都纳入管控，你认为公共安全能否成为这种做法的正当理由？",impact_score:9.5,controversy_level:9.5},{id:"case_070",value_pair:["environment","faith"],direction:"faith_over_environment",intuitive_lean:"faith",title:"清明禁烧纸钱与祭祖传统",real_person:"哈尔滨清明祭扫居民",year:2017,location:"中国哈尔滨",context:"2017年清明前，哈尔滨发布通告，禁止生产、销售和焚烧冥纸冥币，理由包括减少空气污染。清明期间，记者仍在多个祭扫场所看到许多市民烧纸；报道提到，有人知道焚烧会污染环境，仍把它看作祭奠先人的重要方式。不过，墓园内是否适用禁令的说法并不一致，不能断言每位烧纸者都是明知故犯。现在想象你正在家人墓前：你相信烧纸是给祖先送去供奉、表达孝思的重要仪式，鲜花和默哀无法完全替代。",dilemma:"当政府为减少空气污染禁止清明烧纸，而你相信烧纸承载着对祖先的供奉与思念，你会遵守禁令、改用鲜花祭扫，还是继续烧纸以完成自己认为重要的祭祖仪式？",actual_choice:"哈尔滨发布了禁烧通告，但2017年清明期间多个祭扫场所仍有人烧纸。报道指出，一些市民虽知道烧纸会造成污染，仍依照传统祭扫；同时，墓园管理者和热线对墓园内是否禁烧的解释不一致。",consequences:"禁令没有立即改变祭扫习惯，现场劝导和执行范围也不清晰。露天焚烧会产生烟尘，环保部门希望以禁烧和绿色祭扫减少污染；对祭扫者来说，改用鲜花则可能意味着放弃一项承载孝思与供奉意义的仪式。",choice_support_a:"继续烧纸：相信纸钱是向祖先表达孝思、送去供奉的重要方式，即使这会产生烟尘并违背禁烧规定（信仰 > 环境）",choice_support_b:"遵守禁令：改用鲜花或默哀祭祖，避免焚烧造成的空气污染，即使觉得少了熟悉的仪式（环境 > 信仰）",reflection:"如果你相信烧纸关系到对祖先的供奉，而环保规定禁止焚烧，你会坚持仪式还是改用其他方式？",impact_score:8,controversy_level:7},{id:"case_071",value_pair:["environment","family"],direction:"environment_over_family",intuitive_lean:"environment",title:"黄万里举报父亲的水利工程",real_person:"黄万里",year:1957,location:"中国陕西",context:"1957年，清华大学教授黄万里发现三门峡大坝工程存在严重生态隐患，会导致黄河改道和大规模泥沙淤积。但该工程由他父亲的老友主持，举报会牵连父亲的政治声誉和家族关系网。黄万里面临家庭压力，但他坚信科学真理高于亲情。",dilemma:"是为了家族和睦保持沉默，还是为了环境生态揭露工程隐患，冒着家庭决裂的风险？",actual_choice:"黄万里连续发表文章批评工程，被打成右派。他说：'黄河不能这样治，否则子孙后代会骂我们。'",consequences:"黄万里被打成右派，下放劳改20年。父亲与他断绝关系。但三门峡工程果然失败，证明了他的预言。2001年他去世时，黄河依然在为这个错误买单。",choice_support_a:"支持黄万里：环境灾难影响千秋万代，科学良心高于家庭情面（环境 > 亲情）",choice_support_b:"质疑黄万里：孝道是中华文化根本，公开反对父辈是不孝，应该私下沟通（亲情 > 环境）",reflection:"如果你的家人支持一个破坏环境的工程，你会公开反对吗？",impact_score:9,controversy_level:8.5},{id:"case_072",value_pair:["environment","justice"],direction:"environment_over_justice",intuitive_lean:"environment",title:"肯尼亚守林人杀死盗猎者",real_person:"卡鲁基·卡马乌 (Karuki Kamau)",year:2019,location:"肯尼亚阿伯德尔国家公园",context:"2019年,肯尼亚护林员卡鲁基在巡逻时遭遇武装盗猎团伙，他们已经杀死3头濒危大象。卡鲁基开枪击毙2名盗猎者。事后调查显示，这两人是贫困村民，为养家糊口才冒险盗猎，且已放下武器准备投降。",dilemma:"是为了保护濒危物种和生态系统射杀盗猎者，还是考虑社会正义和人命价值，给予他们投降机会？",actual_choice:"卡鲁基选择射杀，事后他说：'每一头大象的死亡都是对未来的背叛，我不能让他们逃脱。'",consequences:"两名盗猎者死亡，留下5个孤儿。环保组织称赞卡鲁基为英雄，但人权组织指控他过度使用武力。他被停职调查但最终无罪释放。盗猎仍在继续。",choice_support_a:"支持卡鲁基：濒危物种灭绝不可逆，保护生态系统优先于个体人命（环境 > 正义）",choice_support_b:"质疑卡鲁基：人命高于动物，贫困驱使犯罪需要社会正义，而非枪决（正义 > 环境）",reflection:"当濒危动物和贫困人类发生冲突，你会站在哪一边？",impact_score:8.5,controversy_level:9},{id:"case_073",value_pair:["environment","life"],direction:"environment_over_life",intuitive_lean:"environment",title:"切尔诺贝利清理者自愿赴死",real_person:"瓦列里·霍杰姆丘克 (Valeri Khodemchuk)",year:1986,location:"苏联乌克兰",context:"1986年切尔诺贝利核事故后，核心融化，必须有人进入反应堆底部排水防止蒸汽爆炸，否则整个欧洲将被辐射污染。这是必死任务。三名志愿者明知必死仍进入反应堆。",dilemma:"是为了保护自己的生命拒绝任务，还是为了防止环境灾难自愿赴死？",actual_choice:"工程师阿列克谢·阿纳年科、瓦列里·别兹帕洛夫和潜水员鲍里斯·巴拉诺夫自愿进入。他们说：'如果不做，整个欧洲将变成荒漠。'",consequences:"三人成功排水，防止了更大灾难。但他们都死于急性辐射病。瓦列里的遗体至今仍埋在反应堆废墟下，辐射太强无法取出。",choice_support_a:"支持志愿者：为防止环境浩劫而牺牲是崇高的，个人生命服从整体生态（环境 > 生命）",choice_support_b:"质疑决定：强迫或劝说人去送死是不道德的，应该寻找其他技术方案（生命 > 环境）",reflection:"如果需要你牺牲生命才能阻止环境灾难，你会自愿吗？",impact_score:10,controversy_level:7},{id:"case_075",value_pair:["environment","safety"],direction:"safety_over_environment",intuitive_lean:"environment",title:"基西米河：防洪裁弯取直与湿地崩退",real_person:"美国陆军工程兵团、佛罗里达州水资源管理区与基西米河流域社区",year:1947,location:"美国佛罗里达州中部",context:"1947年长期洪水后，美国国会授权中央与南佛罗里达防洪工程。1962至1971年间，工程部门将蜿蜒的基西米河裁直，开挖约56英里长的C-38运河并修建水闸，以加快排水、减少洪泛区对周边社区和农地的淹水威胁。河流原有的季节性漫滩因此被切断或排干，约3万至3.5万英亩湿地遭排水、填埋或改作运河；依赖湿地的水鸟数量下降约九成，秃鹰筑巢领地减少约七成。",dilemma:"洪水确实威胁当地社区和农地，快速排水能降低部分淹水风险；但为此裁弯取直并排干大片漫滩，令约3万至3.5万英亩湿地受损，水鸟数量下降约九成。你会维持以运河和水闸快速排水的工程，还是恢复河道与湿地，让洪泛区重新蓄水、承受更复杂的土地和防洪管理？",actual_choice:"工程部门按防洪计划把河流改造成笔直的C-38运河。生态损害显现后，国会于1992年授权修复项目；美国陆军工程兵团与佛罗里达州水资源管理区回填部分运河、重建河道与洪泛区，修复设计仍须维持流域防洪功能。",consequences:"裁弯取直实现了加快排水和降低洪水损害的工程目标，却摧毁了依赖自然洪泛周期的大片湿地，水鸟和其他野生动物显著衰退。后续修复恢复了历史河道和近2万英亩湿地，野生动物回归，同时保留区域防洪功能；但修复耗时数十年、投入巨大，也无法让生态系统立即回到原状。",choice_support_a:"优先修复湿地：九成水鸟消失、数万英亩湿地受损，是为快速排水付出的巨大生态代价。恢复蜿蜒河道和漫滩能重建栖息地，并通过洪泛区蓄水帮助缓释洪峰；既然后续修复能在维持防洪功能下推进，就不该把湿地当成可随意牺牲的排水障碍（环境保护 > 公共安全）",choice_support_b:"优先快速排水：1947年的长期洪水已威胁社区和农地，政府有责任尽快减少淹水损失；运河和水闸提供可直接调度的排水能力，修复工程耗时数十年且代价高昂，不能要求居民再次承担不确定的洪水风险（公共安全 > 环境保护）",reflection:"如果快速排水能够降低洪水损失，却导致数万英亩湿地受损、约九成水鸟消失，而修复可以兼顾防洪但需要数十年和巨额投入，你会如何权衡？",impact_score:8.5,controversy_level:8},{id:"case_076",value_pair:["environment","truth"],direction:"truth_over_environment",intuitive_lean:"truth",title:"气候门调查与科学透明度争议",real_person:"东英吉利大学气候研究中心",year:2009,location:"英国",context:"2009年，东英吉利大学气候研究中心（CRU）的内部邮件遭黑客泄露，引发公众对气候数据处理、同行批评及信息公开的质疑。随后英国议会委员会与独立调查没有发现故意科学不端或足以推翻气候评估结论的证据，但批评了研究资料开放和对外沟通的不足。对于关注气候危机的人来说，澄清调查结论、公开可核验资料有助于建立信任；但邮件被断章取义传播，也可能被用来误导公众、削弱气候行动。",dilemma:"面对引发强烈争议的科学邮件，是否应优先公开并审视研究资料和沟通问题，即使相关片段可能被误读并被用来攻击气候科学？",actual_choice:"研究机构和调查者对邮件及相关指控进行了审查；调查未认定故意科学不端，同时指出透明度和信息公开方面需要改进。",consequences:"事件加深了公众对气候研究机构的质疑，也推动了对开放数据、信息请求处理和科学沟通的反思。调查结论没有支持“气候科学是骗局”的说法；然而，透明度不足本身仍会损害公众信任。",choice_support_a:"倾向环保：若争议材料可能被断章取义来阻碍气候行动，披露时应提供完整背景并避免放大误导性指控（环保行动需要保护）",choice_support_b:"倾向真实：科学机构应接受事实核查并改进信息公开；担心结论被利用，不能替代透明和可验证的证据（真实优先）",reflection:"当真实材料可能被误读并伤害你支持的公共目标时，怎样的公开方式才既诚实又负责任？",impact_score:8,controversy_level:8},{id:"case_077",value_pair:["faith","freedom"],direction:"faith_over_freedom",intuitive_lean:"freedom",title:"陈寅恪拒任中古史研究所所长",real_person:"陈寅恪",year:1953,location:"中国广州",context:"1953年，中国科学院计划成立历史研究机构，邀请中山大学教授陈寅恪担任中古史研究所所长。这是一个能够主持全国性学术研究、建立研究团队的重要职位。但陈寅恪认为，历史研究不能先接受某种政治思想作为不可质疑的前提，再去解释历史事实。他在回应邀请时提出，希望研究所“不宗奉马列主义，并不学习政治”，并坚持“独立之精神，自由之思想”。",dilemma:"为了获得更大的学术平台、组织研究团队并服务国家建设，是应该接受职位并在共同政治理想下开展研究，还是应该拒绝任职，保留不受预设政治结论限制的学术判断自由？",actual_choice:"陈寅恪提出了保持学术独立的条件。由于这些条件无法得到明确保证，他最终拒绝担任中古史研究所所长，继续在中山大学从事学术研究。",consequences:"陈寅恪失去了主持国家级历史研究机构的机会，也没有利用这一职位建立更大规模的研究团队。但他保留了自己的学术独立性，坚持研究应从事实和证据出发，而不能先接受某种不可质疑的政治结论。",choice_support_a:"接受任职：学术不应脱离国家和社会的共同理想。即使研究方法受到一定限制，只要方向正确，仍然可以推进学术事业（信仰 > 自由）",choice_support_b:"拒绝任职：学术研究必须从事实和证据出发，不能预先接受任何不可质疑的结论。即使失去重要职位，也应保留独立判断（自由 > 信仰）",reflection:"如果接受一个重要职位就必须接受一套你并不完全认同的思想前提，你会接受吗？",impact_score:9.6,controversy_level:8.5},{id:"case_078",value_pair:["faith","justice"],direction:"faith_over_justice",intuitive_lean:"faith",title:"杀人犯的告解",real_person:"罗根神父（电影《忏情记》人物）",year:1953,location:"加拿大魁北克",context:"在希区柯克电影《忏情记》中，教堂雇工在告解室向罗根神父承认自己杀了人。天主教教规要求神父绝对保守告解秘密，即使面对严重罪行也不能泄露，更不能利用告解所得的信息伤害告解者。罗根劝凶手自首，对方先答应后反悔。凶手作案时穿着神父长袍，而罗根与死者之间又有一段难以解释的旧事，警方因此逐渐怀疑罗根。",dilemma:"你是罗根神父。说出告解内容，就能为自己洗脱嫌疑，让真正的凶手受审，并避免他继续逍遥法外；但这将打破你向上帝许下的告解保密誓言，摧毁告解圣事赖以存在的绝对信任。不泄露告解，你只能继续劝凶手自首，自己则可能因谋杀被错误定罪。你会如何选择？",actual_choice:"罗根神父选择坚守告解秘密。即使被逮捕并以谋杀罪送上法庭，他也没有向警方说出凶手在告解室里的供述；他宁愿承担被错误定罪的风险，也不愿破坏告解圣事。",consequences:"罗根最终因证据不足被判无罪，真正的凶手后来在冲突中暴露身份。但在作出选择时，他无法预知自己会获释；在凶手暴露之前，受害者得不到公正，公众也仍面临凶手未被查明的风险。",choice_support_a:"坚持信仰：绝不泄露告解。告解秘密一旦能因理由充分而破例，就不再是绝对的；你只能继续劝凶手自首，并承担自己被错误定罪的风险（信仰 ＞ 正义）",choice_support_b:"坚持正义：打破告解秘密，向警方指出真正的凶手。杀人罪不能因为宗教仪式而得到包庇，无辜者也不应替凶手受审（正义 ＞ 信仰）",reflection:"如果一项神圣规则只有在最困难的时候仍不被打破，才配称为信仰；那么为了惩罚一个杀人犯，你是否愿意成为第一个破例的人？",impact_score:9,controversy_level:9.5},{id:"case_079",value_pair:["family","freedom"],direction:"freedom_over_family",intuitive_lean:"freedom",title:"李老师：继续发声，还是保护父母？",real_person:"李颖（“李老师不是你老师”）",year:2022,location:"意大利米兰与中国安徽阜阳",context:"2022年白纸运动期间，旅居意大利米兰的李颖通过社交媒体持续转发中国境内的抗议现场和其他受审查的信息，账号“李老师不是你老师”因此被大量中国网民关注。随后，他在意大利遭遇跟踪、监视、恐吓等骚扰；美国国会下属中国问题特别委员会公开信称，中国有关人员曾到他父母家中询问，要求他停止发声并回国，还威胁影响父母的养老金，并在住所外设置监控。",dilemma:"你人在意大利，可以自由发布国内无法公开传播的信息；但父母留在安徽，警方和有关人员不断上门询问、监控住所，并以养老金和生活安稳施压。你会停止发声、回国或公开与这些活动切割，以换取父母少受骚扰；还是继续发布信息，接受父母可能因此承受更大压力？",actual_choice:"李颖没有停止运营账号，也没有按要求回国。他继续在意大利发布和整理中国境内的信息，同时公开讲述自己遭遇的跨国骚扰以及父母受到的压力。",consequences:"李颖保住了在海外发声和生活的自由，但父母和朋友在国内受到询问，家庭承受持续的恐惧和压力；他的中国银行账户也据报道被冻结。意大利方面后来调查并处理了涉嫌跟踪骚扰他的人员，但这没有消除他和家人面临的风险。",choice_support_a:"保护父母：停止发布敏感信息，避免继续刺激有关部门；个人可以保持沉默，但父母不应该因为子女的选择失去养老金和安稳生活（亲情 > 自由）",choice_support_b:"坚持自由：不能让政权通过骚扰父母来决定你说什么、住在哪里；如果因为家人受压就停止发声，亲情就会被变成控制个人的工具（自由 > 亲情）",reflection:"如果你知道自己每一次发声都可能让父母被约谈、监控甚至失去养老金，你还会继续说吗？",impact_score:9.5,controversy_level:9.5},{id:"case_080",value_pair:["family","life"],direction:"family_over_life",intuitive_lean:"family",title:"邱少云父亲拒绝捐献器官救子",real_person:"邱父（化名）",year:2015,location:"中国四川",context:"2015年，32岁的儿子患肝癌晚期，唯一希望是肝移植。68岁父亲配型成功，但医生警告：以父亲年龄和健康状况，捐肝有60%死亡风险。母亲和女儿哭求父亲不要冒险，但儿子是家中独子，续香火的唯一希望。",dilemma:"是为了儿子的生命冒60%死亡风险捐肝，还是为了其他家人（妻子、孙女）的未来拒绝捐献？",actual_choice:"父亲坚持捐肝，他说：'儿子死了，这个家就散了。'手术中父亲因并发症死亡，儿子获得肝脏后也因感染去世。",consequences:"父子双亡，母亲精神崩溃，12岁孙女成为孤儿。这场悲剧摧毁了整个家庭。",choice_support_a:"理解父亲：为儿子牺牲是父爱本能，家族延续是中国文化核心（家庭 > 生命）",choice_support_b:"质疑父亲：60%死亡风险太高，为妻子和孙女活下来更理性（生命 > 家庭）",reflection:"如果救家人有很高的死亡风险，你会冒险吗？",impact_score:9.5,controversy_level:8.5},{id:"case_081",value_pair:["family","loyalty"],direction:"loyalty_over_family",intuitive_lean:"loyalty",title:"赵苞在母妻被挟持时仍进战",real_person:"赵苞与他的母亲、妻子（《后汉书》记载）",year:177,location:"东汉辽西郡（《资治通鉴》系于熹平六年，具体日期不详）",context:"《后汉书·独行列传》记载，赵苞出任辽西太守后，派人迎接母亲和妻子。她们途经柳城时，被入塞的鲜卑军队劫为人质，随后被押着进攻郡城。赵苞率军列阵，对方把他的母亲带到阵前，以至亲的安危向他施压。他既是儿子和丈夫，也是受朝廷任命、承担守郡职责的臣子；眼前无辜的亲人，成了迫使他退让的筹码。",dilemma:"你是赵苞，尚未下令进战。继续迎战，意味着明知母妻可能被杀，仍履行对朝廷的忠诚与守郡职责；为了保护她们而暂缓进攻、寻求交涉，则可能让敌方利用人质改变你的军事行动，使你辜负朝廷的托付。史书没有记载退让或投降就能换取释放的保证。面对这种不确定性，你会先为家人争取生机，还是不因亲人被挟持而改变效忠的立场？",actual_choice:"史书记载，赵苞悲痛地对母亲说：‘昔为母子，今为王臣，义不得顾私恩、毁忠节。’他选择以臣子的身份尽忠，随后下令进战。母亲也曾劝他不要因自己而亏损忠义，但这并没有消除他作为儿子与丈夫的责任，更不意味着可以替被挟持的妻子决定应当牺牲。",consequences:"据《后汉书》，赵苞击败了敌军，但母亲和妻子都被杀害。归葬后，他自责：‘食禄而避难，非忠也；杀母以全义，非孝也。’史书接着记他呕血而死。他守住了臣子的忠节，却没有因此摆脱失去至亲的痛苦；同样，也不能从这个结局反推，若当时退让，家人就必定能够生还。",choice_support_a:"选择亲情：先为无辜的母亲和妻子争取生机，暂缓进攻、寻求交涉；即使无法保证救人，也不愿在尚有争取余地时，让对朝廷的忠诚压过保护至亲的责任（亲情 > 忠诚）",choice_support_b:"选择忠诚：继续迎战，不因敌方挟持自己的亲人就改变对朝廷的效忠；守郡的托付不能在代价落到家人身上时失效，即使这可能使自己失去母亲和妻子（忠诚 > 亲情）",reflection:"当无辜的家人成为迫使你退让的人质，而退让也不能保证她们获救，你会把保护至亲放在前面，还是继续履行对朝廷的忠诚？",impact_score:9,controversy_level:9},{id:"case_083",value_pair:["family","safety"],direction:"safety_over_family",intuitive_lean:"safety",title:"发现哥哥可能是连环炸弹客",real_person:"戴维·卡钦斯基与哥哥泰德·卡钦斯基",year:1996,location:"美国",context:"1978年至1995年，美国连环炸弹客通过邮寄或放置炸弹制造袭击，造成3人死亡、多人受伤，长期未被抓获。1995年，报纸刊登了炸弹客的宣言。戴维·卡钦斯基在妻子的提醒下阅读宣言，并对照哥哥泰德过去的信件，发现思想和措辞相似，逐渐怀疑哥哥就是凶手。这个线索可能终止长期的公共威胁，却也可能把自己的哥哥送上面临死刑的审判。",dilemma:"你发现哥哥很可能是一个尚未被抓获的连环炸弹客。向调查人员提供他的信件和身份，可能阻止下一次袭击，却也可能让哥哥被判死刑，让年迈母亲承受失去儿子的痛苦。你会为了保护哥哥和家庭保持沉默，还是冒着失去亲人的风险提供线索，阻止更多陌生人受害？在报案时，你还不能确定他是否就是凶手，也不知道他是否已准备再次袭击。",actual_choice:"戴维通过律师向联邦调查人员提供了线索和哥哥的旧信，同时争取保密并希望哥哥免于死刑。1996年4月，泰德被捕；调查人员在他的木屋中发现制弹材料、犯罪记录，以及一枚准备寄出的炸弹。戴维报案时并不知道这枚炸弹的存在。",consequences:"持续多年的炸弹威胁被终止。泰德后来认罪，被判终身监禁而非死刑，但戴维在提供线索时并没有免死保证。他保护了可能成为下一批受害者的人，却承受了哥哥被关押、拒绝和解以及家庭关系破裂的痛苦。举报没有让他轻松摆脱亲情，只是让他把陌生人的安全放在保护哥哥之前。",choice_support_a:"保护家人：不把哥哥的身份和信件交给调查人员，避免亲手将他送上可能判死刑的审判；即使公众仍可能面临袭击，也不愿让母亲和哥哥承受这个结果（亲情 > 公共安全）",choice_support_b:"提供线索：让调查人员查明哥哥是否就是凶手，阻止可能的下一次袭击；即使哥哥可能被判死刑，也不能为了保护亲人让更多陌生人面临炸弹威胁（公共安全 > 亲情）",reflection:"如果阻止下一次炸弹袭击的线索就在你手里，但交出去可能让哥哥被判死刑，你会保持沉默吗？",impact_score:9.5,controversy_level:9},{id:"case_084",value_pair:["freedom","justice"],direction:"justice_over_freedom",intuitive_lean:"justice",title:"恐袭者的手机：为了查清罪行，是否突破隐私保护？",real_person:"苹果公司与美国联邦调查局（FBI）",year:2016,location:"美国加利福尼亚州圣贝纳迪诺",context:"2015年，圣贝纳迪诺发生恐怖袭击，造成14人死亡、22人受伤。调查人员取得一名已被击毙袭击者使用的iPhone，希望查明案件经过及是否有人协助，但无法解锁。2016年，FBI要求苹果编写特殊软件，绕过部分密码安全限制，协助尝试解锁这部手机。苹果已提供其掌握的有关数据，却反对创建这种工具：政府称要求针对本案，苹果则担忧技术及先例可能被用于更多设备，影响普通人的隐私和自主生活。",dilemma:"把自己放在当时的决策位置：你是否支持要求苹果针对这部涉案手机提供解锁协助，以查清恐袭及可能的协助者？还是反对创建削弱安全保护的工具，即使手机中的关键证据可能因此无法取得？你不能预先知道手机里有什么，也不能确定以后是否会出现其他解锁办法。",actual_choice:"苹果公开反对创建绕过安全限制的软件；FBI则坚持，这一要求旨在获取本案证据。双方当时争论的不是是否同情恐怖分子，而是调查严重犯罪能否成为要求企业削弱设备保护的理由。",consequences:"同意协助，可能取得关键证据、追究仍在逃的协助者，也可能形成被扩大使用的技术与先例；拒绝创建工具，可以守住隐私保护的边界，却可能使案件留下无法查清的部分。获取手机数据并不保证发现新的犯罪证据。",choice_support_a:"反对要求苹果创建解锁工具：保护公众的隐私与自主生活，即使这可能使恐袭调查失去重要线索（自由 > 正义）",choice_support_b:"支持要求苹果针对涉案手机提供解锁协助：为受害者查清罪行、追究可能的协助者，接受隐私保护边界被突破的风险（正义 > 自由）",reflection:"当隐私保护挡住的可能是造成多人死亡的恐袭证据时，你仍愿意坚持这条边界吗？",impact_score:9.5,controversy_level:9.5},{id:"case_085",value_pair:["freedom","life"],direction:"freedom_over_life",intuitive_lean:"freedom",title:"林昭坚持思想与表达自由",real_person:"林昭",year:1968,location:"中国上海",context:"林昭曾就读于北京大学，1957年被划为右派，1960年因参与政治异议活动被捕。在狱中，她持续写作、申诉，反对强迫思想改造，主张思想与表达自由。她的坚持不是为了改善物质生活，而是不愿由权力规定自己必须相信什么、可以说什么。1965年，她被判处二十年徒刑，仍继续表达异议。",dilemma:"设想你身处这样的政治监禁中：公开认错、停止异议表达，可能减少进一步遭受惩罚的风险，却意味着在强迫下否认自己的思想；继续写作、拒绝思想改造，则可能面临更严厉的迫害，甚至死亡。你会先保住生命，还是坚持表达自己的思想？认错并不保证获释或免死，这不是一场有明确保命承诺的交换。",actual_choice:"林昭没有停止抗争。她在狱中留下大量书信、诗文和申诉材料，其中包括用血写成的文字，继续批判政治压迫、拒绝被强迫认罪。1968年4月29日，她被处决。她的部分狱中书信和日记后来成为研究其经历的档案材料。",consequences:"她最终失去了生命，也没有在生前获得人身自由；她所坚持的是，即使被囚禁，也不让强制力量完全支配自己的思想与表达。她的遭遇揭示了精神自由可能付出的真实代价，但不能据此断言她只要认错就一定能够活下来。",choice_support_a:"坚持思想与表达自由：即使继续发声可能招致更严厉的迫害乃至死亡，也不愿被迫否认自己的思想、放弃表达（自由 > 生命）",choice_support_b:"优先保住生命：可以暂时认错、停止公开表达，尽量降低被杀害的风险；内心的判断可以保留，活下来才有等待转机的可能（生命 > 自由）",reflection:"如果继续表达自己的思想可能使你被处死，而公开认错、保持沉默可能增加生存机会，你仍认为保住生命应当优先吗？",impact_score:8.5,controversy_level:8},{id:"case_086",value_pair:["freedom","loyalty"],direction:"loyalty_over_freedom",intuitive_lean:"loyalty",title:"日本移民在二战中的选择",real_person:"丹尼尔·井上 (Daniel Inouye)",year:1943,location:"美国夏威夷",context:"1943年，日裔美国人丹尼尔被关进集中营，自由被剥夺仅因种族。美国允许他们参军证明忠诚，但要去欧洲作战，可能战死。丹尼尔面临选择：是追求自己的自由权利，还是用生命证明对美国的忠诚？",dilemma:"是为了自由抗议种族歧视拒绝参军，还是为了证明忠诚接受不公待遇参战？",actual_choice:"丹尼尔加入第442团全日裔部队。他说：'美国是我的国家，我要证明我的忠诚。'",consequences:"442团成为美军史上伤亡率最高部队之一。丹尼尔失去右臂，但获得荣誉勋章。日裔社区用鲜血和牺牲证明了忠诚，推动了战后平权。",choice_support_a:"质疑丹尼尔：应该抗议种族歧视而非顺从，不应该为不公国家卖命（自由 > 忠诚）",choice_support_b:"支持丹尼尔：用忠诚和牺牲赢得尊严和平等是正确的，忠诚高于自由（忠诚 > 自由）",reflection:"当国家对你不公时，你还会保持忠诚吗？",impact_score:9,controversy_level:8.5},{id:"case_088",value_pair:["freedom","safety"],direction:"freedom_over_safety",intuitive_lean:"freedom",title:"古尔巴哈尔·海提瓦吉被拘押",real_person:"古尔巴哈尔·海提瓦吉 (Gulbahar Haitiwaji)",year:2016,location:"中国新疆与法国",context:"维吾尔女性古尔巴哈尔·海提瓦吉长期生活在法国。2016年，她回到新疆处理退休手续时被扣留。根据她和家人的叙述，办案人员将她女儿在法国参加维吾尔人抗议活动视为需要调查的关联，随后她被关押在警察设施和所谓“再教育”设施中。中国政府将新疆的监控、去极端化和拘禁政策解释为预防恐怖主义、维护国家安全的措施。",dilemma:"如果政府认为某人的宗教身份、亲属关系或海外表达可能与极端主义网络有关，是否可以在没有公开审判和透明证据的情况下，先限制她的通信、行动和人身自由，以降低恐怖袭击风险？还是必须先保障个人自由，不能因为关联性怀疑就预防性拘禁？",actual_choice:"海提瓦吉没有经过公开审判便被长期拘押，并被要求参加政治学习、接受持续监控。她的家人在法国向外交机构和媒体求助，经过持续施压后，她于2019年获准离开中国。",consequences:"支持者认为，对高风险人员进行提前监控和限制，可能有助于阻止尚未发生的袭击；批评者指出，以亲属关系、宗教身份或政治表达作为拘禁依据，会把大量无辜者当成潜在威胁，并使政府可以绕过司法程序。海提瓦吉获释回到法国，但她的经历显示，安全名义下的预防性控制可能摧毁个人自由和家庭生活。",choice_support_a:"坚持自由：没有公开证据和司法审判，就不能因为亲属、宗教或政治表达关系而剥夺一个人的自由；预防恐袭不能成为无限扩大监控和拘禁的理由（自由 > 公共安全）",choice_support_b:"优先安全：恐怖组织可能通过家庭和社会网络活动，等到证据充分或袭击发生后再行动可能已经太晚；为了保护更多无辜者，可以接受对高风险关联者的提前监控和限制（公共安全 > 自由）",reflection:"如果提前限制一个人的自由，确实可能降低恐怖袭击风险，但也可能误伤完全无辜的人，你愿意接受这种代价吗？",impact_score:9.5,controversy_level:9.5},{id:"case_089",value_pair:["freedom","truth"],direction:"freedom_over_truth",intuitive_lean:"freedom",title:"李文亮与疫情早期预警",real_person:"李文亮",year:2019,location:"中国武汉",context:"2019年12月30日，武汉中心医院眼科医生李文亮在同学微信群转发信息，称医院出现了7例‘SARS’相关病例，并附上检查信息；他随后补充说是冠状病毒感染，正在进行病毒分型，并提醒同事和家人注意。当时病原体尚未正式确认。2020年1月3日，武汉警方因他传播未经核实的SARS相关信息将他传唤并训诫。后来查明引发疫情的是此前未被认识的新型冠状病毒，警方撤销训诫并道歉。",dilemma:"病原体尚未完成确认时，是否允许医生公开未经核实的初步判断、提醒同事和公众？允许这种自由表达，可能把错误的‘SARS’标签传播出去；但如果以只有完全确认的信息才能传播为由压制预警，也可能延误公众认识真正的疫情。",actual_choice:"李文亮选择在病原体尚未完全确认时提醒同事和家人。警方随后以传播未经核实的信息为由对他进行训诫；国家监委调查认为训诫不当，武汉警方撤销训诫并向其家属道歉。",consequences:"允许早期预警，可能让错误的病毒名称进入公众传播，损害信息的准确性；压制未经完全确认的预警，则可能让医护人员不敢报告异常，使真实的风险更晚进入公共视野。这个案例的冲突不是‘真话还是假话’，而是绝对准确的发布标准与及时自由表达之间的冲突。",choice_support_a:"支持自由：允许医生发布尚未完全确认的初步信息。在未知疫情面前，及时提醒比等待所有事实确认更重要；如果医护人员担心因名称不准确而受到惩罚，真正的风险反而可能被压下去（自由 > 真实）",choice_support_b:"支持真实：只有经过核实的信息才能公开传播。把尚未确定的新型病毒说成SARS会造成事实错误和社会误解，公众需要的是准确的病毒名称、病例数量和传播风险，而不是未经确认的判断（真实 > 自由）",reflection:"面对一个尚未确认、但可能造成严重后果的异常病例，你会允许医生先发出不完全准确的预警吗？",impact_score:9,controversy_level:8.5},{id:"case_090",value_pair:["justice","loyalty"],direction:"loyalty_over_justice",intuitive_lean:"loyalty",title:"沙威该不该逮捕救命恩人冉阿让",real_person:"冉阿让与沙威（雨果小说《悲惨世界》人物）",year:1832,location:"法国巴黎",context:"冉阿让因饥饿、为姐姐的孩子偷面包入狱，又因越狱被加刑，前后服刑十九年。假释后他隐姓埋名，成为受人尊敬的市长和工厂主，救济穷人，还收养了孤女珂赛特，但在法律上他仍是冒用身份的逃犯。1832年巴黎街垒战中，警探沙威被起义者俘获。冉阿让本可以亲手处决他，却暗中放走了他。不久后，沙威终于有机会依法逮捕冉阿让。",dilemma:"是坚持执法一视同仁，把救命恩人送回监狱（正义），还是报答救命之恩，不背弃这位已经改过向善的人（忠诚）？",actual_choice:"沙威放走了冉阿让。",consequences:"沙威一生信奉法律至上，却无法调和执法者的职责和欠下的救命之恩，最终投塞纳河自尽。",choice_support_a:"坚持正义：个人恩情不能凌驾于法律之上，执法者放走恩人就是徇私（正义 > 忠诚）",choice_support_b:"报答恩义：冉阿让刚救了你的命，当年的罪源于饥饿求生，此后又帮助了很多人，把他送回监狱近乎忘恩负义（忠诚 > 正义）",reflection:"当一个曾经犯罪的人已经成为善良正直的人，并且刚刚救过你的生命，你还能否为了司法的一视同仁，亲手把救命恩人送回监狱？",impact_score:9.5,controversy_level:9},{id:"case_092",value_pair:["justice","safety"],direction:"safety_over_justice",intuitive_lean:"safety",title:"第四枚核弹与嫌疑人的孩子",real_person:"审讯专家H与联邦探员布罗迪",year:2010,location:"美国",context:"尤瑟夫声称在美国三座城市藏了核弹，即将爆炸。审讯专家H对他施以酷刑，甚至当着他的面杀死他的妻子；联邦探员布罗迪反对这种做法。尤瑟夫终于供出三枚核弹的位置，但H根据失踪的核材料判断还有第四枚，要求把尤瑟夫的两个年幼孩子带回来继续施压。你在现场必须决定是否允许他这么做。",dilemma:"第四枚核弹确实存在，数以万计的人即将面临死亡；但没有证据证明伤害两个无辜孩子就能及时得到最后的地点。你会允许以孩子相威胁甚至伤害他们，以争取阻止爆炸的机会，还是立刻制止H，即使这意味着放弃找到第四枚核弹的最后机会？",actual_choice:"H选择以公共安全为理由不断升级审讯：他杀死尤瑟夫的妻子，又威胁伤害孩子，迫使尤瑟夫说出三枚核弹的位置。确认还有第四枚核弹后，H想继续拿孩子施压；布罗迪坚持阻止，孩子没有被伤害。尤瑟夫随后自尽，带着第四枚核弹的地点一同死去。",consequences:"三枚已知核弹被找到并拆除，但第四枚核弹确实存在，并开始倒计时。众人最终不得不面对一个无法逃避的结果：阻止H意味着可能有大量无辜者死亡，允许H继续则意味着主动把两个孩子变成审讯工具，甚至可能亲手杀死他们。",choice_support_a:"坚持正义：无论威胁多大，都不能杀害或伤害无辜者来逼供；应阻止H拿孩子施压，即使可能错失寻找第四枚核弹的机会（正义 > 安全）",choice_support_b:"坚持公共安全：第四枚核弹确实存在，及时获取情报可能救下无数人；即使手段会伤害无辜孩子，也应允许H继续施压（安全 > 正义）",reflection:"如果制止H之后第四枚核弹爆炸、造成大量无辜者死亡，你还会认为不伤害孩子是正确的选择吗？",impact_score:9.5,controversy_level:9.5},{id:"case_093",value_pair:["justice","truth"],direction:"justice_over_truth",intuitive_lean:"justice",title:"德国纳粹档案的封存",real_person:"保罗·菲尔兹 (Paul Freese,化名)",year:1955,location:"德国",context:"1955年，德国历史学家保罗发现政府封存了大量纳粹档案，其中包括许多现任政府官员在纳粹时期的罪行证据。公开这些档案可以还原历史真相，但会导致政府崩溃和社会动荡，延缓战后重建。",dilemma:"是为了历史真相公开档案揭露罪犯，还是为了社会正义和稳定重建保持封存？",actual_choice:"保罗私下泄露部分档案给媒体，导致数名官员下台，但他被政府起诉并入狱。",consequences:"保罗入狱3年，但他的行为推动了德国的'去纳粹化'进程。然而完整档案直到2000年代才逐步解密，许多纳粹罪犯逃脱了正义。",choice_support_a:"支持保罗：历史真相必须公开，即使代价是社会动荡，正义不能等待（正义 > 稳定真相）",choice_support_b:"质疑保罗：战后重建需要稳定，过度追究历史会妨碍和解（稳定 > 正义）",reflection:"为了社会稳定，封存历史真相是否可以接受？",impact_score:8,controversy_level:8.5},{id:"case_094",value_pair:["life","loyalty"],direction:"loyalty_over_life",intuitive_lean:"loyalty",title:"杨靖宇：绝境中仍不投降",real_person:"杨靖宇",year:1940,location:"吉林濛江县（今靖宇县）",context:"东北沦陷后，杨靖宇率东北抗日联军抵抗日本侵略。1940年2月，他在日伪军的围追堵截中陷入绝境，最后孤身战斗，饥寒交迫，得不到补给。敌人向他劝降，但他没有接受。对他而言，这不只是是否继续执行一项命令，而是是否向侵占自己国家的敌人屈服。",dilemma:"你已经孤立无援，继续抵抗极可能战死。敌人劝你投降，这是争取活下去的一条路，却没有可靠的安全保证。你会放下武器，优先保全自己的生命；还是拒绝向侵略者投降，宁愿死去，也不以屈服换取生存的机会？",actual_choice:"杨靖宇拒绝日伪军的劝降，继续抵抗，1940年2月23日在战斗中牺牲。",consequences:"杨靖宇失去了生命，却没有向侵略者屈服。他的抵抗成为东北抗战与民族不屈精神的象征，濛江县后来改名为靖宇县。拒降没有让他活下来，投降是否能够保命也无法确定；这个选择仍让人追问，生命是否应当高于对国家和民族的忠诚。",choice_support_a:"优先生命：在已经孤立无援的绝境中，放下武器争取活下去；人的生命不应因为必须以死证明忠诚而被放弃（生命 > 忠诚）",choice_support_b:"拒绝屈服：国家正在遭受侵略，不能为了个人求生向侵略者投降；即使付出生命，也要守住对国家和民族的忠诚（忠诚 > 生命）",reflection:"如果向侵略者投降是你争取活下去的一条路，你会为了国家和民族拒绝吗？",impact_score:9.5,controversy_level:8.5},{id:"case_096",value_pair:["life","safety"],direction:"life_over_safety",intuitive_lean:"life",title:"韦斯·摩尔医生在埃博拉疫区",real_person:"肯特·布兰特利 (Kent Brantly)",year:2014,location:"利比里亚",context:"2014年西非埃博拉疫情爆发，美国医生布兰特利在利比里亚治疗病人。病毒致死率70%，他的家人恳求他回国以保安全。但如果他离开，数百名病人将无人医治而死。",dilemma:"是为了个人和家人的安全离开疫区，还是为了拯救病人生命留下来冒感染风险？",actual_choice:"布兰特利选择留下。他说：'这些病人没有选择，但我有，我选择留下。'",consequences:"布兰特利感染埃博拉，紧急转送回美国才幸存。但他在非洲期间救治了数百名病人。他的选择激励了更多医护人员前往疫区，但也让妻子和孩子经历了巨大恐惧。",choice_support_a:"支持布兰特利：医生的使命是救死扶伤，拯救生命优先于个人安全（生命 > 安全）",choice_support_b:"质疑布兰特利：他对家人也有责任，冒死救陌生人是对妻子孩子的不负责任（安全 > 生命）",reflection:"如果救别人的命需要冒你自己和家人的安全风险，你会去吗？",impact_score:8.5,controversy_level:7.5},{id:"case_097",value_pair:["life","truth"],direction:"truth_over_life",intuitive_lean:"truth",title:"安娜·波利特科夫斯卡娅调查普京",real_person:"安娜·波利特科夫斯卡娅 (Anna Politkovskaya)",year:2006,location:"俄罗斯莫斯科",context:"2006年，俄罗斯记者安娜长期调查普京政府在车臣的战争罪行和腐败。她多次收到死亡威胁，已有三名调查同一主题的记者被暗杀。朋友和家人恳求她停止调查保命。",dilemma:"是为了保命停止调查，还是为了揭露真相继续工作，冒被暗杀的风险？",actual_choice:"安娜拒绝停止。她说：'如果我们都因为恐惧而沉默，真相就永远不会被看见。'",consequences:"2006年10月7日（普京生日当天），安娜在家中电梯被枪杀，年仅48岁。她的调查报告成为揭露俄罗斯人权状况的重要文献，但凶手至今未被缉拿。",choice_support_a:"质疑安娜：活着才能继续工作，主动送死是不理性的，应该先保护自己（生命 > 真相）",choice_support_b:"支持安娜：揭露真相是记者的使命，为真相而死是最高荣誉（真相 > 生命）",reflection:"如果报道真相会导致你被暗杀，你会继续吗？",impact_score:9.5,controversy_level:7},{id:"case_099",value_pair:["loyalty","safety"],direction:"loyalty_over_safety",intuitive_lean:"loyalty",title:"沙利特换俘：兑现对士兵的承诺",real_person:"吉拉德·沙利特与以色列政府",year:2011,location:"以色列与加沙地带",context:"以军士兵吉拉德·沙利特于2006年被哈马斯俘获并关押五年。2011年，以色列政府与哈马斯达成协议，以释放1,027名巴勒斯坦囚犯换回沙利特，其中包括因致命袭击被定罪者。支持者认为，国家必须尽力带回被俘士兵，兑现对服役者及其家庭的承诺；反对者担心释放囚犯会鼓励绑架，并带来新的袭击风险。",dilemma:"政府是否应接受以释放1,027名囚犯为代价，救回被俘五年的本国士兵，即使这可能提高未来绑架的诱因、增加公众面临的安全风险？",actual_choice:"2011年10月，以色列内阁以26比3批准换俘协议。沙利特获释回国，1,027名巴勒斯坦囚犯分批获释。",consequences:"协议兑现了国家不放弃被俘士兵的承诺，也回应了沙利特家人长期要求政府采取行动的诉求；与此同时，释放多名因致命袭击被定罪者引发了对再犯与鼓励绑架的担忧。获释者后来是否重返暴力活动的统计因定义和来源而有很大差异，因此不能把后续袭击简单归因于这项协议。",choice_support_a:"支持忠诚：国家不能把被俘士兵视为可牺牲的代价；尽力救回沙利特，才能兑现对服役者及其家庭的承诺，并维系士兵对军队和国家的信任（忠诚 > 公共安全）",choice_support_b:"支持公共安全：释放大量因暴力袭击被定罪的囚犯，可能让更多公众再次面临袭击风险，也可能使绑架成为获取让步的有效手段；政府应优先降低整体安全威胁（公共安全 > 忠诚）",reflection:"如果救回一名被俘士兵需要释放大量因致命袭击被定罪的囚犯，你认为国家对士兵的承诺应承担多大的公共安全代价？",impact_score:10,controversy_level:9},{id:"case_100",value_pair:["loyalty","truth"],direction:"truth_over_loyalty",intuitive_lean:"truth",title:"卡廷档案移交：承认苏联国家责任",real_person:"米哈伊尔·戈尔巴乔夫、鲍里斯·叶利钦",year:1990,location:"苏联莫斯科、波兰华沙",context:"卡廷惨案发生后，苏联官方数十年否认内务人民委员部的责任。1990年，在波兰总统雅鲁泽尔斯基访苏期间，苏联领导层首次正式承认苏联方面对惨案负有责任，并向波兰移交首批相关档案。1992年，俄罗斯总统叶利钦又移交了包括1940年处决决议在内的文件。公开这些材料意味着承认国家机构曾犯下严重罪行，也可能损害国家声誉并激化政治争论。",dilemma:"当历史档案证明国家机关曾犯下重大罪行，领导者应继续维护前政府留下的否认叙事、避免损害国家形象，还是公开承认并移交档案，即使这会让国家承担责任？",actual_choice:"1990年，戈尔巴乔夫时期的苏联官方承认苏联内务人民委员部对卡廷惨案负有责任并移交部分档案；1992年，叶利钦下令向波兰移交包含斯大林批准处决决议的档案副本。",consequences:"档案披露打破了苏联长期维持的官方否认，为波兰方面查明受害者命运提供了关键材料，也使苏联及其继承国家必须面对国家机构的历史责任。公开事实改善了两国对话的基础，但并未消除政治争议和历史创伤。",choice_support_a:"支持谨慎处理：公开国家机密和前政府责任可能冲击国家稳定、损害国际地位；领导者也有责任维护国家连续性，避免让国家利益受损（忠诚 > 真实）",choice_support_b:"支持承认：忠于国家不等于忠于掩盖真相的旧政权；公开档案、承认国家责任，才能尊重受害者并建立可信的国家形象（真实 > 忠诚）",reflection:"如果你领导的国家继承了前政府的谎言，公开真相可能损害国家声誉，你会选择公布档案并承认责任吗？",impact_score:9.5,controversy_level:8.5},{id:"case_102",value_pair:["safety","truth"],direction:"truth_over_safety",intuitive_lean:"safety",title:"蝙蝠冠状病毒嵌合研究",real_person:"石正丽 (Zhengli Shi)、拉尔夫·巴里克 (Ralph Baric) 与研究团队",year:2015,location:"中国与美国北卡罗来纳州",context:"2015年，研究团队将中国菊头蝠携带的 SHC014 冠状病毒刺突蛋白，与小鼠适应型 SARS 病毒骨架组合成嵌合病毒。实验发现它能感染人类气道细胞，并在小鼠中致病；现有 SARS 疫苗和抗体未能有效保护实验动物。研究并未证明该病毒可以在人际传播。研究者认为需要了解此类蝙蝠病毒的跨种感染风险，批评者则担心制造具有新性质的病毒会增加实验室事故与滥用风险。",dilemma:"为了检验蝙蝠病毒感染人类细胞的潜力、帮助同行评估和监测新兴疫情风险，是否应开展并公开这类嵌合病毒研究，还是限制实验以降低实验室生物安全风险？",actual_choice:"研究团队完成实验并于2015年发表结果。该研究在美国政府暂停资助部分特定增益功能研究之前已启动，并经 NIH 审查获准继续。",consequences:"研究结果显示 SHC014 刺突蛋白可以支持病毒感染人类气道细胞，并提示现有 SARS 疫苗和抗体可能无法应对某些蝙蝠冠状病毒；同时，研究引发了关于实验室生物安全、潜在滥用及高风险病原体研究边界的持续争论。它没有证明病毒能在人际传播，也不是 SARS-CoV-2 的来源证据。",choice_support_a:"支持限制：即使研究目标是预警，制造能感染人类气道细胞的嵌合病毒也会引入额外的生物安全风险；应优先采用风险更低的方法，避免让实验室意外或滥用危及公众（公共安全 > 真实）",choice_support_b:"支持研究与公开：验证蝙蝠病毒感染人类细胞的潜力，能让同行检验风险判断并为监测和防范提供依据；不做研究或不公开结果，也可能让潜在威胁更难被及时识别（真实 > 公共安全）",reflection:"当研究能揭示潜在疫情风险、但实验本身也会增加生物安全风险时，你会支持继续研究并公开结果，还是限制这类实验？",impact_score:9,controversy_level:9},{id:"case_109",value_pair:["contract","justice"],direction:"contract_over_justice",intuitive_lean:"contract",title:"蜗牛镖鲈与特里科大坝",real_person:"田纳西河流域管理局、特里科大坝工程参与者与蜗牛镖鲈",year:1978,location:"美国田纳西州小田纳西河",context:"美国国会于1966年批准特里科大坝项目，工程于1967年开工。大坝建设多年后，科学家在1973年才发现小田纳西河中存在此前未被认识的蜗牛镖鲈；1975年，这种鱼被列为濒危物种，而水库蓄水将淹没它唯一已知的栖息地。诉讼发生时，工程已完成约80%，公共资金已经投入约7800万美元，继续停工将使数千万美元无法收回。",dilemma:"大坝已经建设到接近完成，停止蓄水会让已经投入资金、签订施工安排并依赖项目发展的各方承担巨大损失；但继续蓄水又会摧毁一种新发现的濒危鱼类的唯一已知栖息地。你会完成已经作出承诺的公共工程，还是为了保护这个后来才被认识的物种而停止项目？",actual_choice:"美国最高法院最终维持禁令，阻止特里科大坝蓄水，认为《濒危物种法》要求在工程接近完成时仍然保护蜗牛镖鲈。此后国会通过特别立法豁免该项目，大坝最终得以完成。",consequences:"如果停止项目，数千万美元的公共投资和相关施工、土地及供电安排将受到损失；如果继续项目，蜗牛镖鲈的栖息地将被水库淹没，物种可能灭绝。这个案件把后来才出现的生态知识，与已经形成的工程承诺和投资损失正面撞在了一起。",choice_support_a:"支持契约精神：特里科大坝是经过国会批准、已经投入巨资并完成大半的公共工程。承包商、土地所有者和地方居民都已经按照项目作出安排，不能因为后来发现一种鱼，就让所有已经履行义务的人承担数千万美元损失。公共承诺必须保持可信（契约精神 > 正义）",choice_support_b:"支持正义：蜗牛镖鲈是在工程开工后才被发现的濒危物种，蓄水会摧毁它唯一已知的栖息地。已经花掉的钱可以损失，但物种灭绝无法挽回；人类后来获得的新认识，应当促使我们停止原本合理、如今却会造成不可逆伤害的工程（正义 > 契约精神）",reflection:"如果一个工程在建设大半后才被发现会消灭一种此前无人认识的濒危物种，你会让已经投入的钱决定项目命运吗？",impact_score:9.5,controversy_level:8.5},{id:"case_104",value_pair:["contract","family"],direction:"family_over_contract",intuitive_lean:"family",title:"比利·斯特林斯离开音乐节陪妻子分娩",real_person:"比利·斯特林斯（Billy Strings）与妻子艾莉（Ally）",year:2024,location:"美国科罗拉多州布埃纳维斯塔与密歇根州",context:"2024年9月，比利·斯特林斯已经抵达科罗拉多，准备在自己的Renewal音乐节担任两晚主打演出。观众已经购票，乐队和其他音乐人也已到场。演出前，他接到妻子艾莉的电话：她羊水破了，正在密歇根待产。比利知道妻子可能在这段时间生产，但原本希望能完成音乐节后再回家。此刻，他必须在已经安排好的演出与陪伴妻子分娩之间作出选择。",dilemma:"你已经承诺演出，观众付了钱，乐队和主办方也完成了准备；但妻子开始分娩，需要你在身边。你会留下完成两晚演出，即使错过陪产和孩子出生；还是立即回家，让其他音乐人替演，并承担观众失望和退款的代价？",actual_choice:"比利立即飞回密歇根陪伴妻子，缺席两晚主打演出。音乐节没有取消，由他的乐队和其他音乐人替演。孩子随后出生。比利与主办方后来宣布为普通票和贵宾票退款，承认观众没有得到原本付钱期待的演出；公开报道没有披露演出合同全文或违约判决。",consequences:"比利陪伴妻子经历了分娩，也迎接了孩子出生，但观众没有看到原定主角的两晚演出，乐队和其他音乐人承担了替演责任。购票者获得退款，信用卡处理费不退。退款可以弥补票款，却不能补回观众原本期待的演出；留下履行演出承诺，则可能错过无法重来的家庭时刻。",choice_support_a:"[契约精神]：留下完成演出。观众已经为你的出场付钱，乐队和主办方也按照承诺作了准备；即使妻子分娩、自己很想回家，也不能把已承诺的演出交给别人承担。退款不等于兑现观众期待的演出，应先履行对他们的承诺（契约精神 > 亲情）",choice_support_b:"[亲情]：立即回家陪产。妻子正在经历分娩，需要丈夫在身边，孩子出生也无法重来；即使让观众失望、需要退款并向伙伴道歉，也应该在这一刻陪伴家人，而不是为了演出错过他们最需要你的时候（亲情 > 契约精神）",reflection:"如果妻子开始分娩，而你已经站在一场售票演出的后台，你会留下完成演出，还是立即回家？",impact_score:9,controversy_level:9.5},{id:"case_111",value_pair:["contract","family"],direction:"contract_over_family",intuitive_lean:"contract",title:"陈廷海还粮款，儿子放弃考研",real_person:"陈廷海与儿子陈超",year:2006,location:"中国湖北省当阳市红光村",context:"2006年，粮食经纪人陈廷海将乡亲交给他的油菜籽送往一家长期合作的油脂厂。油厂资金链断裂，经营者失踪，210户村民共98万元的粮款无法收回。陈廷海一家主动认下还款责任；相关报道记载，他给债权人出具了欠条。儿子陈超原本打算继续深造，为帮助家里还债，主动放弃考研、提前参加工作。父亲既面对乡亲已经交出粮食却拿不到钱的处境，也面对还款压力改变儿子人生机会的代价。",dilemma:"假如你是陈廷海，你会优先为儿子保留深造资源，减少家庭投入偿债的力量、推迟向乡亲还款；还是继续把家庭资源用于兑现已经认下的还款承诺，即使儿子因此放弃考研、提前工作？儿子没有造成这笔损失，交出粮食的乡亲也没有过错。",actual_choice:"陈廷海没有逃避，变卖家中能换钱的物品，长期种地、打工和经营农副产品来还款。陈超自愿放弃考研，参加工作并用收入帮助父母偿债；报道并未说父亲强迫他放弃深造。2023年《人民日报》报道时，这笔长期偿还的欠款仍剩13万多元。",consequences:"持续偿债让乡亲陆续收回粮款，也让陈廷海一家长期承受经济压力，陈超失去了原本计划的深造机会。父亲对儿子的教育、成家等需求难以提供支持，并为此感到愧疚。如果优先支持儿子，能够保留他的教育机会，却会让尚未拿回粮款的乡亲继续等待。这不是要求儿子依法替父还债，而是父亲如何分配家庭资源来兑现自己的还款承诺。",choice_support_a:"[契约精神]：继续兑现还款承诺。乡亲已经交出了粮食，你又明确认下债务，不能因为自己的儿子需要深造，就让无过错的农户继续承担损失。即使还款压力影响儿子的教育和家庭生活，也应把已经承诺支付的钱还给他们（契约精神 > 亲情）",choice_support_b:"[亲情]：优先支持儿子深造，推迟还款。儿子没有造成油厂的损失，不应因为父亲的生意变故放弃自己的教育机会。作为父亲，应先尽力保住他的前途，再通过与乡亲协商、自己继续劳动来逐步偿债，而不是让下一代的人生为这笔债让路（亲情 > 契约精神）",reflection:"当兑现自己的还款承诺会挤掉儿子的深造机会时，你会先支持儿子，还是先向交付粮食的乡亲还款？",impact_score:9,controversy_level:9},{id:"case_105",value_pair:["justice","contract"],direction:"justice_over_contract",intuitive_lean:"justice",title:"赵某鹏患癌后要求解除购房合同",real_person:"赵某鹏与卖方李某伟、张某敏（据律师文集改编）",year:2024,location:"中国北京",context:"2023年11月，赵某鹏与李某伟、张某敏签订总价353万元的房屋买卖合同，支付10万元定金，随后完成网签。签约时，双方自愿交易，卖方没有过错。此后，赵某鹏被确诊为癌症，辞职养病，收入来源中断，原本用于购房的资金也需要留作治疗和生活费用。本情境据律师文集对案件的整理改编，停留在买方提出解约的节点，并设定此时房价已经下跌，卖方若接受解约、重新出售，将面临数十万元的差价损失。",dilemma:"假如你是卖方，面对签约后突患癌症的赵某鹏，你会坚持让他按约付款、办理过户，还是接受解除合同，让他保留资金治疗，并自行承担房价下跌带来的损失？",actual_choice:"赵某鹏提出不再支付剩余房款、不再办理过户，并要求解除合同。案例停留在这一请求上，卖方的决定由你作出。",consequences:"如果坚持履约，赵某鹏仍需筹措剩余房款、承担贷款压力，治疗费用和基本生活保障可能受到挤压；如果接受解约，卖方就要重新出售房屋，承担已经下跌的房价造成的数十万元损失。一场突如其来的疾病，让签约时双方都认为合理的交易变成了两难。",choice_support_a:"[正义]：接受解除合同。赵某鹏签约后突患癌症，并非故意毁约；继续要求他付款、承担贷款，可能挤占治疗费用和基本生活保障。即使自己要承担房价下跌的损失，也不应让一场突发疾病把他推入更难承受的困境（正义 > 契约精神）",choice_support_b:"[契约精神]：坚持按约付款、办理过户。卖方没有过错，合同已经签订并完成网签；现在房价已经下跌，接受解约、重新出售将让李某伟和张某敏少收数十万元。买方患病值得同情，但不能因此要求无过错的卖方承担这笔损失（契约精神 > 正义）",reflection:"如果你是李某伟或张某敏，你愿意承担数十万元的房价损失，让突患癌症的买方退出这笔已经签约的交易吗？",impact_score:8.5,controversy_level:9},{id:"case_106",value_pair:["contract","life"],direction:"life_over_contract",intuitive_lean:"life",title:"印度农民的棉花种子债务",real_person:"印度棉农群体",year:2006,location:"印度马哈拉施特拉邦",context:"2000年代，孟山都等种子公司向印度农民推销转基因棉花种子，承诺高产。农民签订购买合同，借高利贷购买昂贵的种子。但种子需要大量化肥和灌溉，许多农民因干旱歉收，无法偿还债务。放贷者根据合同要求农民必须还款，否则将没收土地。2006年，仅马哈拉施特拉邦就有1044名农民因无法偿还种子债务而自杀。他们在遗书中写道：'我签了合同，但我付不起。与其让家人失去土地，不如我去死，至少保险金能还债。'",dilemma:"当严格执行债务合同会导致借款人走投无路甚至自杀时，是应该坚持契约精神要求还款，还是应该以人道主义为由减免债务？",actual_choice:"初期，放贷者和种子公司坚持执行合同，认为'欠债还钱天经地义'。但随着自杀人数激增，国际舆论压力下，印度政府介入，强制要求银行减免部分农业债务，并限制了种子公司的某些合同条款。",consequences:"政府的债务减免拯救了许多农民的生命，但也引发了道德风险争议：如果债务可以因为'困难'而减免，那么契约精神还有何意义？未来谁还愿意借钱给农民？但支持者认为，当合同执行会导致大规模死亡时，生命权必须高于契约权。",choice_support_a:"支持执行合同：虽然同情农民，但合同必须履行，否则信贷体系将崩溃，未来农民更难借到钱。应该通过慈善和社会救济帮助农民，而非破坏契约（契约 > 生命）",choice_support_b:"支持减免债务：当严格执行合同会导致人死亡时，必须以人道主义干预。没有任何合同条款的价值能高过人的生命，法律的目的是保护人而非保护合同（生命 > 契约）",reflection:"如果你是放贷者，面对走投无路的借款人，你会坚持合同还是减免债务？",impact_score:9.5,controversy_level:9},{id:"case_110",value_pair:["contract","life"],direction:"contract_over_life",intuitive_lean:"contract",title:"玛德琳·诺伊曼的临终照护约定",real_person:"玛德琳·诺伊曼（Madeline Neumann）与莫尔斯老年照护中心",year:1995,location:"美国佛罗里达州西棕榈滩",context:"1995年，92岁的阿尔茨海默病患者玛德琳·诺伊曼住在莫尔斯老年照护中心。她的预先医疗指示要求不以人工手段维持生命，养老院的照护合同涉及对这项指示的履行。她的孙女琳达·沙伊布勒担任医疗代理人。当诺伊曼出现急症、无法表达意愿时，养老院叫来急救人员，将她送往医院，并实施了包括插入呼吸管在内的延命措施。这个约定针对符合预先指示的延命情形，并不等于拒绝一切医疗照护。",dilemma:"假如你负责照护诺伊曼，在符合她预先医疗指示的情况下，你会履行不人工延命的照护约定，还是为了让眼前的老人继续活下去，突破约定实施抢救？",actual_choice:"养老院选择呼叫急救，诺伊曼接受了人工延命措施，六天后去世。她的孙女随后起诉养老院。2007年，陪审团认定养老院未尊重她不以人工手段维持生命的意愿，构成违约，判赔15万美元；同时认定当时的医疗主管没有因安排送医而承担相应责任。",consequences:"实施人工延命，让诺伊曼经历了呼吸管等她预先不愿接受的措施，却没有使她恢复长期健康；履行约定，则意味着放弃用这些措施延长她生命的机会。养老院既面对眼前的生命危险，也面对一项恰恰应在患者无法表达意愿时兑现的照护承诺。",choice_support_a:"[契约精神]：履行照护约定，在符合预先医疗指示的情况下不实施人工延命。老人把无法表达时的医疗决定托付给照护机构，机构不能等她失去表达能力后，就以救命为由推翻承诺。即使因此放弃延长生命的机会，也应兑现这项最需要在此刻履行的约定（契约精神 > 生命）",choice_support_b:"[生命]：突破约定，实施抢救。眼前仍是一个可能通过医疗干预继续活下去的人；遵守约定，就可能放弃延长她生命的机会。面对具体的生命危险，即使要承担违约责任，也应先尽力救人，而不是让一份事前文件决定是否延命（生命 > 契约精神）",reflection:"当一项照护承诺真正需要兑现时，代价却是放弃延长一位老人生命的机会，你还会遵守它吗？",impact_score:9.5,controversy_level:9},{id:"case_107",value_pair:["contract","loyalty"],direction:"contract_over_loyalty",intuitive_lean:"contract",title:"勒布朗·詹姆斯的'决定'",real_person:"勒布朗·詹姆斯 (LeBron James)",year:2010,location:"美国克利夫兰",context:"2010年，NBA超级巨星勒布朗·詹姆斯的合同到期，他面临选择：留在家乡球队克利夫兰骑士队（他在这里长大，球迷视他为英雄，他承诺要为家乡带来总冠军），还是跳槽到迈阿密热火队追求总冠军戒指？从合同角度，他完全有权选择任何球队；但从忠诚角度，克利夫兰球迷和整个城市都期待他留下。勒布朗最终在电视直播中宣布：'我要把我的天赋带到南海岸（迈阿密）。'",dilemma:"当职业运动员的合同自由与对家乡、球迷的忠诚发生冲突时，应该优先考虑哪一个？",actual_choice:"勒布朗选择了跳槽迈阿密，行使了合同赋予他的自由选择权。他认为作为职业球员，有权为自己的职业生涯做最好的选择。",consequences:"克利夫兰球迷烧毁了他的球衣，老板发表公开信痛斥他'背叛'。勒布朗在迈阿密赢得了两座总冠军，但'背叛家乡'的污名跟随了他多年。2014年他重返克利夫兰，2016年为骑士夺得总冠军，才部分洗刷了'背叛者'的标签。这个案例引发了关于职业契约与地域忠诚的大讨论。",choice_support_a:"支持勒布朗：职业体育是一份工作，球员有权选择对自己职业生涯最好的选项。合同到期就可以自由选择，这是契约精神的体现，不应该被道德绑架（契约 > 忠诚）",choice_support_b:"批评勒布朗：他不仅是球员，更是克利夫兰的象征和希望。他曾承诺为家乡带来冠军，球迷为他欢呼了七年，这种情感纽带和忠诚比合同条款更重要（忠诚 > 契约）",reflection:"如果你是勒布朗，在合同自由和家乡忠诚之间，你会如何选择？",impact_score:7,controversy_level:8},{id:"case_108",value_pair:["loyalty","contract"],direction:"loyalty_over_contract",intuitive_lean:"loyalty",title:"华容道：曹操旧恩与军令状",real_person:"关羽、曹操、诸葛亮（《三国演义》人物）",year:208,location:"华容道（小说情节）",context:"《三国演义》第五十回写道，赤壁之战后曹操败退，诸葛亮料定他会经过华容道，派关羽前去拦截。关羽起初不愿领命，诸葛亮提醒他曹操昔日待他甚厚；关羽仍表示若放走曹操愿依军法，并立下军令状。曹操被截住后，以往日恩义相求。此情节是小说创作，并非正史记载。",dilemma:"你是关羽，已经接受拦截曹操的军令，并立下军令状承诺：若放走曹操，愿按军法处置。曹操曾厚待你，也在你离去时没有派人追赶。此刻你会执行军令，不让私人恩情影响任务；还是放曹操离开以报旧恩，并承担违背军令状的后果？",actual_choice:"关羽念及曹操旧恩，放曹操及其部众通过华容道。回营后，他没有推诿，主动向诸葛亮请罪。诸葛亮以军令状在先，命人按军法处置；刘备以结义誓言求情，诸葛亮最终饶过关羽。",consequences:"放行使关羽违背了自己明确立下的军令状，回营后面临被处死的风险；他实际请死，最终因刘备求情而免于处置。若执行军令，他则要亲手拦截曾厚待自己的曹操。",choice_support_a:"选择报恩：曹操曾厚待关羽，关羽离去时也没有追杀；面对旧恩主身陷绝境，放他一条生路，即使违背军令状、冒着受军法处置的风险（忠诚 > 契约精神）",choice_support_b:"执行军令：关羽已接受拦截任务，并亲口承诺若放曹便依军法；不能因为私人旧恩就让军令状失去效力，即使这意味着要对曾经厚待自己的人采取行动（契约精神 > 忠诚）",reflection:"当旧恩要求你放走被军令拦截的对象，而你已立下违令受罚的军令状，你会报恩还是守约？",impact_score:9,controversy_level:9},{id:"case_112",value_pair:["faith","contract"],direction:"contract_over_faith",intuitive_lean:"contract",title:"萨姆·佩雷特请求周日休赛被拒",real_person:"萨姆·佩雷特（Sam Perrett）与坎特伯雷斗牛犬队",year:2016,location:"澳大利亚新南威尔士州",context:"2016年，摩门教徒、橄榄球联盟球员萨姆·佩雷特向坎特伯雷斗牛犬队教练德斯·哈斯勒询问，能否像队友威尔·霍波亚特一样不参加周日比赛，以遵守安息日。霍波亚特的周日豁免是在加盟前预先协商并写入合同的；佩雷特没有事先谈妥这项安排。球队当时人员短缺，教练拒绝了请求。佩雷特说自己整个职业生涯都参加过周日比赛，这次并非大事，但他仍想提出请求。",dilemma:"如果你是球队教练，球员在已有赛程安排后提出因信仰不参加周日比赛，你会为宗教实践调整阵容，即使把出场责任转给队友；还是维持此前安排，尤其在球队缺员时要求球员履行已接受的比赛职责？",actual_choice:"哈斯勒没有批准佩雷特的周日豁免，提到霍波亚特的安排是在加盟前协商好的，而球队当时需要佩雷特出场。佩雷特接受了决定；报道记载他此前职业生涯一直参加周日比赛。",consequences:"球队维持了既有赛程和人员安排，佩雷特没有获得宗教上的周日休赛安排。报道没有说明他因此受到纪律处分或经济处罚；争议在于，球员能否在签约时没有谈妥豁免后，再要求球队为安息日调整已经安排的比赛职责。",choice_support_a:"[信仰]：批准周日休赛。遵守安息日是佩雷特认真对待的宗教实践；即使球队缺员，也可以调整阵容，不应要求球员为了履行比赛安排而放弃信仰上的休息日（信仰 > 契约精神）",choice_support_b:"[契约精神]：维持比赛安排。霍波亚特在加盟前谈妥了豁免，佩雷特没有提出同样条件；球队已经按既有赛程组织阵容，临时改动会把责任转给队友。尊重信仰不等于忽视此前接受的职责（契约精神 > 信仰）",reflection:"球员在签约前没有谈妥周日休赛，赛季中因信仰提出请求时，你会调整球队安排还是要求他按原定赛程出场？",impact_score:8,controversy_level:8},{
