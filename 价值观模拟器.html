id:"case_113",value_pair:["faith","contract"],direction:"faith_over_contract",intuitive_lean:"faith",title:"凯文·本德曼拒绝再次赴伊拉克部署",real_person:"凯文·本德曼（Kevin Benderman）",year:2005,location:"美国佐治亚州与伊拉克",context:"凯文·本德曼曾在美国陆军服役，2000年重新入伍，并于2003年随部队赴伊拉克。经历战争并研读《圣经》和《古兰经》后，他提出基于宗教与良心的拒服兵役申请。2004年12月，他申请良心拒服兵役；次年1月，部队准备再次部署时，他没有随队出发。军方后来驳回了他的申请。",dilemma:"本德曼已经重新入伍，仍在服役期间接到随部队再次部署的命令。他可以履行对军队的服役承诺并执行命令，但认为参加这场战争违背了宗教信念；也可以拒绝部署，坚持良心拒服兵役，却可能因违抗军令受到军事审判和刑罚。",actual_choice:"本德曼拒绝随部队再次部署。军事法庭判他未按命令随部队调动罪成立，判处15个月监禁、不名誉退伍并降为列兵；他被判逃兵罪不成立。",consequences:"拒绝部署使本德曼失去自由并结束军旅生涯，也让部队少了一名按命令出发的士兵。若履行服役承诺，他则要参加一场他因宗教和良心理由反对的战争。这个案件让已经作出的服役承诺，与后来形成并付出沉重代价的信仰立场发生直接冲突。",choice_support_a:"[信仰]：坚持拒绝再次部署。一个人不应因曾经入伍，就被要求参与自己基于宗教信念认为错误的战争；即使要承担监禁和退伍处分，也应为良心拒绝杀戮（信仰 > 契约精神）",choice_support_b:"[契约精神]：履行服役承诺并执行部署命令。本德曼重新入伍后仍在服役，部队已按命令集结；个人后来改变看法，不能让战友和军队承担缺员后果。除非获准退役或拒服，仍应先履行已经承担的职责（契约精神 > 信仰）",reflection:"如果你已经重新入伍并接到再次部署命令，却因宗教信念反对这场战争，你会服从命令还是承担拒绝的刑罚？",impact_score:9,controversy_level:9},{id:"case_114",value_pair:["contract","environment"],direction:"contract_over_environment",intuitive_lean:"contract",title:"克拉马斯农户的供水合同",real_person:"农户 Lonny Baley 与克拉马斯盆地灌溉农户",year:2001,location:"美国俄勒冈州与加利福尼亚州交界的克拉马斯盆地",context:"2001年严重干旱期间，美国垦务局为遵守濒危物种保护要求，停止向克拉马斯灌溉项目的大多数农田供水，以维持濒危吸盘鱼和受威胁银大麻哈鱼所需的水量。许多农户长期依赖联邦灌溉项目种植作物，认为政府既然签订供水合同，就不应在关键生长期突然断水。合同本身包含缺水等限制条款，部落水权和濒危物种保护义务也同时适用，因此这并非无条件供水承诺。",dilemma:"如果你是依赖灌溉种植的农户，政府因保护濒危鱼类而停止合同供水，眼看作物和多年生计可能毁于一旦，你会要求政府兑现供水承诺，即使这会减少留给鱼类的水；还是接受停水，让鱼类和河流生态优先？",actual_choice:"垦务局选择按濒危物种保护要求削减供水。农户提起诉讼，主张停水侵犯水权并违反合同；法院没有认定他们享有不受限制的供水权。7月政府虽释放了部分水，但不少农户称为时已晚，无法挽回当季作物损失。",consequences:"停水让许多农户面临作物绝收和收入损失，也使濒危鱼类获得维持生存所需的水量。若继续按合同供水，农户可以保住部分农作物和生计，但鱼类保护目标可能无法实现；若把水留给生态系统，农户便要承担突然失去灌溉水的现实代价。",choice_support_a:"[契约精神]：要求兑现供水承诺。农户长期依赖联邦灌溉项目安排种植和家庭生计；在作物生长期突然断水，会让他们独自承受政策改变的代价。即使保护濒危鱼类很重要，政府也应尊重既有承诺，并公平承担履约造成的后果（契约精神 > 环保）",choice_support_b:"[环保]：把水留给濒危鱼类。吸盘鱼和银大麻哈鱼依赖河流与湖泊生态生存，干旱时继续抽水可能让它们无法存续。供水合同受到水量和法律义务限制，不能要求政府为了农业生产牺牲受保护物种（环保 > 契约精神）",reflection:"当干旱让合同承诺的供水与濒危鱼类的生存用水无法兼得时，你会优先保障农户履约预期，还是把水留给生态系统？",impact_score:9,controversy_level:9},{id:"case_115",value_pair:["environment","contract"],direction:"environment_over_contract",intuitive_lean:"environment",title:"圣华金河复水与农户供水合同",real_person:"圣华金河鲑鱼、Friant灌溉承包方与自然资源保护委员会（NRDC）",year:2006,location:"美国加利福尼亚州圣华金河",context:"Friant大坝建成后，河水被大量引入运河供农业灌溉。大坝下游约60英里的圣华金河河段在多数年份断流，河流上游的原生鲑鱼种群消失。灌溉承包方依靠长期供水合同经营农场；环保组织则起诉，要求政府恢复河流流量并重建鲑鱼栖息地。",dilemma:"如果恢复河水、让鲑鱼重新拥有栖息地，就必须减少一部分按长期供水安排输往农田的水量。你会坚持兑现既有供水合同，还是接受调整供水、优先修复被农业用水改变的河流生态？",actual_choice:"经过18年诉讼，环保组织、Friant灌溉承包方和联邦政府于2006年达成和解；国会于2009年通过法律落实。协议要求逐步向河道恢复流量、重建鲑鱼种群，同时安排措施减轻对灌溉承包方的供水影响。这是经诉讼后协商调整长期供水安排，并非政府单方面违约。",consequences:"恢复流量使圣华金河重获修复河段和重建鲑鱼种群的机会；代价是Friant灌溉承包方长期平均可用水量减少约18%，尽管协议也要求减轻供水影响。农户需要适应较少的灌溉水，河流生态则获得重新恢复的空间。",choice_support_a:"[环保]：让河流重新有水。大坝和灌溉改变使约60英里河段多数年份断流，原生鲑鱼种群在上游消失。恢复河流流量、给鲑鱼重建栖息地的机会，意味着必须接受农田供水减少；长期合同不应让已经受损的河流永远无法恢复（环保 > 契约精神）",choice_support_b:"[契约精神]：保障农户依赖的供水安排。农户依据长期合同规划种植、投资和家庭生计；即使恢复河流有公共价值，也不应轻易减少他们预期可用的水量。若社会决定改变供水规则，应充分补偿受影响者，而不是让农户独自承担代价（契约精神 > 环保）",reflection:"当长期供水合同与修复一条断流并失去鲑鱼的河流发生冲突时，你愿意让农户平均少用一部分水，换取河流生态恢复的机会吗？",impact_score:9,controversy_level:8.5},{id:"case_116",value_pair:["truth","contract"],direction:"truth_over_contract",intuitive_lean:"truth",title:"水门录音：保存追查总统滥权的证据",real_person:"理查德·尼克松、阿瑟·萨姆森与美国国会",year:1974,location:"美国华盛顿特区",context:"尼克松辞职后，他与联邦总务管理局局长阿瑟·萨姆森签订协议，将总统任内文件和录音交由政府保管，并安排日后销毁部分材料。水门录音可能保存总统及其政府如何应对调查的原始记录。若按协议销毁，调查人员和历史研究者可能失去核查总统是否滥用权力、妨碍调查的重要证据。",dilemma:"你是国会议员。政府已与尼克松签订材料保管协议，其中包括日后销毁录音的安排。维护协议有助于守住政府承诺，也尊重前总统对私人通信的隐私主张；但销毁录音可能使公众再也无法查明水门事件中的权力滥用。你会支持遵守协议，还是立法保存材料供合法调查和历史审查？",actual_choice:"国会通过《总统录音与材料保存法》，要求政府保存尼克松任内的相关材料，并阻止按原协议销毁。尼克松起诉挑战该法；1977年最高法院维持法律，认可保存材料供合法政府和历史用途的公共利益，同时要求通过筛查程序保护私人材料。",consequences:"录音没有按协议销毁，得以留作调查和研究水门事件的原始记录；这并不意味着全部材料立即向公众公开，筛查程序仍保护隐私及其他合法利益。国会以立法改变了政府刚签下的安排，尼克松则失去了对材料销毁时间的控制，并通过诉讼维护其权利。",choice_support_a:"[真实]：立法保存录音。水门事件涉及总统权力是否被用于妨碍调查；如果关键对话被销毁，公众和司法机构可能永远无法核实发生了什么。保留原始证据，才能让对权力滥用的调查和历史结论接受事实检验，即使这意味着政府需要改变刚作出的承诺（真实 > 契约精神）",choice_support_b:"[契约精神]：遵守政府与尼克松签订的协议。政府承诺的可信度不应只在方便时才维护，前总统也有权要求私人通信受到保护。若国会在协议签订后专为一人改变规则，未来与政府签约的人可能担心承诺会被追溯推翻；调查需要的材料可以通过既有法律程序取得（契约精神 > 真实）",reflection:"当政府协议安排销毁可能揭示总统如何应对水门调查的原始录音时，你会维护对前总统的承诺，还是立法保存证据、查明权力如何运作？",impact_score:9.5,controversy_level:9.5},{id:"case_117",value_pair:["contract","truth"],direction:"contract_over_truth",intuitive_lean:"contract",title:"亨利·赫斯：守住认罪秘密，还是阻止无辜者被判死刑",real_person:"Henry Hess与一名谋杀案被告",year:1907,location:"阿利瓦尔北，开普殖民地",context:"伦敦律师Henry Hess在开普殖民地阿利瓦尔北为一名谋杀案被告辩护。庭审期间，被告私下向Hess承认自己是真正的凶手，并托付他保守秘密。Hess仍为当事人据理辩护，使其获判无罪。之后，另一名嫌疑人因同一谋杀被定罪、判处死刑。Hess和真正的凶手都知道，这名死刑犯是无辜的。",dilemma:"你是Hess。客户把谋杀认罪秘密托付给你，并要求你守口如瓶。如今，另一名无辜者已被判死刑。你可以守住承诺，维护律师与客户之间的信任；也可以揭露真凶，阻止无辜者被处死。你会如何选择？",actual_choice:"Hess掌握着当事人的认罪秘密。面对无辜者被判死刑，他必须在守住客户托付与揭露真凶之间作出选择。",consequences:"守住秘密，可以维护律师对客户的承诺，以及未来客户坦白事实的信任；代价是无辜者可能被处死。揭露真相有机会纠正冤案、挽救一条生命；代价是背弃当事人的托付，并动摇律师保密义务。",choice_support_a:"[契约精神]：守住当事人托付的秘密。律师若能在客户认罪后随时转而揭发客户，人们就难以放心向辩护律师坦白，律师也无法据实提供法律帮助。信守受托保密的承诺，维护的是辩护关系和每个人获得有效辩护的保障；即便眼前出现令人痛心的结果，也不能轻易背弃托付（契约精神 > 真实）",choice_support_b:"[真实]：揭露认罪，阻止无辜者承受极刑。律师掌握的不是一般隐私，而是可能纠正一宗谋杀冤案的关键信息；沉默可能让无辜者被处死。受托关系固然重要，但若它要求律师眼看无辜者承担不可挽回的惩罚，查明事实、挽救生命就有更高优先性（真实 > 契约精神）",reflection:"当受托保密的承诺与阻止无辜者被判死刑正面冲突时，你认为律师应守住信任，还是揭露事实？",impact_score:10,controversy_level:9.5},{id:"case_118",value_pair:["family","safety"],direction:"safety_over_family",intuitive_lean:"family",title:"查理·卡斯珀：去接女儿，还是赶赴世贸中心？",real_person:"查尔斯·卡斯珀 (Charles L. Kasper)",year:2001,location:"美国纽约市",context:"2001年9月11日，FDNY副局长查尔斯·卡斯珀休班在家时接到呼叫，赶赴遭袭的世贸中心。当天，他的女儿梅丽莎带着18个月大的儿子迪伦住在世贸中心附近；她目睹撞击后打电话回家，十分惊慌。卡斯珀离家前托妻子转告女儿：等他处理完世贸中心的火情，就去接她和孩子。这段承诺来自家属回忆。卡斯珀曾任曼哈顿 Rescue Company 1 队长，参与过1993年世贸中心爆炸案救援；家属后来撤离并平安回家，而卡斯珀在世贸中心倒塌中殉职。",dilemma:"假设你是卡斯珀。你答应了受惊的女儿，处理完现场后亲自去接她和18个月大的外孙；与此同时，世贸中心遭到袭击，城市正面临大规模伤亡，你作为资深救援指挥人员赶赴现场。你会优先赶到家人身边，亲自履行接他们离开的承诺；还是先投入公共救援，把家人交由撤离安排照顾，并承担可能无法亲自兑现承诺的代价？",actual_choice:"家属回忆记载，卡斯珀赶赴世贸中心前让妻子转告女儿，等他处理完现场就去接她和孩子。他后来在世贸中心倒塌中殉职，没能履行这项承诺。史料没有证明他当时面临必须先接家人或只有他能参与救援的明确二选一；这里的两难是依据其经历提出的价值讨论。",consequences:"卡斯珀的家人后来撤离并平安回家，但他在倒塌中殉职。若先去接家人，他可以亲自带他们离开危险区域，却会暂时缺席一场波及大量公众的灾难救援；若先投入救援，则要把家人的撤离交给他人，并承担无法回来兑现亲口承诺的风险。",choice_support_a:"选择亲情：先去接女儿和外孙，亲自把他们带离世贸中心附近。你答应过会来接他们；在家人正处于恐慌和危险中时，不能把这份责任全交给别人，即使现场还有大量伤者等待救援（亲情 > 公共安全）",choice_support_b:"选择公共安全：先赶赴世贸中心投入救援。袭击已造成大规模伤亡，作为受过专业训练的资深救援指挥人员，你应先帮助现场更多人；即使因此无法亲自接女儿和外孙，也要承担失约的代价（公共安全 > 亲情）",reflection:"当你答应亲自接走身处危险附近的女儿和年幼外孙，却同时面对一场大规模公共灾难时，你会先履行对家人的承诺，还是先赶赴现场救援？",impact_score:9.5,controversy_level:8.5}],jh=[{id:"justice",name:"正义",description:"维护公平、惩罚作恶、保护无辜与弱势群体，无辜者不应受牵连，即使代价高昂",examples:["举报腐败","保护无辜","揭露真相","对抗不公","维护弱者权益"]},{id:"freedom",name:"自由",description:"个人选择的权利、思想和行动的自主性，不受他人强制",examples:["言论自由","迁徙自由","拒绝服从","追求理想"]},{id:"life",name:"生命",description:"保护生命、反对杀戮，生命权高于一切",examples:["救人优先","反对死刑","医疗救助","不杀生"]},{id:"family",name:"亲情",description:"家庭纽带、血缘关系、保护亲人，家人利益优先",examples:["保护家人","孝顺父母","不出卖亲人","家族利益"]},{id:"faith",name:"信仰",description:"宗教信念、政治理想、意识形态，为信仰献身",examples:["宗教戒律","政治理想","革命事业","坚守信念"]},{id:"truth",name:"真实/求真",description:"追求客观真理、科学事实、历史真相，拒绝谎言和虚假，真实高于一切",examples:["追求科学真理","揭露历史真相","拒绝谎言","坚守事实","学术诚信"]},{id:"loyalty",name:"忠诚",description:"对组织、国家、雇主、朋友的忠诚，不背叛",examples:["保守秘密","服从命令","不背叛","坚守岗位"]},{id:"safety",name:"公共安全",description:"保护公众免受危险、维护社会秩序，集体安全优先",examples:["防疫措施","反恐行动","监控系统","紧急状态"]},{id:"environment",name:"环境保护",description:"保护自然、减少污染、可持续发展，生态优先",examples:["反对开发","减排降碳","动物保护","绿色生活"]},{id:"contract",name:"契约精神",description:"信守承诺、遵守协议，即使代价高昂也履行合同义务",examples:["履行合同","信守诺言","商业诚信","遵守约定","不违约"]}],Ch=Nh,ca=jh;function hd(){return ca}function Ph(e){return ca.find(t=>t.id===e)}function co(e,t){return Ch.filter(n=>{const[r,l]=n.value_pair;return r===e&&l===t||r===t&&l===e})}function Lh(e){const t=[...e];for(let n=t.length-1;n>0;n--){const r=Math.floor(Math.random()*(n+1));[t[n],t[r]]=[t[r],t[n]]}return t}function Rh(e){const t=[];for(let n=0;n<e.length;n++)for(let r=n+1;r<e.length;r++){const l=[e[n],e[r]];co(l[0],l[1]).length>0&&t.push(l)}return Lh(t)}function Th(e,t){const n={},r={};for(const o of e)n[o]=[],r[o]=0;for(const[o,a,s]o
