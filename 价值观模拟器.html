,location:"日本东京",context:"1990年代日本经济泡沫破裂后，许多大企业陷入困境。索尼、松下等公司开始考虑打破传统的'终身雇佣'承诺，裁员降低成本。虽然法律上这些企业有权裁员（雇佣合同中有相关条款），但'终身雇佣'是日本企业文化的核心：员工对公司绝对忠诚，公司则承诺照顾员工一生。许多50岁以上的员工为公司奉献了30年，放弃了跳槽机会，如今却面临被裁的风险。",dilemma:"当企业的经济理性（裁员降低成本）与对忠诚员工的道德承诺发生冲突时，企业应该严格按照雇佣合同行事，还是应该坚守对忠诚员工的承诺？",actual_choice:"大部分日本企业在巨大的社会压力下，选择了折中方案：通过减薪、冻结招聘、鼓励提前退休等方式削减成本，尽量避免直接裁员。只有极少数企业进行了大规模裁员。",consequences:"日本企业在经济困难时期坚守了对员工的忠诚承诺，维护了社会稳定，但也付出了经济代价——恢复速度慢于美国企业。这个选择体现了日本文化中忠诚高于契约的价值观。但年轻一代开始质疑：这种牺牲经济效率的忠诚是否值得？",choice_support_a:"支持忠诚优先：员工为公司奉献了一生，公司不能在困难时抛弃他们。这种相互忠诚的文化是日本企业的优势，不应该为了短期经济利益而破坏（忠诚 > 契约）",choice_support_b:"支持合同优先：企业必须根据经济现实做决策，雇佣合同允许的裁员是合法的。如果企业因为无法裁员而破产，所有人都会失业，理性的契约执行反而保护了更多人（契约 > 忠诚）",reflection:"如果你是企业管理者，在经济危机中你会裁掉忠诚老员工以拯救企业，还是坚守承诺但面临破产风险？",impact_score:8,controversy_level:8.5}],A$=[{id:"justice",name:"正义",description:"维护公平、惩罚作恶、伸张正义，即使代价高昂",examples:["举报腐败","揭露真相","对抗不公","维护弱者权益"]},{id:"freedom",name:"自由",description:"个人选择的权利、思想和行动的自主性，不受他人强制",examples:["言论自由","迁徙自由","拒绝服从","追求理想"]},{id:"life",name:"生命",description:"保护生命、反对杀戮，生命权高于一切",examples:["救人优先","反对死刑","医疗救助","不杀生"]},{id:"family",name:"亲情",description:"家庭纽带、血缘关系、保护亲人，家人利益优先",examples:["保护家人","孝顺父母","不出卖亲人","家族利益"]},{id:"faith",name:"信仰",description:"宗教信念、政治理想、意识形态，为信仰献身",examples:["宗教戒律","政治理想","革命事业","坚守信念"]},{id:"truth",name:"真实/求真",description:"追求客观真理、科学事实、历史真相，拒绝谎言和虚假，真实高于一切",examples:["追求科学真理","揭露历史真相","拒绝谎言","坚守事实","学术诚信"]},{id:"loyalty",name:"忠诚",description:"对组织、国家、雇主、朋友的忠诚，不背叛",examples:["保守秘密","服从命令","不背叛","坚守岗位"]},{id:"safety",name:"公共安全",description:"保护公众免受危险、维护社会秩序，集体安全优先",examples:["防疫措施","反恐行动","监控系统","紧急状态"]},{id:"environment",name:"环境保护",description:"保护自然、减少污染、可持续发展，生态优先",examples:["反对开发","减排降碳","动物保护","绿色生活"]},{id:"no_harm",name:"不伤害无辜",description:"避免伤及无关者、保护弱势群体，无辜者不应受牵连",examples:["平民保护","避免误伤","人道主义","同情弱者"]},{id:"contract",name:"契约精神",description:"信守承诺、遵守协议，即使代价高昂也履行合同义务",examples:["履行合同","信守诺言","商业诚信","遵守约定","不违约"]}],j$={fiscal_revenue:{name:"fiscal_revenue",display_name:"财政收入",value:450,normalized:55,unit:"亿 alized:65,unit:"%",trend:"stable"},market_share:{name:"market_share",display_name:"市场占有率",value:28,normalized:68,unit:"%",trend:"stable"},regulatory_risk:{name:"regulatory_risk",display_name:"监管风险",value:45,normalized:55,unit:"分",trend:"stable"},brand_reputation:{name:"brand_reputation",display_name:"品牌声誉",value:78,normalized:78,unit:"分",trend:"stable"},international_degree:{name:"international_degree",display_name:"国际化程度",value:42,normalized:42,unit:"%",trend:"stable"}},T$={gdp_total:{name:"gdp_total",display_name:"GDP总量",value:1200,normalized:40,unit:"亿美元",trend:"stable"},gdp_growth:{name:"gdp_growth",display_name:"GDP增速",value:4.8,normalized:58,unit:"%",trend:"stable"},public_support:{name:"public_support",display_name:"国民支持率",value:55,normalized:55,unit:"%",trend:"stable"},forex_reserves:{name:"forex_reserves",display_name:"外汇储备",value:85,normalized:45,unit:"亿美元",trend:"stable"},diplomatic_relations:{name:"diplomatic_relations",display_name:"外交关系",value:60,normalized:60,unit:"分",trend:"stable"},military_defense:{name:"military_defense",display_name:"军事防御",value:42,normalized:42,unit:"分",trend:"stable"},corruption_index:{name:"corruption_index",display_name:"腐败指数",value:55,normalized:45,unit:"分",trend:"stable"},brain_drain:{name:"brain_drain",display_name:"人才外流",value:35,normalized:65,unit:"分",trend:"stable"}},C$={gdp_total:{name:"gdp_total",display_name:"GDP总量",value:18e4,normalized:88,unit:"亿美元",trend:"stable"},gdp_growth:{name:"gdp_growth",display_name:"GDP增速",value:3.2,normalized:55,unit:"%",trend:"stable"},domestic_support:{name:"domestic_support",display_name:"国内支持率",value:52,normalized:52,unit:"%",trend:"stable"},military_strength:{name:"military_strength",display_name:"军事实力",value:92,normalized:92,unit:"分",trend:"stable"},diplomatic_influence:{name:"diplomatic_influence",display_name:"外交影响力",value:85,normalized:85,unit:"分",trend:"stable"},tech_leadership:{name:"tech_leadership",display_name:"科技领先",value:78,normalized:78,unit:"分",trend:"stable"},currency_stability:{name:"currency_stability",display_name:"货币稳定",value:82,normalized:82,unit:"分",trend:"stable"},sanction_pressure:{name:"sanction_pressure",display_name:"制裁压力",value:25,normalized:75,unit:"分",trend:"stable"}},k$={mayor:j$,small_company:E$,tech_giant:$$,small_nation:T$,superpower:C$},N$=[{id:"mayor_theme1",title:"工业引进与生态保护",description:"一边是就业和GDP，一边是碧水蓝天，你如何在发展与环境之间取舍？",scenarios:[{id:"mayor_t1_s1",type:"resource_allocation",title:"重化工业园落地",description:"省里有意将一个大型重化工业园落户你的城市，将带来5万个就业岗位和每年50亿元的财政收入。但环保评估显示，该项目会使城市PM2.5超标30%，两条主要河流面临污染风险。部分市民已开始联名请愿反对。",choices:[{id:"A",text:"全力引进，以就业和财税为首要目标",immediate_effects:{fiscal_revenue:18,gdp_growth:15,unemployment:12,environment_index:-20,citizen_satisfaction:-8},delayed_effects:[{delay_rounds:2,metric:"citizen_satisfaction",delta:-12,description:"空气质量恶化引发更大规模市民抗议"}],econ_principle:"externality_negative",principle_explanation:"负外部性：工厂将污染成本转移给全体市民，企业利润私有化而环境代价社会化，是经典的市场失灵。"},{id:"B",text:"拒绝引进，坚持绿色发展路线",immediate_effects:{environment_index:8,citizen_satisfaction:10,fiscal_revenue:-5,gdp_growth:-8,unemployment:-5},delayed_effects:[{delay_rounds:3,metric:"fiscal_revenue",delta:8,description:"绿色产业逐步填补财税缺口"}],econ_principle:"sustainability",principle_explanation:"可持续发展：清洁的环境本身是生产力，吸引高端人才和新经济企业，长期GDP质量高于重化工业路线。"},{id:"C",text:"有条件引进：企业须达到最严环保标准",immediate_effects:{fiscal_revenue:8,gdp_growth:6,unemployment:5,environment_index:-8},delayed_effects:[{delay_rounds:2,metric:"environment_index",delta:-5,description:"执法难度大，部分环保措施流于形式"}],econ_principle:"pigouvian_tax",principle_explanation:"庇古税原理：通过严格环保标准将外部成本内化，理论上可以实现效率与环保的平衡，但监管执行是关键。"},{id:"D",text:"召开公众听证会，让市民参与决策",immediate_effects:{citizen_satisfaction:12,social_stability:8,fiscal_revenue:-2,gdp_growth:-3},delayed_effects:[],econ_principle:"public_goods",principle_explanation:"公共物品理论：空气和水是公共物品，其使用决策应当通过民主程序做出，而非仅由政府和企业决定。"}]},{id:"mayor_t1_s2",type:"crisis_response",title:"环境污染爆发",description:"工业园区投产18个月后，下游河流出现大面积死鱼，周边3个村庄的饮用水受到污染。流行病学调查显示当地呼吸道疾病发病率上升40%。事件迅速发酵成全国性热点，环保部门督察组已抵达，要求限期整改。",choices:[{id:"A",text:"责令工厂立即停产整顿，启动污染治理",immediate_effects:{environment_index:10,citizen_satisfaction:8,fiscal_revenue:-12,gdp_growth:-10,social_stability:10},delayed_effects:[{delay_rounds:2,metric:"environment_index",delta:8,description:"治理成效显现，环境质量逐步恢复"}],econ_principle:"command_control",principle_explanation:"命令与控制：行政手段是最直接的环境政策工具，在紧急情况下命令停产比市场手段更能快速止损。"},{id:"B",text:"争取宽限期，给企业时间自行整改",immediate_effects:{environment_index:-5,citizen_satisfaction:-15,fiscal_revenue:-3,social_stability:-12},delayed_effects:[{delay_rounds:2,metric:"citizen_satisfaction",delta:-18,description:"宽限期内污染持续，群体性事件升级"}],econ_principle:"regulatory_capture",principle_explanation:"监管俘获：被监管对象影响监管者决策，政府丧失中立立场，最终损害公共利益并引发更大危机。"},{id:"C",text:"启动生态补偿，向受影响居民发放补贴",immediate_effects:{citizen_satisfaction:6,deficit_rate:-10,fiscal_revenue:-8,social_stability:5},delayed_effects:[{delay_rounds:2,metric:"social_stability",delta:-8,description:"补偿金额争议引发新的社会矛盾"}],econ_principle:"compensation_principle",principle_explanation:"补偿原则：Pareto改进要求受害者得到补偿，但货币补偿能否真正弥补健康损失是道德层面的根本争议。"},{id:"D",text:"将责任主要归咎于企业，与地方政府切割",immediate_effects:{citizen_satisfaction:-5,social_stability:-8,fiscal_revenue:-5},delayed_effects:[{delay_rounds:2,metric:"social_stability",delta:-15,description:"公众和媒体追究政府的审批责任，监督追责持续发酵"}],econ_principle:"principal_agent",principle_explanation:"委托代理：政府作为公共利益受托人，审批引进的决策本身已构成责任，撇清关系会让公众更加愤怒。"}]}]},{id:"mayor_theme2",title:"土地财政困局",description:"土地出让是地方财政的命脉，但失地农民的权益不容忽视。",scenarios:[{id:"mayor_t2_s1",type:"ethical_dilemma",title:"大规模征地开发",description:"城市向东扩张计划获批，需要征收5个行政村共2000亩土地用于商业地产开发。开发商测算，土地出让将为城市带来80亿元财政收入。补偿标准按法定最低标准执行，但部分村民认为补偿过低，有300户明确表示不愿搬迁。",choices:[{id:"A",text:"按法定最低标准强制征迁，保证项目进度",immediate_effects:{fiscal_revenue:20,gdp_growth:12,citizen_satisfaction:-18,social_stability:-15},delayed_effects:[{delay_rounds:2,metric:"social_stability",delta:-12,description:"强制拆迁引发群体事件，维稳成本激增"}],econ_principle:"eminent_domain",principle_explanation:"征收权：政府有权为公共目的征收私有财产，但必须给予公正补偿，最低标准补偿在道德和法律上都存在争议。"},{id:"B",text:"提高补偿标准至市价，争取村民自愿搬迁",immediate_effects:{fiscal_revenue:8,citizen_satisfaction:8,social_stability:10,gdp_growth:5},delayed_effects:[],econ_principle:"willingness_to_accept",principle_explanation:"受偿意愿：补偿应基于被征收者的真实受偿意愿而非政府单方定价，这是经济学对公平征收的基本要求。"},{id:"C",text:"修改规划，仅征收无人居住的工业用地",immediate_effects:{fiscal_revenue:-8,citizen_satisfaction:5,social_stability:5,gdp_growth:-5},delayed_effects:[{delay_rounds:3,metric:"fiscal_revenue",delta:6,description:"调整后开发规模缩减但矛盾减少，长期运营更稳定"}],econ_principle:"least_harm",principle_explanation:"最小伤害原则：在达成发展目标的前提下选择社会成本最小的路径，是公共政策设计的基本原则。"},{id:"D",text:"让开发商负责谈判和补偿，政府退居二线",immediate_effects:{fiscal_revenue:15,social_stability:-8,citizen_satisfaction:-10,public_service:-3},delayed_effects:[{delay_rounds:2,metric:"citizen_satisfaction",delta:-12,description:"开发商追求利润最大化，激化与居民矛盾，政府被迫介入"}],econ_principle:"regulatory_outsourcing",principle_explanation:"监管外包：让利益方主导谈判必然导致结果偏向利益方，政府的中立监管职能不可外包。"}]},{id:"mayor_t2_s2",type:"crisis_response",title:"失地农民抗议",description:"强制征迁已执行，但600名失地农民在市政府门口集会维权，诉求包括：重新核定补偿标准、解决就业安置问题。事件引起省级媒体和全国网络关注。信访部门报告显示，上访案件本月激增230%。",choices:[{id:"A",text:"重新协商补偿标准，增加安置就业资金",immediate_effects:{citizen_satisfaction:12,social_stability:15,fiscal_revenue:-10,deficit_rate:-8},delayed_effects:[{delay_rounds:2,metric:"social_stability",delta:8,description:"妥善安置后社会矛盾化解，维稳压力减轻"}],econ_principle:"conflict_resolution",principle_explanation:"冲突解决：主动回应诉求是化解群体性事件的有效方式，拖延只会导致矛盾积累，爆发时代价更高。"},{id:"B",text:"依法处理违规行为，坚持原方案不变",immediate_effects:{social_stability:-20,citizen_satisfaction:-15,public_service:-8},delayed_effects:[{delay_rounds:2,metric:"social_stability",delta:-15,description:"强硬回应激化矛盾，省政府介入追责"}],econ_principle:"rule_of_law",principle_explanation:"法治原则：依法行政是正确的，但若法规本身存在对弱势群体不公平之处，坚持法律可能使合法性危机加剧。"},{id:"C",text:"启动专项就业培训和创业帮扶计划",immediate_effects:{citizen_satisfaction:8,social_stability:8,public_service:8,fiscal_revenue:-5},delayed_effects:[{delay_rounds:3,metric:"unemployment",delta:5,description:"就业培训效果显现，失地农民逐步融入城市"}],econ_principle:"human_capital",principle_explanation:"人力资本投资：授人以鱼不如授人以渔，通过提升技能帮助失地农民转型，是长期可持续的解决方案。"},{id:"D",text:"引导媒体报道开发项目的发展成果",immediate_effects:{citizen_satisfaction:-5,social_stability:-10,gdp_growth:3},delayed_effects:[{delay_rounds:2,metric:"citizen_satisfaction",delta:-12,description:"公关操作被识破，更多负面信息曝光"}],econ_principle:"information_management",principle_explanation:"信息管理：在社交媒体时代，信息封锁几乎不可能，试图用正面宣传掩盖真实矛盾只会加深不信任。"}]}]},{id:"mayor_theme3",title:"财政赤字应对",description:"当入不敷出，是削减公共服务，还是另辟蹊径度过难关？",scenarios:[{id:"mayor_t3_s1",type:"long_short_tradeoff",title:"削减公共服务预算",description:"今年财政缺口达到25亿元，必须在年底前平衡账目。财政局给出了三套方案：大幅削减教育医疗补贴（可节省18亿）、推迟基础设施项目（可节省12亿）、向省里申请特别转移支付（但需要提交整改计划并接受绩效考核）。",choices:[{id:"A",text:"削减教育医疗补贴，平衡财政账目",immediate_effects:{deficit_rate:15,fiscal_revenue:8,public_service:-18,citizen_satisfaction:-15},delayed_effects:[{delay_rounds:2,metric:"public_service",delta:-8,description:"公共服务持续恶化，优质人才加速外流"}],econ_principle:"austerity",principle_explanation:"紧缩政策：削减公共服务是平衡财政的快捷路径，但有大量经济学证据显示紧缩往往抑制长期增长潜力。"},{id:"B",text:"申请省级转移支付，接受绩效考核",immediate_effects:{deficit_rate:10,fiscal_revenue:12,public_service:-3,gdp_growth:3},delayed_effects:[],econ_principle:"fiscal_federalism",principle_explanation:"财政联邦主义：上级转移支付是地方财政困难时的正常救济机制，但绩效约束也倒逼地方提升治理效率。"},{id:"C",text:"推迟基础设施项目，优先保民生支出",immediate_effects:{deficit_rate:8,public_service:3,citizen_satisfaction:5,gdp_growth:-8},delayed_effects:[{delay_rounds:3,metric:"gdp_growth",delta:-5,description:"基础设施滞后制约经济发展，招商引资受阻"}],econ_principle:"public_investment",principle_explanation:"公共投资乘数：基础设施投资对经济增长有乘数效应，延迟投资的机会成本在经济分析中常被低估。"},{id:"D",text:"发行城投债扩大融资，以发展换时间",immediate_effects:{fiscal_revenue:15,gdp_growth:8,public_service:5,deficit_rate:-15},delayed_effects:[{delay_rounds:3,metric:"deficit_rate",delta:-20,description:"债务累积形成系统性财政风险"}],econ_principle:"debt_financing",principle_explanation:"债务融资：城投债短期解决流动性问题，但隐性债务积累是当前地方财政的主要风险源，滚雪球效应严重。"}]},{id:"mayor_t3_s2",type:"crisis_response",title:"教师医生罢工",description:"连续两年削减教育医疗预算后，后果开始显现：600名教师集体请假、3家公立医院非急救服务停摆。工会发表声明要求恢复原预算水平否则将升级行动。同时，已有2所优质学校的教师集体跳槽至邻市私立学校。",choices:[{id:"A",text:"立即恢复预算，并就历史削减致歉",immediate_effects:{public_service:15,citizen_satisfaction:12,deficit_rate:-12,fiscal_revenue:-8},delayed_effects:[{delay_rounds:2,metric:"citizen_satisfaction",delta:8,description:"服务质量恢复，市民满意度持续提升"}],econ_principle:"commitment_device",principle_explanation:"承诺机制：公开道歉并恢复预算是一种承诺，可以稳定教育医疗从业者的预期，防止进一步人才流失。"},{id:"B",text:"开除带头停工者，依法处理违规行为",immediate_effects:{social_stability:-20,public_service:-10,citizen_satisfaction:-18},delayed_effects:[{delay_rounds:2,metric:"public_service",delta:-15,description:"开除引发更大规模离职潮，公共服务体系接近崩溃"}],econ_principle:"efficiency_wage_inverse",principle_explanation:"反效率工资：惩罚高技能公务员只会加速人才外流，在劳动力市场竞争中，政府难以靠强制留住人才。"},{id:"C",text:"引入社会资本，推进教育医疗市场化",immediate_effects:{fiscal_revenue:5,public_service:-5,citizen_satisfaction:-8,gdp_growth:3},delayed_effects:[{delay_rounds:3,metric:"citizen_satisfaction",delta:-10,description:"低收入群体无力承担私有化后的涨价，不满持续上升"}],econ_principle:"privatization",principle_explanation:"私有化：教育医疗私有化在效率上有争议，关键问题是公平性——市场化可能加剧不平等，引发更深层的社会矛盾。"},{id:"D",text:"成立薪酬委员会谈判，寻求折中方案",immediate_effects:{citizen_satisfaction:5,public_service:3,social_stability:8,deficit_rate:-5},delayed_effects:[],econ_principle:"collective_bargaining",principle_explanation:"集体谈判：通过制度化渠道解决劳动争议，比对抗性处理更能降低长期摩擦成本，也符合现代劳动关系原则。"}]}]},{id:"mayor_theme4",title:"群体事件应对",description:"当社会矛盾激化，你的处置方式将定义这座城市的治理底色。",scenarios:[{id:"mayor_t4_s1",type:"game_theory",title:"示威人群聚集",description:"环保、失地、医疗等多个议题的不满情绪在网络上汇聚，一场自发组织的大规模示威已有5000人参与，集会地点距市政府仅200米。诉求涉及多个历史遗留问题，部分组织者正在鼓动更激进行动。警察局长请示如何处置。",choices:[{id:"A",text:"派出警力强制清场，恢复秩序",immediate_effects:{social_stability:8,citizen_satisfaction:-22,public_service:-5},delayed_effects:[{delay_rounds:2,metric:"social_stability",delta:-18,description:"强力清场激化矛盾，更大规模示威酝酿"}],econ_principle:"game_theory",principle_explanation:"博弈论视角：暴力清场是一个短视策略，它可能赢得这次对峙，但改变了游戏参与者对政府的预期，引发更强烈反应。"},{id:"B",text:"主动与代表对话，承诺解决核心诉求",immediate_effects:{citizen_satisfaction:12,social_stability:10,public_service:5,fiscal_revenue:-3},delayed_effects:[{delay_rounds:2,metric:"citizen_satisfaction",delta:8,description:"对话后信任关系改善，后续诉求表达趋于理性"}],econ_principle:"cooperative_game",principle_explanation:"合作博弈：对话是一种帕累托改进——政府获得合法性，市民诉求得到回应，双方都能获益于和平解决。"},{id:"C",text:"申请上级授权，将责任上移",immediate_effects:{social_stability:-8,citizen_satisfaction:-10,gdp_growth:-5},delayed_effects:[{delay_rounds:2,metric:"citizen_satisfaction",delta:-8,description:"拖延使情绪进一步激化，省政府调查组下访"}],econ_principle:"accountability_avoidance",principle_explanation:"责任规避：将危机上移可以暂时保护个人政治安全，但导致问题失去最佳处理时机，往往代价更高。"},{id:"D",text:"向媒体展示城市治理成就，转移视线",immediate_effects:{citizen_satisfaction:-8,social_stability:-12,gdp_growth:3},delayed_effects:[{delay_rounds:2,metric:"social_stability",delta:-15,description:"公关策略被市民识破，怨气积聚达到临界点"}],econ_principle:"credibility_deficit",principle_explanation:"公信力赤字：当政府公信力已经受损时，正面宣传效果大打折扣，甚至会产生反效果，加深不信任感。"}]},{id:"mayor_t4_s2",type:"strategic_choice",title:"城市治理转型抉择",description:"经历了多次社会矛盾后，省委书记找你谈话，要求你对城市未来治理方向做出明确表态。这是你任期内的最后一次重大选择：是修复已有的裂痕、建立长效机制，还是在剩余任期内冲KPI，留给继任者去处理？",choices:[{id:"A",text:"建立公众参与机制，推进阳光政府改革",immediate_effects:{citizen_satisfaction:15,social_stability:12,public_service:8,gdp_growth:-3},delayed_effects:[{delay_rounds:2,metric:"citizen_satisfaction",delta:10,description:"参与式治理改善了政策质量，矛盾大幅减少"}],econ_principle:"institutional_design",principle_explanation:"制度设计：好的制度比好的领导人更可靠，建立公众参与和问责机制是系统性解决问题的根本途径。"},{id:"B",text:"全力冲刺GDP，用发展红利化解矛盾",immediate_effects:{gdp_growth:15,fiscal_revenue:12,citizen_satisfaction:-5,environment_index:-8},delayed_effects:[{delay_rounds:2,metric:"social_stability",delta:-10,description:"快速发展拉大贫富差距，社会矛盾反而加剧"}],econ_principle:"trickle_down",principle_explanation:"涓滴效应：依靠经济增长解决社会问题的理论在实践中效果有限，增长红利的分配机制至关重要。"},{id:"C",text:"优先修复生态和公共服务，还清欠账",immediate_effects:{environment_index:12,public_service:15,citizen_satisfaction:12,fiscal_revenue:-10},delayed_effects:[{delay_rounds:3,metric:"gdp_growth",delta:8,description:"优质环境和公服吸引高端产业落户，长期发展质量改善"}],econ_principle:"social_capital",principle_explanation:"社会资本：信任、健康、教育是生产力的基础，提升公共服务是投资社会资本，长期回报丰厚但不易量化。"},{id:"D",text:"引进数字治理技术，用科技提升管理效率",immediate_effects:{public_service:10,fiscal_revenue:-5,gdp_growth:5,social_stability:5},delayed_effects:[{delay_rounds:2,metric:"citizen_satisfaction",delta:-3,description:"数字监控扩张引发隐私担忧，部分群体产生抵触"}],econ_principle:"technology_governance",principle_explanation:"技术治理：数字化工具可以提升效率，但不能替代政治信任和价值共识，更不能作为监控扩张的借口。"}]}]},{id:"mayor_theme5",title:"城市的未来方向",description:"任期最后阶段，你的选择将为这座城市留下深远的历史遗产。",scenarios:[{id:"mayor_t5_s1",type:"strategic_choice",title:"城市发展战略定位",description:"经过多年任期，你的城市走到了一个关键节点。国家级新区申报窗口期仅有6个月，申报成功将带来巨额政策红利，但需要大量配套投入。与此同时，一个有潜力成为地区科创中心的机会正在形成，但见效周期长达5-8年，可能超出你的任期。还有一个选择是聚焦民生和公共服务，以宜居城市品牌打造差异化竞争力。",choices:[{id:"A",text:"全力申报国家级新区，争取政策红利",immediate_effects:{fiscal_revenue:20,gdp_growth:18,citizen_satisfaction:5,deficit_rate:-15},delayed_effects:[{delay_rounds:2,metric:"environment_index",delta:-10,description:"开发规模扩张对生态带来新压力"}],econ_principle:"policy_rents",principle_explanation:"政策租金：国家级新区的政策红利是真实的，但过度依赖政策洼地会压制真正的市场竞争力培育。"},{id:"B",text:"布局科创生态，甘愿长远谋划",immediate_effects:{gdp_growth:5,public_service:8,citizen_satisfaction:8,fiscal_revenue:-5},delayed_effects:[{delay_rounds:3,metric:"fiscal_revenue",delta:15,description:"科创企业集聚带来高质量税源，经济结构改善"}],econ_principle:"endogenous_growth",principle_explanation:"内生增长理论：知识和创新是长期经济增长的真正引擎，布局科创是为城市积累可持续的竞争力。"},{id:"C",text:"专注宜居城市建设，以人为本",immediate_effects:{citizen_satisfaction:20,public_service:18,environment_index:12,fiscal_revenue:-8},delayed_effects:[{delay_rounds:2,metric:"gdp_growth",delta:8,description:"优质生活环境吸引高素质人才，带动创新和消费"}],econ_principle:"amenity_value",principle_explanation:"宜居价值：城市的魅力是吸引人才、企业和投资的软实力，高质量生活环境是可持续发展的重要基础。"},{id:"D",text:"平衡三者，追求综合协调发展",immediate_effects:{gdp_growth:8,citizen_satisfaction:8,fiscal_revenue:5,environment_index:3},delayed_effects:[],econ_principle:"balanced_development",principle_explanation:"均衡发展：三者并重避免了极端路线，但在资源有限的情况下，均衡可能意味着没有一个方向做到极致。"}]}]}],M$=[{id:"sc_theme1",title:"加班政策风波",description:"面对竞争压力，是否用员工的时间换取竞争优势？",scenarios:[{id:"sc_t1_s1",type:"ethical_dilemma",title:"强制加班令",description:"竞争对手刚发布新产品，市场压力骤增。财务总监建议推行每周6天、日均10小时的加班制度，短期内可大幅提升产能和研发速度。HR经理却警告说，多名核心员工已经在抱怨工作强度，部分人正在被猎头接触。你面临关键抉择：用加班换速度，还是保护团队？",choices:[{id:"A",text:"强制推行加班制度，以竞争优先",immediate_effects:{revenue:12,market_share:8,employee_satisfaction:-18,retention_rate:-10,profit_margin:5},delayed_effects:[{delay_rounds:2,metric:"retention_rate",delta:-12,description:"骨干员工陆续离职，项目出现延误"}],econ_principle:"marginal_diminishing",principle_explanation:"短期生产率上升，但边际效益递减——疲惫的员工错误率更高，创新能力下降，长期反而损失更多。"},{id:"B",text:"拒绝强制加班，优化工作流程代替",immediate_effects:{employee_satisfaction:10,retention_rate:8,revenue:-5,market_share:-4},delayed_effects:[{delay_rounds:3,metric:"revenue",delta:8,description:"流程优化后人效提升，收入回升"}],econ_principle:"marginal_diminishing",principle_explanation:"拒绝低效增长，通过系统性优化提升人均产出，是更可持续的竞争力来源。"},{id:"C",text:"推行弹性加班并给予加班补贴",immediate_effects:{revenue:6,employee_satisfaction:-5,profit_margin:-4,market_share:3},delayed_effects:[],econ_principle:"utility_theory",principle_explanation:"货币补偿部分弥补效用损失，但长期而言员工的心理账户仍在计算付出与回报的比例。"},{id:"D",text:"外包部分工作，招聘兼职减少内部压力",immediate_effects:{profit_margin:-6,cash_flow:-8,employee_satisfaction:5,market_share:2},delayed_effects:[{delay_rounds:2,metric:"customer_satisfaction",delta:-8,description:"外包质量不稳定，客户投诉增加"}],econ_principle:"comparative_advantage",principle_explanation:"比较优势原理——将非核心业务外包，但品控风险随之上升，需要有效的质量管理机制。"}]},{id:"sc_t1_s2",type:"crisis_response",title:"加班政策的代价",description:"三个月过去了，加班政策的影响开始显现。公司技术骨干张工程师和两名产品经理递交了辞呈，他们加入了竞争对手。同时媒体曝光了你们公司的加班文化，招聘网站上出现大量负面评论，最新一轮招聘几乎颗粒无收。现在你必须决定如何应对这场人才危机。",choices:[{id:"A",text:"立即废除加班制度，公开道歉并承诺整改",immediate_effects:{employee_satisfaction:15,customer_satisfaction:8,retention_rate:10,revenue:-6},delayed_effects:[{delay_rounds:2,metric:"retention_rate",delta:8,description:"口碑改善，招聘回暖，人才流失停止"}],econ_principle:"signaling_theory",principle_explanation:"公开认错是强烈的信号传递——向市场和员工表明公司价值观已改变，有助于重建信任资本。"},{id:"B",text:"用涨薪和股权留住关键员工，维持现有制度",immediate_effects:{profit_margin:-10,cash_flow:-12,retention_rate:8,employee_satisfaction:5},delayed_effects:[{delay_rounds:3,metric:"profit_margin",delta:-8,description:"薪资成本持续侵蚀利润，问题根源未解决"}],econ_principle:"efficiency_wage",principle_explanation:"效率工资理论：高薪可以提高留存，但如果根本问题是制度而非薪酬，成本只会越来越高。"},{id:"C",text:"缩减团队规模，用精英小团队撑起运营",immediate_effects:{profit_margin:8,employee_satisfaction:-12,market_share:-8,retention_rate:-15},delayed_effects:[],econ_principle:"diminishing_returns",principle_explanation:"裁员短期改善财务指标，但团队缩减超临界点后剩余员工承受更大压力，效率反而可能下降。"},{id:"D",text:"主动联系媒体讲述公司正面故事",immediate_effects:{customer_satisfaction:6,market_share:3,employee_satisfaction:-3,profit_margin:-3},delayed_effects:[{delay_rounds:2,metric:"employee_satisfaction",delta:-8,description:"员工认为公关是表面文章，信任进一步流失"}],econ_principle:"information_asymmetry",principle_explanation:"信息不对称：对外包装与内部实情脱节，员工看得最清楚，长期无法用PR掩盖文化问题。"}]}]},{id:"sc_theme2",title:"产品安全取舍",description:"在成本压力下，是否以牺牲质量换取更高利润？",scenarios:[{id:"sc_t2_s1",type:"resource_allocation",title:"降低质检标准",description:"采购总监提出：如果将原材料供应商从A级换成C级，单品成本可降低22%，利润率将大幅提升。质检部门警告说C级供应商的不合格率是A级的3倍。竞争对手已经这样做了，他们的定价更低、利润更高。你们怎么办？",choices:[{id:"A",text:"全面切换至低成本供应商，激进降价",immediate_effects:{profit_margin:15,revenue:10,market_share:8,customer_satisfaction:-8},delayed_effects:[{delay_rounds:2,metric:"customer_satisfaction",delta:-15,description:"产品质量问题显现，退货率和投诉急剧上升"}],econ_principle:"adverse_selection",principle_explanation:"逆向选择：在质量信息不透明的市场中，低价策略短期有效，但会吸引价格敏感客户并驱走忠实用户群。"},{id:"B",text:"保持原供应商，通过运营优化降本",immediate_effects:{profit_margin:3,customer_satisfaction:5,revenue:-2,cash_flow:-3},delayed_effects:[{delay_rounds:3,metric:"market_share",delta:5,description:"口碑积累带来自然增长"}],econ_principle:"reputation_capital",principle_explanation:"声誉资本：质量信誉是难以快速积累但极易摧毁的无形资产，对小公司尤为关键。"},{id:"C",text:"部分产品线切换，核心产品保持高标准",immediate_effects:{profit_margin:7,market_share:4,customer_satisfaction:-3},delayed_effects:[],econ_principle:"market_segmentation",principle_explanation:"市场细分：差异化产品线可覆盖不同客户，但管理复杂度上升，品牌定位需要清晰区分。"},{id:"D",text:"投资研发，通过技术创新实现降本",immediate_effects:{cash_flow:-15,profit_margin:-5,employee_satisfaction:5,market_share:-2},delayed_effects:[{delay_rounds:3,metric:"profit_margin",delta:12,description:"自主技术降本成效显现，成本结构改善"}],econ_principle:"innovation_rent",principle_explanation:"创新租金：技术领先带来的成本优势是竞争护城河，比价格战更可持续，但需要耐心度过投资期。"}]},{id:"sc_t2_s2",type:"crisis_response",title:"产品召回危机",description:"噩耗传来：一款产品因质量问题导致3名用户受伤，监管部门介入调查，要求48小时内提交质量报告并召回同批次产品。媒体已开始报道，社交平台热度持续攀升。全面召回预计费用高达800万元，相当于公司半年净利润。",choices:[{id:"A",text:"立即全面召回，主动承担责任",immediate_effects:{cash_flow:-25,profit_margin:-18,customer_satisfaction:8,debt_pressure:-10},delayed_effects:[{delay_rounds:2,metric:"customer_satisfaction",delta:12,description:"危机公关处理得当，品牌信任度回升"}],econ_principle:"signaling_theory",principle_explanation:"危机时刻的行动是最有力的信号——主动担责比被动应付的长期成本低得多，能保存最多的声誉资本。"},{id:"B",text:"法律部门介入，争议是否必须召回",immediate_effects:{customer_satisfaction:-20,profit_margin:-5,debt_pressure:-5},delayed_effects:[{delay_rounds:2,metric:"revenue",delta:-20,description:"诉讼缠身加监管处罚，损失远超召回成本"}],econ_principle:"risk_management",principle_explanation:"风险管理失误：法律博弈的预期成本远高于主动召回，且声誉损失难以用金钱简单计算。"},{id:"C",text:"只召回有记录问题的产品，最小化范围",immediate_effects:{cash_flow:-10,profit_margin:-8,customer_satisfaction:-12},delayed_effects:[{delay_rounds:2,metric:"customer_satisfaction",delta:-10,description:"更多问题陆续曝光，公信力彻底崩溃"}],econ_principle:"moral_hazard",principle_explanation:"道德风险：最小化召回范围看似减少损失，实则在拿剩余用户安全豪赌，一旦再出事故代价成倍增加。"},{id:"D",text:"紧急融资，以现金解决危机但推迟召回",immediate_effects:{cash_flow:-8,debt_pressure:-20,customer_satisfaction:-8,revenue:-8},delayed_effects:[{delay_rounds:3,metric:"profit_margin",delta:-10,description:"融资利息和还款压力持续侵蚀利润"}],econ_principle:"liquidity_crisis",principle_explanation:"流动性危机下的高息融资是双刃剑——解决短期资金缺口，但债务成本会在未来长期拖累经营。"}]}]},{id:"sc_theme3",title:"现金流危机",description:"公司账面资金告急，每一个融资决策都将深刻影响未来。",scenarios:[{id:"sc_t3_s1",type:"long_short_tradeoff",title:"紧急融资抉择",description:"公司账上只剩45天的运营资金。银行贷款审批需要3个月，民间借贷平台可以3天放款但年化利率高达28%。一家大型竞争对手愿意低估价收购30%股权并获得2个董事会席位。你只有一周时间做决定。",choices:[{id:"A",text:"接受高息民间借贷，维持独立经营",immediate_effects:{cash_flow:20,debt_pressure:-22,profit_margin:-8},delayed_effects:[{delay_rounds:2,metric:"profit_margin",delta:-12,description:"高额利息持续侵蚀利润，财务压力越滚越大"}],econ_principle:"time_value_of_money",principle_explanation:"货币时间价值：今天的流动性有溢价，但28%的资金成本意味着每个月你都在为这个决定付出高昂代价。"},{id:"B",text:"出让30%股权给竞争对手，换取资金和资源",immediate_effects:{cash_flow:30,debt_pressure:10,market_share:5,revenue:8},delayed_effects:[{delay_rounds:3,metric:"profit_margin",delta:-8,description:"股东利益冲突加剧，战略执行受制约"}],econ_principle:"principal_agent",principle_explanation:"委托代理问题：引入竞争对手股东后，委托人与代理人目标可能不一致，日常决策会变得复杂和受限。"},{id:"C",text:"紧急削减开支，裁员降薪过冬",immediate_effects:{cash_flow:12,profit_margin:6,employee_satisfaction:-20,retention_rate:-15,revenue:-10},delayed_effects:[],econ_principle:"sunk_cost",principle_explanation:"裁员节省的现金是真实的，但流失的经验和客户关系同样是难以挽回的沉没成本，需要仔细权衡。"},{id:"D",text:"向供应链上下游申请赊账周转",immediate_effects:{cash_flow:15,customer_satisfaction:-5,debt_pressure:-8},delayed_effects:[{delay_rounds:2,metric:"cash_flow",delta:-10,description:"供应商要求提前还款，资金链更紧"}],econ_principle:"supply_chain_finance",principle_explanation:"供应链金融本质是把压力转嫁给供应商，短期有效，但会损伤长期合作关系和供货稳定性。"}]},{id:"sc_t3_s2",type:"strategic_choice",title:"债务压力下的战略收缩",description:"高息债务的代价正在显现：每月净利润的60%用于还本付息。股东开始质疑公司生存能力，有人建议出售非核心业务线，有人建议大幅缩减规模。一家风投表示有意投资，但要求大幅稀释现有股东权益，且需要加入董事会参与日常决策。",choices:[{id:"A",text:"出售非核心业务线，聚焦主营",immediate_effects:{cash_flow:25,debt_pressure:18,revenue:-12,market_share:-6},delayed_effects:[{delay_rounds:2,metric:"profit_margin",delta:8,description:"聚焦后主营业务竞争力提升，效率改善"}],econ_principle:"core_competency",principle_explanation:"核心竞争力理论：聚焦于真正有差异化优势的业务，放弃看似多元化实则分散精力的边缘业务。"},{id:"B",text:"接受风投融资，稀释股权换发展空间",immediate_effects:{cash_flow:35,debt_pressure:25,market_share:8,revenue:10},delayed_effects:[],econ_principle:"venture_capital",principle_explanation:"风险资本注入改变了博弈格局——你拥有更少的股权，但可能获得更大的蛋糕，关键是与投资人目标是否一致。"},{id:"C",text:"破釜沉舟，押注一款新产品快速翻盘",immediate_effects:{cash_flow:-15,profit_margin:-10,market_share:12,revenue:15},delayed_effects:[{delay_rounds:2,metric:"revenue",delta:18,description:"若新品爆发将带来大量订单，实现逆转"}],econ_principle:"high_risk_return",principle_explanation:"高风险高回报：困境中的集中押注是博弈策略，可能带来反转，也可能加速失败，需要对概率有清醒认知。"},{id:"D",text:"寻求被大公司战略收购",immediate_effects:{cash_flow:20,debt_pressure:20,employee_satisfaction:-8,market_share:5},delayed_effects:[{delay_rounds:3,metric:"employee_satisfaction",delta:-10,description:"文化整合困难，核心员工流失加剧"}],econ_principle:"mergers_acquisitions",principle_explanation:"并购整合解决了资金问题，但文化冲突和管理整合是新挑战，协同效应并不总能如预期般实现。"}]}]},{id:"sc_theme4",title:"知识产权博弈",description:"当抄袭可以快速致富，当创新需要漫长投入，你如何选择？",scenarios:[{id:"sc_t4_s1",type:"game_theory",title:"复制还是创新",description:"竞争对手推出了一款大受欢迎的新产品，市场调研显示60%的功能可以被直接复制，技术团队认为3个月就能完成。对手尚未在你们的主要市场申请专利，法务顾问说处于法律灰色地带。而继续自主研发则需要至少18个月。",choices:[{id:"A",text:"快速复制对手产品，抢占市场窗口",immediate_effects:{market_share:12,revenue:15,customer_satisfaction:5,cash_flow:-8},delayed_effects:[{delay_rounds:2,metric:"market_share",delta:-8,description:"对手申请专利后发起侵权诉讼，被迫下架产品"}],econ_principle:"free_rider",principle_explanation:"搭便车效应：利用他人研发成果的短期收益是真实的，但若成为行业惯例，整个创新生态会崩溃，包括你自己。"},{id:"B",text:"坚持自主研发，走差异化路线",immediate_effects:{cash_flow:-12,profit_margin:-6,employee_satisfaction:8,market_share:-5},delayed_effects:[{delay_rounds:3,metric:"market_share",delta:15,description:"原创产品形成差异化壁垒，用户忠诚度高"}],econ_principle:"innovation_rent",principle_explanation:"创新租金：原创技术形成的竞争壁垒更难被复制，且不受法律威胁，是长期高于平均利润的来源。"},{id:"C",text:"购买对手专利授权，合法引进其技术",immediate_effects:{profit_margin:-5,market_share:8,cash_flow:-10,customer_satisfaction:5},delayed_effects:[],econ_principle:"transaction_costs",principle_explanation:"交易成本理论：付费使用知识产权比内部研发成本更低，但让你永远依赖对方的技术路线，失去主动权。"},{id:"D",text:"通过高薪挖人，间接获取对手技术",immediate_effects:{revenue:10,employee_satisfaction:-8,market_share:6,cash_flow:-6},delayed_effects:[{delay_rounds:2,metric:"cash_flow",delta:-15,description:"商业秘密诉讼启动，面临巨额赔偿风险"}],econ_principle:"information_asymmetry",principle_explanation:"通过人才流动获取信息在短期有效，但知识产权和商业秘密保护越来越严格，法律风险极高。"}]},{id:"sc_t4_s2",type:"crisis_response",title:"专利诉讼风暴",description:"对手的律师函已经寄到：声称你们侵犯其3项核心专利，要求赔偿800万并立即停止销售相关产品。法务团队评估侵权成立概率70%。产品正处于最佳销售季，立即停售将损失本季度约40%的收入。你该如何应对这场危机？",choices:[{id:"A",text:"庭外和解，支付赔偿金并取得授权",immediate_effects:{cash_flow:-20,profit_margin:-12,market_share:3,revenue:5},delayed_effects:[],econ_principle:"game_theory",principle_explanation:"博弈论视角：和解是纳什均衡——双方都清楚诉讼成本高昂，和解通常优于双输的诉讼对抗。"},{id:"B",text:"全力应诉，聘请顶级专利律师团",immediate_effects:{cash_flow:-15,profit_margin:-8,employee_satisfaction:-5},delayed_effects:[{delay_rounds:3,metric:"market_share",delta:10,description:"若胜诉将获得市场主动权，但诉讼期间业务严重受阻"}],econ_principle:"expected_value",principle_explanation:"期望值计算：30%胜诉概率下的期望价值需与和解成本比较，诉讼的时间成本和不确定性容易被低估。"},{id:"C",text:"紧急重新设计产品，绕开专利争议",immediate_effects:{cash_flow:-18,revenue:-15,profit_margin:-10,employee_satisfaction:-3},delayed_effects:[{delay_rounds:2,metric:"revenue",delta:8,description:"绕过专利的新版本上市，恢复销售"}],econ_principle:"substitute_goods",principle_explanation:"从根本上解决专利依赖问题，短期阵痛但长期建立了自主知识产权，不再受制于人。"},{id:"D",text:"反诉对方，声称对方也侵犯了你们的专利",immediate_effects:{cash_flow:-10,employee_satisfaction:-8,revenue:-5},delayed_effects:[{delay_rounds:3,metric:"profit_margin",delta:-15,description:"双方专利战消耗大量资源，市场机会被第三方竞争者抢占"}],econ_principle:"mutually_assured_destruction",principle_explanation:"相互确保毁灭：专利战升级双方都会受损，对小公司而言消耗战更为致命，这是以卵击石的赌博。"}]}]},{id:"sc_theme_contract",title:"契约精神考验",description:"在商业利益面前，是否坚守合同承诺？",scenarios:[{id:"sc_tc_s1",type:"ethical_dilemma",title:"供应商合同困境",description:"公司与A供应商签订了3年长期合同，约定每月采购1000件零部件，单价50元。合同执行一年后，市场上出现了新的B供应商，同等质量的零部件售价仅35元，能为公司每月节省1.5万元成本。但合同有违约金条款：提前终止需支付剩余合同金额的30%作为违约金（约36万元）。财务部门计算后发现，即使支付违约金，两年内仍能净节省20万元。A供应商是一家小型家族企业，失去你们这个大客户可能导致其裁员甚至倒闭。",choices:[{id:"A",text:"支付违约金，立即切换到更便宜的供应商",immediate_effects:{profit_margin:-8,cash_flow:-12,customer_satisfaction:3},delayed_effects:[{delay_rounds:2,metric:"profit_margin",delta:10,description:"成本节省效果显现，利润率提升"}],econ_principle:"opportunity_cost",principle_explanation:"机会成本理论：已签合同不是沉没成本，违约金是可量化的代价，如果切换的长期收益超过违约成本，理性选择是违约。"},{id:"B",text:"信守合同，继续与A供应商合作至合同期满",immediate_effects:{profit_margin:-5,employee_satisfaction:5,customer_satisfaction:2},delayed_effects:[{delay_rounds:3,metric:"market_share",delta:5,description:"守信行为赢得业界口碑，带来新合作机会"}],econ_principle:"reputation_capital",principle_explanation:"声誉资本：契约精神是商业社会的信任基石，违约带来的声誉损失是难以量化的隐性成本，长期看可能远超短期节省。"},{id:"C",text:"与A供应商谈判，请求降价或修改合同条款",immediate_effects:{profit_margin:2,cash_flow:-3},delayed_effects:[{delay_rounds:2,metric:"profit_margin",delta:-3,description:"谈判失败，A供应商拒绝降价，关系恶化"}],econ_principle:"bargaining_power",principle_explanation:"谈判力量不对等：你有替代选项，A供应商没有，这种信息不对称使得谈判很可能演变为变相要挟。"},{id:"D",text:"等到合同到期再切换，暂时承受高成本",immediate_effects:{profit_margin:-6,employee_satisfaction:-3,market_share:-2},delayed_effects:[{delay_rounds:3,metric:"profit_margin",delta:12,description:"合同到期后顺利切换，成本大幅下降且无声誉损失"}],econ_principle:"time_consistency",principle_explanation:"时间一致性：短期损失换取长期信誉，这种策略在重复博弈中更优——未来合作伙伴会看到你的守信记录。"}]},{id:"sc_tc_s2",type:"crisis_response",title:"客户违约危机",description:"你最大的客户——占公司收入40%的C公司突然陷入财务困境，拖欠了三个月货款共计120万元，并提出希望延期6个月支付且要求免除10%的滞纳金。你派人调查后发现，C公司确实遇到了严重现金流问题，但并未破产。如果你起诉并申请资产冻结，他们可能被迫宣布破产，你的货款可能血本无归；如果你同意延期，对方可能真的能熬过难关并继续合作，但也可能拖你下水。合同明确规定了违约责任和滞纳金条款。",choices:[{id:"A",text:"立即起诉，申请冻结资产，严格执行合同条款",immediate_effects:{cash_flow:-15,revenue:-20,debt_pressure:-10},delayed_effects:[{delay_rounds:2,metric:"revenue",delta:-15,description:"C公司破产，账款无法收回，失去最大客户"}],econ_principle:"creditor_rights",principle_explanation:"债权人权利：法律保护合同执行，但在对方资不抵债时，过于强硬可能导致双输——既收不回钱，又失去长期客户。"},{id:"B",text:"同意延期6个月，免除部分滞纳金，帮助客户渡过难关",immediate_effects:{cash_flow:-8,revenue:5,customer_satisfaction:8},delayed_effects:[{delay_rounds:3,metric:"revenue",delta:15,description:"C公司恢复运营，感激之情带来更多订单"}],econ_principle:"relationship_lending",principle_explanation:"关系型借贷：基于信任和长期关系的灵活处理在小企业生态中很常见，但风险是对方可能无法兑现承诺。"},{id:"C",text:"要求C公司提供资产抵押或股权质押作为担保",immediate_effects:{cash_flow:-5,revenue:-8,market_share:3},delayed_effects:[{delay_rounds:2,metric:"cash_flow",delta:8,description:"抵押物变现，部分收回欠款"}],econ_principle:"collateral_requirement",principle_explanation:"抵押要求：在违约风险上升时要求额外担保是常见做法，但可能被视为趁火打劫，损害商业关系。"},{id:"D",text:"将债权打折出售给第三方催收公司，及时止损",immediate_effects:{cash_flow:8,revenue:-12,customer_satisfaction:-10},delayed_effects:[{delay_rounds:2,metric:"customer_satisfaction",delta:-8,description:"催收公司手段激进，C公司及行业对你产生负面评价"}],econ_principle:"debt_factoring",principle_explanation:"债权保理：将坏账风险转移给专业机构，但折价损失和声誉代价需要权衡——客户会记住你在危机时的选择。"}]}]},{id:"sc_theme5",title:"公司存亡抉择",description:"经历重重考验，公司面临决定命运的最终战略抉择。",scenarios:[{id:"sc_t5_s1",type:"strategic_choice",title:"生死存亡的十字路口",description:"你的公司经过5年发展，积累了一定市场地位，同时也背负着债务、人才流失和品牌损伤的历史包袱。此时出现了三个机会：大公司全资收购（溢价30%）、风投注资冲刺IPO（3年内上市）、与同规模同行战略合并（双方各持股50%）。这是决定公司命运的最后抉择。",choices:[{id:"A",text:"接受全资收购，套现并入大平台",immediate_effects:{cash_flow:40,debt_pressure:35,revenue:15,employee_satisfaction:-8},delayed_effects:[],econ_principle:"exit_strategy",principle_explanation:"退出策略：创业成功不只有上市一条路，战略收购是兑现价值的有效方式，但意味着创业旅程的终结。"},{id:"B",text:"接受风投注资，冲刺IPO",immediate_effects:{cash_flow:30,market_share:15,revenue:20,profit_margin:-5},delayed_effects:[{delay_rounds:2,metric:"employee_satisfaction",delta:10,description:"IPO预期激励全员，士气大振，吸引顶尖人才加入"}],econ_principle:"growth_premium",principle_explanation:"资本市场对高增长故事给予更高估值，但IPO的合规成本和公众压力是全新的挑战与约束。"},{id:"C",text:"与同行战略合并，强强联合",immediate_effects:{market_share:20,revenue:18,employee_satisfaction:-5,profit_margin:8},delayed_effects:[{delay_rounds:3,metric:"profit_margin",delta:10,description:"规模效应和协同效应逐步释放，成本结构改善"}],econ_principle:"economies_of_scale",principle_explanation:"规模经济：合并后共享成本、互补资源，但整合过程中的文化冲突和权力博弈是不可忽视的障碍。"},{id:"D",text:"拒绝所有方案，坚持独立发展",immediate_effects:{employee_satisfaction:8,revenue:-5,market_share:-3,profit_margin:-3},delayed_effects:[{delay_rounds:2,metric:"market_share",delta:-8,description:"竞争格局持续不利，被资本化对手进一步甩开"}],econ_principle:"independence_premium",principle_explanation:"独立溢价是真实存在的，但在资本驱动的市场中，拒绝合作有时意味着错失最好的市场窗口期。"}]}]}],I$=[{id:"sn_theme1",title:"大国贷款的诱惑与陷阱",description:"一笔来自大国的优惠贷款，背后附带的条件将如何影响国家主权？",scenarios:[{id:"sn_t1_s1",type:"long_short_tradeoff",title:"接受战略贷款",description:"一个大国提出为你们提供50亿美元的基础设施贷款，利率仅1.5%，但附带条款包括：工程由该国承包商承建、关键港口20年租赁权作为抵押、贷款用途受限于指定领域。这笔钱能解决你们迫切的基础设施缺口，但多名经济学家警告这是主权债务陷阱。",choices:[{id:"A",text:"全面接受贷款及所有附带条件",immediate_effects:{gdp_total:15,gdp_growth:12,forex_reserves:20,diplomatic_relations:-8},delayed_effects:[{delay_rounds:2,metric:"diplomatic_relations",delta:-15,description:"港口租赁权引发邻国警惕，周边外交关系恶化"}],econ_principle:"debt_trap",principle_explanation:"债务陷阱外交：低息贷款通过资产抵押和条款捆绑，可能在违约时将关键基础设施控制权转移给债主国，主权风险极高。"},{id:"B",text:"拒绝贷款，寻求多边机构融资",immediate_effects:{diplomatic_relations:8,brain_drain:5,gdp_growth:-5,forex_reserves:-5},delayed_effects:[{delay_rounds:3,metric:"gdp_growth",delta:6,description:"多边融资虽慢但条件更公平，发展更可持续"}],econ_principle:"sovereign_debt",principle_explanation:"主权债务选择：多边机构贷款（世界银行、亚行）条件相对透明且不附政治条件，是维护主权的更佳选择。"},{id:"C",text:"接受贷款但谈判删除港口抵押条款",immediate_effects:{gdp_total:8,forex_reserves:12,gdp_growth:6,diplomatic_relations:-3},delayed_effects:[],econ_principle:"nash_bargaining",principle_explanation:"纳什谈判：争取删除最危险的条款是合理策略，但大国的谈判筹码远超小国，谈判结果能否如愿值得审慎评估。"},{id:"D",text:"引发国内争论，通过议会表决决定",immediate_effects:{public_support:8,diplomatic_relations:-5,gdp_growth:-3},delayed_effects:[{delay_rounds:2,metric:"public_support",delta:5,description:"民主程序增强决策合法性，无论结果如何都减少后续争议"}],econ_principle:"democratic_governance",principle_explanation:"民主治理：将重大主权决策交由民主程序，提高合法性，也能防止个别领导人被腐化收买而出卖国家利益。"}]},{id:"sn_t1_s2",type:"crisis_response",title:"债务违约危机",description:"三年后，贷款项目进展缓慢，财政收入增长不达预期，你们已无力偿还即将到期的本息共8亿美元。债主国大使已经两次登门，暗示如果违约，港口租赁条款将自动生效。国内反对党将此描述为出卖国家利益，街头已出现小规模抗议。",choices:[{id:"A",text:"向债主国请求延期偿还，接受额外条件",immediate_effects:{forex_reserves:10,gdp_growth:3,diplomatic_relations:-10,public_support:-10},delayed_effects:[{delay_rounds:2,metric:"diplomatic_relations",delta:-12,description:"延期协议暴露更多主权让步，国内政治危机加深"}],econ_principle:"debt_restructuring",principle_explanation:"债务重组：延期虽然避免了立即危机，但通常要求接受新的约束条件，可能使债务陷阱进一步收紧。"},{id:"B",text:"联合其他小国宣告违约，寻求国际支持",immediate_effects:{diplomatic_relations:8,forex_reserves:-5,gdp_growth:-8,military_defense:-5},delayed_effects:[{delay_rounds:2,metric:"diplomatic_relations",delta:12,description:"集体行动产生示范效应，国际社会关注债务条款公平性"}],econ_principle:"collective_action",principle_explanation:"集体行动：单个小国违约代价巨大，但联合行动改变博弈结构，可以获得道义支持和更多谈判空间。"},{id:"C",text:"紧急出售国有资产换取外汇偿债",immediate_effects:{forex_reserves:18,gdp_total:-10,public_support:-12,brain_drain:-8},delayed_effects:[{delay_rounds:3,metric:"gdp_growth",delta:-8,description:"优质国有资产流失，长期盈利能力下降"}],econ_principle:"fire_sale",principle_explanation:"贱卖资产：在流动性危机中被迫出售资产往往以大幅折价成交，是一种代价极高的融资方式。"},{id:"D",text:"向西方国家求援，换取政治站队",immediate_effects:{forex_reserves:12,diplomatic_relations:5,military_defense:8,public_support:-5},delayed_effects:[{delay_rounds:2,metric:"diplomatic_relations",delta:-8,description:"政治站队引发债主国经济报复措施"}],econ_principle:"geopolitical_economy",principle_explanation:"地缘政治经济学：寻求对立大国援助可以短期化解危机，但使小国陷入大国博弈的前沿，长期代价难以预测。"}]}]},{id:"sn_theme2",title:"外国军事基地之争",description:"安全保障与主权代价，这是一道关于国家尊严与现实利益的方程式。",scenarios:[{id:"sn_t2_s1",type:"game_theory",title:"军事基地谈判",description:"一个大国提议在你国南部海岸建立军事基地，提供每年3亿美元的租金和安全保障承诺，期限50年。你的军队规模有限，周边存在一个你无力单独抗衡的地区威胁。但邻国已警告，允许外国军事存在将被视为敌对行为，并威胁取消双边贸易协定。",choices:[{id:"A",text:"同意建立基地，换取安全保障和资金",immediate_effects:{military_defense:20,forex_reserves:12,gdp_growth:5,diplomatic_relations:-18},delayed_effects:[{delay_rounds:2,metric:"diplomatic_relations",delta:-15,description:"邻国兑现威胁，终止贸易协定，经济损失超过租金收入"}],econ_principle:"security_dilemma",principle_explanation:"安全困境：一方的安全提升往往被对方解读为威胁，引发新一轮军备或外交报复，整体安全可能反而下降。"},{id:"B",text:"拒绝基地，维持不结盟政策",immediate_effects:{diplomatic_relations:12,public_support:8,military_defense:-5,forex_reserves:-5},delayed_effects:[{delay_rounds:3,metric:"diplomatic_relations",delta:10,description:"中立立场赢得多方信任，外交空间拓展"}],econ_principle:"neutrality_premium",principle_explanation:"中立溢价：不结盟政策在大国竞争中保留了外交灵活性，可以与所有方维持合作关系，是小国常用的生存策略。"},{id:"C",text:"接受后勤补给站而非完整基地，降低政治敏感性",immediate_effects:{military_defense:8,forex_reserves:5,diplomatic_relations:-8,public_support:-3},delayed_effects:[],econ_principle:"graduated_commitment",principle_explanation:"渐进承诺：折中方案降低政治摩擦，但补给站与基地的实质区别在周边国家眼中可能并不明显。"},{id:"D",text:"就基地问题举行全国公投",immediate_effects:{public_support:12,diplomatic_relations:-5,gdp_growth:-2},delayed_effects:[{delay_rounds:2,metric:"diplomatic_relations",delta:5,description:"公投程序本身增加了决策的国际合法性认可"}],econ_principle:"democratic_legitimacy",principle_explanation:"民主合法性：通过公投做出的安全决策具有更强的合法性，即使结果不利，也能降低国内政治撕裂。"}]},{id:"sn_t2_s2",type:"crisis_response",title:"边境冲突升级",description:"无论你做出了何种选择，地区局势仍持续升温：邻国在争议海域驱逐了你们的渔船，本周又有两艘被扣押，10名渔民被拘留。国内舆论要求强硬回应，反对党批评你软弱。国际社会的反应则态度模糊，倾向于让双方自行协商解决。",choices:[{id:"A",text:"派遣海警船对峙，展示强硬立场",immediate_effects:{public_support:12,military_defense:5,diplomatic_relations:-15,gdp_growth:-5},delayed_effects:[{delay_rounds:2,metric:"military_defense",delta:-8,description:"军事对峙升级，你方实力弱势被暴露，威慑力下降"}],econ_principle:"brinkmanship",principle_explanation:"边缘政策：在实力不对等的冲突中展示强硬可能激化冲突，小国在军事博弈中的代价往往远高于大国。"},{id:"B",text:"通过外交渠道谈判，换取渔民获释",immediate_effects:{diplomatic_relations:5,public_support:-8,forex_reserves:-3,gdp_growth:2},delayed_effects:[],econ_principle:"negotiation",principle_explanation:"谈判解决：对于不对等冲突，谈判通常是最理性的选择，牺牲部分政治声望换取实际安全保障是务实策略。"},{id:"C",text:"提交国际仲裁，诉诸国际法",immediate_effects:{diplomatic_relations:8,public_support:5,military_defense:-3,gdp_growth:-2},delayed_effects:[{delay_rounds:3,metric:"diplomatic_relations",delta:10,description:"若胜诉将建立法律先例，长期确立权益"}],econ_principle:"rule_of_law",principle_explanation:"法律途径：对于缺乏军事实力的小国，国际法是最重要的保护机制，即使执行力有限，判决也有政治和舆论价值。"},{id:"D",text:"以经济利益换取政治妥协",immediate_effects:{diplomatic_relations:12,gdp_growth:-5,public_support:-12,forex_reserves:-8},delayed_effects:[{delay_rounds:2,metric:"public_support",delta:-8,description:"被认为出卖主权，国内政治反弹加剧"}],econ_principle:"appeasement",principle_explanation:"绥靖政策：以经济让步换取政治和平可以短期缓解压力，但可能强化对方的强硬预期，导致更大的索取。"}]}]},{id:"sn_theme3",title:"腐败与稳定的交换",description:"当腐败成为维系政治稳定的粘合剂，清廉与稳定之间你如何选择？",scenarios:[{id:"sn_t3_s1",type:"ethical_dilemma",title:"精英腐败的默许",description:"你的政治稳定高度依赖几个地区强人和商业精英的支持，他们掌控着大量非正式经济活动和政治动员能力。调查部门报告显示，其中两人的家族涉嫌将国家矿产资源私有化，年获利约2亿美元。起诉将引发政治动荡，但放任则助长腐败文化。",choices:[{id:"A",text:"启动调查并起诉，展示法治决心",immediate_effects:{corruption_index:18,brain_drain:8,public_support:10,diplomatic_relations:-10},delayed_effects:[{delay_rounds:2,metric:"gdp_growth",delta:-8,description:"精英报复，部分商业投资撤出，短期经济受冲击"}],econ_principle:"rule_of_law",principle_explanation:"法治经济学：制度性腐败是发展中国家增长陷阱的重要原因，打击腐败短期有成本，但可以提升长期投资环境。"},{id:"B",text:"默许腐败，以稳定为由维持现状",immediate_effects:{corruption_index:-15,gdp_growth:5,diplomatic_relations:-8,brain_drain:-8},delayed_effects:[{delay_rounds:2,metric:"corruption_index",delta:-10,description:"腐败文化扩散，政府公信力持续下滑"}],econ_principle:"institutional_decay",principle_explanation:"制度衰败：腐败的容忍会扩散并腐蚀整个政治文化，最终侵蚀国家治理能力的根基，是难以逆转的制度退化。"},{id:"C",text:"私下警告，要求归还部分非法所得",immediate_effects:{corruption_index:5,forex_reserves:8,public_support:-3,gdp_growth:2},delayed_effects:[],econ_principle:"partial_reform",principle_explanation:"半推进式改革：私下处理避免了政治冲突，但缺乏公开示范效应，对腐败风气的改变作用有限。"},{id:"D",text:"引入国际透明度审查，借外部压力推动改革",immediate_effects:{corruption_index:12,diplomatic_relations:10,brain_drain:5,gdp_growth:-3},delayed_effects:[{delay_rounds:2,metric:"diplomatic_relations",delta:8,description:"透明度提升改善国际评级，外资流入增加"}],econ_principle:"external_constraint",principle_explanation:"外部约束机制：利用国际机构的压力推动国内改革，是小国绕过内部阻力的常用策略，但需要接受外部监督。"}]},{id:"sn_t3_s2",type:"crisis_response",title:"国际透明度曝光",description:"一个国际非政府组织发布报告，点名你们国家的腐败指数大幅恶化，具体列举了几个矿产私有化案例。随后国际货币基金组织暂停了正在谈判中的贷款协议，要求在恢复前提交反腐改革计划。国内反对党借机发起不信任投票。",choices:[{id:"A",text:"提交全面反腐改革计划，换取国际支持",immediate_effects:{corruption_index:15,diplomatic_relations:12,forex_reserves:8,public_support:8},delayed_effects:[{delay_rounds:3,metric:"gdp_growth",delta:8,description:"国际贷款恢复，改革信号吸引外资"}],econ_principle:"conditionality",principle_explanation:"条件性援助：IMF附条件的援助模式推动接受国进行结构性改革，虽有争议，但常是推动改变的外部动力。"},{id:"B",text:"否认报告内容，指责境外势力干涉内政",immediate_effects:{corruption_index:-10,diplomatic_relations:-15,forex_reserves:-8,brain_drain:-8},delayed_effects:[{delay_rounds:2,metric:"brain_drain",delta:-12,description:"精英人才和资本加速外流"}],econ_principle:"reputational_damage",principle_explanation:"声誉损失：否认可信报告的代价是进一步损失国际信誉，外资和援助机构通常以透明度信号做出资金决策。"},{id:"C",text:"处理几个典型案例，展示改革诚意",immediate_effects:{corruption_index:8,diplomatic_relations:6,public_support:6,gdp_growth:2},delayed_effects:[],econ_principle:"selective_enforcement",principle_explanation:"选择性执法：处理几个典型案例可以传递改革信号，但如果是选择性打击，难以形成真正的制度性约束。"},{id:"D",text:"政治危机中转移焦点，宣布提前选举",immediate_effects:{public_support:5,diplomatic_relations:-5,corruption_index:-3,gdp_growth:-5},delayed_effects:[{delay_rounds:2,metric:"public_support",delta:8,description:"若选举结果支持执政党，将获得新的政治授权"}],econ_principle:"political_business_cycle",principle_explanation:"政治经济周期：提前选举是政治危机中常见的重置按钮，通过诉诸民意获得新授权，但实质问题仍需后续解决。"}]}]},{id:"sn_theme4",title:"货币政策的双刃剑",description:"汇率是国家经济政策的重要工具，但每一次主动干预都有深远的连锁反应。",scenarios:[{id:"sn_t4_s1",type:"resource_allocation",title:"货币贬值刺激出口",description:"你们的出口产品因汇率高估而竞争力下降，出口额已连续两年萎缩。财政部建议主动将本币贬值20%，可立即提升出口竞争力。但央行警告，贬值将引发进口通货膨胀，推高居民生活成本，且一旦开始贬值，可能引发市场恐慌性资本外流。",choices:[{id:"A",text:"主动贬值20%，以出口为引擎刺激增长",immediate_effects:{gdp_growth:12,gdp_total:8,forex_reserves:-12,public_support:-8},delayed_effects:[{delay_rounds:2,metric:"forex_reserves",delta:-15,description:"资本外流加速，外汇储备持续消耗"}],econ_principle:"competitive_devaluation",principle_explanation:"竞争性贬值：通过汇率获得的出口优势短暂，贸易伙伴可能报复性贬值，引发货币战，长期而言所有人受损。"},{id:"B",text:"维持汇率稳定，通过结构性改革提升竞争力",immediate_effects:{forex_reserves:5,gdp_growth:-3,brain_drain:5,corruption_index:3},delayed_effects:[{delay_rounds:3,metric:"gdp_growth",delta:8,description:"结构性改革提升全要素生产率，增长更可持续"}],econ_principle:"real_exchange_rate",principle_explanation:"实际汇率：真正的竞争力来自生产率提升，而非名义汇率操控，结构性改革虽慢但带来的优势更可持续。"},{id:"C",text:"小幅渐进贬值，同时加强资本管制",immediate_effects:{gdp_growth:5,forex_reserves:-5,diplomatic_relations:-5,public_support:-3},delayed_effects:[],econ_principle:"managed_float",principle_explanation:"管理浮动：渐进贬值配合资本管制可以减少市场冲击，但资本管制本身会降低外国投资吸引力，是两害相权取其轻。"},{id:"D",text:"向国际货币基金组织寻求汇率稳定支持",immediate_effects:{forex_reserves:12,diplomatic_relations:8,gdp_growth:2,corruption_index:3},delayed_effects:[{delay_rounds:2,metric:"public_support",delta:-8,description:"IMF附加的财政紧缩条件引发国内政治反弹"}],econ_principle:"external_bailout",principle_explanation:"外部救助：IMF援助解决短期流动性，但附带的结构调整条件常在受援国引起政治和社会动荡。"}]},{id:"sn_t4_s2",type:"crisis_response",title:"外汇储备告急",description:"贬值后资本外流超出预期，外汇储备从90亿美元快速跌至35亿美元，仅够支撑约2个月的进口。国际评级机构将你们的主权评级降至垃圾级，新的国际融资几乎断绝。国内粮食和能源进口商已经出现美元荒，部分超市货架开始出现短缺。",choices:[{id:"A",text:"实施严格外汇管制，限制资本外流",immediate_effects:{forex_reserves:15,diplomatic_relations:-8,gdp_growth:-8,brain_drain:-10},delayed_effects:[{delay_rounds:2,metric:"gdp_growth",delta:-10,description:"外汇管制使进出口几乎瘫痪，经济陷入衰退"}],econ_principle:"capital_controls",principle_explanation:"资本管制：在危机中可以短期稳定外汇，但长期损害市场信心和投资环境，对发展中国家是高代价的政策工具。"},{id:"B",text:"向中国或其他国家紧急融资，换取政治支持",immediate_effects:{forex_reserves:20,diplomatic_relations:-8,gdp_growth:3,military_defense:-5},delayed_effects:[{delay_rounds:2,metric:"diplomatic_relations",delta:-12,description:"政治站队代价逐渐显现，西方援助和投资减少"}],econ_principle:"geopolitical_economy",principle_explanation:"双边紧急融资通常附带政治代价，在大国博弈中选边站是危机中常见但需谨慎权衡的策略。"},{id:"C",text:"优先保障粮食和能源进口，其他全面紧缩",immediate_effects:{forex_reserves:8,public_support:5,gdp_growth:-12,brain_drain:-5},delayed_effects:[],econ_principle:"crisis_triage",principle_explanation:"危机分类处理：在极端资源约束下，优先保障生存必需品是最低限度的政府责任，其他损失只能先行承受。"},{id:"D",text:"宣布主权违约，启动债务重组谈判",immediate_effects:{forex_reserves:5,diplomatic_relations:-15,gdp_growth:-15,public_support:-5},delayed_effects:[{delay_rounds:3,metric:"gdp_growth",delta:12,description:"债务重组完成后轻装上阵，经济逐渐复苏"}],econ_principle:"sovereign_default",principle_explanation:"主权违约：历史上许多国家在违约后经历了一段痛苦时期，但随后实现了强劲复苏，前提是债务重组谈判成功。"}]}]},{id:"sn_theme5",title:"国家命运的最终抉择",description:"经历了所有挑战，你面临决定国家未来走向的历史性抉择。",scenarios:[{id:"sn_t5_s1",type:"strategic_choice",title:"小国的生存哲学",description:"经历了债务危机、军事压力、腐败曝光和经济动荡之后，国家处于十字路口。此时面临三条路：加入某大国主导的经济安全共同体（获得保护但让渡部分主权）；与周边国家组成小多边联盟（力量有限但保持独立）；走彻底市场化开放路线，以效率换发展（成为真正的自由港）。",choices:[{id:"A",text:"加入大国主导的共同体，换取保护",immediate_effects:{military_defense:20,forex_reserves:15,gdp_growth:10,diplomatic_relations:-10},delayed_effects:[{delay_rounds:2,metric:"public_support",delta:-10,description:"主权让渡引发民族主义反弹，独立运动兴起"}],econ_principle:"security_for_sovereignty",principle_explanation:"安全换主权：这是历史上小国常见的生存选择，但让渡主权的边界一旦打开，很难再收回，需要对历史案例有清醒认识。"},{id:"B",text:"构建小多边联盟，以集体力量求独立",immediate_effects:{diplomatic_relations:15,military_defense:8,gdp_growth:5,public_support:10},delayed_effects:[{delay_rounds:2,metric:"forex_reserves",delta:8,description:"区域经济一体化逐步释放贸易红利"}],econ_principle:"regional_integration",principle_explanation:"区域一体化：小国联合可以形成有意义的集体力量，东盟模式提供了一个在大国博弈中维持战略自主的参考案例。"},{id:"C",text:"走自由港路线，成为开放的国际交汇点",immediate_effects:{gdp_growth:15,forex_reserves:12,brain_drain:15,diplomatic_relations:8},delayed_effects:[{delay_rounds:2,metric:"corruption_index",delta:-8,description:"开放市场需要法治基础，腐败治理成为招商引资的前提"}],econ_principle:"comparative_advantage",principle_explanation:"比较优势：小国无法与大国竞争制造业，但可以通过地理位置、制度建设和中立立场建立独特的竞争优势。"},{id:"D",text:"坚持自力更生，依靠内部改革振兴",immediate_effects:{public_support:12,corruption_index:8,gdp_growth:-5,military_defense:-3},delayed_effects:[{delay_rounds:3,metric:"gdp_growth",delta:10,description:"内部改革完成后，内生发展动力显现"}],econ_principle:"endogenous_development",principle_explanation:"内生发展：依靠外力的发展模式难以可持续，真正的民族振兴需要建立在国民能力和制度质量的改善之上。"}]}]}],D$=[{id:"sp_theme1",title:"贸易战的代价",description:"关税是经济武器，但每一发炮弹都会落在自己国内消费者身上。",scenarios:[{id:"sp_t1_s1",type:"game_theory",title:"发动关税战",description:"经济团队报告：对手国通过技术盗窃、汇率操控和政府补贴，在多个关键制造业领域形成不公平竞争优势，每年造成你国约3000亿美元的贸易逆差。鹰派阁僚建议对其出口产品加征25%关税，温和派则担忧报复和通货膨胀。",choices:[{id:"A",text:"全面加征关税，以强硬姿态争取谈判筹码",immediate_effects:{domestic_support:12,gdp_growth:-5,diplomatic_influence:-10,sanction_pressure:10},delayed_effects:[{delay_rounds:2,metric:"gdp_growth",delta:-8,description:"对手报复性关税引发本国通胀，消费者实际购买力下降"}],econ_principle:"comparative_advantage",principle_explanation:"比较优势受损：关税保护了特定行业但损害了整体经济效率，消费者为进口商品支付更高价格，是变相的内部税。"},{id:"B",text:"通过多边机制解决，提起WTO诉讼",immediate_effects:{diplomatic_influence:12,domestic_support:-5,gdp_growth:2,tech_leadership:3},delayed_effects:[{delay_rounds:3,metric:"diplomatic_influence",delta:8,description:"赢得WTO案件后形成国际规则共识，长期受益"}],econ_principle:"international_institutions",principle_explanation:"多边主义：通过国际机构解决争端虽然慢，但建立规则和先例，长期来看比双边对抗对强国更有利。"},{id:"C",text:"精准打击：只对战略性高技术产品加征关税",immediate_effects:{tech_leadership:8,domestic_support:5,gdp_growth:-2,diplomatic_influence:-5},delayed_effects:[],econ_principle:"strategic_trade_policy",principle_explanation:"战略性贸易政策：集中在高技术和战略产品上的保护主义比全面关税战更具精准性，减少对消费者的负面影响。"},{id:"D",text:"联合盟国共同对对手施压",immediate_effects:{diplomatic_influence:15,domestic_support:8,currency_stability:3,gdp_growth:-2},delayed_effects:[{delay_rounds:2,metric:"sanction_pressure",delta:15,description:"多国联合行动形成更强的谈判压力"}],econ_principle:"coalition_bargaining",principle_explanation:"联盟谈判：多国联合行动大幅提升对手的承受成本，是大国外交工具箱中效率较高的策略。"}]},{id:"sp_t1_s2",type:"crisis_response",title:"贸易战引发的通胀与工人失业",description:"贸易战进入第二年：关税报复导致多个依赖出口的工业州失业率飙升至9%；进口商品价格上涨推动通货膨胀创10年新高；对手国已找到其他贸易伙伴替代你的市场。中期选举临近，民调显示三分之二选民认为贸易战代价过高。",choices:[{id:"A",text:"谈判达成部分协议，有条件降低部分关税",immediate_effects:{gdp_growth:8,domestic_support:10,currency_stability:5,diplomatic_influence:-5},delayed_effects:[{delay_rounds:2,metric:"gdp_growth",delta:6,description:"贸易正常化后供应链恢复，通胀压力逐步缓解"}],econ_principle:"negotiated_settlement",principle_explanation:"谈判解决：贸易战没有赢家，及时止损并通过谈判实现相互妥协，通常是最优的现实结果。"},{id:"B",text:"坚持关税，用补贴援助受影响行业",immediate_effects:{domestic_support:5,gdp_growth:-5,sanction_pressure:5,currency_stability:-5},delayed_effects:[{delay_rounds:2,metric:"currency_stability",delta:-8,description:"大规模补贴加剧财政赤字和货币贬值压力"}],econ_principle:"industrial_policy",principle_explanation:"产业政策：补贴可以短期缓解失业压力，但大规模补贴扭曲了市场信号，资源错配问题可能加剧。"},{id:"C",text:"将贸易战转化为科技脱钩，强化技术壁垒",immediate_effects:{tech_leadership:12,diplomatic_influence:-8,gdp_growth:-3,domestic_support:3},delayed_effects:[{delay_rounds:3,metric:"tech_leadership",delta:10,description:"技术脱钩加速本土科技自主，但全球供应链成本大幅上升"}],econ_principle:"decoupling",principle_explanation:"脱钩战略：科技脱钩比关税战代价更大但目标更明确——争夺技术标准制高点，是大国博弈的长期核心战场。"},{id:"D",text:"重新定义胜利叙事，强调供应链安全成就",immediate_effects:{domestic_support:8,gdp_growth:-8,tech_leadership:3},delayed_effects:[],econ_principle:"political_narrative",principle_explanation:"政治叙事：通过重新界定成功标准来影响公众认知，是政治家应对政策失败时的常见工具，但有效性高度依赖信息管控能力。"}]}]},{id:"sp_theme2",title:"领土争端的红线",description:"军事冒险可能速胜，但国际秩序的代价可能让你付出数十年的代价。",scenarios:[{id:"sp_t2_s1",type:"ethical_dilemma",title:"争议领土的武力选项",description:"争议领土局势再度升温：对方在岛礁上修建了军事设施，你的军事参谋部评估在未来3年窗口期内具有压倒性军事优势。国内民族主义情绪高涨，强硬派要求采取行动。但外交部警告，军事行动将触发盟国防御承诺，引发大规模制裁。",choices:[{id:"A",text:"在明确法律框架下发动有限军事行动",immediate_effects:{domestic_support:18,military_strength:10,diplomatic_influence:-25,sanction_pressure:-25},delayed_effects:[{delay_rounds:2,metric:"currency_stability",delta:-15,description:"国际制裁和资本外流对货币构成严重压力"}],econ_principle:"geopolitical_risk",principle_explanation:"地缘政治风险溢价：军事行动会引发全球风险厌恶情绪，资本外流、贸易中断和制裁的综合成本可能远超军事收益。"},{id:"B",text:"维持现状，通过外交谈判管控争议",immediate_effects:{diplomatic_influence:8,domestic_support:-8,tech_leadership:3,sanction_pressure:5},delayed_effects:[{delay_rounds:3,metric:"diplomatic_influence",delta:10,description:"外交克制赢得中间国家尊重，国际空间扩大"}],econ_principle:"status_quo_bias",principle_explanation:"现状维持：在不对称信息和高不确定性下，维持现状通常优于高风险行动，外交解决保留了最多的选择空间。"},{id:"C",text:"加强军事存在但不动用武力，形成实际控制",immediate_effects:{military_strength:8,domestic_support:8,diplomatic_influence:-12,sanction_pressure:-10},delayed_effects:[],econ_principle:"gray_zone",principle_explanation:"灰色地带战略：在武力与外交之间运作，避免触发明确的战争门槛，但代价是长期的不稳定和摩擦成本。"},{id:"D",text:"提出共同开发协议，经济利益换政治搁置",immediate_effects:{diplomatic_influence:12,gdp_growth:5,domestic_support:-5,military_strength:-3},delayed_effects:[{delay_rounds:2,metric:"gdp_growth",delta:5,description:"资源开发合作带来实质经济利益"}],econ_principle:"joint_development",principle_explanation:"共同开发：搁置争议、共同开发是在主权争端未解决前实现资源利益的务实选择，在多个历史案例中已有先例。"}]},{id:"sp_t2_s2",type:"crisis_response",title:"国际制裁升级",description:"由于海上摩擦升级，西方国家联盟宣布对你们实施新一轮全面制裁，涵盖金融清算、芯片出口、能源技术转让。多个中立国迫于压力减少了与你们的经贸往来。GDP增速已从5.2%降至2.1%，你面临制裁与经济发展的艰难权衡。",choices:[{id:"A",text:"以反制裁回应，强化与非西方国家关系",immediate_effects:{diplomatic_influence:5,sanction_pressure:-10,gdp_growth:-5,domestic_support:8},delayed_effects:[{delay_rounds:2,metric:"currency_stability",delta:-8,description:"制裁对抗使金融体系进一步脱离国际主流，代价持续累积"}],econ_principle:"economic_nationalism",principle_explanation:"经济民族主义：反制裁可以展示强硬，维持内部凝聚力，但加速了与全球体系的脱节，长期代价巨大。"},{id:"B",text:"谈判降低敌对行为，换取制裁缓解",immediate_effects:{diplomatic_influence:12,gdp_growth:6,sanction_pressure:15,domestic_support:-12},delayed_effects:[{delay_rounds:2,metric:"gdp_growth",delta:8,description:"制裁缓解后经济活动逐步恢复"}],econ_principle:"sanctions_bargaining",principle_explanation:"制裁博弈：制裁的本质是施压工具，谈判中的让步通常能获得制裁缓解，关键是找到双方都可接受的平衡点。"},{id:"C",text:"加速技术自立，推进制裁豁免的产业链",immediate_effects:{tech_leadership:12,gdp_growth:-3,sanction_pressure:-5,domestic_support:5},delayed_effects:[{delay_rounds:3,metric:"tech_leadership",delta:15,description:"技术自立战略见效，关键产业链摆脱外部依赖"}],econ_principle:"import_substitution",principle_explanation:"进口替代：制裁倒逼技术自主，虽然短期成本高昂，但可能加速关键技术突破，这是历史上一些国家的实际经验。"},{id:"D",text:"构建独立的平行国际体系",immediate_effects:{diplomatic_influence:8,gdp_growth:-8,tech_leadership:5,currency_stability:-10},delayed_effects:[{delay_rounds:3,metric:"diplomatic_influence",delta:12,description:"替代性国际体系初具规模，影响力初步建立"}],econ_principle:"system_rivalry",principle_explanation:"体系竞争：建立替代性国际体系需要巨大的成本和公共物品投入，且需要足够多的成员参与才能形成可信的替代选择。"}]}]},{id:"sp_theme3",title:"债务外交的代价",description:"通过贷款控制战略资产，是强大的外交工具，还是损人不利己的泥潭？",scenarios:[{id:"sp_t3_s1",type:"long_short_tradeoff",title:"基础设施外交投资",description:"你的对外投资战略已在40个国家布局基础设施项目，总贷款规模达8000亿美元。三分之一的项目面临不同程度的还款困难，部分国家已要求重新谈判条款。国内有声音批评这是劳民伤财，另一些人认为这是扩大地缘政治影响力的必要成本。",choices:[{id:"A",text:"维持高强度对外贷款，争夺战略资产控制权",immediate_effects:{diplomatic_influence:15,gdp_growth:-5,sanction_pressure:-8,domestic_support:-5},delayed_effects:[{delay_rounds:2,metric:"diplomatic_influence",delta:-10,description:"债务陷阱指控发酵，多国寻求退出协议"}],econ_principle:"debt_trap_diplomacy",principle_explanation:"债务陷阱外交的有效性存在学术争议，但对受援国主权的潜在威胁已引起国际社会广泛警惕，反弹效应在上升。"},{id:"B",text:"重组贷款条件，树立责任大国形象",immediate_effects:{diplomatic_influence:12,gdp_growth:-3,domestic_support:5,sanction_pressure:8},delayed_effects:[{delay_rounds:2,metric:"diplomatic_influence",delta:10,description:"负责任大国形象吸引更多国家主动寻求合作"}],econ_principle:"soft_power",principle_explanation:"软实力：负责任的债务重组虽然放弃了部分控制权，但提升了国际声誉，带来更广泛、更可持续的影响力。"},{id:"C",text:"将投资重心转向高质量基础设施，减少政治色彩",immediate_effects:{diplomatic_influence:8,gdp_growth:3,tech_leadership:5,domestic_support:3},delayed_effects:[],econ_principle:"quality_over_quantity",principle_explanation:"质量优先：高标准基础设施带来真实的发展价值，比低质量贷款更能赢得受援国的长期信任和合作意愿。"},{id:"D",text:"将问题贷款打包处置，减少国家直接承担",immediate_effects:{gdp_growth:2,diplomatic_influence:-5,domestic_support:5,currency_stability:3},delayed_effects:[{delay_rounds:2,metric:"diplomatic_influence",delta:-8,description:"甩包袱操作被受援国认为是不负责任的遗弃，信任度大幅下降"}],econ_principle:"risk_transfer",principle_explanation:"风险转移：通过金融工具将不良贷款风险转移，短期改善账面，但破坏了合作关系，损害了长期战略利益。"}]},{id:"sp_t3_s2",type:"crisis_response",title:"国际舆论的债务陷阱指控",description:"七国集团发表联合声明，指责你们的对外贷款战略是系统性的主权剥削，并宣布联合推出一项对抗性基础设施倡议。多个受援国正在举行选举，反华候选人将撕毁贷款协议作为竞选承诺，已有两个国家宣布退出相关框架。",choices:[{id:"A",text:"公开反驳，展示实际发展成果数据",immediate_effects:{diplomatic_influence:5,domestic_support:8,sanction_pressure:-5,tech_leadership:2},delayed_effects:[],econ_principle:"information_war",principle_explanation:"信息战：用数据反驳情绪性指控有一定效果，但在已经极化的国际舆论中，事实论证的边际效益正在下降。"},{id:"B",text:"提出比竞争对手更好的援助条件",immediate_effects:{diplomatic_influence:12,gdp_growth:-8,domestic_support:-3,sanction_pressure:5},delayed_effects:[{delay_rounds:2,metric:"diplomatic_influence",delta:8,description:"条件竞争赢得部分摇摆国家，影响力版图维持"}],econ_principle:"aid_competition",principle_explanation:"援助竞争：对外援助领域的竞争迫使各方提高援助质量，这从全球公共品角度是有益的，但对你的财政是高成本。"},{id:"C",text:"大幅削减对外贷款，将资源内部化",immediate_effects:{gdp_growth:8,domestic_support:12,diplomatic_influence:-15,sanction_pressure:5},delayed_effects:[{delay_rounds:3,metric:"sanction_pressure",delta:10,description:"战略收缩被解读为外交撤退，对手趁机填补真空"}],econ_principle:"strategic_retreat",principle_explanation:"战略收缩：专注国内建设可以积累更强的内生发展能力，但全球影响力存在自然萎缩，放弃的阵地很难再夺回。"},{id:"D",text:"将对外投资转向绿色能源和数字基础设施",immediate_effects:{diplomatic_influence:10,tech_leadership:8,gdp_growth:-3,domestic_support:3},delayed_effects:[{delay_rounds:2,metric:"diplomatic_influence",delta:12,description:"绿色投资符合全球气候议题趋势，获得广泛欢迎"}],econ_principle:"green_diplomacy",principle_explanation:"绿色外交：将对外投资与全球气候议题结合，既符合国际潮流又实现地缘政治目标，是软硬实力的有效结合。"}]}]},{id:"sp_theme4",title:"碳中和与经济增长的张力",description:"气候承诺与发展权益，你将如何在全球公共品与国家利益之间取舍？",scenarios:[{id:"sp_t4_s1",type:"resource_allocation",title:"激进去碳化路线",description:"在国际气候峰会上，你提出了2045年碳中和的激进承诺，比现有计划提前10年。这需要在未来5年内关闭80%的煤电，转型期将造成约300万工人失业。能源价格预计上涨40%，对制造业出口竞争力形成打击。但气候科学家说，不做不足以避免气候灾难。",choices:[{id:"A",text:"兑现激进承诺，成为全球气候领导者",immediate_effects:{diplomatic_influence:18,tech_leadership:12,gdp_growth:-12,domestic_support:-15},delayed_effects:[{delay_rounds:2,metric:"domestic_support",delta:-10,description:"能源价格上涨和工人失业引发大规模社会抗议"}],econ_principle:"global_public_goods",principle_explanation:"全球公共品：气候是典型的全球公共品，搭便车问题严重——一国的牺牲难以确保其他国家同样付出，道德理想与现实博弈冲突。"},{id:"B",text:"坚持渐进转型，拒绝激进时间表",immediate_effects:{gdp_growth:3,domestic_support:8,diplomatic_influence:-8,tech_leadership:2},delayed_effects:[],econ_principle:"transition_cost",principle_explanation:"转型成本：能源转型的速度需要与经济承受能力匹配，过快的转型引发的社会动荡可能延误整体去碳化进程。"},{id:"C",text:"以绿色技术援助为条件推动全球联合转型",immediate_effects:{diplomatic_influence:15,tech_leadership:10,gdp_growth:-3,sanction_pressure:5},delayed_effects:[{delay_rounds:3,metric:"diplomatic_influence",delta:12,description:"绿色技术输出建立了新的软实力优势"}],econ_principle:"technology_transfer",principle_explanation:"技术转让外交：提供绿色技术援助既推动了全球气候目标，又建立了技术标准输出的软实力，是双赢的外交策略。"},{id:"D",text:"在国内建立碳市场，以价格机制驱动转型",immediate_effects:{tech_leadership:8,gdp_growth:-3,domestic_support:-5,currency_stability:3},delayed_effects:[{delay_rounds:3,metric:"gdp_growth",delta:5,description:"碳市场机制成熟后，减排与经济效率实现更好平衡"}],econ_principle:"carbon_pricing",principle_explanation:"碳定价：碳市场将外部成本内化，是经济学界最推崇的气候政策工具，但政治可行性在不同国家存在巨大差异。"}]},{id:"sp_t4_s2",type:"crisis_response",title:"能源危机与工人抗议",description:"去碳化政策引发了连锁反应：煤电关停导致部分地区供电紧张，工业用电成本上涨35%；一个重工业省份的煤矿工人举行了历史性大罢工；欧洲部分国家在能源危机中重新烧煤，你的牺牲没有换来对等的国际行动。你该如何回应？",choices:[{id:"A",text:"暂缓部分关停计划，优先解决能源安全",immediate_effects:{domestic_support:15,gdp_growth:8,tech_leadership:-3,diplomatic_influence:-12},delayed_effects:[{delay_rounds:2,metric:"diplomatic_influence",delta:-8,description:"退让被国际社会视为气候承诺不可信的证据"}],econ_principle:"time_inconsistency",principle_explanation:"时间不一致性：政策承诺的可信度取决于是否经受住短期压力的考验，临时退让会根本性地损害未来政策的可信度。"},{id:"B",text:"坚守承诺，用救济金和再培训安抚工人",immediate_effects:{domestic_support:-5,tech_leadership:5,diplomatic_influence:8,gdp_growth:-5},delayed_effects:[{delay_rounds:2,metric:"domestic_support",delta:5,description:"再培训项目见效，工人逐步融入新能源产业"}],econ_principle:"just_transition",principle_explanation:"公正转型：为受影响工人提供补偿和再培训是能源转型政策公平性的核心，没有公正转型的去碳化将面临持续的政治阻力。"},{id:"C",text:"宣布发展核能，以此填补能源缺口",immediate_effects:{tech_leadership:10,gdp_growth:3,domestic_support:5,diplomatic_influence:3},delayed_effects:[{delay_rounds:3,metric:"tech_leadership",delta:12,description:"核能布局巩固了能源独立性，技术领先优势扩大"}],econ_principle:"energy_mix",principle_explanation:"能源组合：核能作为低碳稳定电源，在全球能源转型中受到越来越多的重视，是务实平衡清洁与稳定的方案。"},{id:"D",text:"在国际场合指责其他大国搭便车，要求公平分担",immediate_effects:{diplomatic_influence:-5,domestic_support:8,sanction_pressure:-5,gdp_growth:-2},delayed_effects:[],econ_principle:"burden_sharing",principle_explanation:"负担分担：指出其他国家的搭便车行为有其道义合理性，但外交指责的实际效果有限，需要配合具体的制度性约束机制。"}]}]},{id:"sp_theme5",title:"世界格局的大抉择",description:"站在历史的节点上，你的战略选择将定义未来数十年的国际秩序。",scenarios:[{id:"sp_t5_s1",type:"strategic_choice",title:"大国战略的终极抉择",description:"你的国家在多年的博弈后处于历史性的战略窗口：美国主导的旧秩序正在松动；多极化的新秩序尚未成形；技术革命正在改写权力基础。此刻你面临三条战略路径：强化对抗，趁对手衰落期扩张影响力；寻求共存，在竞争中建立稳定框架；打造第三极，构建不以对抗任何一方为前提的大国关系。",choices:[{id:"A",text:"加速布局，趁乱扩展战略优势",immediate_effects:{military_strength:15,diplomatic_influence:8,domestic_support:12,sanction_pressure:-15},delayed_effects:[{delay_rounds:2,metric:"gdp_growth",delta:-12,description:"扩张引发对手联盟化反应，战略对抗成本激增"}],econ_principle:"power_transition",principle_explanation:"权力转移理论：崛起大国与守成大国的冲突虽非注定，但冒进扩张往往触发守成大国的联合制衡，历史上的教训深刻。"},{id:"B",text:"建立竞争性共存框架，划定合作与竞争的边界",immediate_effects:{diplomatic_influence:18,gdp_growth:8,domestic_support:5,sanction_pressure:10},delayed_effects:[{delay_rounds:2,metric:"diplomatic_influence",delta:12,description:"稳定的战略框架吸引中间国家，国际空间拓展"}],econ_principle:"managed_competition",principle_explanation:"有管理的竞争：冷战经验显示，即使是严峻的大国竞争也可以在一套非正式规则下运行，避免滑向直接冲突。"},{id:"C",text:"主导构建新型多边秩序，提供全球公共品",immediate_effects:{diplomatic_influence:15,tech_leadership:10,gdp_growth:-5,domestic_support:3},delayed_effects:[{delay_rounds:3,metric:"diplomatic_influence",delta:20,description:"作为秩序提供者的国际地位确立，领导力红利持续释放"}],econ_principle:"hegemonic_stability",principle_explanation:"霸权稳定理论：提供国际公共品的大国可以从规则制定和信誉中获益，这是将权力转化为持续影响力的最有效路径。"},{id:"D",text:"专注内政，以强大的国内基础支撑大国地位",immediate_effects:{gdp_growth:12,domestic_support:18,tech_leadership:8,diplomatic_influence:-5},delayed_effects:[{delay_rounds:3,metric:"domestic_support",delta:10,description:"内部发展成果强化了国际竞争中的战略基础"}],econ_principle:"comprehensive_national_power",principle_explanation:"综合国力：大国竞争的最终底牌是经济、技术和社会凝聚力，聚焦内部建设是积累这些基础性优势的务实路径。"}]}]}],L$=[{id:"tg_theme1",title:"用户数据货币化",description:"你掌握着数亿用户的行为数据，如何使用这些数据将决定公司的道德边界。",scenarios:[{id:"tg_t1_s1",type:"ethical_dilemma",title:"出售用户数据",description:"广告技术公司提出：愿意以每季度2亿元的价格购买你们平台的用户行为数据（脱敏处理）。这笔钱相当于公司季度净利润的18%。隐私委员会的报告指出，在欧盟和部分国家此类交易属于违规。国内目前没有明确法规禁止。竞争对手据说已经开展类似合作。",choices:[{id:"A",text:"全面合作，将数据资产最大化变现",immediate_effects:{revenue:18,market_cap:12,regulatory_risk:-20,brand_reputation:-15},delayed_effects:[{delay_rounds:2,metric:"regulatory_risk",delta:-15,description:"监管部门启动数据安全专项检查"}],econ_principle:"externality_negative",principle_explanation:"负外部性：数据货币化将用户隐私成本外部化，企业获利而用户承担风险，是典型的市场失灵问题。"},{id:"B",text:"拒绝出售，将数据隐私作为品牌差异化",immediate_effects:{brand_reputation:12,employee_satisfaction:8,revenue:-5,market_cap:-3},delayed_effects:[{delay_rounds:3,metric:"market_cap",delta:15,description:"高隐私定位吸引高价值用户，长期估值提升"}],econ_principle:"reputation_capital",principle_explanation:"声誉资本：将隐私保护打造为核心价值主张，可以形成难以复制的信任资产，在监管趋严的趋势下是战略先手。"},{id:"C",text:"仅出售聚合匿名统计数据，不含个体信息",immediate_effects:{revenue:6,regulatory_risk:-5,brand_reputation:-3},delayed_effects:[],econ_principle:"information_goods",principle_explanation:"信息商品的边界模糊——所谓匿名化的数据在大数据技术下常常可以被重新识别，风险并未真正消除。"},{id:"D",text:"建立内部广告平台，自己使用数据变现",immediate_effects:{revenue:10,market_share:5,rd_ratio:-5,brand_reputation:-5},delayed_effects:[{delay_rounds:2,metric:"regulatory_risk",delta:-8,description:"广告生态引发平台垄断调查"}],econ_principle:"vertical_integration",principle_explanation:"纵向整合：自建广告平台控制全价值链，但也加大了反垄断审查风险，因为你同时是规则制定者和参与者。"}]},{id:"tg_t1_s2",type:"crisis_response",title:"数据泄露丑闻",description:"一名离职工程师向媒体爆料：公司实际收集的数据远超用户协议所允许的范围，且存在违规出售记录。相关文件截图在社交媒体上迅速传播。监管部门已发函要求你们在48小时内作出说明。公司股价盘前已下跌9%。",choices:[{id:"A",text:"全面公开透明，主动配合调查并整改",immediate_effects:{brand_reputation:-5,regulatory_risk:10,employee_satisfaction:5,market_cap:-10},delayed_effects:[{delay_rounds:2,metric:"brand_reputation",delta:12,description:"透明处理重建信任，用户留存恢复"}],econ_principle:"signaling_theory",principle_explanation:"主动透明是最强的信号：危机中的诚实应对往往能挽回更多信任，比掩盖造成的二次伤害小得多。"},{id:"B",text:"否认核心指控，打压爆料人",immediate_effects:{regulatory_risk:-25,brand_reputation:-22,employee_satisfaction:-15},delayed_effects:[{delay_rounds:2,metric:"revenue",delta:-15,description:"更多内部人员站出来，危机持续发酵"}],econ_principle:"information_asymmetry",principle_explanation:"信息不对称策略：试图维持信息优势，但在数字时代内部信息极难完全封锁，掩盖往往比事件本身代价更高。"},{id:"C",text:"迅速下线涉事功能，最小化事件范围",immediate_effects:{regulatory_risk:5,brand_reputation:-8,revenue:-8,market_cap:-5},delayed_effects:[{delay_rounds:2,metric:"regulatory_risk",delta:8,description:"监管部门认可积极整改态度，调查范围收窄"}],econ_principle:"damage_control",principle_explanation:"损害控制：快速止损比完整的解释更重要，但需要真实改变，否则被认为是公关操作反而加重危机。"},{id:"D",text:"将注意力引向竞争对手，称行业普遍如此",immediate_effects:{regulatory_risk:-10,brand_reputation:-18,market_share:-5},delayed_effects:[{delay_rounds:2,metric:"regulatory_risk",delta:-20,description:"监管机构将整个行业纳入审查，你们首当其冲"}],econ_principle:"race_to_bottom",principle_explanation:"竞次效应：声称行业普遍如此不能减轻责任，反而可能触发监管机构对整个行业的系统性清查。"}]}]},{id:"tg_theme2",title:"反竞争打压",description:"市场地位给了你扼杀竞争者的能力，但这种能力该如何使用？",scenarios:[{id:"tg_t2_s1",type:"game_theory",title:"收购还是扶持竞争对手",description:"一家初创公司开发了一款可能颠覆你核心业务的产品，现在估值只有8亿元，增长迅猛。你可以以10亿元收购并将其关闭，也可以任其发展。战略部门预计若任其发展，3年内可能抢占你15%的市场份额。",choices:[{id:"A",text:"收购后关闭，消灭潜在威胁",immediate_effects:{market_share:10,market_cap:8,rd_ratio:-5,regulatory_risk:-15},delayed_effects:[{delay_rounds:2,metric:"regulatory_risk",delta:-20,description:"反垄断机构以扼杀竞争为由启动调查"}],econ_principle:"predatory_acquisition",principle_explanation:"掠夺性收购：通过收购消灭竞争者是反垄断法的重点监控行为，短期护住市场份额，长期面临巨额罚款。"},{id:"B",text:"收购后整合，吸收其技术和团队",immediate_effects:{rd_ratio:8,employee_satisfaction:5,market_cap:-5,market_share:5},delayed_effects:[{delay_rounds:3,metric:"rd_ratio",delta:10,description:"整合成功后创新能力大幅增强"}],econ_principle:"technology_acquisition",principle_explanation:"技术并购：通过收购获取创新能力比内部孵化更快，但整合失败率超过70%，文化冲突是主要杀手。"},{id:"C",text:"任其发展，加速自身创新迎战",immediate_effects:{rd_ratio:12,employee_satisfaction:8,revenue:-5,market_share:-3},delayed_effects:[{delay_rounds:3,metric:"market_share",delta:8,description:"加大研发后推出更强产品，维持竞争优势"}],econ_principle:"schumpeter_creative_destruction",principle_explanation:"熊彼特的创造性破坏：健康的竞争推动创新，允许竞争者存在可以激励自身持续进化，避免内部惰性。"},{id:"D",text:"利用平台优势打压，限制其在你生态内的分发",immediate_effects:{market_share:6,revenue:5,regulatory_risk:-12,brand_reputation:-10},delayed_effects:[{delay_rounds:2,metric:"regulatory_risk",delta:-18,description:"平台滥权投诉激增，监管部门介入"}],econ_principle:"platform_monopoly",principle_explanation:"平台垄断：利用平台控制分发渠道打压竞争者是监管机构的重点关注对象，各国反垄断法规正在加速收紧。"}]},{id:"tg_t2_s2",type:"crisis_response",title:"反垄断调查风暴",description:"监管机构正式宣布对公司展开反垄断调查，指控包括：平台垄断、扼杀竞争、数据滥用。这是近年来针对科技公司力度最大的调查。股价在调查公告后两天内下跌17%。政府已要求你们冻结一切并购行动，且可能要求拆分业务。",choices:[{id:"A",text:"主动与监管合作，提出结构性补救措施",immediate_effects:{regulatory_risk:20,market_cap:-8,brand_reputation:5,employee_satisfaction:3},delayed_effects:[{delay_rounds:3,metric:"regulatory_risk",delta:18,description:"通过合作化解调查，避免强制拆分"}],econ_principle:"regulatory_capture",principle_explanation:"监管合规：主动提出补救措施通常能以可控代价化解监管风险，而强硬对抗可能导致最坏结果——强制拆分。"},{id:"B",text:"全力法律应战，争取每一个拖延机会",immediate_effects:{regulatory_risk:-25,revenue:-8,employee_satisfaction:-10,market_cap:-12},delayed_effects:[{delay_rounds:3,metric:"brand_reputation",delta:-15,description:"长期诉讼拖累公司，形象持续受损"}],econ_principle:"war_of_attrition",principle_explanation:"消耗战：大企业有能力拖延法律进程，但这会持续消耗资源和声誉，且很难在拖延中真正改善局面。"},{id:"C",text:"主动拆分部分业务，展示开放态度",immediate_effects:{regulatory_risk:25,market_cap:-15,brand_reputation:10},delayed_effects:[{delay_rounds:2,metric:"market_cap",delta:8,description:"拆分后各子公司估值释放，总市值可能反弹"}],econ_principle:"breakup_value",principle_explanation:"分拆价值：有时整体低于各部分之和——分拆让每个业务单元更专注，可能实现价值重估，微软案例可为参考。"},{id:"D",text:"游说政界，通过政治手段化解调查",immediate_effects:{regulatory_risk:10,revenue:-3,brand_reputation:-12,employee_satisfaction:-8},delayed_effects:[{delay_rounds:2,metric:"regulatory_risk",delta:-15,description:"政治生态变化后游说失效，反而引发更严厉调查"}],econ_principle:"rent_seeking",principle_explanation:"寻租行为：通过政治手段影响监管是典型的寻租，短期可能有效，但反噬风险极大且腐化企业文化。"}]}]},{id:"tg_theme3",title:"AI伦理边界",description:"你掌握着最先进的AI技术，如何使用它将定义公司的道德底色。",scenarios:[{id:"tg_t3_s1",type:"ethical_dilemma",title:"军事AI合同",description:"国防部提出一份价值120亿元的军事AI合同，用于无人机自主识别和决策系统开发。这对公司营收是巨大利好，且会提升与政府的关系。但内部调查显示，68%的技术骨干反对参与军事项目，部分人已威胁集体辞职。",choices:[{id:"A",text:"接受合同，以商业利益为首要考量",immediate_effects:{revenue:20
